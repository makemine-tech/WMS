<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0B1220;--card:#141E33;--bd:#26344F;--tx:#E8EEF7;--sub:#8597B0;--accent:#3B82F6;--green:#34D399;--red:#F87171;--amber:#FBBF24;}
body{background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--tx);min-height:100vh;padding-bottom:200px;}
.wrap{max-width:560px;margin:0 auto;padding:14px 12px;}
.center{text-align:center;padding:70px 20px;color:var(--sub);font-size:14px;}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.back{background:rgba(255,255,255,.06);color:var(--sub);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap;}
.ttl{font-size:17px;font-weight:800;flex:1;min-width:0;}
.testb{font-size:11px;font-weight:800;color:#FCD34D;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);border-radius:6px;padding:2px 7px;white-space:nowrap;}
select{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 10px;font-size:14px;font-family:inherit;margin-bottom:10px;}
.notice{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:10px;padding:9px 11px;font-size:12px;color:#FDE68A;line-height:1.6;margin-bottom:10px;}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin-bottom:10px;}
.lb{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;}
.heard{font-size:17px;font-weight:700;line-height:1.45;min-height:26px;word-break:keep-all;}
.heard.interim{color:var(--sub);}
.grid{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px;}
.grid .k{color:var(--sub);}
.grid .v{font-weight:700;}
.grid .v.none{color:#475569;font-weight:600;}
.chk{font-size:13px;line-height:1.5;margin-top:4px;display:flex;gap:6px;}
.chk.ok{color:#6EE7B7;} .chk.ng{color:#FCA5A5;} .chk.wn{color:#FCD34D;}
.say{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.4);border-radius:12px;padding:11px 12px;margin-bottom:10px;font-size:15px;color:#BFDBFE;line-height:1.55;}
.say.done{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.45);color:#A7F3D0;}
.say.bad{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.45);color:#FECACA;}
.yn{display:flex;gap:8px;margin-top:9px;}
.yn button{flex:1;border:none;border-radius:10px;padding:11px 0;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(11,18,32,1) 70%,rgba(11,18,32,0));padding:14px 12px calc(14px + env(safe-area-inset-bottom));}
.dock-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;}
.mic{width:100%;height:84px;border-radius:18px;border:none;background:#2563EB;color:#fff;font-size:19px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(37,99,235,.35);}
.mic.on{background:#DC2626;box-shadow:0 0 0 0 rgba(220,38,38,.6);animation:pulse 1.1s infinite;}
.mic.ask{background:#059669;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.55);}70%{box-shadow:0 0 0 14px rgba(220,38,38,0);}100%{box-shadow:0 0 0 0 rgba(220,38,38,0);}}
.hint{font-size:11.5px;color:var(--sub);text-align:center;}
.typ{display:flex;gap:6px;margin-bottom:10px;}
.typ input{flex:1;min-width:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 10px;font-size:14px;font-family:inherit;}
.typ button,.sbtn{background:rgba(255,255,255,.07);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
details{margin-bottom:10px;}
summary{font-size:12.5px;color:var(--sub);font-weight:700;cursor:pointer;padding:6px 2px;}
.ex{display:block;width:100%;text-align:left;background:rgba(255,255,255,.04);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:6px;cursor:pointer;font-family:inherit;}
.hist{font-size:12.5px;border-bottom:1px dashed rgba(255,255,255,.08);padding:7px 2px;line-height:1.5;}
.hist .t{color:var(--sub);font-size:11px;}
.alts{font-size:11.5px;color:var(--sub);margin-top:6px;line-height:1.6;}
</style>

firebase.initializeApp({

var GID=(new URLSearchParams(location.search).get('gid'))||localStorage.getItem('wms_adminGroupId')||'';
var WHS=[], WH=null, WHID=null, whRef=null, PRODUCTS=[];
var rec=null, listening=false, pending=null, lastR=null, lastEv=null;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ── 화면 ── */
function renderShell(){
  app.innerHTML=
    '<div class="top"><a class="back" href="/wms.html">‹ 창고관리</a><div class="ttl">🎙 음성 입출고</div><span class="testb">시험 모드</span></div>'
    +'<select id="whSel" onchange="selectWh(this.value)">'+WHS.map(function(w){return '<option value="'+esc(w.id)+'"'+(w.id===WHID?' selected':'')+'>'+esc(w.name)+'</option>';}).join('')+'</select>'
    +'<div class="notice">🧪 <b>시험 모드</b> — 말한 내용을 해석하고 창고 기록과 대조해 보여주기만 합니다. <b>실제 입출고 기록은 하지 않습니다.</b>'
    +(SR?'':'<br>⚠ 이 브라우저는 음성 인식을 지원하지 않아요. 안드로이드 크롬을 권장합니다. 아래 입력칸으로 문장 시험은 가능합니다.')+'</div>'
    +'<div class="box"><div class="lb"><span>알아들은 말</span><span id="micSt">대기</span></div><div class="heard interim" id="heard">아래 버튼을 누르고 말하세요</div><div class="alts" id="alts"></div></div>'
    +'<div class="box" id="resBox" style="display:none"><div class="lb"><span>해석 결과</span></div><div class="grid" id="resGrid"></div><div id="chks"></div></div>'
    +'<div id="sayBox"></div>'
    +'<div class="typ"><input id="typIn" placeholder="문장 직접 입력해 시험 (예: 에이 십이 4층 뭐야)" autocomplete="off"><button onclick="typedTest()">해석</button></div>'
    +'<details><summary>말하는 예시</summary>'
      +['서리태 십오 이칠공칠공삼 백이십오개 에이 십 3층 입고','서리태 십오 이칠공칠공삼 백이십오개 에이 십 3층 출고','에이 십이 4층 뭐야','에이 십 3층에서 비 오 1층으로 이동','에이 원 2층 확인','취소']
        .map(function(t){return '<button class="ex" onclick="exTest(this)">'+esc(t)+'</button>';}).join('')
      +'<div class="hint" style="text-align:left;margin-top:8px;line-height:1.7">· 위치: 알파벳(에이·비·씨 / A) + 번호(일·원·1·십·텐 모두 가능) · 층: 1층 = 맨 아래<br>· 유통기한: 이칠공칠공삼 / 이칠영칠영삼 / 27년 7월 3일<br>· 동작: 입고 · 출고 · 뭐야(확인) · 이동 · 취소</div>'
    +'</details>'
    +'<details><summary>최근 기록 (이 폰에만 저장)</summary><div id="histBox"></div></details>'
    +'<div class="dock"><div class="dock-in"><button class="mic" id="micBtn" onclick="micPress()">🎙 눌러서 말하기</button>'
    +'<div class="hint" id="hint">탭하고 말하면 말이 끝날 때 자동으로 멈춰요 · 블루투스 버튼(Enter·Space·→)도 가능</div></div></div>';
  document.getElementById('typIn').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); typedTest(); } });
  renderHist();
}
function setMicUI(state){
  var b=document.getElementById('micBtn'), st=document.getElementById('micSt'), hn=document.getElementById('hint'); if(!b) return;
  if(state==='cmd'){ b.className='mic on'; b.textContent='● 듣는 중… (말이 끝나면 자동 종료)'; st.textContent='듣는 중'; }
  else if(state==='confirm'){ b.className='mic on'; b.textContent='● "네" 또는 "아니오"라고 말하세요'; st.textContent='대답 듣는 중'; }
  else if(state==='ask'){ b.className='mic ask'; b.textContent='🎙 눌러서 "네 / 아니오" 대답'; st.textContent='대답 대기'; }
  else { b.className='mic'; b.textContent='🎙 눌러서 말하기'; st.textContent='대기'; }
  if(hn) hn.textContent=state==='ask'?'버튼을 누르고 대답하거나, 위의 네/아니오를 누르세요':'탭하고 말하면 말이 끝날 때 자동으로 멈춰요 · 블루투스 버튼(Enter·Space·→)도 가능';
}
function showHeard(text, interim){ var h=document.getElementById('heard'); if(!h) return; h.textContent=text||''; h.className='heard'+(interim?' interim':''); }

/* ── 음성 출력(TTS) ── */
var koVoice=null;
function pickVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; koVoice=vs.filter(function(v){return /ko/i.test(v.lang);})[0]||null; }catch(e){} }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text, cb){
  var called=false; function done(){ if(called) return; called=true; if(cb) cb(); }
  if(!window.speechSynthesis||!text){ done(); return; }
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=1.05; if(koVoice) u.voice=koVoice;
    u.onend=done; u.onerror=done;
    speechSynthesis.speak(u);
    setTimeout(done, 1200+text.length*140);   /* 일부 기기에서 onend 누락 대비 */
  }catch(e){ done(); }
}

/* ── 음성 인식 ── */
function micPress(){ keepAwake(); if(listening){ stopListen(); return; } listen(pending?'confirm':'cmd'); }
window.micPress=micPress;
function stopListen(){ if(rec){ try{ rec.abort(); }catch(e){} } rec=null; listening=false; setMicUI(pending?'ask':'idle'); }
function listen(mode){
  if(!SR){ showHeard('이 브라우저는 음성 인식을 지원하지 않아요 (안드로이드 크롬 권장)', true); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  if(rec){ try{ rec.abort(); }catch(e){} }
  var r=new SR(); r.lang='ko-KR'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  var finalAlts=null; rec=r; listening=true; setMicUI(mode);
  if(mode==='cmd') showHeard('…', true);
  r.onresult=function(ev){
    var txt=''; for(var i=ev.resultIndex;i<ev.results.length;i++) txt+=ev.results[i][0].transcript;
    var last=ev.results[ev.results.length-1];
    if(last.isFinal){ finalAlts=[]; for(var a=0;a<last.length;a++) finalAlts.push(last[a].transcript); }
    if(mode==='cmd') showHeard(txt, !last.isFinal);
  };
  r.onerror=function(e){
    var m={'no-speech':'말소리가 들리지 않았어요','not-allowed':'마이크 권한이 꺼져 있어요 — 주소창 왼쪽 자물쇠에서 마이크를 허용해 주세요','network':'인터넷 연결이 필요해요','audio-capture':'마이크를 찾을 수 없어요'}[e.error];
    if(m&&mode==='cmd') showHeard(m, true);
  };
  r.onend=function(){
    if(rec!==r) return;
    rec=null; listening=false;
    if(finalAlts&&finalAlts.length){ if(mode==='cmd') handleCommand(finalAlts); else handleConfirm(finalAlts); }
    else setMicUI(pending?'ask':'idle');
  };
  try{ r.start(); }catch(e){ listening=false; setMicUI('idle'); }
}
/* 블루투스 리모컨·키보드 버튼 → 듣기 시작 */
document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')) return;
  if([' ','Enter','ArrowRight','ArrowDown','PageDown','MediaPlayPause'].indexOf(e.key)>=0){ e.preventDefault(); micPress(); }
});
var wakeLock=null;
function keepAwake(){ try{ if(navigator.wakeLock&&!wakeLock) navigator.wakeLock.request('screen').then(function(l){ wakeLock=l; l.addEventListener('release',function(){ wakeLock=null; }); }).catch(function(){}); }catch(e){} }
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&wakeLock===null&&listening) keepAwake(); });

/* ── 해석 + 창고 기록 대조 ── */
function parseOpts(){ var cols=[]; for(var c=0;c<(WH&&WH.cols||0);c++) cols.push(V.colName(c)); return {products:PRODUCTS, cols:cols}; }
function handleCommand(alts){
  var R=V.parseBest(alts, parseOpts());
  showHeard(alts[R.altIndex||0], false);
  var ao=document.getElementById('alts');
  if(ao) ao.textContent=alts.length>1?('인식 후보 '+alts.length+'개 중 가장 잘 맞는 문장을 골랐어요'):'';
  var ev=evaluate(R); lastR=R; lastEv=ev;
  renderResult(R, ev);
  pushHist(alts[R.altIndex||0], R, ev);
  if(ev.ask){ pending=ev; renderSay(ev.ask, 'ask'); setMicUI('ask'); speak(ev.ask, function(){ if(pending===ev) listen('confirm'); }); }
  else { pending=null; renderSay(ev.say, ev.ok?'info':'bad'); setMicUI('idle'); speak(ev.say); }
}
function handleConfirm(alts){
  var yn=null; for(var i=0;i<alts.length&&!yn;i++) yn=V.yesNo(alts[i]);
  if(yn==='yes') confirmYes();
  else if(yn==='no') confirmNo();
  else { renderSay('"'+alts[0]+'" — 네 또는 아니오로 대답해 주세요. (버튼을 눌러도 돼요)', 'ask'); setMicUI('ask'); speak('네 또는 아니오로 대답해 주세요'); }
}
function confirmYes(){
  if(!pending) return; var ev=pending; pending=null;
  renderSay('✓ '+ev.doneText+' — (시험 모드라 실제 기록은 하지 않았어요)', 'done'); setMicUI('idle');
  speak(ev.doneSay+'. 시험 모드라 기록하지 않았어요.');
}
function confirmNo(){ pending=null; renderSay('취소했어요. 다시 말씀해 주세요.', 'info'); setMicUI('idle'); speak('취소했어요'); }
window.confirmYes=confirmYes; window.confirmNo=confirmNo;

/* 조사 붙이기 — 받침 유무로 을/를·은/는·이/가·으로/로 (숫자는 읽는 소리 기준: 1일 3삼 6육 7칠 8팔 0영·십 = 받침) */
function josa(w, pair){
  var a=pair.split('/'), s=String(w).trim(), ch=s.slice(-1), code=ch.charCodeAt(0), has=false, rieul=false;
  if(code>=0xAC00&&code<=0xD7A3){ var jong=(code-0xAC00)%28; has=jong>0; rieul=jong===8; }
  else if(/\d/.test(ch)){ has='0136780'.indexOf(ch)>=0; rieul='178'.indexOf(ch)>=0; }
  if(pair==='으로/로') return s+(has&&!rieul?a[0]:a[1]);
  return s+(has?a[0]:a[1]);
}
function cellAt(L){
  if(!L||L.row==null) return {err:'위치(알파벳 + 번호)를 알아듣지 못했어요'};
  var nm=L.col+'-'+L.row, sy=V.sayLoc({col:L.col,row:L.row}), c=V.colIndex(L.col), r=L.row-1;
  if(!WH||c<0||c>=WH.cols||r<0||r>=WH.rows) return {err:nm+' 위치는 이 창고 배치도에 없어요', sayErr:sy+' 위치는 이 창고에 없어요'};
  var key=r+'-'+c, cell=(WH.cells||{})[key];
  if(!cell||(cell.type!=='rack'&&cell.type!=='shelf')) return {err:josa(nm,'은/는')+' 랙(보관) 칸이 아니에요', sayErr:josa(sy,'은/는')+' 랙 칸이 아니에요'};
  return {key:key, cell:cell, dR:cell.divR||1, dC:cell.divC||1, name:nm, sy:sy};
}
function levelOf(ci, lvl){
  if(lvl==null) return {err:'몇 층인지 알아듣지 못했어요'};
  if(lvl<1||lvl>ci.dR) return {err:josa(ci.name,'은/는')+' '+ci.dR+'층까지 있어요', sayErr:josa(ci.sy,'은/는')+' '+ci.dR+'층까지 있어요'};
  var sr=ci.dR-lvl, arr=[];   /* 1층 = 맨 아래 줄 */
  for(var sc=0;sc<ci.dC;sc++){ var sk=sr+'-'+sc; arr.push({sk:sk, slot:(ci.cell.slots||{})[sk]||null}); }
  return {slots:arr};
}
function slotSay(s){ return s.name+', '+V.sayExp(s.exp)+', '+(+s.qty||0)+'개'; }
function evaluate(R){
  var lines=[], ok=true;
  function L(t,kind,s){ lines.push({t:t,k:kind,s:s}); if(kind==='ng') ok=false; }   /* s = 음성으로 읽을 문장(없으면 t) */
  R.warn.forEach(function(w){ L(w,'wn'); });
  if(R.leftovers.length) L('해석하지 못한 말: '+R.leftovers.join(', '),'wn');
  if(!WH) return {ok:false, lines:[{t:'창고 정보가 없어요','k':'ng'}], say:'창고 정보를 불러오지 못했어요'};
  if(!R.action){ L('무엇을 할지(입고·출고·뭐야·이동·취소) 못 알아들었어요','ng'); return {ok:false,lines:lines,say:'입고, 출고, 뭐야, 이동, 취소 중 무엇을 할지 말씀해 주세요'}; }
  if(R.action==='undo') return {ok:true, lines:lines, say:'시험 모드라 되돌릴 기록이 없어요'};

  var ci=cellAt(R.loc);
  if(ci.err){ L(ci.err,'ng'); return {ok:false,lines:lines,say:ci.sayErr||ci.err}; }
  var locSay=V.sayLoc(R.loc);

  if(R.action==='what'){
    if(R.loc.lvl==null){
      var parts=[]; for(var lv=ci.dR;lv>=1;lv--){ var s0=levelOf(ci,lv).slots.filter(function(x){return x.slot;})[0]; parts.unshift(lv+'층 '+(s0?s0.slot.name+' '+V.sayExp(s0.slot.exp):'비어 있음')); }
      L(ci.name+' 전체 '+ci.dR+'개 층','ok');
      return {ok:true, lines:lines, say:(V.sayLoc({col:R.loc.col,row:R.loc.row}))+'. '+parts.join('. ')};
    }
    var lw=levelOf(ci,R.loc.lvl); if(lw.err){ L(lw.err,'ng'); return {ok:false,lines:lines,say:lw.sayErr||lw.err}; }
    var got=lw.slots.filter(function(x){return x.slot;});
    if(!got.length){ L(ci.name+' '+R.loc.lvl+'층은 비어 있어요','ok'); return {ok:true,lines:lines,say:josa(locSay,'은/는')+' 비어 있어요'}; }
    L('기록: '+got.map(function(x){return x.slot.name+' · '+V.fmtExp(x.slot.exp)+' · '+(+x.slot.qty||0)+'개';}).join(' / '),'ok');
    return {ok:true, lines:lines, say:locSay+', '+got.map(function(x){return x.slot.name+', '+V.sayExp(x.slot.exp);}).join(', ')+'입니다'};
  }

  var lv2=levelOf(ci,R.loc.lvl); if(lv2.err){ L(lv2.err,'ng'); return {ok:false,lines:lines,say:lv2.sayErr||lv2.err}; }

  if(R.action==='in'){
    if(!R.product){ L('상품명을 알아듣지 못했어요 (등록된 상품만 가능)','ng','상품명을 알아듣지 못했어요'); }
    if(!R.exp) L('유통기한을 알아듣지 못했어요','ng');
    else if(!V.validYMD(R.exp)) L('유통기한 날짜가 올바르지 않아요','ng');
    else { var d=new Date('20'+R.exp.slice(0,2)+'-'+R.exp.slice(2,4)+'-'+R.exp.slice(4,6)); var now=new Date(); now.setHours(0,0,0,0); if(d<now) L('유통기한이 이미 지난 날짜예요 ('+V.fmtExp(R.exp)+')','wn'); }
    if(R.qty==null) L('수량을 알아듣지 못했어요','ng'); else if(R.qty<=0) L('수량이 0이에요','ng');
    var empty=lv2.slots.filter(function(x){return !x.slot;})[0];
    if(!empty){ var occ=lv2.slots[0].slot, onm=occ?occ.name:'물건';
      L(ci.name+' '+R.loc.lvl+'층에 이미 '+onm+(occ?' ('+V.fmtExp(occ.exp)+')':'')+' 있음','ng', locSay+'에는 이미 '+josa(onm,'이/가')+' 있어요'); }
    else L(ci.name+' '+R.loc.lvl+'층 비어 있음','ok');
    if(!ok){ var first=lines.filter(function(x){return x.k==='ng';})[0]; return {ok:false,lines:lines,say:(first.s||first.t)+'. 다시 말씀해 주세요.'}; }
    var q=(WH.inQ||[]).filter(function(it){ return it&&it.name===R.product&&String(it.exp||'')===R.exp; });
    L(q.length?'입고대기 목록에 같은 상품·유통기한 '+q.length+'건 있음 → 1건 차감 예정':'입고대기에 없는 새 입고로 등록 예정', q.length?'ok':'wn');
    return {ok:true, lines:lines, ask:R.product+', '+V.sayExp(R.exp)+', '+R.qty+'개. '+locSay+'에 입고할까요?',
      doneText:ci.name+' '+R.loc.lvl+'층 '+R.product+' 입고', doneSay:'입고 완료'};
  }
  if(R.action==='out'){
    var has=lv2.slots.filter(function(x){return x.slot;});
    if(!has.length){ L(ci.name+' '+R.loc.lvl+'층은 비어 있어요','ng'); return {ok:false,lines:lines,say:josa(locSay,'은/는')+' 비어 있어요. 출고할 물건이 없어요.'}; }
    var match=has.filter(function(x){ var s=x.slot;
      return (!R.product||s.name===R.product)&&(!R.exp||String(s.exp||'')===R.exp)&&(R.qty==null||(+s.qty||0)===R.qty); })[0];
    if(!match){
      var s1=has[0].slot, diff=[];
      if(R.product&&s1.name!==R.product) diff.push('상품');
      if(R.exp&&String(s1.exp||'')!==R.exp) diff.push('유통기한');
      if(R.qty!=null&&(+s1.qty||0)!==R.qty) diff.push('수량');
      L('기록과 다름('+diff.join('·')+'): 실제는 '+s1.name+' · '+V.fmtExp(s1.exp)+' · '+(+s1.qty||0)+'개','ng');
      return {ok:false,lines:lines,say:locSay+'에는 '+josa(slotSay(s1),'이/가')+' 있어요. 말씀하신 '+josa(diff.join(', ')||'상품','이/가')+' 달라요. 해당 제품이 아닙니다.'};
    }
    L('기록 일치: '+match.slot.name+' · '+V.fmtExp(match.slot.exp)+' · '+(+match.slot.qty||0)+'개','ok');
    return {ok:true, lines:lines, ask:locSay+', '+slotSay(match.slot)+'. 출고할까요?', doneText:ci.name+' '+R.loc.lvl+'층 '+match.slot.name+' 출고', doneSay:'출고 완료'};
  }
  if(R.action==='move'){
    var src=lv2.slots.filter(function(x){return x.slot;})[0];
    if(!src){ L('출발 '+ci.name+' '+R.loc.lvl+'층이 비어 있어요','ng'); return {ok:false,lines:lines,say:'출발 위치가 비어 있어요'}; }
    var ci2=cellAt(R.loc2); if(ci2.err){ L('도착: '+ci2.err,'ng'); return {ok:false,lines:lines,say:'도착 위치를 알아듣지 못했어요'}; }
    var lw3=levelOf(ci2,R.loc2.lvl); if(lw3.err){ L('도착: '+lw3.err,'ng'); return {ok:false,lines:lines,say:'도착 위치: '+(lw3.sayErr||lw3.err)}; }
    var dst=lw3.slots.filter(function(x){return !x.slot;})[0];
    if(!dst){ L('도착 '+ci2.name+' '+R.loc2.lvl+'층에 이미 물건이 있어요','ng'); return {ok:false,lines:lines,say:'도착 위치에 이미 물건이 있어요'}; }
    L('출발 '+src.slot.name+' · '+V.fmtExp(src.slot.exp)+' → 도착 비어 있음','ok');
    return {ok:true, lines:lines, ask:josa(src.slot.name,'을/를')+' '+locSay+'에서 '+josa(V.sayLoc(R.loc2),'으로/로')+' 옮길까요?', doneText:ci.name+' '+R.loc.lvl+'층 → '+ci2.name+' '+R.loc2.lvl+'층 이동', doneSay:'이동 완료'};
  }
  return {ok:false, lines:lines, say:'알 수 없는 명령이에요'};
}

function renderResult(R, ev){
  var box=document.getElementById('resBox'), g=document.getElementById('resGrid'), c=document.getElementById('chks'); if(!box) return;
  var actName={in:'입고',out:'출고',what:'확인(뭐야)',move:'이동',undo:'취소'}[R.action]||'';
  function row(k,v){ return '<div class="k">'+k+'</div><div class="v'+(v?'':' none')+'">'+(v?esc(v):'—')+'</div>'; }
  g.innerHTML=row('동작',actName)+row('상품',R.product)+row('유통기한',V.fmtExp(R.exp))+row('수량',R.qty!=null?R.qty+'개':'')
    +row(R.action==='move'?'출발':'위치',V.locLabel(R.loc))+(R.action==='move'?row('도착',V.locLabel(R.loc2)):'');
  c.innerHTML=ev.lines.map(function(x){ return '<div class="chk '+x.k+'">'+(x.k==='ok'?'✓':x.k==='ng'?'✕':'⚠')+' <span>'+esc(x.t)+'</span></div>'; }).join('');
  box.style.display='';
}
function renderSay(text, kind){
  var b=document.getElementById('sayBox'); if(!b) return;
  if(!text){ b.innerHTML=''; return; }
  b.innerHTML='<div class="say'+(kind==='done'?' done':kind==='bad'?' bad':'')+'">🔊 '+esc(text)
    +(kind==='ask'?'<div class="yn"><button style="background:#059669;color:#fff" onclick="confirmYes()">네</button><button style="background:#334155;color:#E2E8F0" onclick="confirmNo()">아니오</button></div>':'')+'</div>';
}
function typedTest(){ var i=document.getElementById('typIn'); var t=(i&&i.value||'').trim(); if(!t) return; pending=null; handleCommand([t]); }
function exTest(el){ var i=document.getElementById('typIn'); if(i) i.value=el.textContent; pending=null; handleCommand([el.textContent]); }
window.typedTest=typedTest; window.exTest=exTest;

/* ── 최근 기록 (이 폰 localStorage) ── */
function loadHist(){ try{ return JSON.parse(lsGet('wms_voice_hist')||'[]'); }catch(e){ return []; } }
function pushHist(text,R,ev){
  var h=loadHist(); var d=new Date(), p=function(x){return (x<10?'0':'')+x;};
  h.unshift({t:p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()), s:text,
    r:[{in:'입고',out:'출고',what:'확인',move:'이동',undo:'취소'}[R.action]||'?', R.product||'', V.fmtExp(R.exp), R.qty!=null?R.qty+'개':'', V.locLabel(R.loc)].filter(Boolean).join(' · '), ok:!!ev.ok});
  lsSet('wms_voice_hist', JSON.stringify(h.slice(0,20))); renderHist();
}
function renderHist(){
  var b=document.getElementById('histBox'); if(!b) return; var h=loadHist();
  b.innerHTML=h.length?h.map(function(x){ return '<div class="hist"><div class="t">'+esc(x.t)+' · '+(x.ok?'✓':'✕')+'</div>"'+esc(x.s)+'"<br><b>'+esc(x.r)+'</b></div>'; }).join(''):'<div class="hint" style="text-align:left">아직 없어요</div>';
}

/* ── 데이터 ── */
function collectProducts(list){
  var s={};
  list.forEach(function(w){
    if(!w) return;
    Object.keys(w.pColors||{}).forEach(function(n){ s[n]=1; });
    (w.inQ||[]).forEach(function(it){ if(it&&it.name) s[it.name]=1; });
    Object.keys(w.cells||{}).forEach(function(k){ var c=w.cells[k]; if(!c||!c.slots) return; Object.keys(c.slots).forEach(function(sk){ var x=c.slots[sk]; if(x&&x.name) s[x.name]=1; }); });
  });
  return Object.keys(s);
}
function selectWh(id){
  if(whRef) whRef.off();
  WHID=id; lsSet('wms_voice_wh:'+GID, id);
  whRef=db.ref('warehouses/'+id);
  whRef.on('value',function(s){
    WH=s.val(); if(WH){ WH.rows=+WH.rows||0; WH.cols=+WH.cols||0; }
    var all=WHS.map(function(w){ return w.id===id?WH:w.raw; }); PRODUCTS=collectProducts(all);
  });
}
window.selectWh=selectWh;
function start(){
  db.ref('groups/'+GID).get().then(function(g){
    var wids=g.exists()?Object.keys(g.val()).filter(function(k){return k!=='_init';}):[];
    if(!wids.length){ app.innerHTML='<div class="center">이 그룹에 창고가 없어요.</div>'; return; }
    return Promise.all(wids.map(function(w){ return db.ref('warehouses/'+w).get().then(function(s){ return {id:w, raw:s.val()}; }).catch(function(){ return null; }); }))
    .then(function(list){
      WHS=list.filter(function(x){return x&&x.raw;}).map(function(x){ return {id:x.id, name:x.raw.name||x.id, raw:x.raw}; });
      if(!WHS.length){ app.innerHTML='<div class="center">창고를 불러오지 못했어요.</div>'; return; }
      var saved=lsGet('wms_voice_wh:'+GID); WHID=WHS.some(function(w){return w.id===saved;})?saved:WHS[0].id;
      PRODUCTS=collectProducts(WHS.map(function(w){return w.raw;}));
      renderShell(); selectWh(WHID);
    });
  }).catch(function(e){ app.innerHTML='<div class="center" style="color:#F87171">불러오기 실패: '+esc(e.message)+'</div>'; });
}
auth.onAuthStateChanged(function(user){
  if(!user){ location.replace('/wms_login.html?return='+encodeURIComponent('/wms_voice.html'+location.search)); return; }
  db.ref('superadmins/'+user.uid).get().then(function(a){
    if(a.exists()){ if(!GID){ app.innerHTML='<div class="center">그룹이 지정되지 않았어요. 창고관리 메뉴에서 들어와 주세요.</div>'; return; } start(); return; }
    db.ref('userGroup/'+user.uid).get().then(function(g){
      if(!g.exists()){ app.innerHTML='<div class="center">작업 그룹에 등록되어 있지 않아요.</div>'; return; }
      if(!GID) GID=g.val();
      if(g.val()!==GID){ app.innerHTML='<div class="center">이 그룹에 대한 권한이 없어요.</div>'; return; }
      start();
    });
  }).catch(function(e){ app.innerHTML='<div class="center" style="color:#F87171">권한 확인 실패: '+esc(e.message)+'</div>'; });
});
</script>
