<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0B1220;--card:#141E33;--bd:#26344F;--tx:#E8EEF7;--sub:#8597B0;--accent:#3B82F6;--green:#34D399;--red:#F87171;--amber:#FBBF24;}
body{background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--tx);min-height:100vh;padding-bottom:150px;}
.wrap{max-width:560px;margin:0 auto;padding:12px;}
.center{text-align:center;padding:70px 20px;color:var(--sub);font-size:14px;}

/* 상단 — 한 줄 */
.top{display:flex;align-items:center;gap:7px;margin-bottom:10px;}
.back{background:rgba(255,255,255,.06);color:var(--sub);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700;text-decoration:none;}
.whs{flex:1;min-width:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:13px;font-family:inherit;}
.sttTg{font-size:10px;font-weight:800;border-radius:6px;padding:4px 6px;cursor:pointer;font-family:inherit;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--sub);}
.sttTg.on{color:#C4B5FD;background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.5);}

/* 모드 5버튼 */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.md{padding:14px 0;border-radius:11px;border:1px solid var(--bd);background:var(--card);color:var(--sub);font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;}
.md.on{color:#fff;}
.md.on.inq{background:#2563EB;border-color:#2563EB;}
.md.on.outq{background:#DC2626;border-color:#DC2626;}
.md.on.place{background:#059669;border-color:#059669;}
.md.on.outnow{background:#EA580C;border-color:#EA580C;}
.md.on.check{background:#475569;border-color:#475569;}
.md.on.plan{background:#7C3AED;border-color:#7C3AED;}

/* 예정작업 입력 */
.pb{border:1px solid var(--bd);border-radius:11px;padding:8px;margin-top:8px;background:rgba(255,255,255,.02);}
.pb.reg{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.05);}
.ph{display:flex;gap:5px;align-items:center;margin-bottom:6px;}
.pn{font-size:11px;font-weight:800;color:var(--sub);width:14px;flex:none;}
.pt{font-size:11px;font-weight:800;padding:4px 7px;border-radius:6px;flex:none;}
.pt.in{color:#A7F3D0;background:rgba(52,211,153,.15);}
.pt.out{color:#FCA5A5;background:rgba(248,113,113,.15);}
.pr{display:flex;gap:5px;align-items:center;margin-bottom:5px;}
.pi{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:8px 7px;font-size:14px;font-family:inherit;min-width:0;}
.pi:disabled{color:var(--sub);background:transparent;border-color:transparent;padding-left:0;}
.ptype{flex:none;width:62px;}
.pveh{flex:1;}
.pnm{flex:1.7;}
.pex{flex:1.25;}
.pqn{flex:.8;}
.pbtn{flex:none;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--sub);border-radius:7px;padding:8px 6px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;}
.pbtn.add{color:#93C5FD;border-color:rgba(59,130,246,.4);}
.pbtn.del{color:#FCA5A5;border-color:rgba(248,113,113,.3);}
.pbtn.big{flex:1;padding:11px 6px;font-size:13px;}
.pleft{font-size:11px;font-weight:800;color:#6EE7B7;flex:none;padding:0 4px;}
.pr.done{padding:2px 2px 4px;}
.pdesc{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pfoot{display:flex;gap:5px;margin-top:6px;}
.preg{flex:1;margin-top:0;border:none;border-radius:8px;padding:10px;background:#2563EB;color:#fff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.padd{display:flex;gap:6px;margin-top:10px;}

/* 문답 카드 */
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;}
.q{font-size:26px;font-weight:800;line-height:1.3;margin-bottom:4px;}
.q.small{font-size:18px;color:var(--sub);font-weight:700;}
.sub{font-size:12.5px;color:var(--sub);margin-bottom:10px;line-height:1.55;}
.rows{margin:10px 0 0;}
.row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;background:rgba(255,255,255,.04);margin-bottom:5px;cursor:pointer;}
.row.cur{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.5);}
.row .k{font-size:12px;color:var(--sub);width:78px;flex:none;font-weight:700;}
.row .v{font-size:16px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .v.none{color:#4A5A72;font-weight:600;}
.row .e{font-size:12px;color:var(--sub);flex:none;}
.row .v.fz{color:var(--amber);}
.ed{display:flex;gap:6px;margin-top:9px;}
.ed input{flex:1;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--accent);border-radius:9px;padding:11px 10px;font-size:16px;font-family:inherit;}
.ed button{flex:none;background:var(--accent);color:#fff;border:none;border-radius:9px;padding:0 15px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
.st{margin-top:10px;padding:10px 11px;border-radius:10px;font-size:14px;line-height:1.55;background:rgba(255,255,255,.05);color:var(--sub);}
.st.ok{background:rgba(52,211,153,.1);color:#A7F3D0;}
.st.ng{background:rgba(248,113,113,.1);color:#FCA5A5;}
.st.hear{background:rgba(59,130,246,.1);color:#BFDBFE;font-family:ui-monospace,monospace;}

/* 하단 고정 버튼 */
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(11,18,32,0),var(--bg) 26%);padding:16px 12px 14px;}
.dock-in{max-width:560px;margin:0 auto;}
.mic{width:100%;height:74px;border-radius:16px;border:none;background:#2563EB;color:#fff;font-size:19px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 8px 24px rgba(37,99,235,.35);}
.mic.on{background:#DC2626;animation:pulse 1.1s infinite;}
.mic.think{background:#7C3AED;}
.mic:disabled{background:#1E293B;color:#64748B;box-shadow:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

details{margin-top:12px;}
summary{font-size:12px;color:var(--sub);font-weight:700;cursor:pointer;padding:6px 2px;}
.log{font-size:12.5px;border-bottom:1px dashed rgba(255,255,255,.08);padding:6px 2px;display:flex;gap:8px;}
.log .t{color:var(--sub);font-size:10.5px;white-space:nowrap;padding-top:2px;}
.btn2{background:rgba(255,255,255,.06);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px;}
</style>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAM2t9dvtStrXNam-YAiq19yD8FHwKpPmI",

var auth=firebase.auth(), db=firebase.database(), V=window.WMSVoice;
var app=document.getElementById('app');
var QS=new URLSearchParams(location.search);
var GID=QS.get('gid')||localStorage.getItem('wms_adminGroupId')||'', WANT_WID=QS.get('wid')||'';
var WHS=[], WH=null, WHID=null, whRef=null, PRODUCTS=[], USER=null;
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null, listening=false;

/* U(이 폰): 진행중인 대기 그룹 · 되돌리기 · 처리내역 */
var U={ACTIVE:{in:null,out:null}, UNDO:[], LOG:[]};
var PAL=['#B22222','#FF0000','#FF6666','#FFCCCC','#CC7A00','#FFA500','#FFC04D','#FFE5B3','#B3B300','#FFFF00','#FFFF66','#FFFFCC','#006400','#008000','#4CAF50','#C8E6C9','#00008B','#0000FF','#6666FF','#CCCCFF','#000033','#000080','#333399','#9999CC','#004D40','#008080','#4DB6AC','#B2DFDB','#4B0082','#800080','#B366B3','#E6CCE6','#000000','#333333','#666666','#999999','#CCCCCC','#FFFFFF'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function uKey(){ return 'wms_voice_u:'+GID+':'+WHID; }
function saveU(){ U.UNDO=U.UNDO.slice(-50); U.LOG=U.LOG.slice(0,60); lsSet(uKey(), JSON.stringify(U)); }
function loadU(){ try{ var o=JSON.parse(lsGet(uKey())||'null'); U=Object.assign({ACTIVE:{in:null,out:null},UNDO:[],LOG:[]},o||{}); }catch(e){ U={ACTIVE:{in:null,out:null},UNDO:[],LOG:[]}; } }
function uid(){ return Math.random().toString(36).slice(2,9); }
function pad(n){ return (n<10?'0':'')+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowHM(){ var d=new Date(); return pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function josa(w, pair){
  var a=pair.split('/'), s=String(w).trim(), ch=s.slice(-1), code=ch.charCodeAt(0), has=false, rieul=false;
  if(code>=0xAC00&&code<=0xD7A3){ var jong=(code-0xAC00)%28; has=jong>0; rieul=jong===8; }
  else if(/\d/.test(ch)){ has='0136780'.indexOf(ch)>=0; rieul='178'.indexOf(ch)>=0; }
  if(pair==='으로/로') return s+(has&&!rieul?a[0]:a[1]);
  return s+(has?a[0]:a[1]);
}
function addLog(s){ U.LOG.unshift({t:nowHM(), s:s}); saveU(); renderLog(); }
function whPath(){ return 'warehouses/'+WHID; }
function inQArr(){ var q=WH&&WH.inQ; if(!q) return []; return Array.isArray(q)?q.filter(Boolean):Object.keys(q).map(function(k){return q[k];}).filter(Boolean); }
function fail(e){ console.warn(e); setStatus('저장 실패: '+(e&&e.message||e),'ng'); speak('저장에 실패했어요'); }
function colNames(){ var c=[]; for(var i=0;i<(WH&&WH.cols||0);i++) c.push(V.colName(i)); return c; }

/* ── 대기 목록 ── */
function inGroups(){
  var m={}, order=[];
  inQArr().forEach(function(it){ if(!it||!it.name) return; var k=it.name+'|'+String(it.exp||'')+'|'+(+it.qty||0);
    if(!m[k]){ m[k]={id:k, type:'in', product:it.name, exp:String(it.exp||''), qty:+it.qty||0, items:[]}; order.push(k); } m[k].items.push(it); });
  return order.map(function(k){ var g=m[k]; g.left=g.items.length; g.total=g.left; return g; });
}
function outGroups(){
  var vo=(WH&&WH.voiceOut)||{};
  return Object.keys(vo).map(function(id){ var x=vo[id]||{}; return {id:id, type:'out', product:x.product, exp:String(x.exp||''), qty:+x.qty||0, total:+x.total||0, left:Math.max(0,+x.left||0), createdAt:x.createdAt||0}; })
    .filter(function(g){ return g.product; }).sort(function(a,b){ return a.createdAt-b.createdAt; });
}
function groupsOf(type){ return type==='in'?inGroups():outGroups(); }
function findGroup(type,id){ var l=groupsOf(type); for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i]; return null; }
function activeGroup(type){
  var g=U.ACTIVE[type]&&findGroup(type,U.ACTIVE[type]);
  if(g&&g.left>0) return g;
  var nx=groupsOf(type).filter(function(x){return x.left>0;})[0]||null;
  U.ACTIVE[type]=nx?nx.id:null; return nx;
}
function groupLine(g){ return g.product+' · '+(g.exp?V.fmtExp(g.exp):'유통기한 무관')+(g.qty?' · '+g.qty+'개':''); }

/* ── 칸 ── */
function cellAt(L){
  if(!L||L.row==null) return {err:'유닛을 알아듣지 못했어요'};
  var nm=L.col+'-'+L.row, sy=V.sayLoc({col:L.col,row:L.row}), c=V.colIndex(L.col), r=L.row-1;
  if(!WH||c<0||c>=WH.cols||r<0||r>=WH.rows) return {err:nm+' 유닛은 이 창고에 없어요', sayErr:sy+' 유닛은 이 창고에 없어요'};
  var key=r+'-'+c, cell=(WH.cells||{})[key];
  if(!cell||(cell.type!=='rack'&&cell.type!=='shelf')) return {err:josa(nm,'은/는')+' 랙 칸이 아니에요', sayErr:josa(sy,'은/는')+' 랙 칸이 아니에요'};
  return {key:key, cell:cell, dR:cell.divR||1, dC:cell.divC||1, name:nm, sy:sy};
}
function levelOf(ci, lvl){
  if(lvl==null) return {err:'몇 층인지 알아듣지 못했어요'};
  if(lvl<1||lvl>ci.dR) return {err:josa(ci.name,'은/는')+' '+ci.dR+'층까지 있어요', sayErr:josa(ci.sy,'은/는')+' '+ci.dR+'층까지 있어요'};
  var sr=ci.dR-lvl, arr=[];   /* 1층 = 맨 아래 줄 */
  for(var sc=0;sc<ci.dC;sc++){ var sk=sr+'-'+sc; arr.push({sk:sk, slot:(ci.cell.slots||{})[sk]||null}); }
  return {slots:arr};
}
function locCheck(L){
  var ci=cellAt(L); if(ci.err) return {err:ci.err, sayErr:ci.sayErr||ci.err};
  var lv=levelOf(ci,L.lvl); if(lv.err) return {err:lv.err, sayErr:lv.sayErr||lv.err};
  return {ci:ci, lv:lv, say:V.sayLoc(L), label:ci.name+' '+L.lvl+'층'};
}
function setSlotLocal(key, sk, val){ var c=WH.cells[key]; if(!c.slots) c.slots={}; if(val) c.slots[sk]=val; else delete c.slots[sk]; }

/* ── 음성 출력 ── */
var koVoice=null;
function pickVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; koVoice=vs.filter(function(v){return /ko/i.test(v.lang);})[0]||null; }catch(e){} }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text, cb){
  var called=false; function done(){ if(called) return; called=true; if(cb) cb(); }
  if(!window.speechSynthesis||!text){ setTimeout(done,60); return; }
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=1.1; if(koVoice) u.voice=koVoice;
    u.onend=done; u.onerror=done; speechSynthesis.speak(u);
    setTimeout(done, 1100+text.length*130);
  }catch(e){ done(); }
}


/* ── 음성 인식 ─────────────────────────────────────────────
   문답형이라 "지금 무엇을 묻는지"(slot)를 서버에 함께 보낸다.
   서버는 그 종류의 어휘만 부스트하므로 후보가 좁아져 오인식이 준다.
   서버가 안 되면 브라우저 기본 인식으로 자동 폴백. ───────── */
var SSTT_OK = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
var SSTT = SSTT_OK && lsGet('wms_voice_sstt') !== '0';
var sttFails = 0, sttFn = null;
function sttCall(){
  if(!sttFn) sttFn = firebase.app().functions('asia-southeast1').httpsCallable('sttVoice', {timeout:60000});
  return sttFn;
}
function paintSSTT(){
  var el=document.getElementById('sttTg'); if(!el) return;
  el.style.display = SSTT_OK?'':'none';
  el.className='sttTg'+(SSTT?' on':'');
  el.textContent = SSTT?'🎯 정밀':'기본';
}
function setSSTT(on){ SSTT=!!on&&SSTT_OK; sttFails=0; lsSet('wms_voice_sstt', SSTT?'1':'0'); paintSSTT(); }
window.toggleSSTT=function(){ setSSTT(!SSTT); };

var micStream=null, mediaRec=null, audioCtx=null, vadTimer=null, sttAbort=false;
function pickMime(){
  var c=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  for(var i=0;i<c.length;i++){ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }
  return '';
}
function getMic(){
  if(micStream && micStream.active) return Promise.resolve(micStream);
  return navigator.mediaDevices.getUserMedia({audio:{channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true}})
    .then(function(s){ micStream=s; return s; });
}
function releaseMic(){ try{ if(micStream) micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} micStream=null; }
document.addEventListener('visibilitychange',function(){ if(document.hidden && !listening) releaseMic(); });
function levelBar(v){ var n=Math.max(0,Math.min(12,Math.round(v*100))); return new Array(n+1).join('=')+new Array(12-n+1).join('.'); }
function stopVAD(){ if(vadTimer){ clearInterval(vadTimer); vadTimer=null; } }

/* 말이 끝나는 지점 — 창고 소음을 감안해 첫 0.3초의 바닥소음으로 문턱을 잡는다 */
function startVAD(stream, my, onStop){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){ setTimeout(function(){ onStop('done'); }, 4000); return; }
  var src=audioCtx.createMediaStreamSource(stream);
  var an=audioCtx.createAnalyser(); an.fftSize=1024; an.smoothingTimeConstant=.2; src.connect(an);
  var buf=new Uint8Array(an.fftSize);
  var t0=Date.now(), floor=0, floorN=0, thr=0.012, spoke=false, lastLoud=0;
  vadTimer=setInterval(function(){
    an.getByteTimeDomainData(buf);
    var s=0; for(var i=0;i<buf.length;i++){ var d=(buf[i]-128)/128; s+=d*d; }
    var rms=Math.sqrt(s/buf.length), el=Date.now()-t0;
    if(el<300){ floor+=rms; floorN++; thr=Math.max(0.012,(floor/floorN)*2.6); }
    else {
      if(rms>thr){ spoke=true; lastLoud=Date.now(); }
      if(!spoke && el>6000) return fin('no-speech');
      if(spoke && Date.now()-lastLoud>900) return fin('done');
      if(el>15000) return fin('done');
    }
    if(!stale(my)) setStatus((spoke?'* ':'. ')+levelBar(rms),'hear');
  }, 50);
  function fin(why){ stopVAD(); try{ src.disconnect(); }catch(e){} onStop(why); }
}

/* listen(slot, cb) — cb(alts, err) 로 인식 후보 문장들을 넘긴다.
   지난 인식의 늦은 콜백이 최신 결과·안내를 덮어쓰지 않도록 번호로 걸러낸다. */
var listenSeq=0;
function stale(my){ return my!==listenSeq; }
function listen(slot, cb){
  var my=++listenSeq;
  listen.my=my;
  function guarded(alts, err){ if(stale(my)) return; cb(alts, err); }
  if(SSTT) listenServer(slot, guarded, my); else listenWeb(slot, guarded, my);
}

function listenServer(slot, cb, my){
  var mt=pickMime();
  sttAbort=false; listening=true; setMic('on');
  setStatus('. '+levelBar(0),'hear');
  getMic().then(function(stream){
    if(sttAbort){ listening=false; setMic('idle'); return; }
    var chunks=[], r;
    try{ r=new MediaRecorder(stream, mt?{mimeType:mt, audioBitsPerSecond:32000}:undefined); }
    catch(e){ listening=false; setMic('idle'); setStatus('녹음을 시작할 수 없어요','ng'); return; }
    mediaRec=r;
    r.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    r.onstop=function(){
      stopVAD(); mediaRec=null; listening=false;
      if(sttAbort){ setMic('idle'); return; }
      var blob=new Blob(chunks,{type:mt||'audio/webm'});
      if(blob.size<1200){ setMic('idle'); cb(null,'no-speech'); return; }
      sendAudio(blob, mt, slot, cb, my);
    };
    r.start();
    startVAD(stream, my, function(why){
      if(why==='no-speech'){ sttAbort=true; try{ r.stop(); }catch(e){}
        listening=false; setMic('idle'); cb(null,'no-speech'); return; }
      try{ r.stop(); }catch(e){}
    });
  }).catch(function(err){
    stopVAD(); listening=false; mediaRec=null; setMic('idle');
    if(stale(my)) return;
    setStatus((err&&err.name==='NotAllowedError')?'마이크 권한이 꺼져 있어요 — 주소창 왼쪽 자물쇠에서 허용해 주세요':'마이크를 열 수 없어요','ng');
  });
}
function sendAudio(blob, mt, slot, cb, my){
  setMic('think'); if(!stale(my)) setStatus('인식 중…','hear');
  var fr=new FileReader();
  fr.onerror=function(){ sttFallback('오디오를 읽지 못했어요', slot, cb, my); };
  fr.onload=function(){
    var b64=String(fr.result||'').split(',')[1]||'';
    if(!b64) return sttFallback('오디오가 비었어요', slot, cb, my);
    sttCall()({audio:b64, mime:mt||'audio/webm', slot:slot, products:PRODUCTS.slice(0,400), cols:colNames(), priority:planVocab()})
      .then(function(res){
        var d=(res&&res.data)||{}, alts=d.alts||[];
        sttFails=0; setMic('idle');
        if(d.adapted===false) addLog('어휘 부스트 없이 인식됨 — 정확도가 낮을 수 있어요');
        cb(alts.length?alts:null, alts.length?null:'empty');
      })
      .catch(function(err){ sttFallback((err&&err.message)||'인식 서버에 연결하지 못했어요', slot, cb, my); });
  };
  fr.readAsDataURL(blob);
}
function sttFallback(msg, slot, cb, my){
  sttFails++; setMic('idle'); addLog('정밀인식 실패 — '+msg);
  if(stale(my)) return;
  if(sttFails>=3){ setSSTT(false); setStatus('정밀인식이 계속 실패해 기본 인식으로 바꿨어요','ng'); cb(null,'fail'); return; }
  setStatus('정밀인식 실패 — 기본 인식으로 다시 들어볼게요','ng');
  listenWeb(slot, cb, my);
}

/* 브라우저 기본 인식 (폴백) */
function listenWeb(slot, cb, my){
  if(!SR){ setStatus('이 브라우저는 음성 인식을 지원하지 않아요 — 아래 칸에 입력해 주세요','ng'); cb(null,'nosupport'); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  if(rec){ try{ rec.abort(); }catch(e){} }
  var r=new SR(); r.lang='ko-KR'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  var finalAlts=null; rec=r; listening=true; setMic('on'); setStatus('듣는 중…','hear');
  r.onresult=function(ev){
    var txt=''; for(var i=ev.resultIndex;i<ev.results.length;i++) txt+=ev.results[i][0].transcript;
    var last=ev.results[ev.results.length-1];
    if(last.isFinal){ finalAlts=[]; for(var a=0;a<last.length;a++) finalAlts.push(last[a].transcript); }
    if(!stale(my)) setStatus(txt||'듣는 중…','hear');
  };
  r.onerror=function(){};
  r.onend=function(){
    if(rec!==r) return;
    rec=null; listening=false; setMic('idle');
    cb(finalAlts&&finalAlts.length?finalAlts:null, finalAlts?null:'no-speech');
  };
  try{ r.start(); }catch(e){ listening=false; setMic('idle'); cb(null,'fail'); }
}
function stopListen(){
  listenSeq++; sttAbort=true; stopVAD();
  if(mediaRec){ try{ mediaRec.stop(); }catch(e){} mediaRec=null; }
  if(rec){ try{ rec.abort(); }catch(e){} rec=null; }
  listening=false; setMic('idle');
}
var wakeLock=null;
function keepAwake(){ try{ if(navigator.wakeLock&&!wakeLock) navigator.wakeLock.request('screen').then(function(l){ wakeLock=l; l.addEventListener('release',function(){ wakeLock=null; }); }).catch(function(){}); }catch(e){} }


/* ── 문답 진행 ─────────────────────────────────────────────
   한 번에 한 가지만 묻고 한 마디만 듣는다.
   답이 짧을수록 인식이 정확하고, 틀리면 그 항목만 다시 고치면 된다. */
var MODES={
  plan:   {label:'예정작업', steps:[]},
  inq:    {label:'입고대기', steps:['product','exp','qty','pallets']},
  place:  {label:'입고적치', steps:['unit','lvl']},
  outnow: {label:'즉시출고', steps:['unit','lvl']},
  outq:   {label:'출고대기', steps:['product','pallets']},
  check:  {label:'유닛확인', steps:['unit','lvl']}
};
var SLOTS={
  product:{k:'상품명',    q:'상품명?',           stt:'product'},
  exp:    {k:'유통기한',  q:'유통기한?',         stt:'exp'},
  qty:    {k:'파렛트당',  q:'파렛트당 수량은요?', stt:'num'},
  pallets:{k:'파렛트 수', q:'파렛트 수는요?',     stt:'num'},
  unit:   {k:'유닛',      q:'어느 유닛인가요?',   stt:'unit'},
  lvl:    {k:'층',        q:'몇 층인가요?',       stt:'lvl'}
};
var W=null;      /* {mode, val:{}, i, edit, tries, done} */
var MICST='idle';

function steps(){ return MODES[W.mode].steps; }
function curSlot(){ return W.edit || (W.i<steps().length ? steps()[W.i] : null); }

function pickMode(m){
  stopListen(); try{ speechSynthesis.cancel(); }catch(e){}
  W={mode:m, val:{}, i:0, edit:null, tries:0, done:false};
  render();
}
window.pickMode=pickMode;

/* 시작 / 중지 */
function micPress(){
  keepAwake();
  if(listening){ stopListen(); return; }
  if(!W||W.mode==='plan') return;
  if(W.done){ W={mode:W.mode, val:{}, i:0, edit:null, tries:0, done:false}; }
  W.tries=0; askCur();
}
window.micPress=micPress;

function askCur(){
  var s=curSlot();
  if(!s){ finishWiz(); return; }
  render();
  speak(SLOTS[s].q, function(){ hear(s); });
}
function hear(s){
  var w=W;
  listen(SLOTS[s].stt, function(alts, err){
    if(W!==w||W.done) return;   /* 그 사이 작업을 바꿨거나 끝났으면 무시 */
    if(!alts){ retry(s, err==='no-speech'?'못 들었어요':'다시 말씀해 주세요'); return; }
    var r=parseAlts(s, alts);
    if(!r){ setStatus('"'+alts[0]+'" — 못 알아들었어요','ng'); retry(s,'다시 말씀해 주세요'); return; }
    accept(s, r.v, r.fuzzy, alts[0]);
  });
}
function retry(s, msg){
  W.tries++;
  if(W.tries>=3){ setStatus((msg||'')+' — 아래 칸에 직접 입력해 주세요','ng'); setMic('idle'); render(); return; }
  speak(msg, function(){ hear(s); });
}

/* 답 하나가 확정됨 → 완료멘트 + 다음 질문 */
function accept(s, v, fuzzy, heard){
  W.val[s]={v:v, fuzzy:!!fuzzy, heard:heard||''};
  W.tries=0;
  W.edit=null;
  /* 아직 안 채운 첫 항목으로 — 고치기였다면 원래 자리로 돌아간다 */
  var nx=steps().filter(function(k){ return !W.val[k]; })[0];
  W.i = nx?steps().indexOf(nx):steps().length;
  render();
  var echo=slotSay(s, v);
  if(W.i>=steps().length){ speak(echo, function(){ finishWiz(); }); return; }
  var nextS=steps()[W.i];
  speak(echo+'. '+SLOTS[nextS].q, function(){ render(); hear(nextS); });
}

/* ── 답 해석 (질문마다 다르게) ── */
function parseAlts(s, alts){
  for(var i=0;i<alts.length;i++){ var r=parseSlot(s, alts[i]); if(r) return r; }
  return null;
}
function parseSlot(s, text){
  if(!text) return null;
  if(s==='product'){
    var m=V.matchProduct(text, PRODUCTS);
    if(m && m.rel<=0.34) return {v:m.name, fuzzy:!m.exact};
    return null;
  }
  if(s==='exp'){
    if(/없|무관|건너|스킵|패스/.test(text)) return {v:''};
    var d=V.digitsOf(text);
    if(d.length===8) d=d.slice(2);
    if(d.length===6 && V.validYMD(d)) return {v:d};
    return null;
  }
  if(s==='qty'||s==='pallets'){
    var n=V.firstNum(text);
    if(n!=null && n>0 && n<=9999) return {v:n};
    return null;
  }
  if(s==='unit'){
    var cn=colNames(), u=V.matchUnit(text, cn);
    /* 이 창고에 없는 유닛이면 그 자리에서 되묻는다 (끝까지 갔다가 실패하지 않게) */
    if(!u || cn.indexOf(u.col)<0 || u.row<1 || u.row>(WH&&WH.rows||0)) return null;
    return {v:u};
  }
  if(s==='lvl'){
    var l=V.firstNum(text);
    if(l!=null && l>=1 && l<=30) return {v:l};
    return null;
  }
  return null;
}
function slotSay(s, v){
  if(s==='product') return v;
  if(s==='exp') return v?V.sayExp(v):'유통기한 없음';
  if(s==='qty') return v+'개';
  if(s==='pallets') return v+'파렛트';
  if(s==='unit') return V.sayLoc({col:v.col,row:v.row});
  if(s==='lvl') return v+'층';
  return String(v);
}
function slotText(s, v){
  if(s==='exp') return v?V.fmtExp(v):'없음';
  if(s==='qty') return v+'개';
  if(s==='pallets') return v+'팔';
  if(s==='unit') return v.col+'-'+v.row;
  if(s==='lvl') return v+'층';
  return String(v);
}

/* ── 타이핑으로 고치기 ── */
function editSlot(s){ stopListen(); try{ speechSynthesis.cancel(); }catch(e){} W.edit=s; W.tries=0; render(); }
window.editSlot=editSlot;
function submitTyped(){
  var el=document.getElementById('edIn'); if(!el) return;
  var t=(el.value||'').trim(); if(!t) return;
  var s=curSlot(); if(!s) return;
  var r=parseSlot(s, t);
  if(!r){ setStatus('"'+t+'" — '+SLOTS[s].k+'(으)로 해석할 수 없어요','ng'); return; }
  el.value='';
  accept(s, r.v, r.fuzzy, t);
}
window.submitTyped=submitTyped;

/* ── 마무리 ── */
function finishWiz(){
  stopListen();      /* 아직 떠 있는 인식 콜백이 결과 안내를 덮어쓰지 않게 */
  W.done=true;
  if(W.mode==='inq'||W.mode==='outq') return actRegister();
  if(W.mode==='place') return actPlace();
  if(W.mode==='outnow') return actOutNow();
  if(W.mode==='check') return actCheck();
}
function wizOk(text, say){ W.done=true; setStatus(text,'ok'); setMic('idle'); render(); speak(say||text); }
function wizNg(text, say){ W.done=true; setStatus(text,'ng'); setMic('idle'); render(); speak(say||text); }

/* ── 실제 처리 ── */
function pickClr(name){ var pc=(WH&&WH.pColors)||{}; if(pc[name]) return pc[name]; var used={}; Object.keys(pc).forEach(function(k){ used[pc[k]]=1; }); return PAL.filter(function(c){return !used[c];})[0]||PAL[0]; }
function safeKey(s){ return !/[.#$\/\[\]]/.test(s); }

function actRegister(){
  var v=W.val, type=W.mode==='inq'?'in':'out';
  var d={type:type, product:v.product.v, exp:v.exp?v.exp.v:'', qty:v.qty?v.qty.v:0, pallets:v.pallets.v};
  if(type==='in'){
    var items=[]; for(var i=0;i<d.pallets;i++) items.push({id:uid(), name:d.product, qty:+d.qty||1, exp:String(d.exp||'')});
    var nq=inQArr().concat(items), upd={inQ:nq};
    if(safeKey(d.product)&&!(WH.pColors&&WH.pColors[d.product])) upd['pColors/'+d.product]=pickClr(d.product);
    var tx={id:uid(), type:'in', date:todayStr(), name:d.product, exp:String(d.exp||''), pallets:d.pallets, qty:(+d.qty||1)*d.pallets};
    var txRef=db.ref('txLogs/'+WHID).push();
    WH.inQ=nq;
    U.ACTIVE.in=d.product+'|'+String(d.exp||'')+'|'+(+d.qty||1);
    U.UNDO.push({t:'reg', ids:items.map(function(x){return x.id;}), txKey:txRef.key, label:'입고대기 등록 · '+d.product+' '+d.pallets+'팔'});
    Promise.all([db.ref(whPath()).update(upd), txRef.set(tx)]).catch(fail);
  } else {
    var vref=db.ref(whPath()+'/voiceOut').push();
    var o={product:d.product, exp:String(d.exp||''), qty:+d.qty||0, total:d.pallets, left:d.pallets, createdAt:Date.now(), by:(USER&&USER.email)||''};
    if(!WH.voiceOut) WH.voiceOut={}; WH.voiceOut[vref.key]=o;
    U.ACTIVE.out=vref.key;
    U.UNDO.push({t:'oreg', voId:vref.key, label:'출고대기 등록 · '+d.product+' '+d.pallets+'팔'});
    vref.set(o).catch(fail);
  }
  saveU();
  var nm=type==='in'?'입고대기':'출고대기';
  var brief=d.product+(d.exp?', '+V.sayExp(d.exp):'')+(d.qty?', '+d.qty+'개씩':'')+' '+d.pallets+'파렛트. '+nm+' 등록 완료.';
  addLog('[등록] '+nm+' · '+d.product+(d.exp?' · '+V.fmtExp(d.exp):'')+(d.qty?' · '+d.qty+'개':'')+' x '+d.pallets+'팔');
  wizOk(d.product+(d.exp?' · '+V.fmtExp(d.exp):'')+(d.qty?' · '+d.qty+'개':'')+' × '+d.pallets+'팔 → '+nm+' 등록 완료', brief);
}

function actPlace(){
  var L={col:W.val.unit.v.col, row:W.val.unit.v.row, lvl:W.val.lvl.v};
  var lc=locCheck(L); if(lc.err) return wizNg(lc.err, lc.sayErr);
  var g=activeGroup('in');
  if(!g) return wizNg('입고대기가 없어요 — 먼저 등록하세요','입고대기가 없어요. 먼저 입고대기를 등록해 주세요');
  var empty=lc.lv.slots.filter(function(x){return !x.slot;})[0];
  if(!empty){ var o=lc.lv.slots[0].slot;
    return wizNg(lc.label+'에 이미 '+o.name+' ('+V.fmtExp(o.exp)+') 있음', lc.say+'에는 이미 '+josa(o.name,'이/가')+' 있어요'); }
  var item=g.items[0], key=lc.ci.key, sk=empty.sk;
  var nq=inQArr().filter(function(x){ return x.id!==item.id; });
  var upd={}; upd['cells/'+key+'/slots/'+sk]=item; upd.inQ=nq.length?nq:null;
  setSlotLocal(key, sk, item); WH.inQ=nq;
  U.UNDO.push({t:'in', key:key, sk:sk, item:item, label:lc.label+' 적치 · '+item.name});
  saveU();
  db.ref(whPath()).update(upd).catch(fail);
  var left=g.left-1;
  addLog('[적치] '+lc.label+' · '+groupLine(g)+' (남은 '+left+'팔)');
  wizOk(lc.label+' 적치 완료 · '+item.name+' (남은 '+left+'팔)',
        lc.say+' 적치 완료. '+(left>0?left+'파렛트 남았어요':josa(g.product,'이/가')+' 끝났어요'));
}

function actOutNow(){
  var L={col:W.val.unit.v.col, row:W.val.unit.v.row, lvl:W.val.lvl.v};
  var lc=locCheck(L); if(lc.err) return wizNg(lc.err, lc.sayErr);
  var has=lc.lv.slots.filter(function(x){return x.slot;});
  if(!has.length) return wizNg(lc.label+'은 비어 있어요', josa(lc.say,'은/는')+' 비어 있어요');
  var cand=has[0], slot=cand.slot, key=lc.ci.key, sk=cand.sk;
  var g=activeGroup('out');
  if(g && g.product!==slot.name) g=null;   /* 출고대기와 다르면 그 칸 기준으로 처리 */
  var tx={id:uid(), type:'out', date:todayStr(), name:slot.name, exp:String(slot.exp||''), pallets:1, qty:+slot.qty||0};
  var txRef=db.ref('txLogs/'+WHID).push();
  var upd={}; upd['cells/'+key+'/slots/'+sk]=null;
  var po=WH.pendOut, poArr=Array.isArray(po)?po:(po?Object.keys(po).map(function(k){return po[k];}):[]);
  var poN=poArr.filter(function(x){ return x&&!(x.cKey===key&&x.sKey===sk); });
  var poGone=poArr.filter(function(x){ return x&&x.cKey===key&&x.sKey===sk; });
  if(poGone.length){ upd.pendOut=poN.length?poN:null; WH.pendOut=poN; }
  setSlotLocal(key, sk, null);
  if(g&&WH.voiceOut&&WH.voiceOut[g.id]) WH.voiceOut[g.id].left=Math.max(0,(+WH.voiceOut[g.id].left||0)-1);
  U.UNDO.push({t:'out', key:key, sk:sk, item:slot, txKey:txRef.key, voId:g?g.id:null, po:poGone, label:lc.label+' 즉시출고 · '+slot.name});
  saveU();
  var ps=[db.ref(whPath()).update(upd), txRef.set(tx)];
  if(g) ps.push(db.ref(whPath()+'/voiceOut/'+g.id+'/left').transaction(function(x){ return Math.max(0,(+x||0)-1); }));
  Promise.all(ps).catch(fail);
  var qn=+slot.qty||0;
  addLog('[즉시출고] '+lc.label+' · '+slot.name+' · '+V.fmtExp(slot.exp)+' · '+qn+'개');
  wizOk(lc.label+' 즉시출고 완료 · '+slot.name+' · '+V.fmtExp(slot.exp)+' · 1팔 '+qn+'개',
        slot.name+', '+V.sayExp(slot.exp)+', 1파렛트 '+qn+'개를 즉시출고 처리하였습니다');
}

function actCheck(){
  var L={col:W.val.unit.v.col, row:W.val.unit.v.row, lvl:W.val.lvl.v};
  var lc=locCheck(L); if(lc.err) return wizNg(lc.err, lc.sayErr);
  var got=lc.lv.slots.filter(function(x){return x.slot;});
  if(!got.length) return wizOk(lc.label+' — 비어 있어요', josa(lc.say,'은/는')+' 비어 있어요');
  wizOk(lc.label+' — '+got.map(function(x){ return x.slot.name+' · '+V.fmtExp(x.slot.exp)+' · '+(+x.slot.qty||0)+'개'; }).join(' / '),
        lc.say+', '+got.map(function(x){ return x.slot.name+', '+V.sayExp(x.slot.exp)+', '+(+x.slot.qty||0)+'개'; }).join(', ')+'입니다');
}

/* ── 되돌리기 ── */
function doUndo(){
  var u=U.UNDO[U.UNDO.length-1];
  if(!u){ setStatus('되돌릴 내역이 없어요','ng'); speak('되돌릴 내역이 없어요'); return; }
  var ok=true, msg='';
  if(u.t==='in'){
    var cur=((WH.cells[u.key]||{}).slots||{})[u.sk];
    if(!cur||cur.id!==u.item.id){ ok=false; msg='그 칸이 이미 바뀌어서 되돌릴 수 없어요'; }
    else { var nq=inQArr().concat([u.item]); var upd={}; upd['cells/'+u.key+'/slots/'+u.sk]=null; upd.inQ=nq;
      setSlotLocal(u.key,u.sk,null); WH.inQ=nq; db.ref(whPath()).update(upd).catch(fail); }
  } else if(u.t==='out'){
    var cur2=((WH.cells[u.key]||{}).slots||{})[u.sk];
    if(cur2){ ok=false; msg='그 칸에 이미 다른 물건이 있어서 되돌릴 수 없어요'; }
    else { var up2={}; up2['cells/'+u.key+'/slots/'+u.sk]=u.item; setSlotLocal(u.key,u.sk,u.item);
      if(u.po&&u.po.length){ var pc=WH.pendOut, pa=(Array.isArray(pc)?pc:(pc?Object.keys(pc).map(function(k){return pc[k];}):[])).filter(Boolean).concat(u.po); up2.pendOut=pa; WH.pendOut=pa; }
      var ps=[db.ref(whPath()).update(up2)]; if(u.txKey) ps.push(db.ref('txLogs/'+WHID+'/'+u.txKey).remove());
      if(u.voId){ ps.push(db.ref(whPath()+'/voiceOut/'+u.voId).transaction(function(o){ if(!o) return o; o.left=Math.min(+o.total||0,(+o.left||0)+1); return o; }));
        if(WH.voiceOut&&WH.voiceOut[u.voId]) WH.voiceOut[u.voId].left=Math.min(+WH.voiceOut[u.voId].total||0,(+WH.voiceOut[u.voId].left||0)+1); }
      Promise.all(ps).catch(fail); }
  } else if(u.t==='reg'){
    var ids={}; u.ids.forEach(function(i){ ids[i]=1; });
    var before=inQArr(), nq2=before.filter(function(x){ return !ids[x.id]; }), removed=before.length-nq2.length;
    if(!removed){ ok=false; msg='이미 모두 적치돼서 되돌릴 수 없어요'; }
    else { WH.inQ=nq2; var ps2=[db.ref(whPath()+'/inQ').set(nq2.length?nq2:null)];
      if(removed===u.ids.length&&u.txKey) ps2.push(db.ref('txLogs/'+WHID+'/'+u.txKey).remove());
      else msg='적치된 '+(u.ids.length-removed)+'팔은 그대로 두고 남은 '+removed+'팔만 지웠어요';
      Promise.all(ps2).catch(fail); }
  } else if(u.t==='oreg'){
    db.ref(whPath()+'/voiceOut/'+u.voId).remove().catch(fail); if(WH.voiceOut) delete WH.voiceOut[u.voId];
  } else if(u.t==='plan'){
    /* 예정 등록 되돌리기 — 아직 적치·출고되지 않은 것만 거둬들이고 예정 건을 미등록으로 되돌린다 */
    if(u.type==='in'){
      var kill={}; (u.ids||[]).forEach(function(i){ kill[i]=1; });
      var was=inQArr(), rest=was.filter(function(x){ return !kill[x.id]; }), gone=was.length-rest.length;
      if(!gone){ ok=false; msg='이미 모두 적치돼서 되돌릴 수 없어요'; }
      else {
        if(gone<(u.ids||[]).length) msg='적치된 '+((u.ids||[]).length-gone)+'팔은 그대로 두고 남은 '+gone+'팔만 거뒀어요';
        WH.inQ=rest;
        var pl=[db.ref(whPath()+'/inQ').set(rest.length?rest:null)];
        if(!msg) (u.txKeys||[]).forEach(function(k){ pl.push(db.ref('txLogs/'+WHID+'/'+k).remove()); });
        Promise.all(pl).catch(fail);
      }
    } else {
      (u.voIds||[]).forEach(function(v){ db.ref(whPath()+'/voiceOut/'+v).remove().catch(fail); if(WH.voiceOut) delete WH.voiceOut[v]; });
    }
    if(ok){
      var pp=plansObj()[u.pid];
      if(pp){ pp.registered=false;
        rowIds(pp).forEach(function(rid){ delete pp.rows[rid].ids; delete pp.rows[rid].voId;
          db.ref(plansPath()+'/'+u.pid+'/rows/'+rid+'/ids').remove().catch(function(){});
          db.ref(plansPath()+'/'+u.pid+'/rows/'+rid+'/voId').remove().catch(function(){}); });
        db.ref(plansPath()+'/'+u.pid+'/registered').set(false).catch(function(){});
      }
      PLANSIG='';
    }
  }
  if(!ok){ setStatus(msg,'ng'); speak(msg); return; }
  U.UNDO.pop(); addLog('[되돌림] '+u.label+(msg?' ('+msg+')':''));
  saveU(); render(); setStatus('되돌렸어요: '+u.label+(msg?' — '+msg:''),'ok'); speak('되돌렸어요');
}
window.doUndo=doUndo;



/* ── 예정작업 ───────────────────────────────────────────────
   당일 들어오고 나갈 차를 미리 적어 두는 곳. 여기만 말이 아니라 타이핑이다.
   건(차량) 하나에 상품 줄이 여러 개 붙는다.
   [등록] 하면 입고 건은 입고대기(inQ), 출고 건은 출고대기(voiceOut)로 들어가고,
   적치·출고로 다 빠지면 이 목록에서 저절로 사라진다.
   또 여기 적힌 상품·유통기한·수량은 음성 인식의 우선 어휘로 쓰인다. ── */
function plansPath(){ return whPath()+'/plans'; }
function plansObj(){ return (WH&&WH.plans)||{}; }
function planIds(){
  var o=plansObj();
  return Object.keys(o).filter(function(k){ return o[k]; })
    .sort(function(a,b){ return (o[a].createdAt||0)-(o[b].createdAt||0); });
}
function rowIds(p){
  var r=p.rows||{};
  return Object.keys(r).filter(function(k){ return r[k]; })
    .sort(function(a,b){ return (r[a].seq||0)-(r[b].seq||0); });
}
/* 등록된 줄이 얼마나 남았는지 — 0 이면 그 줄은 끝난 것 */
function rowLeft(p, r){
  if(!p.registered) return null;
  if(p.type==='in'){
    var have={}; inQArr().forEach(function(x){ have[x.id]=1; });
    return (r.ids||[]).filter(function(id){ return have[id]; }).length;
  }
  var vo=(WH&&WH.voiceOut)||{};
  return r.voId&&vo[r.voId] ? Math.max(0,+vo[r.voId].left||0) : 0;
}
function planDone(p){
  if(!p.registered) return false;
  var rs=rowIds(p); if(!rs.length) return true;
  return rs.every(function(rid){ return rowLeft(p, p.rows[rid])===0; });
}
/* 다 끝난 건은 목록에서 지운다 */
function planCleanup(){
  if(!WH||!WH.plans) return;
  planIds().forEach(function(pid){
    if(planDone(plansObj()[pid])){
      delete WH.plans[pid];
      db.ref(plansPath()+'/'+pid).remove().catch(function(){});
    }
  });
}

/* 음성 인식 우선 어휘 — 오늘 들어올/나갈 것부터 알아듣게 */
function planVocab(){
  var prods=[], exps=[], nums=[];
  planIds().forEach(function(pid){
    var p=plansObj()[pid];
    rowIds(p).forEach(function(rid){
      var r=p.rows[rid];
      if(r.product && prods.indexOf(r.product)<0) prods.push(r.product);
      if(r.exp && exps.indexOf(r.exp)<0) exps.push(r.exp);
      [r.qty, r.pallets].forEach(function(n){ if(n>0 && nums.indexOf(+n)<0) nums.push(+n); });
    });
  });
  return {products:prods, exps:exps, nums:nums};
}

/* ── 편집 ── */
function planAdd(type){
  var pid=db.ref(plansPath()).push().key;
  var rid=uid();
  var p={type:type||'in', vehicle:'', createdAt:Date.now(), by:(USER&&USER.email)||'', registered:false,
         rows:{}};
  p.rows[rid]={product:'', exp:'', pallets:'', qty:'', seq:Date.now()};
  if(!WH.plans) WH.plans={};
  WH.plans[pid]=p;
  db.ref(plansPath()+'/'+pid).set(p).catch(fail);
  PLANSIG=''; render();
}
window.planAdd=planAdd;
function planRowAdd(pid){
  var p=plansObj()[pid]; if(!p||p.registered) return;
  var rid=uid();
  if(!p.rows) p.rows={};
  p.rows[rid]={product:'', exp:'', pallets:'', qty:'', seq:Date.now()};
  db.ref(plansPath()+'/'+pid+'/rows/'+rid).set(p.rows[rid]).catch(fail);
  PLANSIG=''; render();
}
window.planRowAdd=planRowAdd;
function planDel(pid){
  var p=plansObj()[pid]; if(!p) return;
  if(p.registered && !confirm('이미 등록된 건이에요. 예정 목록에서만 지울까요? (입고대기·출고대기는 그대로 남습니다)')) return;
  delete WH.plans[pid];
  db.ref(plansPath()+'/'+pid).remove().catch(fail);
  PLANSIG=''; render();
}
window.planDel=planDel;
function planRowDel(pid, rid){
  var p=plansObj()[pid]; if(!p||p.registered) return;
  if(rowIds(p).length<=1){ planDel(pid); return; }
  delete p.rows[rid];
  db.ref(plansPath()+'/'+pid+'/rows/'+rid).remove().catch(fail);
  PLANSIG=''; render();
}
window.planRowDel=planRowDel;
/* 입력칸에서 빠져나올 때 저장 — 타이핑 중에는 화면을 다시 그리지 않는다 */
function planSet(pid, rid, field, el){
  var p=plansObj()[pid]; if(!p||p.registered) return;
  var v=el.value;
  if(field==='pallets'||field==='qty') v=v.replace(/[^\d]/g,'');
  if(field==='exp') v=v.replace(/[^\d]/g,'').slice(0,6);
  el.value=v;
  if(rid){ if(!p.rows[rid]) return; p.rows[rid][field]=v; db.ref(plansPath()+'/'+pid+'/rows/'+rid+'/'+field).set(v).catch(fail); }
  else { p[field]=v; db.ref(plansPath()+'/'+pid+'/'+field).set(v).catch(fail); }
}
window.planSet=planSet;

/* ── 등록 → 입고대기 / 출고대기 ── */
function planRegister(pid){
  var p=plansObj()[pid]; if(!p||p.registered) return;
  var rs=rowIds(p), bad=[];
  rs.forEach(function(rid,i){
    var r=p.rows[rid];
    if(!r.product) bad.push((i+1)+'번째 줄 상품명');
    if(!(+r.pallets>0)) bad.push((i+1)+'번째 줄 파렛트 수');
    if(p.type==='in'){
      if(!(+r.qty>0)) bad.push((i+1)+'번째 줄 파렛트당 수량');
      if(r.exp && !V.validYMD(r.exp)) bad.push((i+1)+'번째 줄 유통기한');
    }
  });
  if(bad.length){ setStatus('빠지거나 잘못된 값: '+bad.join(', '),'ng'); return; }

  var upd={}, done=[];
  if(p.type==='in'){
    var nq=inQArr();
    rs.forEach(function(rid){
      var r=p.rows[rid], items=[];
      for(var i=0;i<+r.pallets;i++) items.push({id:uid(), name:r.product, qty:+r.qty, exp:String(r.exp||'')});
      nq=nq.concat(items);
      if(safeKey(r.product)&&!(WH.pColors&&WH.pColors[r.product])) upd['pColors/'+r.product]=pickClr(r.product);
      var txRef=db.ref('txLogs/'+WHID).push();
      txRef.set({id:uid(), type:'in', date:todayStr(), name:r.product, exp:String(r.exp||''),
                 pallets:+r.pallets, qty:(+r.qty)*(+r.pallets)}).catch(fail);
      p.rows[rid].ids=items.map(function(x){return x.id;});
      done.push({rid:rid, ids:p.rows[rid].ids, txKey:txRef.key});
    });
    upd.inQ=nq.length?nq:null;
    WH.inQ=nq;
    db.ref(whPath()).update(upd).catch(fail);
  } else {
    rs.forEach(function(rid){
      var r=p.rows[rid];
      var vref=db.ref(whPath()+'/voiceOut').push();
      var o={product:r.product, exp:String(r.exp||''), qty:+r.qty||0, total:+r.pallets, left:+r.pallets,
             createdAt:Date.now(), by:(USER&&USER.email)||''};
      if(!WH.voiceOut) WH.voiceOut={}; WH.voiceOut[vref.key]=o;
      vref.set(o).catch(fail);
      p.rows[rid].voId=vref.key;
      done.push({rid:rid, voId:vref.key});
    });
  }
  p.registered=true;
  var save={registered:true};
  done.forEach(function(d){
    if(d.ids) save['rows/'+d.rid+'/ids']=d.ids;
    if(d.voId) save['rows/'+d.rid+'/voId']=d.voId;
  });
  db.ref(plansPath()+'/'+pid).update(save).catch(fail);
  U.UNDO.push({t:'plan', pid:pid, type:p.type,
    ids:done.reduce(function(a,d){ return a.concat(d.ids||[]); },[]),
    txKeys:done.map(function(d){return d.txKey;}).filter(Boolean),
    voIds:done.map(function(d){return d.voId;}).filter(Boolean),
    label:'예정 등록 · '+(p.vehicle||(p.type==='in'?'입고':'출고'))+' '+rs.length+'품목'});
  saveU();
  var tot=rs.reduce(function(a,rid){ return a+(+p.rows[rid].pallets||0); },0);
  addLog('[예정등록] '+(p.type==='in'?'입고대기':'출고대기')+' · '+(p.vehicle||'차량미기입')+' · '+rs.length+'품목 '+tot+'팔');
  PLANSIG=''; render();
  setStatus((p.type==='in'?'입고대기':'출고대기')+'에 '+rs.length+'품목 '+tot+'팔 등록했어요','ok');
}
window.planRegister=planRegister;

}

        +'<input class="pi pveh" value="'+esc(p.vehicle||'')+'" placeholder="차량"'+(reg?' disabled':'')
          +' onchange="planSet(\''+pid+'\',null,\'vehicle\',this)">'

      +'</div>';
    rs.forEach(function(rid){

      }
      h+='<div class="pr">'
        +'<input class="pi pnm" list="prodList" value="'+esc(r.product||'')+'" placeholder="상품명"'+(reg?' disabled':'')

        +'<input class="pi pex" inputmode="numeric" value="'+esc(r.exp||'')+'" placeholder="유통기한"'+(reg?' disabled':'')
          +' onchange="planSet(\''+pid+'\',\''+rid+'\',\'exp\',this)">'
        +'<input class="pi pqn" inputmode="numeric" value="'+esc(r.pallets||'')+'" placeholder="팔수"'+(reg?' disabled':'')
          +' onchange="planSet(\''+pid+'\',\''+rid+'\',\'pallets\',this)">'
        +'<input class="pi pqn" inputmode="numeric" value="'+esc(r.qty||'')+'" placeholder="개/팔"'+(reg?' disabled':'')
          +' onchange="planSet(\''+pid+'\',\''+rid+'\',\'qty\',this)">'
        +(reg?'<span class="pleft">남은 '+left+'팔</span>'
             :'<button class="pbtn del" onclick="planRowDel(\''+pid+'\',\''+rid+'\')" title="이 줄 삭제">✕</button>')
      +'</div>';
    });
    /* ＋품목은 줄마다 두면 폰에서 입력칸이 좁아진다 — 블록 아래에 하나만 */
    if(!reg) h+='<div class="pfoot">'
      +'<button class="pbtn add" onclick="planRowAdd(\''+pid+'\')">＋ 품목</button>'
      +'<button class="preg" onclick="planRegister(\''+pid+'\')">'+(p.type==='in'?'입고대기':'출고대기')+'에 등록</button>'
      +'</div>';
    h+='</div>';
  });
  h+='<div class="padd"><button class="pbtn add big" onclick="planAdd(\'in\')">＋ 입고 건 추가</button>'
    +'<button class="pbtn add big" onclick="planAdd(\'out\')">＋ 출고 건 추가</button></div>';
  h+='<datalist id="prodList">'+PRODUCTS.slice().sort().map(function(x){ return '<option value="'+esc(x)+'">'; }).join('')+'</datalist>';
  h+='<div class="st" id="st">여기 적어 두면 음성 인식이 이 상품·유통기한·수량을 먼저 알아들어요</div>';
  c.innerHTML=h;
}

function renderCard(){
  var c=document.getElementById('card'); if(!c) return;

  /* 입력 중이던 값·커서는 살려둔다 (다른 사람의 창고 변경으로 다시 그려질 수 있음) */
  var old=document.getElementById('edIn'), keep=old?old.value:'', focused=old&&document.activeElement===old;
  var st=document.getElementById('st'), stHTML=st?st.outerHTML:'';

    c.innerHTML='<div class="q small">위에서 작업을 고르세요</div>'+ctxLine();

  }

        +'<div class="k">'+SLOTS[k].k+'</div>'
        +'<div class="v'+(g?(g.fuzzy?' fz':''):' none')+'">'+(g?esc(slotText(k,g.v)):'—')+'</div>'
        +'<div class="e">'+(g?'✎':'')+'</div></div>';
    }).join('')+'</div>';
  if(!W.done&&s) h+='<div class="ed"><input id="edIn" placeholder="'+esc(SLOTS[s].k)+' 직접 입력" autocomplete="off" inputmode="'+(s==='product'?'text':'numeric')+'"><button onclick="submitTyped()">✓</button></div>';

  var b=document.getElementById('micBtn'); if(!b) return;
  if(state==='on'){ b.className='mic on'; b.textContent='● 듣는 중 — 탭하면 중지'; b.disabled=false; return; }
  if(state==='think'){ b.className='mic think'; b.textContent='인식 중…'; b.disabled=true; return; }
  b.className='mic'; b.disabled=!W||W.mode==='plan';
  if(!W){ b.textContent='작업을 고르세요'; return; }
  if(W.mode==='plan'){ b.textContent='예정작업은 직접 입력해요'; return; }
  if(W.done){ b.textContent='🎙 '+MODES[W.mode].label+' 다시 시작'; return; }
  var filled=steps().filter(function(k){ return W.val[k]; }).length;
  b.textContent=filled?'🎙 이어서 말하기':'🎙 시작';
}
function renderLog(){
  var b=document.getElementById('logBox'); if(!b) return;
  b.innerHTML=U.LOG.length?U.LOG.map(function(x){ return '<div class="log"><span class="t">'+esc(x.t)+'</span><span>'+esc(x.s)+'</span></div>'; }).join('')
    :'<div class="sub">아직 없어요</div>';
}

/* ── 데이터 ── */
function collectProducts(list){
  var s={};
  list.forEach(function(w){
    if(!w) return;
    Object.keys(w.pColors||{}).forEach(function(n){ s[n]=1; });
    var q=w.inQ; (Array.isArray(q)?q:(q?Object.keys(q).map(function(k){return q[k];}):[])).forEach(function(it){ if(it&&it.name) s[it.name]=1; });
    Object.keys(w.cells||{}).forEach(function(k){ var c=w.cells[k]; if(!c||!c.slots) return; Object.keys(c.slots).forEach(function(sk){ var x=c.slots[sk]; if(x&&x.name) s[x.name]=1; }); });
  });
  return Object.keys(s);
}
function selectWh(id){
  if(whRef) whRef.off();
  WHID=id; lsSet('wms_voice_wh:'+GID, id); loadU(); W=null; stopListen();
  whRef=db.ref('warehouses/'+id);
  whRef.on('value',function(s){
    WH=s.val(); if(WH){ WH.rows=+WH.rows||0; WH.cols=+WH.cols||0; if(!WH.cells) WH.cells={}; }
    PRODUCTS=collectProducts(WHS.map(function(w){ return w.id===id?WH:w.raw; }));
    planCleanup();
    render();
  });
}
window.selectWh=selectWh;
function start(){
  db.ref('groups/'+GID).get().then(function(g){
    var wids=g.exists()?Object.keys(g.val()).filter(function(k){return k!=='_init';}):[];
    if(!wids.length){ app.innerHTML='<div class="center">이 그룹에 창고가 없어요.</div>'; return; }
    return Promise.all(wids.map(function(w){ return db.ref('warehouses/'+w).get().then(function(s){ return {id:w, raw:s.val()}; }).catch(function(){ return null; }); }))
    .then(function(list){
      WHS=list.filter(function(x){return x&&x.raw;}).map(function(x){ return {id:x.id, name:x.raw.name||x.id, raw:x.raw}; });
      if(!WHS.length){ app.innerHTML='<div class="center">창고를 불러오지 못했어요.</div>'; return; }
      var saved=WANT_WID||lsGet('wms_voice_wh:'+GID); WHID=WHS.some(function(w){return w.id===saved;})?saved:WHS[0].id;
      PRODUCTS=collectProducts(WHS.map(function(w){return w.raw;}));
      loadU(); renderShell(); selectWh(WHID);
    });
  }).catch(function(e){ app.innerHTML='<div class="center" style="color:#F87171">불러오기 실패: '+esc(e.message)+'</div>'; });
}
auth.onAuthStateChanged(function(user){
  if(!user){ location.replace('/wms_login.html?return='+encodeURIComponent('/wms_voice.html'+location.search)); return; }
  USER=user;
  db.ref('superadmins/'+user.uid).get().then(function(a){
    if(a.exists()){ if(!GID){ app.innerHTML='<div class="center">그룹이 지정되지 않았어요. 창고관리에서 들어와 주세요.</div>'; return; } start(); return; }
    db.ref('userGroup/'+user.uid).get().then(function(g){
      if(!g.exists()){ app.innerHTML='<div class="center">작업 그룹에 등록되어 있지 않아요.</div>'; return; }
      if(!GID) GID=g.val();
      if(g.val()!==GID){ app.innerHTML='<div class="center">이 그룹에 대한 권한이 없어요.</div>'; return; }
      start();
    });
  }).catch(function(e){ app.innerHTML='<div class="center" style="color:#F87171">권한 확인 실패: '+esc(e.message)+'</div>'; });
});

</script>
