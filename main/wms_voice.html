<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>음성 입출고 (시험) — 메이크창고</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0B1220;--card:#141E33;--bd:#26344F;--tx:#E8EEF7;--sub:#8597B0;--accent:#3B82F6;--green:#34D399;--red:#F87171;--amber:#FBBF24;}
body{background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--tx);min-height:100vh;padding-bottom:210px;}
.wrap{max-width:560px;margin:0 auto;padding:14px 12px;}
.center{text-align:center;padding:70px 20px;color:var(--sub);font-size:14px;}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.back{background:rgba(255,255,255,.06);color:var(--sub);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap;}
.ttl{font-size:17px;font-weight:800;flex:1;min-width:0;}
.testb{font-size:11px;font-weight:800;color:#FCD34D;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);border-radius:6px;padding:2px 7px;white-space:nowrap;}
select,.fin{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 10px;font-size:14px;font-family:inherit;}
select{margin-bottom:10px;}
.notice{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:10px;padding:9px 11px;font-size:12px;color:#FDE68A;line-height:1.6;margin-bottom:12px;}
.sec{font-size:12.5px;color:var(--sub);font-weight:800;margin:4px 2px 7px;letter-spacing:.02em;}
.tabs{display:flex;gap:6px;margin-bottom:8px;}
.tab{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--sub);font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;}
.tab.on.in{background:rgba(52,211,153,.14);color:#6EE7B7;border-color:rgba(52,211,153,.55);}
.tab.on.out{background:rgba(248,113,113,.14);color:#FCA5A5;border-color:rgba(248,113,113,.55);}
.grp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer;}
.grp.act{border-color:#60A5FA;box-shadow:0 0 0 2px rgba(96,165,250,.35);}
.grp.done{opacity:.45;}
.g1{display:flex;align-items:center;gap:8px;}
.gname{font-size:15px;font-weight:800;flex:1;min-width:0;}
.gsrc{font-size:10.5px;color:var(--sub);border:1px solid var(--bd);border-radius:5px;padding:1px 5px;white-space:nowrap;}
.gact{font-size:11px;font-weight:800;color:#93C5FD;white-space:nowrap;}
.g2{font-size:12.5px;color:var(--sub);margin-top:3px;}
.gclr{background:rgba(239,68,68,.12);color:#FCA5A5;border:1px solid rgba(239,68,68,.4);border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;}
.gbar{height:6px;background:rgba(255,255,255,.07);border-radius:4px;margin-top:7px;overflow:hidden;}
.gbar i{display:block;height:100%;background:var(--green);}
.empty{font-size:12.5px;color:var(--sub);padding:12px 4px;line-height:1.6;}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin-bottom:10px;}
.lb{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;}
.heard{font-size:17px;font-weight:700;line-height:1.45;min-height:26px;word-break:keep-all;}
.heard.interim{color:var(--sub);}
.draft{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.45);border-radius:12px;padding:11px 12px;margin-bottom:10px;}
.draft .dt{font-size:13px;font-weight:800;color:#93C5FD;margin-bottom:6px;display:flex;justify-content:space-between;}
.grid{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px;}
.grid .k{color:var(--sub);}
.grid .v{font-weight:700;}
.grid .v.none{color:#475569;font-weight:600;}
.grid .v.need{color:#FCD34D;}
.chk{font-size:13px;line-height:1.5;margin-top:4px;display:flex;gap:6px;}
.chk.ok{color:#6EE7B7;} .chk.ng{color:#FCA5A5;} .chk.wn{color:#FCD34D;}
.say{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.4);border-radius:12px;padding:11px 12px;margin-bottom:10px;font-size:15px;color:#BFDBFE;line-height:1.55;}
.say.done{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.45);color:#A7F3D0;}
.say.bad{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.45);color:#FECACA;}
.yn{display:flex;gap:8px;margin-top:9px;}
.yn button{flex:1;border:none;border-radius:10px;padding:11px 0;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;}
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(11,18,32,1) 72%,rgba(11,18,32,0));padding:12px 12px calc(14px + env(safe-area-inset-bottom));}
.dock-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:7px;}
.cur{font-size:12.5px;font-weight:800;color:#93C5FD;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mic{width:100%;height:80px;border-radius:18px;border:none;background:#2563EB;color:#fff;font-size:19px;font-weight:800;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(37,99,235,.35);}
.mic.on{background:#DC2626;animation:pulse 1.1s infinite;}
.mic.ask{background:#059669;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.55);}70%{box-shadow:0 0 0 14px rgba(220,38,38,0);}100%{box-shadow:0 0 0 0 rgba(220,38,38,0);}}
.hint{font-size:11.5px;color:var(--sub);text-align:center;}
.typ{display:flex;gap:6px;margin-bottom:10px;}
.typ input{flex:1;min-width:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 10px;font-size:14px;font-family:inherit;}
.btn2{background:rgba(255,255,255,.07);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
details{margin-bottom:10px;}
summary{font-size:12.5px;color:var(--sub);font-weight:700;cursor:pointer;padding:6px 2px;}
.form{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px;}
.form .full{grid-column:1/-1;}
.ex{display:block;width:100%;text-align:left;background:rgba(255,255,255,.04);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:6px;cursor:pointer;font-family:inherit;}
.log{font-size:13px;border-bottom:1px dashed rgba(255,255,255,.08);padding:6px 2px;display:flex;gap:8px;}
.log .t{color:var(--sub);font-size:11px;white-space:nowrap;padding-top:2px;}
.logbar{display:flex;gap:6px;margin-top:8px;}
</style>
</head>
<body>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAM2t9dvtStrXNam-YAiq19yD8FHwKpPmI",
  authDomain:"makewon.com",
  databaseURL:"https://makechango-wms-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"makechango-wms",
  storageBucket:"makechango-wms.firebasestorage.app",
  messagingSenderId:"333385336098",
  appId:"1:333385336098:web:94f07492421965ab32917b"
});
var auth=firebase.auth(), db=firebase.database(), V=window.WMSVoice;
var app=document.getElementById('app');
var GID=(new URLSearchParams(location.search).get('gid'))||localStorage.getItem('wms_adminGroupId')||'';
var WHS=[], WH=null, WHID=null, whRef=null, PRODUCTS=[];
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null, listening=false, pending=null;

/* ── 시험 상태 (이 폰에만 저장, 창고 원본은 안 바꿈) ──
   GROUPS: 음성·직접입력으로 만든 대기 목록 {id,type:'in'|'out',product,exp,qty,total,left}
   REALUSED: 창고 실제 입고대기 묶음에서 시험으로 쓴 파렛트 수 {묶음키:수}
   SIM: 칸 시험 변경 {'r-c|슬롯': 상품 또는 null(비움)}  UNDO: 되돌리기 스택  LOG: 처리 내역 */
var S={GROUPS:[], REALUSED:{}, SIM:{}, UNDO:[], LOG:[], ACTIVE:{in:null,out:null}, MODE:'in'};
var DRAFT=null;   /* 대기 등록 중인 초안 {type,product,exp,qty,pallets,awaiting} */

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function stKey(){ return 'wms_voice_sim:'+GID+':'+WHID; }
function save(){ lsSet(stKey(), JSON.stringify(S)); }
function load(){ try{ var o=JSON.parse(lsGet(stKey())||'null'); if(o&&o.GROUPS) S=Object.assign({GROUPS:[],REALUSED:{},SIM:{},UNDO:[],LOG:[],ACTIVE:{in:null,out:null},MODE:'in'},o); else resetState(true); }catch(e){ resetState(true); } }
function resetState(silent){ S={GROUPS:[], REALUSED:{}, SIM:{}, UNDO:[], LOG:[], ACTIVE:{in:null,out:null}, MODE:'in'}; DRAFT=null; if(!silent){ save(); renderAll(); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function josa(w, pair){
  var a=pair.split('/'), s=String(w).trim(), ch=s.slice(-1), code=ch.charCodeAt(0), has=false, rieul=false;
  if(code>=0xAC00&&code<=0xD7A3){ var jong=(code-0xAC00)%28; has=jong>0; rieul=jong===8; }
  else if(/\d/.test(ch)){ has='0136780'.indexOf(ch)>=0; rieul='178'.indexOf(ch)>=0; }
  if(pair==='으로/로') return s+(has&&!rieul?a[0]:a[1]);
  return s+(has?a[0]:a[1]);
}
function nowHM(){ var d=new Date(), p=function(x){return (x<10?'0':'')+x;}; return p(d.getHours())+':'+p(d.getMinutes()); }

/* ── 대기 목록 (창고 실제 입고대기 + 시험 등록분) ── */
function realInGroups(){
  var m={}, order=[];
  (WH&&WH.inQ||[]).forEach(function(it){ if(!it||!it.name) return; var k=it.name+'|'+(it.exp||'')+'|'+(+it.qty||0);
    if(!m[k]){ m[k]={id:'r:'+k, key:k, src:'real', type:'in', product:it.name, exp:String(it.exp||''), qty:+it.qty||0, total:0}; order.push(k); } m[k].total++; });
  return order.map(function(k){ var g=m[k]; g.left=Math.max(0,g.total-(S.REALUSED[k]||0)); return g; });
}
function groupsOf(type){ return (type==='in'?realInGroups():[]).concat(S.GROUPS.filter(function(g){return g.type===type;})); }
function findGroup(id){ var all=groupsOf('in').concat(groupsOf('out')); for(var i=0;i<all.length;i++) if(all[i].id===id) return all[i]; return null; }
function activeGroup(type){
  var g=S.ACTIVE[type]&&findGroup(S.ACTIVE[type]);
  if(g&&g.left>0) return g;
  var nx=groupsOf(type).filter(function(x){return x.left>0;})[0]||null;
  S.ACTIVE[type]=nx?nx.id:null; return nx;
}
function useGroup(g, d){   /* 파렛트 1개 사용(d=+1) / 되돌림(d=-1) */
  if(g.src==='real') S.REALUSED[g.key]=Math.max(0,(S.REALUSED[g.key]||0)+d);
  else { var own=S.GROUPS.filter(function(x){return x.id===g.id;})[0]; if(own) own.left=Math.max(0,Math.min(own.total,own.left-d)); }
}
function groupLine(g){ return g.product+' · '+(g.exp?V.fmtExp(g.exp):'유통기한 무관')+(g.qty?' · '+g.qty+'개':''); }

/* ── 화면 ── */
function renderShell(){
  app.innerHTML=
    '<div class="top"><a class="back" href="/wms.html">‹ 창고관리</a><div class="ttl">🎙 음성 입출고</div><span class="testb">시험 모드</span></div>'
    +'<select id="whSel" onchange="selectWh(this.value)">'+WHS.map(function(w){return '<option value="'+esc(w.id)+'"'+(w.id===WHID?' selected':'')+'>'+esc(w.name)+'</option>';}).join('')+'</select>'
    +'<div class="notice">🧪 <b>시험 모드</b> — 입고·출고는 <b>이 폰 화면에서만 흉내</b>내고 창고 기록은 바꾸지 않습니다. 창고의 실제 입고대기·재고를 읽어 대조합니다.'
    +(SR?'':'<br>⚠ 이 브라우저는 음성 인식을 지원하지 않아요(안드로이드 크롬 권장). 아래 입력칸으로 문장 시험은 가능합니다.')+'</div>'
    +'<div class="sec">① 대기 목록 — 먼저 상품을 등록하고, 진행할 목록을 고르세요</div>'
    +'<div class="tabs"><button class="tab in" id="tabIn" onclick="setMode(\'in\')"></button><button class="tab out" id="tabOut" onclick="setMode(\'out\')"></button></div>'
    +'<div id="lists"></div>'
    +'<details><summary>＋ 대기 목록 직접 입력</summary><div class="form">'
      +'<select class="fin full" id="fType"><option value="in">입고대기</option><option value="out">출고대기</option></select>'
      +'<input class="fin full" id="fName" list="prodList" placeholder="상품명 (등록된 상품)">'
      +'<input class="fin" id="fExp" inputmode="numeric" placeholder="유통기한 YYMMDD">'
      +'<input class="fin" id="fQty" inputmode="numeric" placeholder="파렛트당 수량">'
      +'<input class="fin" id="fPal" inputmode="numeric" placeholder="파렛트 수">'
      +'<button class="btn2" onclick="manualAdd()">목록에 추가</button>'
      +'<datalist id="prodList"></datalist></div></details>'
    +'<div id="draftBox"></div>'
    +'<div class="sec">② 위치 말하기 — "에이 원 3층 입고" · "에이 원 3층 출고" · "에이 원 3층 뭐야"</div>'
    +'<div class="box"><div class="lb"><span>알아들은 말</span><span id="micSt">대기</span></div><div class="heard interim" id="heard">아래 버튼을 누르고 말하세요</div></div>'
    +'<div class="box" id="resBox" style="display:none"><div class="lb"><span>해석 · 대조</span></div><div class="grid" id="resGrid"></div><div id="chks"></div></div>'
    +'<div id="sayBox"></div>'
    +'<div class="typ"><input id="typIn" placeholder="문장 직접 입력해 시험" autocomplete="off"><button class="btn2" onclick="typedTest()">해석</button></div>'
    +'<details open><summary>처리 내역 (시험)</summary><div id="logBox"></div><div class="logbar"><button class="btn2" onclick="doUndo()">↩ 마지막 되돌리기</button><button class="btn2" onclick="if(confirm(\'시험 내역과 시험 등록 목록을 모두 지울까요?\'))resetState()">시험 초기화</button></div></details>'
    +'<details><summary>말하는 예시</summary>'
      +['서리태 십오 이칠공칠공칠 백이십오개 십팔 파렛트 입고대기','에이 원 3층 입고','에이 원 2층 입고','서리태 삼십 오 파렛트 출고대기','에이 십이 4층 출고','에이 십이 4층 뭐야','취소']
        .map(function(t){return '<button class="ex" onclick="exTest(this)">'+esc(t)+'</button>';}).join('')
      +'<div class="hint" style="text-align:left;margin-top:8px;line-height:1.7">· 등록: 상품 · 유통기한 · 파렛트당 수량 · 파렛트 수 + "입고대기"/"출고대기" (말이 끊기면 빠진 것만 다시 물어봐요)<br>· 위치: 알파벳(에이·비 / A) + 번호(일·원·1·십·텐) + 층(1층 = 맨 아래)<br>· "입고/출고"를 빼고 위치만 말하면 위에서 고른 탭(입고/출고)으로 처리</div>'
    +'</details>'
    +'<div class="dock"><div class="dock-in"><div class="cur" id="cur"></div><button class="mic" id="micBtn" onclick="micPress()">🎙 눌러서 말하기</button>'
    +'<div class="hint" id="hint">탭하고 말하면 말이 끝날 때 자동으로 멈춰요 · 블루투스 버튼(Enter·Space·→)도 가능</div></div></div>';
  document.getElementById('typIn').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); typedTest(); } });
  renderAll();
}
function renderAll(){ renderLists(); renderDraft(); renderLog(); renderCur(); renderDatalist(); }
function renderDatalist(){ var d=document.getElementById('prodList'); if(d) d.innerHTML=PRODUCTS.slice().sort().map(function(p){return '<option value="'+esc(p)+'">';}).join(''); }
function renderLists(){
  var box=document.getElementById('lists'); if(!box) return;
  var gi=groupsOf('in'), go=groupsOf('out');
  var li=gi.reduce(function(s,g){return s+g.left;},0), lo=go.reduce(function(s,g){return s+g.left;},0);
  document.getElementById('tabIn').textContent='입고대기 '+li+'팔';
  document.getElementById('tabOut').textContent='출고대기 '+lo+'팔';
  document.getElementById('tabIn').className='tab in'+(S.MODE==='in'?' on':'');
  document.getElementById('tabOut').className='tab out'+(S.MODE==='out'?' on':'');
  var list=S.MODE==='in'?gi:go, act=activeGroup(S.MODE);
  box.innerHTML=list.length?list.map(function(g){
    var pct=g.total?Math.round((g.total-g.left)/g.total*100):0, isAct=act&&act.id===g.id;
    return '<div class="grp'+(isAct?' act':'')+(g.left<=0?' done':'')+'" onclick="pickGroup(\''+esc(g.id).replace(/'/g,"\\'")+'\')">'
      +'<div class="g1"><span class="gname">'+esc(g.product)+'</span>'+(g.src==='real'?'<span class="gsrc">창고 입고대기</span>':'<span class="gsrc">음성·직접 등록</span>')
      +(isAct?'<span class="gact">▶ 진행 중</span>':'')
      +'<button class="gclr" onclick="event.stopPropagation();resetGroup(\''+esc(g.id).replace(/'/g,"\\'")+'\')">초기화</button></div>'
      +'<div class="g2">'+esc(g.exp?V.fmtExp(g.exp):'유통기한 무관')+(g.qty?' · 파렛트당 '+g.qty+'개':'')+' · 남은 <b style="color:var(--tx)">'+g.left+'</b> / '+g.total+'팔</div>'
      +'<div class="gbar"><i style="width:'+pct+'%"></i></div></div>';
  }).join(''):'<div class="empty">'+(S.MODE==='in'?'입고대기 목록이 없어요. 아래 버튼을 누르고 <b>"서리태 십오 이칠공칠공칠 백이십오개 십팔 파렛트 입고대기"</b>처럼 말하거나, 직접 입력하세요.':'출고대기 목록이 없어요. <b>"서리태 삼십 오 파렛트 출고대기"</b>처럼 말하거나 직접 입력하세요. (목록 없이 출고하면 매번 "네"로 확인)')+'</div>';
}
function renderCur(){
  var c=document.getElementById('cur'); if(!c) return;
  if(DRAFT){ c.textContent='📝 '+(DRAFT.type==='in'?'입고대기':'출고대기')+' 등록 중 — 빠진 항목을 말씀하세요'; return; }
  var g=activeGroup(S.MODE);

/* 대기 목록 초기화 — 음성·직접 등록분은 목록에서 지움 / 창고 실제 입고대기는(시험 모드라 지우지 않고) 진행 수만 처음으로.
   이미 시험으로 넣고 뺀 칸은 그대로 두고, 그 내역의 되돌리기 연결만 끊음 */
function resetGroup(id){
  var g=findGroup(id); if(!g) return;
  var used=g.total-g.left;
  var msg=g.src==='real'
    ? '"'+g.product+' '+(g.exp?V.fmtExp(g.exp):'')+'" 창고 입고대기의 진행 수('+used+'팔 사용)를 처음으로 되돌릴까요?\n(시험 모드 — 창고의 실제 입고대기는 그대로)'
    : '"'+g.product+' '+(g.exp?V.fmtExp(g.exp):'')+'" '+(g.type==='in'?'입고대기':'출고대기')+' 목록('+g.left+'/'+g.total+'팔 남음)을 지울까요?';
  if(!confirm(msg)) return;
  if(g.src==='real') delete S.REALUSED[g.key];
  else S.GROUPS=S.GROUPS.filter(function(x){ return x.id!==id; });
  S.UNDO.forEach(function(u){ if(u.gid===id) u.gid=null; });
  if(S.ACTIVE[g.type]===id) S.ACTIVE[g.type]=null;
  S.LOG.unshift({t:nowHM(), s:'🧹 초기화 · '+(g.type==='in'?'입고대기':'출고대기')+' '+groupLine(g)});
  save(); renderAll(); renderSay('🧹 '+g.product+' '+(g.src==='real'?'진행 수를 처음으로 되돌렸어요':'목록을 지웠어요'),'done');

function showHeard(text, interim){ var h=document.getElementById('heard'); if(!h) return; h.textContent=text||''; h.className='heard'+(interim?' interim':''); }

/* ── 음성 출력(TTS) ── */
var koVoice=null;
function pickVoice(){ try{ var vs=speechSynthesis.getVoices()||[]; koVoice=vs.filter(function(v){return /ko/i.test(v.lang);})[0]||null; }catch(e){} }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text, cb){
  var called=false; function done(){ if(called) return; called=true; if(cb) cb(); }
  if(!window.speechSynthesis||!text){ done(); return; }
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=1.08; if(koVoice) u.voice=koVoice;
    u.onend=done; u.onerror=done; speechSynthesis.speak(u);
    setTimeout(done, 1200+text.length*140);
  }catch(e){ done(); }
}

/* ── 음성 인식 ── */
function micPress(){ keepAwake(); if(listening){ stopListen(); return; } listen(pending?'confirm':(DRAFT?'fill':'cmd')); }
window.micPress=micPress;
function idleState(){ return pending?'ask':(DRAFT?'wait':'idle'); }
function stopListen(){ if(rec){ try{ rec.abort(); }catch(e){} } rec=null; listening=false; setMicUI(idleState()); }
function listen(mode){
  if(!SR){ showHeard('이 브라우저는 음성 인식을 지원하지 않아요 (안드로이드 크롬 권장)', true); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  if(rec){ try{ rec.abort(); }catch(e){} }
  var r=new SR(); r.lang='ko-KR'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  var finalAlts=null; rec=r; listening=true; setMicUI(mode);
  if(mode!=='confirm') showHeard('…', true);
  r.onresult=function(ev){
    var txt=''; for(var i=ev.resultIndex;i<ev.results.length;i++) txt+=ev.results[i][0].transcript;
    var last=ev.results[ev.results.length-1];
    if(last.isFinal){ finalAlts=[]; for(var a=0;a<last.length;a++) finalAlts.push(last[a].transcript); }
    if(mode!=='confirm') showHeard(txt, !last.isFinal);
  };
  r.onerror=function(e){
    var m={'no-speech':'말소리가 들리지 않았어요','not-allowed':'마이크 권한이 꺼져 있어요 — 주소창 왼쪽 자물쇠에서 마이크를 허용해 주세요','network':'인터넷 연결이 필요해요','audio-capture':'마이크를 찾을 수 없어요'}[e.error];
    if(m&&mode!=='confirm') showHeard(m, true);
  };
  r.onend=function(){
    if(rec!==r) return;
    rec=null; listening=false;
    if(finalAlts&&finalAlts.length){ if(mode==='confirm') handleConfirm(finalAlts); else handleCommand(finalAlts); }
    else setMicUI(idleState());
  };
  try{ r.start(); }catch(e){ listening=false; setMicUI(idleState()); }
}
document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')) return;
  if([' ','Enter','ArrowRight','ArrowDown','PageDown','MediaPlayPause'].indexOf(e.key)>=0){ e.preventDefault(); micPress(); }
});
var wakeLock=null;
function keepAwake(){ try{ if(navigator.wakeLock&&!wakeLock) navigator.wakeLock.request('screen').then(function(l){ wakeLock=l; l.addEventListener('release',function(){ wakeLock=null; }); }).catch(function(){}); }catch(e){} }

/* ── 명령 처리 ── */
function parseOpts(){ var cols=[]; for(var c=0;c<(WH&&WH.cols||0);c++) cols.push(V.colName(c)); return {products:PRODUCTS, cols:cols, draft:!!DRAFT}; }
function handleCommand(alts){
  var R=V.parseBest(alts, parseOpts());
  showHeard(alts[R.altIndex||0], false);
  var regF=!!(R.product||R.exp||R.qty!=null||R.pallets!=null);
  if(R.action==='inq'||R.action==='outq'){ if(DRAFT) fillDraft(R); else startDraft(R); return; }   /* 등록 중이면 이어 붙이기 */
  if(R.action==='undo'){ if(DRAFT){ cancelDraft(); return; } doUndo(); return; }
  if(DRAFT&&!R.action&&(regF||R.leftovers.length)){ fillDraft(R); return; }
  /* "서리태 십오"처럼 동작 없이 상품 정보만 (말이 끊긴 앞부분) → 등록 시작, 종류는 위 탭 기준 */
  if(!DRAFT&&!R.action&&!R.loc&&regF){ startDraft(R, S.MODE); return; }
  if(!R.action&&R.loc){ R.action=S.MODE; R.warn.push('"입고/출고" 없이 말해 위 탭('+(S.MODE==='in'?'입고':'출고')+')으로 처리했어요'); }
  if(R.action==='in') return doIn(R);
  if(R.action==='out') return doOut(R);
  if(R.action==='what') return doWhat(R);
  if(R.action==='move') return finish(R, {ok:false, lines:[{t:'이동은 이 화면에서 지원하지 않아요','k':'ng'}], say:'이동은 지원하지 않아요. 출고 후 입고로 해 주세요.'});
  finish(R, {ok:false, lines:[{t:'무엇을 할지 못 알아들었어요','k':'ng'}], say:'위치와 함께 입고, 출고, 뭐야 중 하나를 말씀해 주세요'});
}
/* 결과 표시 + 음성 안내 (+ 확인 질문이면 자동으로 네/아니오 듣기) */
function finish(R, ev){
  (R.warn||[]).forEach(function(w){ ev.lines.unshift({t:w,k:'wn'}); });
  renderResult(R, ev);
  if(ev.ask){ pending=ev; renderSay(ev.ask,'ask'); setMicUI('ask'); speak(ev.ask,function(){ if(pending===ev) listen('confirm'); }); }
  else { pending=null; renderSay(ev.say, ev.ok?'done':'bad'); setMicUI(idleState()); speak(ev.say); }
  renderLists(); renderCur();
}

/* ① 대기 목록 등록 — 말이 끊겨도 적어둔 건 두고 빠진 것만 다시 묻기 */
function startDraft(R, typeDefault){
  var t=R.action==='inq'?'in':R.action==='outq'?'out':(typeDefault||'in');
  DRAFT={type:t, product:R.product, exp:R.exp, qty:R.qty, pallets:R.pallets, awaiting:null};
  continueDraft(R);
}
function fillDraft(R){
  if(R.action==='inq') DRAFT.type='in'; else if(R.action==='outq') DRAFT.type='out';
  if(R.product) DRAFT.product=R.product;
  if(R.exp) DRAFT.exp=R.exp;
  if(R.qty!=null) DRAFT.qty=R.qty;
  if(R.pallets!=null) DRAFT.pallets=R.pallets;
  /* 숫자만 말한 경우 → 지금 묻고 있는 항목에 */
  if(R.leftovers.length===1&&/^\d+$/.test(R.leftovers[0])&&(DRAFT.awaiting==='qty'||DRAFT.awaiting==='pallets')&&DRAFT[DRAFT.awaiting]==null) DRAFT[DRAFT.awaiting]=parseInt(R.leftovers[0],10);
  continueDraft(R);
}
function continueDraft(R){
  var need=DRAFT.type==='in'?['product','exp','qty','pallets']:['product','pallets'];
  var bad=null;
  if(DRAFT.exp&&!V.validYMD(DRAFT.exp)){ DRAFT.exp=null; bad='유통기한 날짜가 올바르지 않아요. '; }
  if(DRAFT.qty!=null&&!(DRAFT.qty>0)){ DRAFT.qty=null; }
  if(DRAFT.pallets!=null&&!(DRAFT.pallets>0&&DRAFT.pallets<=500)){ DRAFT.pallets=null; bad=(bad||'')+'파렛트 수가 올바르지 않아요. '; }
  var miss=need.filter(function(f){ return DRAFT[f]==null||DRAFT[f]===''; })[0];
  DRAFT.awaiting=miss||null;
  renderDraft(); renderCur();
  var ev={ok:true, lines:[]};
  if(R&&R.productFuzzy) ev.lines.push({t:'상품명이 정확히 들리지 않아 "'+DRAFT.product+'"(으)로 골랐어요','k':'wn'});
  if(miss){
    var Q={product:'상품명을 말씀해 주세요', exp:'유통기한을 말씀해 주세요', qty:'파렛트당 수량을 말씀해 주세요', pallets:'파렛트 수를 말씀해 주세요'}[miss];
    ev.lines.push({t:Q,k:'wn'});
    renderResultDraft(ev); renderSay((bad||'')+Q,'info'); setMicUI('wait');
    speak((bad||'')+Q, function(){ if(DRAFT&&DRAFT.awaiting===miss&&!listening) listen('fill'); });
    return;
  }
  var d=DRAFT, ask=d.product+(d.exp?', '+V.sayExp(d.exp):'')+(d.qty!=null?', '+d.qty+'개씩':'')+' '+d.pallets+'파렛트. '+(d.type==='in'?'입고대기':'출고대기')+'로 등록할까요?';
  ev.ask=ask; ev.reg=true; renderResultDraft(ev);
  pending=ev; renderSay(ask,'ask'); setMicUI('ask'); speak(ask,function(){ if(pending===ev) listen('confirm'); });
}
function cancelDraft(){ DRAFT=null; pending=null; renderDraft(); renderSay('등록을 취소했어요','info'); setMicUI('idle'); speak('등록을 취소했어요'); }
window.cancelDraft=cancelDraft;
function addGroup(d){
  var g={id:'v:'+uid(), src:'voice', type:d.type, product:d.product, exp:d.exp||'', qty:d.qty!=null?d.qty:0, total:d.pallets, left:d.pallets};
  S.GROUPS.push(g); S.ACTIVE[d.type]=g.id; S.MODE=d.type;
  S.LOG.unshift({t:nowHM(), s:'📝 '+(d.type==='in'?'입고대기':'출고대기')+' 등록 · '+groupLine(g)+' × '+g.total+'팔'});
  save(); return g;
}
function manualAdd(){

  var e=document.getElementById('fExp').value.replace(/\D/g,''), q=parseInt(document.getElementById('fQty').value,10), p=parseInt(document.getElementById('fPal').value,10);

window.manualAdd=manualAdd;

/* ② 위치 → 칸 확인 */
function cellAt(L){
  if(!L||L.row==null) return {err:'위치(알파벳 + 번호)를 알아듣지 못했어요'};
  var nm=L.col+'-'+L.row, sy=V.sayLoc({col:L.col,row:L.row}), c=V.colIndex(L.col), r=L.row-1;
  if(!WH||c<0||c>=WH.cols||r<0||r>=WH.rows) return {err:nm+' 위치는 이 창고 배치도에 없어요', sayErr:sy+' 위치는 이 창고에 없어요'};
  var key=r+'-'+c, cell=(WH.cells||{})[key];
  if(!cell||(cell.type!=='rack'&&cell.type!=='shelf')) return {err:josa(nm,'은/는')+' 랙(보관) 칸이 아니에요', sayErr:josa(sy,'은/는')+' 랙 칸이 아니에요'};
  return {key:key, cell:cell, dR:cell.divR||1, dC:cell.divC||1, name:nm, sy:sy};
}
function simGet(key, sk, real){ var k=key+'|'+sk; return S.SIM.hasOwnProperty(k)?S.SIM[k]:real; }
function levelOf(ci, lvl){
  if(lvl==null) return {err:'몇 층인지 알아듣지 못했어요'};
  if(lvl<1||lvl>ci.dR) return {err:josa(ci.name,'은/는')+' '+ci.dR+'층까지 있어요', sayErr:josa(ci.sy,'은/는')+' '+ci.dR+'층까지 있어요'};
  var sr=ci.dR-lvl, arr=[];   /* 1층 = 맨 아래 줄 */
  for(var sc=0;sc<ci.dC;sc++){ var sk=sr+'-'+sc; arr.push({sk:sk, slot:simGet(ci.key, sk, (ci.cell.slots||{})[sk]||null)}); }
  return {slots:arr};
}
function locCheck(R){
  var ci=cellAt(R.loc); if(ci.err) return {err:ci.err, sayErr:ci.sayErr||ci.err};
  var lv=levelOf(ci,R.loc.lvl); if(lv.err) return {err:lv.err, sayErr:lv.sayErr||lv.err};
  return {ci:ci, lv:lv, say:V.sayLoc(R.loc), label:ci.name+' '+R.loc.lvl+'층'};
}
function doIn(R){
  var lc=locCheck(R); if(lc.err) return finish(R,{ok:false,lines:[{t:lc.err,k:'ng'}],say:lc.sayErr});
  var g=activeGroup('in');
  if(!g) return finish(R,{ok:false,lines:[{t:'입고대기 목록이 없어요 — 먼저 상품을 등록하세요','k':'ng'}],say:'입고대기 목록이 없어요. 먼저 상품, 유통기한, 수량, 파렛트 수를 말하고 입고대기라고 말씀해 주세요.'});
  var empty=lc.lv.slots.filter(function(x){return !x.slot;})[0];
  if(!empty){ var o=lc.lv.slots[0].slot; return finish(R,{ok:false,lines:[{t:lc.label+'에 이미 '+o.name+' ('+V.fmtExp(o.exp)+') 있음','k':'ng'}],say:lc.say+'에는 이미 '+josa(o.name,'이/가')+' 있어요'}); }
  var k=lc.ci.key+'|'+empty.sk;
  S.UNDO.push({t:'in', k:k, had:S.SIM.hasOwnProperty(k), prev:S.SIM[k], gid:g.id, label:lc.label+' 입고 · '+g.product});
  S.SIM[k]={name:g.product, qty:g.qty, exp:g.exp};
  useGroup(g, 1);
  var g2=findGroup(g.id), left=g2?g2.left:0;
  S.LOG.unshift({t:nowHM(), s:'✅ '+lc.label+' 입고 · '+groupLine(g)+' (남은 '+left+'팔)'});
  var nx=left>0?null:activeGroup('in');
  save();
  finish(R,{ok:true,lines:[{t:lc.label+' 입고 · '+groupLine(g),'k':'ok'},{t:'남은 '+left+' / '+g.total+'팔'+(nx?' · 다음: '+nx.product:''),'k':'ok'}],
    say:lc.say+' 입고. '+(left>0?left+'파렛트 남았어요':g.product+' 입고대기 끝났어요'+(nx?'. 다음은 '+nx.product+'예요':''))});
}
function doOut(R){
  var lc=locCheck(R); if(lc.err) return finish(R,{ok:false,lines:[{t:lc.err,k:'ng'}],say:lc.sayErr});
  var has=lc.lv.slots.filter(function(x){return x.slot;});
  if(!has.length) return finish(R,{ok:false,lines:[{t:lc.label+'은 비어 있어요','k':'ng'}],say:josa(lc.say,'은/는')+' 비어 있어요. 출고할 물건이 없어요.'});
  var g=activeGroup('out');
  var cand=has.filter(function(x){ var s=x.slot;
    return (!g||(s.name===g.product&&(!g.exp||String(s.exp||'')===g.exp)))
      &&(!R.product||s.name===R.product)&&(!R.exp||String(s.exp||'')===R.exp); })[0];
  if(!cand){
    var s1=has[0].slot, want=g?g.product+(g.exp?' '+V.fmtExp(g.exp):''):(R.product||'말씀하신 상품');
    return finish(R,{ok:false,lines:[{t:'다름: 실제는 '+s1.name+' · '+V.fmtExp(s1.exp)+' · '+(+s1.qty||0)+'개 / 출고할 것: '+want,'k':'ng'}],
      say:lc.say+'에는 '+josa(s1.name+', '+V.sayExp(s1.exp),'이/가')+' 있어요. 해당 제품이 아닙니다.'});
  }
  if(!g){   /* 출고대기 목록 없이 출고 → 내용 읽고 확인 */
    return finish(R,{ok:true,lines:[{t:'출고대기 목록 없음 — 칸 내용 확인 후 출고','k':'wn'},{t:'기록: '+cand.slot.name+' · '+V.fmtExp(cand.slot.exp)+' · '+(+cand.slot.qty||0)+'개','k':'ok'}],
      ask:lc.say+'에 '+josa(cand.slot.name+', '+V.sayExp(cand.slot.exp),'이/가')+' 있어요. 출고할까요?', out1:{lc:lc, sk:cand.sk, slot:cand.slot, R:R}});
  }
  performOut(R, lc, cand.sk, cand.slot, g);
}
function performOut(R, lc, sk, slot, g){
  var k=lc.ci.key+'|'+sk;
  S.UNDO.push({t:'out', k:k, had:S.SIM.hasOwnProperty(k), prev:S.SIM[k], gid:g?g.id:null, label:lc.label+' 출고 · '+slot.name});
  S.SIM[k]=null;
  if(g) useGroup(g, 1);
  var g2=g&&findGroup(g.id), left=g2?g2.left:null;
  S.LOG.unshift({t:nowHM(), s:'📤 '+lc.label+' 출고 · '+slot.name+' '+V.fmtExp(slot.exp)+(left!=null?' (남은 '+left+'팔)':'')});
  save();
  finish(R,{ok:true,lines:[{t:lc.label+' 출고 · '+slot.name+' · '+V.fmtExp(slot.exp),'k':'ok'}].concat(left!=null?[{t:'출고대기 남은 '+left+' / '+g.total+'팔','k':'ok'}]:[]),
    say:lc.say+' 출고. '+(left!=null?(left>0?left+'파렛트 남았어요':g.product+' 출고대기 끝났어요'):'')});
}
function doWhat(R){
  var ci=cellAt(R.loc); if(ci.err) return finish(R,{ok:false,lines:[{t:ci.err,k:'ng'}],say:ci.sayErr||ci.err});
  if(R.loc.lvl==null){
    var parts=[], lines=[];
    for(var lv=1;lv<=ci.dR;lv++){ var s0=levelOf(ci,lv).slots.filter(function(x){return x.slot;})[0];
      parts.push(lv+'층 '+(s0?s0.slot.name+' '+V.sayExp(s0.slot.exp):'비어 있음'));
      lines.push({t:lv+'층: '+(s0?s0.slot.name+' · '+V.fmtExp(s0.slot.exp):'비어 있음'),k:'ok'}); }
    return finish(R,{ok:true,lines:lines,say:ci.sy+'. '+parts.join('. ')});
  }
  var lw=levelOf(ci,R.loc.lvl); if(lw.err) return finish(R,{ok:false,lines:[{t:lw.err,k:'ng'}],say:lw.sayErr||lw.err});
  var got=lw.slots.filter(function(x){return x.slot;}), say=V.sayLoc(R.loc);
  if(!got.length) return finish(R,{ok:true,lines:[{t:ci.name+' '+R.loc.lvl+'층은 비어 있어요','k':'ok'}],say:josa(say,'은/는')+' 비어 있어요'});
  finish(R,{ok:true,lines:got.map(function(x){return {t:x.slot.name+' · '+V.fmtExp(x.slot.exp)+' · '+(+x.slot.qty||0)+'개',k:'ok'};}),
    say:say+', '+got.map(function(x){return x.slot.name+', '+V.sayExp(x.slot.exp);}).join(', ')+'입니다'});
}
function doUndo(){
  var u=S.UNDO.pop();
  if(!u){ renderSay('되돌릴 내역이 없어요','info'); speak('되돌릴 내역이 없어요'); return; }
  if(u.had) S.SIM[u.k]=u.prev; else delete S.SIM[u.k];
  var g=u.gid&&findGroup(u.gid); if(g) useGroup(g,-1);
  S.LOG.unshift({t:nowHM(), s:'↩ 되돌림 · '+u.label});
  save(); renderAll(); renderSay('↩ 되돌렸어요: '+u.label,'done'); speak('되돌렸어요');
}
window.doUndo=doUndo;
function handleConfirm(alts){
  var yn=null; for(var i=0;i<alts.length&&!yn;i++) yn=V.yesNo(alts[i]);
  if(yn==='yes') confirmYes(); else if(yn==='no') confirmNo();
  else { renderSay('"'+alts[0]+'" — 네 또는 아니오로 대답해 주세요','ask'); setMicUI('ask'); speak('네 또는 아니오로 대답해 주세요'); }
}
function confirmYes(){
  if(!pending) return; var ev=pending; pending=null;
  if(ev.reg&&DRAFT){ var g=addGroup(DRAFT); DRAFT=null; renderAll();
    renderSay('✓ 등록했어요 — '+groupLine(g)+' × '+g.total+'팔. 이제 위치만 말씀하세요 (예: 에이 원 3층 '+(g.type==='in'?'입고':'출고')+')','done'); setMicUI('idle');
    speak('등록했어요. 이제 위치만 말씀하세요'); return; }
  if(ev.out1){ performOut(ev.out1.R, ev.out1.lc, ev.out1.sk, ev.out1.slot, null); return; }
  setMicUI(idleState());
}
function confirmNo(){ var ev=pending; pending=null; if(ev&&ev.reg){ renderSay('등록하지 않았어요. 고칠 항목을 다시 말씀하세요.','info'); DRAFT.awaiting=null; setMicUI('wait'); speak('등록하지 않았어요'); return; } renderSay('취소했어요','info'); setMicUI(idleState()); speak('취소했어요'); }
window.confirmYes=confirmYes; window.confirmNo=confirmNo;

function renderResult(R, ev){
  var box=document.getElementById('resBox'), g=document.getElementById('resGrid'), c=document.getElementById('chks'); if(!box) return;
  var actName={in:'입고',out:'출고',what:'확인(뭐야)',move:'이동',undo:'취소'}[R.action]||'';
  function row(k,v){ return '<div class="k">'+k+'</div><div class="v'+(v?'':' none')+'">'+(v?esc(v):'—')+'</div>'; }
  g.innerHTML=row('동작',actName)+row('위치',V.locLabel(R.loc))+(R.product?row('상품',R.product):'')+(R.exp?row('유통기한',V.fmtExp(R.exp)):'');
  c.innerHTML=ev.lines.map(function(x){ return '<div class="chk '+x.k+'">'+(x.k==='ok'?'✓':x.k==='ng'?'✕':'⚠')+' <span>'+esc(x.t)+'</span></div>'; }).join('');
  box.style.display='';
}
function renderResultDraft(ev){
  var box=document.getElementById('resBox'); if(!box) return;
  document.getElementById('resGrid').innerHTML='<div class="k">동작</div><div class="v">'+(DRAFT&&DRAFT.type==='in'?'입고대기 등록':'출고대기 등록')+'</div>';
  document.getElementById('chks').innerHTML=ev.lines.map(function(x){ return '<div class="chk '+x.k+'">'+(x.k==='ok'?'✓':x.k==='ng'?'✕':'⚠')+' <span>'+esc(x.t)+'</span></div>'; }).join('');
  box.style.display='';
}
function renderSay(text, kind){
  var b=document.getElementById('sayBox'); if(!b) return;
  if(!text){ b.innerHTML=''; return; }
  b.innerHTML='<div class="say'+(kind==='done'?' done':kind==='bad'?' bad':'')+'">🔊 '+esc(text)
    +(kind==='ask'?'<div class="yn"><button style="background:#059669;color:#fff" onclick="confirmYes()">네</button><button style="background:#334155;color:#E2E8F0" onclick="confirmNo()">아니오</button></div>':'')+'</div>';
}
function typedTest(){ var i=document.getElementById('typIn'); var t=(i&&i.value||'').trim(); if(!t) return; if(pending&&V.yesNo(t)){ handleConfirm([t]); return; } pending=null; handleCommand([t]); }
function exTest(el){ var i=document.getElementById('typIn'); if(i) i.value=el.textContent; pending=null; handleCommand([el.textContent]); }
window.typedTest=typedTest; window.exTest=exTest;

/* ── 데이터 ── */
function collectProducts(list){
  var s={};
  list.forEach(function(w){
    if(!w) return;
    Object.keys(w.pColors||{}).forEach(function(n){ s[n]=1; });
    (w.inQ||[]).forEach(function(it){ if(it&&it.name) s[it.name]=1; });
    Object.keys(w.cells||{}).forEach(function(k){ var c=w.cells[k]; if(!c||!c.slots) return; Object.keys(c.slots).forEach(function(sk){ var x=c.slots[sk]; if(x&&x.name) s[x.name]=1; }); });
  });
  return Object.keys(s);
}
function selectWh(id){
  if(whRef) whRef.off();
  WHID=id; lsSet('wms_voice_wh:'+GID, id); load(); DRAFT=null; pending=null;
  whRef=db.ref('warehouses/'+id);
  whRef.on('value',function(s){
    WH=s.val(); if(WH){ WH.rows=+WH.rows||0; WH.cols=+WH.cols||0; if(!Array.isArray(WH.inQ)) WH.inQ=WH.inQ?Object.values(WH.inQ):[]; }
    PRODUCTS=collectProducts(WHS.map(function(w){ return w.id===id?WH:w.raw; }));
    renderAll();
  });
}
window.selectWh=selectWh;
function start(){
  db.ref('groups/'+GID).get().then(function(g){
    var wids=g.exists()?Object.keys(g.val()).filter(function(k){return k!=='_init';}):[];
    if(!wids.length){ app.innerHTML='<div class="center">이 그룹에 창고가 없어요.</div>'; return; }
    return Promise.all(wids.map(function(w){ return db.ref('warehouses/'+w).get().then(function(s){ return {id:w, raw:s.val()}; }).catch(function(){ return null; }); }))
    .then(function(list){
      WHS=list.filter(function(x){return x&&x.raw;}).map(function(x){ return {id:x.id, name:x.raw.name||x.id, raw:x.raw}; });
      if(!WHS.length){ app.innerHTML='<div class="center">창고를 불러오지 못했어요.</div>'; return; }
      var saved=lsGet('wms_voice_wh:'+GID); WHID=WHS.some(function(w){return w.id===saved;})?saved:WHS[0].id;
      PRODUCTS=collectProducts(WHS.map(function(w){return w.raw;}));
      renderShell(); selectWh(WHID);
    });
  }).catch(function(e){ app.innerHTML='<div class="center" style="color:#F87171">불러오기 실패: '+esc(e.message)+'</div>'; });
}
auth.onAuthStateChanged(function(user){
  if(!user){ location.replace('/wms_login.html?return='+encodeURIComponent('/wms_voice.html'+location.search)); return; }
  db.ref('superadmins/'+user.uid).get().then(function(a){
    if(a.exists()){ if(!GID){ app.innerHTML='<div class="center">그룹이 지정되지 않았어요. 창고관리 메뉴에서 들어와 주세요.</div>'; return; } start(); return; }
    db.ref('userGroup/'+user.uid).get().then(function(g){
      if(!g.exists()){ app.innerHTML='<div class="center">작업 그룹에 등록되어 있지 않아요.</div>'; return; }
      if(!GID) GID=g.val();
      if(g.val()!==GID){ app.innerHTML='<div class="center">이 그룹에 대한 권한이 없어요.</div>'; return; }
      start();
    });
  }).catch(function(e){ app.innerHTML='<div class="center" style="color:#F87171">권한 확인 실패: '+esc(e.message)+'</div>'; });
});
</script>
