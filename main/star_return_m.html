<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f14">
<title>반품 검수 (휴대폰)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  :root { --bg:#0d0f14; --surface:#151820; --surface2:#1b1f29; --border:#2a2f3d; --accent:#4af0a8; --text:#e8eaf0; --muted:#7c8494; --red:#f05050; --yellow:#fbbf24; --blue:#3b82f6; }
  body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); padding:12px 12px calc(90px + env(safe-area-inset-bottom)); font-size:15px; }
  .mono { font-family:'Space Mono',monospace; }
  .dim { color:var(--muted); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .top h1 { font-size:18px; font-weight:900; }
  .top h1 b { color:var(--accent); }
  .who { font-size:11px; color:var(--muted); }
  .os { font-size:11px; font-weight:800; color:var(--blue); border:1px solid #1e3a66; border-radius:12px; padding:2px 8px; }

  .big { width:100%; border:0; border-radius:14px; padding:16px; font:900 17px 'Noto Sans KR',sans-serif; display:flex; align-items:center; justify-content:center; gap:8px; }
  .big.g { background:var(--accent); color:#06281a; }
  .big.b { background:var(--blue); color:#fff; }
  .big.d { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
  .big:disabled { opacity:.4; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .man { display:flex; gap:6px; margin-top:8px; }
  .man input { flex:1; min-width:0; background:#0a0c10; border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px; font:700 15px 'Space Mono',monospace; }
  .man button { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:0 14px; font:800 14px 'Noto Sans KR',sans-serif; }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; margin-top:12px; }
  .lbl { font-size:12px; font-weight:800; color:var(--muted); margin:2px 0 8px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:14px; }
  .kv span { color:var(--muted); }
  .kv b { font-family:'Space Mono',monospace; word-break:break-all; }
  .banner { border-radius:10px; padding:10px 12px; font-size:14px; font-weight:700; margin-top:8px; line-height:1.55; }
  .banner.red { background:#2a1414; border:1px solid #5a2525; color:#fca5a5; }
  .banner.yel { background:#2a2410; border:1px solid #5a4b20; color:#fde68a; }
  .banner.grn { background:#10261c; border:1px solid #1f5a3d; color:#a7f3d0; }
  .banner.blu { background:#0f1d33; border:1px solid #1e3a66; color:#bfdbfe; }

  .item { border:1px solid var(--border); border-radius:12px; padding:10px; margin-top:8px; background:var(--surface2); }
  .item.hot { border-color:var(--accent); }
  .item .nm { font-weight:800; font-size:14.5px; }
  .item .bc { font-family:'Space Mono',monospace; font-size:12px; color:var(--muted); margin-top:2px; }
  .item .ctl { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .cnt { font-family:'Space Mono',monospace; font-weight:700; font-size:20px; min-width:64px; text-align:center; }
  .cnt.full { color:var(--accent); } .cnt.over { color:var(--red); }
  .pm { width:44px; height:44px; border-radius:10px; border:1px solid var(--border); background:#0a0c10; color:var(--text); font:900 20px sans-serif; }
  .q { display:flex; flex:1; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .q button { flex:1; height:44px; border:0; background:transparent; color:var(--muted); font:900 15px 'Noto Sans KR',sans-serif; }
  .q button.on1 { background:var(--accent); color:#06281a; }
  .q button.on2 { background:var(--red); color:#fff; }
  textarea { width:100%; background:#0a0c10; border:1px solid var(--border); color:var(--text); border-radius:10px; padding:10px; font:14px 'Noto Sans KR',sans-serif; min-height:64px; }

  .photos { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
  .ph { position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:#0a0c10; border:1px solid var(--border); }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .ph .x { position:absolute; right:4px; top:4px; width:26px; height:26px; border-radius:50%; border:0; background:rgba(0,0,0,.65); color:#fff; font-weight:900; }
  .ph .up { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); }

  .chipm { border:1px solid var(--border); background:var(--surface2); color:var(--muted); border-radius:16px; padding:6px 12px; font-size:13.5px; font-weight:700; }
  .chipm.on { color:#06281a; background:var(--accent); border-color:var(--accent); }
  .recent .r { display:flex; justify-content:space-between; align-items:center; padding:9px 2px; border-bottom:1px solid #1f2430; font-size:13.5px; }
  .st { border-radius:6px; padding:2px 7px; font-size:11.5px; font-weight:800; white-space:nowrap; }
  .st.s-scan { background:#1f2533; color:#cbd5e1; } .st.s-ready { background:#0f1d33; color:#93c5fd; } .st.s-saving { background:#2a2410; color:#fde68a; }
  .st.s-done { background:#10261c; color:#6ee7b7; } .st.s-fail { background:#2a1414; color:#fca5a5; }

  .foot { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:rgba(13,15,20,.96); border-top:1px solid var(--border); display:flex; gap:8px; z-index:5; }
  .foot .big { padding:14px; }

  /* 카메라 바코드 읽기 */
  #scanOv { position:fixed; inset:0; z-index:30; background:#000; display:none; flex-direction:column; }
  #scanOv.on { display:flex; }
  #reader { flex:1; width:100%; }
  #reader video { object-fit:cover; }
  .sc-top { padding:12px; padding-top:calc(12px + env(safe-area-inset-top)); display:flex; justify-content:space-between; align-items:center; color:#fff; font-weight:800; }
  .sc-msg { padding:10px 14px; text-align:center; font-size:14px; color:#fff; min-height:44px; }
  .sc-last { font-family:'Space Mono',monospace; color:var(--accent); }
  .sc-bot { padding:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom)); }

  #toast { position:fixed; left:50%; top:14px; transform:translateX(-50%); background:#111827; border:1px solid var(--border); color:var(--text); border-radius:10px;
           padding:10px 14px; font-size:14px; font-weight:700; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; width:max-content; max-width:92vw; text-align:center; }
  #toast.on { opacity:1; }
  #viewer { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; }
  #viewer img { max-width:100%; max-height:100%; }
</style>
</head>
<body>
  <div class="top">
    <div><h1>↩ 반품 <b>검수</b></h1><div class="who" id="who">로그인 확인 중…</div></div>
    <div style="display:flex;gap:6px;align-items:center"><span class="os" id="osTag"></span><a href="star_return.html" class="who" style="color:var(--muted)">PC 화면</a></div>
  </div>

  <div id="pcWarn" class="banner yel" style="display:none;margin:0 0 10px"></div>
  <div id="startBox">
    <div id="cargoBox" class="card" style="display:none;margin:0 0 10px">
      <div class="lbl">업체명 · 택배사 — 스캔하는 반품마다 들어갑니다</div>
      <div class="man" style="margin-top:0"><input id="vendorIn" list="vendorList" placeholder="업체명 (새 이름은 목록에 쌓임)" autocomplete="off" style="font-family:'Noto Sans KR',sans-serif"><datalist id="vendorList"></datalist></div>
      <div id="vendorChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
      <div id="courierChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
      <div class="dim" style="font-size:12px;margin-top:6px">우체국 송장(6077·7077)은 택배사를 안 골라도 자동으로 우체국 · 원송장 자동 추적</div>
    </div>
    <button class="big g" onclick="openScan('rno')">📷 반품 송장 스캔</button>
    <div class="man"><input id="rnoIn" inputmode="numeric" placeholder="또는 송장번호 직접 입력" autocomplete="off"><button onclick="manualRno()">확인</button></div>
  </div>

  <div id="cur"></div>

  <div class="card recent">
    <div class="lbl">오늘 검수한 반품</div>
    <div id="recent" class="dim" style="font-size:13px">불러오는 중…</div>
  </div>

  <div class="foot" id="foot" style="display:none"></div>

  <div id="scanOv">
    <div class="sc-top"><span id="scTitle">반품 송장 스캔</span><button class="big d" style="width:auto;padding:8px 14px;font-size:14px" onclick="closeScan()">닫기</button></div>
    <div id="reader"></div>
    <div class="sc-msg" id="scMsg">바코드를 네모 안에 맞춰 주세요</div>
    <div class="sc-bot" id="scBot"></div>
  </div>
  <div id="viewer" onclick="this.style.display='none'"><img id="viewImg" alt=""></div>
  <input type="file" id="camIn" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="albumIn" accept="image/*" multiple style="display:none">
  <div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="wms_sync.js"></script>
<script src="star_return_core.js"></script>
<script>
/* 신규인원용 링크(?key=열쇠)로 들어오면 로그인 게이트를 건너뜀 — 대신 서버가 열쇠를 확인하고 반품 데이터만 열어 줌 (functions-settle/kiosk.js) */
if (!/[?&]key=[A-Za-z0-9_-]{20,64}/.test(location.search)){
  var gs = document.createElement('script'); gs.src = '/wms_access.js'; gs.setAttribute('data-page', 'star_return_m'); gs.setAttribute('data-floor', '2'); document.head.appendChild(gs);
}
</script>
<script>
/* ============================================================
   스타 3PL 반품입고 — 휴대폰 검수 화면 (대표님 2026-10-24)
   휴대폰 카메라로 ① 반품 송장 ② 상품 바코드를 읽고, 상품마다 정상/불량 · 특이사항 · 📷 사진까지 한 화면에서.
   PC 반품입고관리(star_return.html)와 같은 기록을 씀 → PC 목록에 바로 쌓이고 사진도 같이 보임.
   원송장 주문의 상품 목록은 이벗 도우미가 연결된 PC 가 자동으로 채움(look=wait → PC autoLook).
   ?os=android → 크롬 자체 바코드 읽기(BarcodeDetector) 우선 / ?os=ios → 사파리용(ZXing) — 둘 다 html5-qrcode
   사진: Storage star_return/{gid}/{반품송장}/{시각}.jpg (긴 변 1600px JPEG 로 줄여 올림), 목록은 DB photos/{반품송장}/{id}
   이 화면은 기록 전체를 덮어쓰지 않고(update) 바뀐 칸만 씀 — PC 가 같은 기록에 상품을 채우는 중이어도 안 지워지게
============================================================ */
var $ = function(id){ return document.getElementById(id); };
var db = null, gid = null, me = null, base = null;
var RECS = {}, NOTES = {}, PHOTOS = {}, CUR = null, photoRef = null;
var OS = (/[?&]os=(android|ios)/.exec(location.search) || [])[1] || (/iPhone|iPad|iPod/.test(navigator.userAgent) ? 'ios' : 'android');
$('osTag').textContent = OS === 'ios' ? ' 아이폰' : ' 안드로이드';
/* 스타 / 화물 구분 (star_return_core.js 의 CFG, 주소 ?db=cargo) */
document.title = CFG.db === 'cargo' ? '반품 검수 (화물·휴대폰)' : '반품 검수 (휴대폰)';
if (CFG.db === 'cargo') document.querySelector('.top h1').innerHTML = '↩ 반품 <b>검수</b> <span class="dim" style="font-size:13px">화물</span>';
document.querySelector('.top a[href="star_return.html"]').href = 'star_return.html' + (CFG.q ? '?' + CFG.q.slice(1) : '');
var VENDORS = {}, CUR_COURIER = '';
if (CFG.vendor){
  $('cargoBox').style.display = 'block';
  try { $('vendorIn').value = localStorage.getItem('retVendor_' + CFG.db) || ''; } catch(e){}
  $('vendorIn').addEventListener('change', function(){ try { localStorage.setItem('retVendor_' + CFG.db, this.value.trim()); } catch(e){} renderVendorChips(); });
}
function renderVendorChips(){
  if (!CFG.vendor) return;
  var ks = Object.keys(VENDORS).map(function(k){ return VENDORS[k]; }).filter(function(v){ return v && v.name; });
  $('vendorList').innerHTML = ks.map(function(v){ return '<option value="' + esc(v.name) + '">'; }).join('');
  var cur = $('vendorIn').value.trim();
  $('vendorChips').innerHTML = ks.sort(function(a, b){ return (b.t || 0) - (a.t || 0); }).slice(0, 10).map(function(v){
    return '<button class="chipm' + (cur === v.name ? ' on' : '') + '" onclick="pickVendor(this.textContent)">' + esc(v.name) + '</button>'; }).join('');
  $('courierChips').innerHTML = COURIERS.map(function(c){ return '<button class="chipm' + (CUR_COURIER === c ? ' on' : '') + '" onclick="CUR_COURIER=\'' + c + '\';renderVendorChips()">' + c + '</button>'; }).join('');
}
function pickVendor(n){ $('vendorIn').value = n; try { localStorage.setItem('retVendor_' + CFG.db, n); } catch(e){} renderVendorChips(); }
function addVendor(name){ name = String(name || '').trim(); if (!name || !base) return; base.child('dict/vendor/' + vkey(name)).transaction(function(c){ c = c || {}; return { name: name, n: (c.n || 0) + 1, t: Date.now() }; }); }

var toastT = null;
function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ e.classList.remove('on'); }, 2400); }
function byName(){ return KIOSK ? (WORKER || '신규인원') + '(링크)' : (me && (me.email || '').split('@')[0]) || ''; }
function vib(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }

/* ── 이벗 도우미가 연결된 PC 가 있는지 — PC 반품입고관리가 30초마다 남기는 helperBeat 로 판단 (90초 넘게 없으면 없음) ── */
var BEAT = null, SKEW = 0;
function pcAlive(){ return !!(BEAT && BEAT.ok && Date.now() + SKEW - (BEAT.at || 0) < 90000); }
function showPcWarn(){
  var w = $('pcWarn'), alive = pcAlive();
  w.style.display = alive || !base ? 'none' : 'block';
  w.innerHTML = '⚠️ 이벗 도우미가 연결된 PC 가 없습니다<div style="font-weight:400;font-size:13px;margin-top:3px">스캔·사진·메모는 그대로 됩니다. 다만 <b>상품 목록</b>은 PC 반품입고관리에서 이벗 도우미를 연결해야 채워집니다'
    + (BEAT && BEAT.at ? ' (마지막 연결 ' + hm(BEAT.at) + (BEAT.by ? ' · ' + esc(BEAT.by) : '') + ')' : '') + '.</div>';
}
function typing(){ var a = document.activeElement; return !!(a && a.tagName === 'TEXTAREA'); }   /* 메모 쓰는 중엔 다시 그리지 않음 */
setInterval(function(){ showPcWarn(); if (CUR && !typing()) render(); }, 15000);

/* ── 기록 쓰기: 바뀐 칸만 ── */
function upd(r, fields){
  Object.assign(r, fields); r.upd = Date.now(); RECS[r.rno] = r; markNotes(r);
  var u = Object.assign({}, fields, { upd: r.upd });
  return base.child('recs/' + r.rno).update(u);
}

/* ── 카메라 바코드 읽기 ── */
var scanner = null, scanMode = null, lastCode = '', lastAt = 0;
var FORMATS = typeof Html5QrcodeSupportedFormats !== 'undefined' ? [Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E, Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.CODABAR, Html5QrcodeSupportedFormats.QR_CODE] : [];
function openScan(mode){
  if (typeof Html5Qrcode === 'undefined'){ toast('바코드 읽기 프로그램을 못 불러왔습니다 — 인터넷 확인'); return; }
  scanMode = mode; lastCode = ''; lastAt = 0;
  $('scTitle').textContent = mode === 'rno' ? '① 반품 송장 스캔' : '② 상품 바코드 스캔 (여러 개 계속)';
  $('scMsg').innerHTML = mode === 'rno' ? '송장 바코드를 네모 안에 맞춰 주세요' : '상품 바코드를 하나씩 비추면 자동으로 셉니다';
  $('scBot').innerHTML = mode === 'item' ? '<button class="big g" onclick="closeScan()">✔ 상품 스캔 끝</button>' : '';
  $('scanOv').classList.add('on');
  scanner = new Html5Qrcode('reader', { formatsToSupport: FORMATS, verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: OS === 'android' } });
  var box = Math.min(window.innerWidth - 40, 340);
  scanner.start({ facingMode: 'environment' }, { fps: 12, qrbox: { width: box, height: Math.round(box * 0.45) }, disableFlip: true }, onCode, function(){})
    .catch(function(e){ closeScan(); toast('카메라를 못 열었습니다 — ' + (OS === 'ios' ? '설정 > Safari > 카메라 「허용」' : '주소창 왼쪽 자물쇠 > 카메라 「허용」') + ' 후 다시'); console.error(e); });
}
function closeScan(){
  $('scanOv').classList.remove('on');
  if (scanner){ var s = scanner; scanner = null; s.stop().then(function(){ s.clear(); }).catch(function(){}); }
}
function onCode(text){
  var code = String(text || '').trim(), now = Date.now();
  if (!code || (code === lastCode && now - lastAt < 1800)) return;   /* 같은 바코드를 계속 비추고 있을 때 중복 방지 */
  lastCode = code; lastAt = now;
  if (scanMode === 'rno'){
    var no = digits(code);
    if (no.length < 10 || no.length > 15){ beep(false); $('scMsg').textContent = '송장 바코드가 아닙니다: ' + code; return; }
    closeScan(); startRno(no);
  } else {
    var r = RECS[CUR]; if (!r || locked(r)) return;
    var pre = !(r.items || []).length && CFG.db === 'cargo';   /* 화물: 원송장 전 스캔은 그냥 쌓음 */
    var a = applyItem(r, code);
    upd(r, { items: r.items || [], extras: r.extras || [] });
    if (pre){ var xx = (r.extras || []).filter(function(e){ return e.code === a.code; })[0]; beep(true); vib(40);
      $('scMsg').innerHTML = '✔ <span class="sc-last">' + esc(a.code) + '</span> — ' + (xx ? xx.n : 1) + '개째'; render(a.code); return; }
    beep(!!a.hit && !a.over); vib(a.hit && !a.over ? 40 : [80, 60, 80]);
    $('scMsg').innerHTML = a.hit ? '✔ <span class="sc-last">' + esc(a.code) + '</span> ' + esc(a.hit.name) + ' — 반품 ' + a.hit.got + ' / 주문 ' + a.hit.qty + (a.over ? ' <b style="color:#f05050">주문보다 많음</b>' : '')

var UPLOADING = {};
function shrink(file){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var M = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, M / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? res(b) : rej(new Error('사진 변환 실패')); }, 'image/jpeg', 0.8);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('사진을 못 읽었습니다')); };
    img.src = url;
  });
}
function uploadFiles(files){

    shrink(f).then(function(b){

      return ref.put(b, { contentType: 'image/jpeg' }).then(function(){ return ref.getDownloadURL(); });
    }).then(function(url){
      return base.child('photos/' + r.rno).push({ path: path, url: url, at: Date.now(), by: byName() });
    }).then(function(){ delete UPLOADING[tmp]; vib(30); render(); }, function(e){ delete UPLOADING[tmp]; render(); toast('사진 올리기 실패: ' + (e.code || e.message)); });
  });
}

      me = u; gid = d.gid; db = firebase.database();
      var pcA = document.querySelector('.top a[href^="star_return.html"]'); if (pcA) pcA.style.display = 'none';   /* 링크 접속자는 PC 화면 못 씀 */
      $('who').innerHTML = '👤 ' + esc(WORKER) + ' · 신규인원용 링크' + (d.label ? ' 「' + esc(d.label) + '」' : '') + (d.exp ? ' · ~' + hm(d.exp) : '') + ' <a href="#" style="color:var(--muted)" onclick="if(askWorker())location.reload();return false">이름 바꾸기</a>';
      startData();
    }).catch(function(e){ joined = false; kioskFail(String(e.message || e.code || e)); });
  });
} else WMSync.onAuth(function(st){
  if (!st.user){ $('who').textContent = '로그인 필요'; return; }
  if (!st.groupId){ $('who').textContent = '작업 그룹 미등록 — 관리자에게 초대코드를 받으세요'; return; }
  me = st.user; gid = st.groupId; db = firebase.database();
  $('who').textContent = (me.email || '').split('@')[0] + ' · 그룹 ' + gid;
  startData();
});
</script>
</body>
</html>
