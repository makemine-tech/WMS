<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E131B">
<meta name="copyright" content="© 2026 Makemine Design. All rights reserved.">
<title>반품 검수 (휴대폰)</title>
<style>
  /* 현장용 큰 글씨 · 고대비 (대표님 2026-10-24 C안 — 눈이 안 좋은 작업자·장갑 낀 손) */
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@700&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  :root { --bg:#111111; --card:#1C1C1C; --card2:#262626; --border:#3A3A3A; --yel:#FFD400; --yel2:#FFE566; --grn:#2ECC71; --grn-ink:#0A2614;
          --red:#FF4D4D; --red2:#FF8080; --text:#FFFFFF; --muted:#BDBDBD; --blue:#7AB8FF; }
  body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); padding:14px 14px calc(120px + env(safe-area-inset-bottom)); font-size:17px; line-height:1.45; }
  button { font-family:inherit; cursor:pointer; }
  .mono { font-family:'Space Mono',monospace; }
  .dim { color:var(--muted); }
  .ico { width:1.25em; height:1.25em; flex-shrink:0; }

  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .top .ttl { font-size:16px; font-weight:700; color:var(--muted); }
  .top .ttl b { color:var(--text); }
  .who { font-size:13px; color:var(--muted); margin-top:2px; }
  .who a { color:var(--muted); }
  .today { font-family:'Space Mono',monospace; font-size:16px; color:var(--yel); white-space:nowrap; }
  .os { font-size:12px; font-weight:700; color:var(--muted); }
  .pcl { font-size:13px; color:var(--muted); }

  /* 큰 단추 */
  .btn { border:2px solid var(--border); background:var(--card); color:var(--text); border-radius:18px; min-height:64px; padding:10px 16px;
         font-size:17px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; }
  .btn.y { background:var(--yel); border-color:var(--yel); color:#111; font-weight:900; }
  .btn.w { background:#fff; border-color:#fff; color:#111; font-weight:900; }
  .btn:disabled { opacity:.4; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; min-width:0; }

  .hero { width:100%; min-height:min(52vh,420px); border:0; border-radius:32px; background:var(--yel); color:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; margin-bottom:12px; }
  .hero svg { width:110px; height:110px; }
  .hero b { font-size:44px; font-weight:900; letter-spacing:-1.5px; line-height:1.1; }
  .hero span { font-size:17px; font-weight:700; }

  .man { display:none; gap:8px; margin-bottom:12px; }
  .man.on { display:flex; }
  .man input, .vin { flex:1; min-width:0; background:#000; border:2px solid var(--border); color:var(--text); border-radius:16px; padding:0 16px; height:64px; font:700 20px 'Space Mono',monospace; }
  .vin { font-family:'Noto Sans KR',sans-serif; font-size:18px; width:100%; }
  .man button { width:96px; flex:0 0 96px; }

  .card { background:var(--card); border-radius:22px; padding:16px; margin-top:12px; }
  .lbl { font-size:15px; font-weight:700; color:var(--muted); margin-bottom:10px; }
  .banner { border-radius:18px; padding:14px 16px; font-size:16px; font-weight:700; margin-top:10px; line-height:1.5; border:2px solid; }
  .banner small { display:block; font-weight:500; font-size:14px; margin-top:4px; }
  .banner.red { background:#2B0F0F; border-color:var(--red); color:#FFB3B3; }
  .banner.yel { background:#2B2200; border-color:var(--yel); color:var(--yel2); }
  .banner.grn { background:#0D2618; border-color:var(--grn); color:#9BF0BE; }
  .banner.blu { background:#0E1E33; border-color:#3B6FB6; color:#CFE3FF; }

  /* 송장 머리 */
  .head { display:flex; align-items:center; gap:12px; }
  .head .x { width:56px; height:56px; flex:0 0 56px; border-radius:16px; border:2px solid var(--border); background:var(--card); color:#fff; display:flex; align-items:center; justify-content:center; }
  .head .no { font-family:'Space Mono',monospace; font-size:19px; }
  .head .sub { font-size:14px; color:var(--muted); }
  .st { border-radius:10px; padding:4px 10px; font-size:14px; font-weight:700; white-space:nowrap; }
  .st.s-scan { background:#333; color:#fff; } .st.s-ready { background:#0E1E33; color:var(--blue); } .st.s-saving { background:#2B2200; color:var(--yel); }
  .st.s-done { background:#0D2618; color:var(--grn); } .st.s-fail { background:#2B0F0F; color:var(--red2); }

  .tally { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:12px; }
  .tally div { background:var(--card); border-radius:16px; padding:10px 12px; }
  .tally span { display:block; font-size:14px; font-weight:700; color:var(--muted); }
  .tally b { font-family:'Space Mono',monospace; font-size:30px; line-height:1.15; }

  /* 한 상품씩 */
  .pager { display:flex; align-items:center; justify-content:space-between; margin:16px 2px 8px; gap:8px; }
  .pager .pn { font-size:17px; font-weight:700; color:var(--muted); }
  .dots { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .dots button { width:30px; height:30px; border-radius:10px; border:2px solid var(--border); background:transparent; padding:0; }
  .dots button.done { background:var(--grn); border-color:var(--grn); }
  .dots button.part { background:var(--yel); border-color:var(--yel); }
  .dots button.cur { outline:3px solid #fff; outline-offset:2px; }
  .focus { background:var(--card); border-radius:28px; padding:20px 16px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; border:3px solid transparent; }
  .focus.hot { border-color:var(--yel); }
  .focus .nm { font-size:28px; font-weight:900; line-height:1.25; letter-spacing:-.6px; word-break:keep-all; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .focus .nm.long { font-size:22px; }
  .focus .opt { font-size:17px; color:var(--muted); font-weight:700; }
  .focus .bc { font-family:'Space Mono',monospace; font-size:14px; color:var(--muted); }
  .focus .big { font-family:'Space Mono',monospace; font-size:84px; line-height:1; color:var(--yel); margin-top:10px; }
  .focus .big small { font-size:30px; color:var(--muted); }
  .focus .big.full { color:var(--grn); } .focus .big.over { color:var(--red2); }
  .focus .say { font-size:18px; font-weight:700; color:var(--yel); }
  .focus .say.ok { color:var(--grn); } .focus .say.bad { color:var(--red2); }

  .qt { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:10px; }
  .qbox { border-radius:24px; padding:12px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .qbox.g { background:#0D2618; border:3px solid var(--grn); color:#9BF0BE; }
  .qbox.b { background:#2B0F0F; border:3px solid var(--red); color:#FFB3B3; }
  .qbox .k { font-size:20px; font-weight:900; }
  .qbox .n { font-family:'Space Mono',monospace; font-size:48px; line-height:1; color:#fff; }
  .qbox .pmr { display:flex; gap:8px; width:100%; }
  .qbox .pmr button { flex:1; height:56px; border-radius:16px; border:0; font:900 30px 'Noto Sans KR',sans-serif; }
  .qbox.g .pmr button { background:var(--grn); color:var(--grn-ink); }
  .qbox.b .pmr button { background:var(--red); color:#fff; }
  .qbox .pmr button.minus { background:transparent; border:2px solid currentColor; color:inherit; }

  .lst .li { display:flex; align-items:center; gap:12px; width:100%; background:var(--card2); border:2px solid transparent; border-radius:18px; padding:12px 14px; margin-top:8px; color:#fff; text-align:left; }
  .lst .li.cur { border-color:#fff; }
  .lst .li .t { flex:1; min-width:0; font-size:17px; font-weight:700; }
  .lst .li .t small { display:block; font-size:14px; color:var(--muted); font-weight:500; }
  .lst .li .c { font-family:'Space Mono',monospace; font-size:22px; color:var(--yel); white-space:nowrap; }
  .lst .li .c.full { color:var(--grn); } .lst .li .c.over { color:var(--red2); }

  .xrow { display:flex; align-items:center; gap:10px; background:#2B0F0F; border:2px solid var(--red); border-radius:18px; padding:12px 14px; margin-top:8px; color:#FFB3B3; }
  .xrow .t { flex:1; min-width:0; font-weight:700; font-size:16px; }
  .xrow .t .mono { display:block; color:#fff; font-size:15px; word-break:break-all; }
  .xrow button { flex:0 0 auto; width:auto; min-height:48px; padding:0 14px; font-size:15px; border-radius:14px; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { min-height:52px; padding:0 18px; border-radius:999px; border:2px solid var(--border); background:transparent; color:#fff; font-size:17px; font-weight:700; }
  .chip.on { background:var(--yel); border-color:var(--yel); color:#111; }
  textarea { width:100%; background:#000; border:2px solid var(--border); color:#fff; border-radius:16px; padding:14px; font:500 17px 'Noto Sans KR',sans-serif; min-height:90px; margin-top:10px; }

  .photos { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .ph { position:relative; aspect-ratio:1; border-radius:16px; overflow:hidden; background:#000; border:2px solid var(--border); }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .ph .x { position:absolute; right:6px; top:6px; width:40px; height:40px; border-radius:50%; border:0; background:rgba(0,0,0,.75); color:#fff; font-weight:900; font-size:20px; }
  .ph .up { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--muted); }

  .recent .r { display:flex; align-items:center; gap:12px; width:100%; background:var(--card); border:0; border-radius:20px; padding:16px; margin-top:8px; color:#fff; text-align:left; }
  .recent .r .dot { width:12px; height:12px; border-radius:50%; flex:0 0 12px; background:var(--yel); }
  .recent .r .t { flex:1; min-width:0; font-size:16px; font-weight:700; }
  .recent .r .t .mono { display:block; font-size:14px; color:var(--muted); font-weight:700; }
  .copy { text-align:center; font-size:12px; color:#8A8A8A; margin-top:28px; }

  .foot { position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(12px + env(safe-area-inset-bottom)); background:rgba(17,17,17,.97); border-top:2px solid var(--border); display:flex; gap:10px; z-index:5; }
  .foot .btn { min-height:76px; border-radius:24px; font-size:20px; }
  .foot .btn.side { flex:0 0 88px; font-size:16px; }

  /* 카메라 바코드 읽기 */
  #scanOv { position:fixed; inset:0; z-index:30; background:#000; display:none; flex-direction:column; border:0 solid transparent; transition:border-color .15s; }
  #scanOv.on { display:flex; }
  #scanOv.okf { border:8px solid var(--grn); } #scanOv.badf { border:8px solid var(--red); }
  #reader { flex:1; width:100%; min-height:0; }
  #reader video { object-fit:cover; }
  .sc-top { padding:12px 14px; padding-top:calc(12px + env(safe-area-inset-top)); display:flex; justify-content:space-between; align-items:center; gap:10px; color:var(--yel); font-weight:900; font-size:20px; }
  .sc-top .btn { width:auto; min-height:56px; padding:0 18px; font-size:17px; }
  .sc-msg { padding:12px 16px; text-align:center; font-size:20px; font-weight:700; color:#fff; min-height:72px; line-height:1.4; }
  .sc-msg .nm { display:block; font-size:24px; font-weight:900; }
  .sc-msg .n { font-family:'Space Mono',monospace; font-size:34px; color:var(--yel); }
  .sc-last { font-family:'Space Mono',monospace; color:var(--yel); }
  .sc-bot { padding:10px 14px; padding-bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; }
  .mode { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .mode button { min-height:68px; border-radius:20px; border:3px solid var(--border); background:#111; color:var(--muted); font-size:20px; font-weight:900; }
  .mode button.g.on { background:var(--grn); border-color:var(--grn); color:var(--grn-ink); }
  .mode button.b.on { background:var(--red); border-color:var(--red); color:#fff; }

  #flash { position:fixed; inset:0; z-index:50; pointer-events:none; opacity:0; transition:opacity .25s; }
  #flash.ok { background:rgba(46,204,113,.35); opacity:1; } #flash.bad { background:rgba(255,77,77,.4); opacity:1; }
  #toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#000; border:2px solid var(--yel); color:#fff; border-radius:16px;
           padding:14px 18px; font-size:17px; font-weight:700; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; width:max-content; max-width:92vw; text-align:center; }
  #toast.on { opacity:1; }
  #viewer { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.94); display:none; align-items:center; justify-content:center; }
  #viewer img { max-width:100%; max-height:100%; }

  /* 한 화면씩 — 화면 전체가 휴대폰 높이에 딱 맞음, 스크롤은 목록(.scroll)만 (대표님 2026-10-24) */
  html, body { height:100%; overflow:hidden; }
  body { padding:0; }
  /* 키보드(대표님 2026-10-24: 올라오면 내용을 밀어 올리고 안 내려옴) — 문서는 아예 안 움직이게 고정하고,
     #app 을 「지금 보이는 부분」(visualViewport) 위치·높이에 맞춤 → 키보드가 내려가면 저절로 제자리 */
  html, body { position:fixed; inset:0; width:100%; overscroll-behavior:none; }
  #app { position:fixed; left:0; right:0; top:var(--appTop, 0px); height:100vh; height:var(--appH, 100dvh); display:flex; flex-direction:column; padding:calc(8px + env(safe-area-inset-top)) 14px calc(4px + env(safe-area-inset-bottom)); }
  #app .top { margin-bottom:8px; flex:0 0 auto; }
  #page { flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; overflow:hidden; }
  #page > * { flex-shrink:0; }
  #page > .scroll, #page > .focus { flex:1 1 auto; min-height:0; }
  .scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #page .banner { margin:0; padding:10px 14px; font-size:15px; }
  #page .banner small { font-size:13px; }
  .foot { position:static; flex:0 0 auto; padding:10px 0 4px; background:none; border:0; }
  .foot:empty { display:none; }
  .foot .btn { min-height:68px; border-radius:22px; font-size:19px; }
  .foot .btn.side { flex:0 0 104px; }
  .copy { margin:2px 0 0; font-size:10px; flex:0 0 auto; }

  .steps { display:flex; gap:6px; }
  .steps span { flex:1; text-align:center; font-size:13px; font-weight:700; color:var(--muted); padding:5px 0; border-radius:10px; background:var(--card); }
  .steps span.on { background:var(--yel); color:#111; }
  .steps span.done { color:var(--grn); }

  .shot { width:100%; height:120px; border:0; border-radius:24px; background:var(--yel); color:#111; display:flex; align-items:center; justify-content:center; gap:16px; }
  .shot .sico { width:56px; height:56px; }
  .shot span { display:flex; flex-direction:column; align-items:flex-start; }
  .shot b { font-size:30px; font-weight:900; letter-spacing:-1px; line-height:1.15; }
  .shot small { font-size:15px; font-weight:700; }
  .seg { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
  .seg button { min-height:52px; border-radius:14px; border:2px solid var(--border); background:var(--card); color:#fff; font-size:16px; font-weight:700; padding:0 2px; }
  .seg button.on { background:#3B82F6; border-color:#3B82F6; color:#fff; font-weight:900; }
  .man input { height:56px; font-size:18px; }
  .vin { height:52px !important; font-size:16px !important; }
  .chips.sm { gap:6px; }
  .chips.sm .chip { min-height:44px; padding:0 14px; font-size:15px; }

  #page .head .no { font-size:17px; }
  #page .head .sub { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msgs { max-height:22vh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .pager { margin:0; }
  .pager .pn { font-size:16px; color:#fff; }
  .pager .tl { flex:1; text-align:center; font-size:14px; color:var(--muted); white-space:nowrap; }
  .pager .lk { border:2px solid var(--border); background:var(--card); color:#fff; border-radius:12px; min-height:40px; padding:0 12px; font-size:14px; font-weight:700; }
  #page .focus { padding:12px; gap:2px; justify-content:center; border-radius:24px; overflow:hidden; }
  #page .focus .nm { font-size:clamp(20px,3.4vh,28px); -webkit-line-clamp:2; }
  #page .focus .nm.long { font-size:clamp(18px,2.9vh,23px); }
  #page .focus .bc { font-size:13px; }
  #page .focus .big { font-size:clamp(44px,9vh,84px); margin-top:4px; }
  #page .focus .big small { font-size:.4em; }
  #page .focus .say { font-size:16px; }
  #page .qt { width:100%; margin-top:8px; gap:8px; }
  #page .qbox { padding:8px; gap:6px; border-radius:20px; }
  .qbox .kn { display:flex; align-items:baseline; justify-content:center; gap:10px; }
  #page .qbox .k { font-size:17px; }
  #page .qbox .n { font-size:clamp(28px,5vh,44px); }
  #page .qbox .pmr button { height:clamp(44px,6.5vh,56px); font-size:26px; }
  .nav .btn { min-height:64px; }
  .nav .btn:first-child, .nav .btn:last-child { flex:1; }
  .empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-size:20px; font-weight:700; color:var(--muted); background:var(--card); border-radius:24px; }
  .empty small { font-size:15px; font-weight:500; margin-top:6px; }
  .xcard { background:var(--card); border-radius:20px; padding:10px; margin-bottom:8px; border:3px solid transparent; }
  .xcard.hot { border-color:var(--yel); }
  .xcard .xh { display:flex; align-items:center; gap:10px; }
  .xcard .xh .mono { flex:1; min-width:0; word-break:break-all; font-size:15px; }
  .xcard .xh b { font-size:18px; }
  .xcard .xh .btn { width:auto; min-height:44px; padding:0 12px; font-size:14px; }
  #page textarea { min-height:0; height:76px; margin:0; }
  #page .photos { margin:0; }
  .recent .r { margin:0 0 8px; }
  .ask { font-size:22px; font-weight:900; line-height:1.3; }
  .ask small { display:block; font-size:14px; font-weight:500; color:var(--muted); margin-top:4px; }
  .seg.four { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .row.three .btn { min-height:60px; font-size:16px; padding:6px; gap:4px; }
  .addq { display:flex; align-items:center; gap:10px; }
  .addq .btn { flex:0 0 72px; font-size:28px; }
  .addq b { flex:1; text-align:center; font-family:'Space Mono',monospace; font-size:44px; color:var(--yel); }
  .addq b small { font-family:'Noto Sans KR',sans-serif; font-size:16px; color:var(--muted); margin-left:4px; }
  .xcard .xh .xn { flex:1; min-width:0; font-size:17px; font-weight:700; }
  .sum { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .sum div { background:var(--card); border-radius:14px; padding:8px 12px; }
  .sum span { display:block; font-size:13px; color:var(--muted); font-weight:700; }
  .sum b { font-size:16px; }
  /* 단계마다 번호 붙은 노란 입체 상자 + 안쪽 검정 입체 단추 (대표님 2026-10-24 — 1번부터 끝까지 같은 모양) */
  .yb { width:100%; text-align:left; border:0; background:var(--yel); color:#111; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px;
        box-shadow:0 6px 0 #A88600, 0 12px 18px rgba(0,0,0,.45); margin-bottom:6px; }
  #page > .yb.fill { flex:1 1 auto; min-height:0; }
  button.yb.tap:active { transform:translateY(4px); box-shadow:0 2px 0 #A88600; }
  .yb .yh { display:flex; align-items:center; gap:10px; font-size:21px; font-weight:900; letter-spacing:-.5px; line-height:1.2; }

  var gs = document.createElement('script'); gs.src = '/wms_access.js'; gs.setAttribute('data-page', 'star_return_m'); gs.setAttribute('data-floor', '2'); document.head.appendChild(gs);
}
</script>
<script>
/* ============================================================
   스타 3PL 반품입고 — 휴대폰 검수 화면 (대표님 2026-10-24)
   휴대폰 카메라로 ① 반품 송장 ② 상품 바코드를 읽고, 상품마다 정상/불량 · 특이사항 · 📷 사진까지 한 화면에서.
   PC 반품입고관리(star_return.html)와 같은 기록을 씀 → PC 목록에 바로 쌓이고 사진도 같이 보임.
   원송장 주문의 상품 목록은 이벗 도우미가 연결된 PC 가 자동으로 채움(look=wait → PC autoLook).
   ?os=android → 크롬 자체 바코드 읽기(BarcodeDetector) 우선 / ?os=ios → 사파리용(ZXing) — 둘 다 html5-qrcode
   사진: Storage star_return/{gid}/{반품송장}/{시각}.jpg (긴 변 1600px JPEG 로 줄여 올림), 목록은 DB photos/{반품송장}/{id}
   이 화면은 기록 전체를 덮어쓰지 않고(update) 바뀐 칸만 씀 — PC 가 같은 기록에 상품을 채우는 중이어도 안 지워지게
============================================================ */
var $ = function(id){ return document.getElementById(id); };
/* ── 휴대폰 키보드: #app 을 지금 보이는 부분(visualViewport)에 맞춤 — 키보드가 올라오면 줄이고, 내려가면 원래대로 (대표님 2026-10-24) ── */
(function(){
  var vv = window.visualViewport, full = 0, root = document.documentElement, t = null;
  function fit(){
    var h = vv ? vv.height : window.innerHeight, top = vv ? Math.max(0, vv.offsetTop) : 0;
    full = Math.max(full, window.innerHeight, h);
    var kb = h < full - 120;   /* 보이는 높이가 120px 넘게 줄면 키보드가 올라온 것 */
    root.style.setProperty('--appH', Math.round(h) + 'px');
    root.style.setProperty('--appTop', Math.round(top) + 'px');
    root.classList.toggle('kb', kb);
    if (!kb){ window.scrollTo(0, 0); var p = $('page'); if (p) p.scrollTop = 0; }
  }
  function soon(){ clearTimeout(t); t = setTimeout(fit, 60); }
  if (vv){ vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
  window.addEventListener('resize', soon);
  window.addEventListener('orientationchange', function(){ full = 0; setTimeout(fit, 300); });
  /* 입력 칸을 누르면 키보드가 다 올라온 뒤 그 칸이 보이게, 칸에서 나오면 제자리 */
  document.addEventListener('focusin', function(e){ var el = e.target; if (!el || !/INPUT|TEXTAREA/.test(el.tagName)) return;
    setTimeout(function(){ fit(); try { el.scrollIntoView({ block: 'center' }); } catch(x){} window.scrollTo(0, 0); }, 320); });
  document.addEventListener('focusout', function(){ setTimeout(fit, 120); setTimeout(fit, 450); });
  fit();
})();
var db = null, gid = null, me = null, base = null;
var RECS = {}, NOTES = {}, PHOTOS = {}, CUR = null, photoRef = null;
var OS = (/[?&]os=(android|ios)/.exec(location.search) || [])[1] || (/iPhone|iPad|iPod/.test(navigator.userAgent) ? 'ios' : 'android');
$('osTag').textContent = OS === 'ios' ? ' 아이폰' : ' 안드로이드';
/* 스타 / 화물 구분 (star_return_core.js 의 CFG, 주소 ?db=cargo) */
document.title = CFG.db === 'cargo' ? '반품 검수 (화물·휴대폰)' : '반품 검수 (휴대폰)';
if (CFG.db === 'cargo') $('ttl').innerHTML = '↩ <b>반품 검수</b> · 화물';
$('pcLink').href = 'star_return.html' + (CFG.q ? '?' + CFG.q.slice(1) : '');
/* 화물: 택배사는 첫 화면에서 고름(휴대폰에 기억), 업체명은 송장을 찍은 다음 화면에서 고름 */
var VENDORS = {}, CUR_COURIER = '';
if (CFG.vendor){ try { CUR_COURIER = localStorage.getItem('retCourier_' + CFG.db) || ''; } catch(e){} }
function renderVendorChips(){ if (STEP === 'vendor' && !typing()) render(); }
function addVendor(name){ name = String(name || '').trim(); if (!name || !base) return; base.child('dict/vendor/' + vkey(name)).transaction(function(c){ c = c || {}; return { name: name, n: (c.n || 0) + 1, t: Date.now() }; }); }

var toastT = null;
function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ e.classList.remove('on'); }, 2400); }
function byName(){ return KIOSK ? (WORKER || '신규인원') + '(링크)' : (me && (me.email || '').split('@')[0]) || ''; }
function vib(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }

/* ── 이벗 도우미가 연결된 PC 가 있는지 — PC 반품입고관리가 30초마다 남기는 helperBeat 로 판단 (90초 넘게 없으면 없음) ── */
var BEAT = null, SKEW = 0;
function pcAlive(){ return !!(BEAT && BEAT.ok && Date.now() + SKEW - (BEAT.at || 0) < 90000); }
function showPcWarn(){ if (!typing()) render(); }   /* 첫 화면 맨 위 「이벗 도우미 PC 연결」 안내 */
function typing(){ var a = document.activeElement; return !!(a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')); }   /* 글자 넣는 중엔 다시 그리지 않음 */
setInterval(function(){ if (!typing()) render(); }, 15000);

/* ── 기록 쓰기: 바뀐 칸만 ── */
function upd(r, fields){
  Object.assign(r, fields); r.upd = Date.now(); RECS[r.rno] = r; markNotes(r);
  var u = Object.assign({}, fields, { upd: r.upd });
  return base.child('recs/' + r.rno).update(u);
}

/* ── 카메라 바코드 읽기 ── */
var scanner = null, scanMode = null, lastCode = '', lastAt = 0;
var FORMATS = typeof Html5QrcodeSupportedFormats !== 'undefined' ? [Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E, Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.CODABAR, Html5QrcodeSupportedFormats.QR_CODE] : [];
function openScan(mode){
  if (typeof Html5Qrcode === 'undefined'){ toast('바코드 읽기 프로그램을 못 불러왔습니다 — 인터넷 확인'); return; }
  scanMode = mode; lastCode = ''; lastAt = 0;
  $('scTitle').textContent = mode === 'rno' ? '반품 송장 찍기' : '상품 찍기 · 계속';
  $('scMsg').innerHTML = mode === 'rno' ? '송장 바코드를 네모 안에 맞춰 주세요' : '상품 바코드를 하나씩 비추면 자동으로 셉니다';
  renderScanBot();
  $('scanOv').classList.add('on');
  scanner = new Html5Qrcode('reader', { formatsToSupport: FORMATS, verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: OS === 'android' } });
  var box = Math.min(window.innerWidth - 40, 340);
  scanner.start({ facingMode: 'environment' }, { fps: 12, qrbox: { width: box, height: Math.round(box * 0.45) }, disableFlip: true }, onCode, function(){})
    .catch(function(e){ closeScan(); toast('카메라를 못 열었습니다 — ' + (OS === 'ios' ? '설정 > Safari > 카메라 「허용」' : '주소창 왼쪽 자물쇠 > 카메라 「허용」') + ' 후 다시'); console.error(e); });
}
/* 상품 찍기: 지금 찍는 것을 정상/불량 중 무엇으로 셀지 크게 고름 */
function renderScanBot(){
  $('scBot').innerHTML = scanMode === 'item'
    ? '<div class="mode"><button class="g' + (SCANQ !== '2' ? ' on' : '') + '" onclick="setScanQ(\'1\')">정상으로 찍기</button><button class="b' + (SCANQ === '2' ? ' on' : '') + '" onclick="setScanQ(\'2\')">불량으로 찍기</button></div>'
      + '<button class="btn y" style="min-height:76px;font-size:21px" onclick="closeScan()">다 찍었어요</button>'
    : (CUR ? '' : '<div class="man on" style="margin:0"><input id="rnoIn2" inputmode="numeric" placeholder="송장번호 직접 입력" autocomplete="off"><button class="btn y" onclick="$(\'rnoIn\').value=$(\'rnoIn2\').value;closeScan();manualRno()">확인</button></div>');
}
function setScanQ(q){ SCANQ = q; vib(20); renderScanBot(); }
function closeScan(){
  $('scanOv').classList.remove('on');
  if (scanner){ var s = scanner; scanner = null; s.stop().then(function(){ s.clear(); }).catch(function(){}); }
}
function onCode(text){
  var code = String(text || '').trim(), now = Date.now();
  if (!code || (code === lastCode && now - lastAt < 1800)) return;   /* 같은 바코드를 계속 비추고 있을 때 중복 방지 */
  lastCode = code; lastAt = now;
  if (scanMode === 'rno'){
    var no = digits(code);
    if (!okNo(no)){ beep(false); flash(false); $('scMsg').textContent = '송장 바코드가 아닙니다: ' + code; return; }
    closeScan(); startRno(no);
  } else {
    var r = RECS[CUR]; if (!r || locked(r)) return;
    var pre = !(r.items || []).length && CFG.db === 'cargo';   /* 화물: 원송장 전 스캔은 그냥 쌓음 */
    var a = applyItem(r, code, SCANQ), qw = SCANQ === '2' ? ' <b style="color:var(--red2)">불량</b>' : '';
    upd(r, { items: r.items || [], extras: r.extras || [] });
    if (pre){ var xx = (r.extras || []).filter(function(e){ return e.code === a.code; })[0]; beep(true); vib(40); flash(true);
      $('scMsg').innerHTML = '<span class="nm mono">' + esc(a.code) + '</span><span class="n">' + (xx ? xx.n : 1) + '</span>개째' + qw; render(a.code); return; }
    beep(!!a.hit && !a.over); vib(a.hit && !a.over ? 40 : [80, 60, 80]); flash(!!a.hit && !a.over);
    $('scMsg').innerHTML = a.hit ? '<span class="nm">' + esc(a.hit.name) + '</span><span class="n">' + a.hit.got + ' / ' + a.hit.qty + '</span>' + qw + (a.over ? ' <b style="color:var(--red2)">주문보다 많아요</b>' : a.hit.got === a.hit.qty ? ' <b style="color:var(--grn)">다 왔어요</b>' : '')
      : '<span class="nm" style="color:var(--red2)">이 주문에 없는 상품</span><span class="sc-last">' + esc(a.code) + '</span> — 특이사항으로 기록';
    if (a.note) $('scMsg').innerHTML += '<br><b style="color:var(--yel)">📌 사전 특이사항 상품: ' + esc(a.note.memo || a.note.val) + '</b>';
    render(a.code);
  }
}

/* ── ① 반품 송장 ── */
function manualRno(){ var no = digits($('rnoIn').value); $('rnoIn').value = ''; if (!okNo(no)){ toast('송장번호(숫자)를 넣어 주세요'); return; } startRno(no); }
function startRno(no){
  var r = RECS[no];
  if (r){ openRec(no); beep(true); toast(locked(r) ? '이미 반영된 송장입니다 — 내용만 봅니다' : '이미 스캔한 송장입니다 — 이어서 검수'); return; }
  var courier = isEpost(no) ? '우체국' : CUR_COURIER;   /* 업체명은 다음 화면(② 업체)에서 */
  if (CFG.vendor && !courier){ beep(false); flash(false); vib([80, 60, 80]); toast('우체국 송장이 아닙니다 — 택배사를 먼저 고르세요'); return; }
  /* 휴대폰은 최근 3일만 받아 두므로, 더 오래된 같은 송장 기록이 있는지 서버에서 한 번 더 확인 (덮어쓰기 방지) */
  base.child('recs/' + no).once('value').then(function(sn){
    if (sn.exists()){ RECS[no] = sn.val(); openRec(no); toast('예전에 스캔한 송장입니다 — 이어서 봅니다'); return; }
    r = { rno: no, at: Date.now(), by: byName(), state: 'scan', trace: needTrace(no) ? 'busy' : 'skip', items: [], extras: [], dev: 'm-' + OS };
    if (CFG.vendor) r.courier = courier;
    RECS[no] = r;
    return base.child('recs/' + no).set(r).then(function(){ openRec(no); beep(true); vib(40);
      if (r.trace === 'busy'){ trace(no); if (!pcAlive()) toast('⚠️ 이벗 도우미가 연결된 PC 가 없습니다 — 상품 목록은 PC 에서 도우미를 연결하면 채워집니다'); }
      else if (!CFG.vendor) toast('원송장 추적 없이 등록 — 상품 스캔·사진을 남기고, 원송장은 PC 에서 찾아 넣습니다'); });   /* 화물은 바로 업체 고르기 화면 */
  });
}
function trace(no){
  var fn = firebase.app().functions('asia-northeast3').httpsCallable('epostReturnOrigin', { timeout: 60000 });
  fn({ nos: [no] }).then(function(res){
    var x = ((res.data && res.data.rows) || [])[0] || {}, r = RECS[no];
    if (x.err) upd(r, { trace: 'err', traceErr: x.err });
    else if (x.orig) upd(r, { trace: 'ok', orig: x.orig, origDate: x.origDate || null, self: false, look: 'wait' });
    else upd(r, { trace: 'ok', orig: no, origDate: null, self: true, look: 'wait' });   /* 반품원등기번호 없음 = 반송 */
    render();
  }).catch(function(e){ upd(RECS[no], { trace: 'err', traceErr: String((e && (e.message || e.code)) || e) }); render(); beep(false); });
}

/* ── 화면 (대표님 2026-10-24): 한 화면씩, 스크롤 없음 (목록만 스크롤) · 단계마다 번호 붙은 상자(.yb, 유리판 테마)
   화물: 1 반송장 → 2 업체 → 3 상품(스캔·촬영·직접 입력) → 4 사진 → 5 원송장·사유·메모 → 완료
   스타: 1 반송장 → 2 상품(한 상품씩) → 3 사진·메모 → 완료
   위 단계 이름을 누르면 그 단계로 바로. 목록에서 「수정」으로 들어오면(EDIT) 아래가 〈이전 · 수정 완료 · 다음〉
   내 목록 = 이 휴대폰 작업자가 찍은 것 중 「확정」 안 한 것 — 확정하면 휴대폰 목록에서만 빠지고 PC 에는 그대로 (r.mok)
   FOCUS = 지금 크게 보이는 상품 줄(-1 = 덜 찍은 첫 상품으로 자동), SHOWALL = 상품 전체 목록으로 보기
   SCANQ = 카메라로 찍을 때 정상('1')/불량('2') 중 무엇으로 셀지 — 송장 바뀌면 정상으로 돌아감 */
var STEP = 'start', FOCUS = -1, SHOWALL = false, SCANQ = '1', KFAIL = false, EDIT = false;
var MEMO_TAGS = ['박스 파손', '구성품 누락', '사용 흔적', '내용물 파손', '오배송'];
var PHONE_COURIERS = [['우체국', '우체국'], ['한진', '한진'], ['롯데', '롯데'], ['CJ대한통운', 'CJ'], ['기타', '기타']];
function steps(){ return CFG.vendor ? [['start', '송장'], ['vendor', '업체'], ['items', '상품'], ['photo', '사진'], ['orig', '원송장']] : [['start', '송장'], ['items', '상품'], ['finish', '사진·메모']]; }
function stepNo(step){ return steps().map(function(x){ return x[0]; }).indexOf(step) + 1; }
function go(step){ STEP = step; SHOWALL = false; render(); }
function nextOf(step){ var s = steps().map(function(x){ return x[0]; }), i = s.indexOf(step); return s[i + 1]; }
function prevOf(step){ var s = steps().map(function(x){ return x[0]; }), i = s.indexOf(step); return s[i - 1]; }
function goBack(){ var p = prevOf(STEP); if (!p) closeCur(); else go(p); }
function openRec(no, edit){
  CUR = no; FOCUS = -1; SHOWALL = false; SCANQ = '1'; ADD = null; EDIT = !!edit;
  var r = RECS[no]; STEP = CFG.vendor && r && !r.vendor && !locked(r) ? 'vendor' : 'items';
  if (photoRef) photoRef.off();
  photoRef = base.child('photos/' + no); photoRef.on('value', function(s){ PHOTOS = s.val() || {}; if (!typing()) render(); });
  render();
}
function closeCur(){ CUR = null; STEP = 'start'; EDIT = false; ADD = null; if (photoRef){ photoRef.off(); photoRef = null; } PHOTOS = {}; render(); }
/* 수정 완료 — 바뀐 것은 누를 때마다 이미 저장됨, 지금 화면에 쓰다 만 원송장만 넣고 목록으로 */
function editDone(){
  var r = RECS[CUR];
  if (r && STEP === 'orig' && !applyOrig(r)) return;
  toast('수정했습니다 — ' + (r ? r.rno : '')); closeCur(); go('list');
}
/* 정상/불량 수량 ± (kind '1' 정상 · '2' 불량 — star_return_core.js addCnt) */
function addCntI(i, kind, d){ var r = RECS[CUR]; if (!r || locked(r)) return; var it = r.items[i]; if (it.got == null) it.got = 0; addCnt(it, kind, d); FOCUS = i; upd(r, { items: r.items }); vib(20); render(); }
function addCntX(i, kind, d){ var r = RECS[CUR]; if (!r || locked(r)) return; var x = r.extras[i]; addCnt(x, kind, d); if (!x.n) r.extras.splice(i, 1); upd(r, { extras: r.extras }); vib(20); render(); }
function delExtra(i){ var r = RECS[CUR]; if (!r || locked(r)) return; r.extras.splice(i, 1); upd(r, { extras: r.extras }); render(); }
function setMemo(v){ var r = RECS[CUR]; if (!r || locked(r)) return; upd(r, { memo: String(v || '').trim() }); }
function memoTags(m){ return String(m || '').split(/\s*,\s*/).filter(Boolean); }
function toggleTag(t){
  var r = RECS[CUR]; if (!r || locked(r)) return;
  var a = memoTags(r.memo), i = a.indexOf(t);
  if (i >= 0) a.splice(i, 1); else a.unshift(t);
  upd(r, { memo: a.join(', ') }); vib(20); render();
}
function focusTo(i){ FOCUS = i; SHOWALL = false; render(); }
function toggleList(){ SHOWALL = !SHOWALL; render(); }
/* 택배사: 첫 화면에선 다음 송장용(휴대폰에 기억), 송장 단계(기록 열림)에선 그 기록을 고침 */
function setCourier(c){
  var r = CUR && RECS[CUR];
  if (r){ if (locked(r)) return; if (isEpost(r.rno) && c !== '우체국'){ toast('우체국 송장(6077·7077)은 우체국으로 둡니다'); return; } upd(r, { courier: c }); }
  else { CUR_COURIER = c; try { localStorage.setItem('retCourier_' + CFG.db, c); } catch(e){} }
  vib(20); render();
}
/* ② 업체명 — 고르면 기록에 넣음(사전 특이사항이 있으면 빨간 상자), 다음은 「다음」으로 */
function pickVendor(n){ var r = RECS[CUR]; if (!r || locked(r)) return; n = String(n || '').trim(); if (!n) return;
  try { localStorage.setItem('retVendor_' + CFG.db, n); } catch(e){}

function ico(id, cls){ return '<svg class="' + (cls || 'ico') + '" aria-hidden="true"><use href="#i-' + id + '"/></svg>'; }
function sayOf(it){
  var got = it.got || 0;
  if (got > it.qty) return ['bad', '주문보다 ' + (got - it.qty) + '개 많아요'];
  if (got === it.qty) return ['ok', '다 왔어요'];
  if (!got) return ['', '아직 안 찍었어요'];
  return ['', (it.qty - got) + '개 더 있으면 찍어 주세요'];

function qBoxes(fn, i, o, lk){   /* 정상 / 불량 큰 칸 두 개 (스타 한 상품씩) */

  return '<div class="qt"><div class="qbox g"><div class="kn"><span class="k">정상</span><span class="n">' + goodOf(o) + '</span></div>' + pm('1') + '</div>'

function qMini(fn, i, o, lk){   /* 정상 / 불량 한 줄 (화물 목록 — 세로를 낮게) */

        + '<button class="btn" aria-label="다음 상품" ' + (FOCUS >= items.length - 1 || SHOWALL ? 'disabled' : '') + ' onclick="focusTo(' + (FOCUS + 1) + ')">' + ico('next') + '</button></div>';
    } else if (CFG.db === 'cargo'){
      /* 화물: 어떤 상품이 몇 개 들어왔는지만 — 바코드 스캔 / 촬영하고 입력 / 직접 입력 (원송장을 찾으면 PC 가 주문 상품과 맞춤) */
      var xs = r.extras || [], xn = xs.reduce(function(s, x){ return s + x.n; }, 0);
      if (ADD && !lk){
        h += '<div class="yb">' + yh('items', '상품 직접 입력', Object.keys(UPLOADING).length ? '사진 올리는 중…' : '')
          + '<input id="manName" class="win" oninput="if(ADD)ADD.name=this.value" value="' + esc(ADD.name) + '" placeholder="상품명" autocomplete="off">'
          + '<div class="addq"><button class="ib" aria-label="하나 빼기" onclick="addQty(-1)">−</button><b>' + ADD.n + '<small>개</small></b><button class="ib" aria-label="하나 더하기" onclick="addQty(1)">+</button></div>'
          + '<div class="seg two"><button class="ib' + (ADD.q !== '2' ? ' g' : '') + '" onclick="addQ(\'1\')">정상</button><button class="ib' + (ADD.q === '2' ? ' r' : '') + '" onclick="addQ(\'2\')">불량</button></div>'
          + '<div class="seg two"><button class="ib" onclick="addCancel()">취소</button><button class="ib on" onclick="addSave()">넣기</button></div></div>';
      } else {
        h += '<div class="lbl" style="margin:0">들어온 상품 ' + (xs.length ? xs.length + '종 ' + xn + '개' : '') + '</div><div class="scroll">'
          + (xs.length ? '' : '<div class="empty" style="min-height:100%">아직 없습니다<small>아래 버튼에서 스캔 · 촬영 · 직접 입력</small></div>')
          + xs.map(function(x, i){ return '<div class="xcard' + (lastCode && x.code === lastCode ? ' hot' : '') + '"><div class="xh"><span class="' + (x.code ? 'mono' : 'xn') + '">' + esc(xName(x)) + '</span><b>' + x.n + '개</b>'
            + (lk ? '' : '<button class="btn" onclick="delExtra(' + i + ')">지우기</button>') + '</div>' + qMini('addCntX', i, x, lk) + '</div>'; }).join('') + '</div>';
        if (!lk) h += '<div class="yb">' + yh('items', '무엇이 들어왔나요?')
          + '<div class="seg three"><button class="ib" onclick="openScan(\'item\')">' + ico('scan') + '스캔</button><button class="ib" onclick="addOpen(true)">' + ico('cam') + '촬영</button><button class="ib" onclick="addOpen(false)">' + ico('key') + '직접 입력</button></div></div>';
      }
    } else {
      h += '<div class="empty">' + (r.look === 'wait' || r.look === 'busy' ? '상품 목록을 기다리는 중…' : '상품 목록이 없습니다') + '<small>사진·메모는 다음 단계에서 먼저 해도 됩니다</small></div>';
    }
    if ((r.trace === 'err' || r.look === 'err' || r.look === 'none') && !lk) h += '<button class="btn" onclick="retry()">다시 조회</button>';
    f = navFoot('<button class="btn y" onclick="itemsNext()">다음' + ico('next') + '</button>');
  }

  else if (STEP === 'photo' || STEP === 'finish'){   /* 화물 ④ 사진만 / 스타 ③ 사진·메모 */
    var lk3 = locked(r), pk3 = Object.keys(PHOTOS).sort(function(a, b){ return (PHOTOS[a].at || 0) - (PHOTOS[b].at || 0); }), nu = Object.keys(UPLOADING).length;
    h += stepBar() + recHead(r);
    h += '<div class="yb">' + yh(STEP, '사진을 남겨둘까요?', pk3.length ? pk3.length + '장 찍음' : '안 남겨도 되면 「' + (STEP === 'photo' ? '건너뛰기' : '완료') + '」')
      + (lk3 ? '' : '<div class="seg two"><button class="ib big" onclick="$(\'camIn\').click()">' + ico('cam', 'sico') + '사진 찍기</button><button class="ib big" onclick="$(\'albumIn\').click()">' + ico('img', 'sico') + '앨범</button></div>') + '</div>';
    h += '<div class="scroll"><div class="photos sm">' + pk3.map(function(k){ var p = PHOTOS[k];
        return '<div class="ph"><img src="' + esc(p.url) + '" alt="" onclick="viewPhoto(\'' + esc(p.url) + '\')">' + (lk3 ? '' : '<button class="x" aria-label="사진 지우기" onclick="delPhoto(\'' + k + '\')">×</button>') + '</div>'; }).join('')
      + Object.keys(UPLOADING).map(function(){ return '<div class="ph"><div class="up">올리는 중</div></div>'; }).join('') + '</div></div>';
    if (STEP === 'finish'){   /* 스타: 메모도 여기 */
      var tagsF = memoTags(r.memo);
      h += '<div class="chips sm">' + MEMO_TAGS.map(function(t){ return '<button class="chip' + (tagsF.indexOf(t) >= 0 ? ' on' : '') + '" ' + (lk3 ? 'disabled' : '') + ' onclick="toggleTag(\'' + t + '\')">' + t + '</button>'; }).join('') + '</div>'
        + '<textarea ' + (lk3 ? 'disabled' : '') + ' placeholder="직접 쓰기" onchange="setMemo(this.value)">' + esc(r.memo || '') + '</textarea>';
      f = navFoot(r.state === 'scan' || !r.state ? '<button class="btn y" onclick="finish()">완료 · 다음 송장' + ico('arrow') + '</button>' : '<button class="btn" onclick="closeCur()">' + stOf(r).t + ' · 닫기</button>');
    } else f = navFoot('<button class="btn ' + (pk3.length ? 'y' : '') + '" onclick="go(\'orig\')">' + (pk3.length ? '다음' : '건너뛰기') + ico('next') + '</button>');
  }

  else if (STEP === 'orig'){   /* 화물 ⑤ 원송장(없으면 비워 두기) · 반품 사유 · 메모 → 완료 */
    var lk4 = locked(r), tags4 = memoTags(r.memo), dis = lk4 ? ' disabled' : '';
    h += stepBar() + recHead(r);
    h += '<div class="yb fill">' + yh('orig', '원송장 · 사유 · 메모', '원송장을 모르면 비워 두세요 — PC 에서 반영할 때 찾습니다')
      + '<input id="origIn" class="win mono" inputmode="numeric" value="' + esc(r.self ? '' : (r.orig || '')) + '" placeholder="원송장 번호 (없으면 비워 두기)" autocomplete="off"' + dis + '>'
      + '<div class="yl">반품 사유</div><div class="seg four">' + RECOS.map(function(x){ return '<button class="ib' + ((r.reco || '401') === x[0] ? ' on' : '') + '"' + dis + ' onclick="setReco(\'' + x[0] + '\')">' + x[1] + '</button>'; }).join('') + '</div>'
      + '<div class="yl">특이사항 · 메모</div><div class="tagw">' + MEMO_TAGS.map(function(t){ return '<button class="ib' + (tags4.indexOf(t) >= 0 ? ' on' : '') + '"' + dis + ' onclick="toggleTag(\'' + t + '\')">' + t + '</button>'; }).join('') + '</div>'
      + '<textarea class="win"' + dis + ' placeholder="메모 직접 쓰기" onchange="setMemo(this.value)">' + esc(r.memo || '') + '</textarea></div>';
    f = navFoot(r.state === 'scan' || !r.state ? '<button class="btn y" onclick="origDone()">' + (r.checked ? '다시 저장' : '완료') + ico('arrow') + '</button>' : '<button class="btn" onclick="closeCur()">' + stOf(r).t + ' · 닫기</button>');
  }

  pg.innerHTML = h; foot.innerHTML = f;
  if (STEP === 'list') renderRecent();
}
/* ③ → 다음: 화물은 상품이 하나는 있어야 */
function itemsNext(){
  var r = RECS[CUR]; if (!r) return;
  if (CFG.vendor && ADD){ toast('입력 중인 상품을 「넣기」 또는 「취소」 하세요'); return; }
  if (CFG.vendor && !(r.items || []).some(function(it){ return it.got > 0; }) && !(r.extras || []).length){ beep(false); flash(false); toast('들어온 상품을 하나 이상 넣어 주세요'); return; }
  go(nextOf('items'));
}
/* 내 목록 = 이 휴대폰 작업자가 찍은 것 중 확정 안 한 것 (최근 3일) */
var PEND = 0;
function myRows(){ var me2 = byName(); return Object.keys(RECS).map(function(k){ return RECS[k]; }).filter(function(r){ return r && !r.mok && (!r.by || r.by === me2); }).sort(function(a, b){ return b.at - a.at; }); }
function renderRecent(){
  var all = Object.keys(RECS).map(function(k){ return RECS[k]; }).filter(Boolean), today = dayOf(Date.now()), rows = myRows();
  PEND = rows.length;
  $('todayN').textContent = '오늘 ' + all.filter(function(r){ return dayOf(r.at) === today; }).length + '건';
  var box = $('recent'); if (!box) return;
  box.innerHTML = rows.length ? rows.map(function(r){ var st = stOf(r), g = 0, b = 0, kinds = (r.items || []).filter(function(it){ return it.got > 0; }).length + (r.extras || []).length, dl = doneLike(r);
    (r.items || []).forEach(function(it){ if (it.got > 0){ g += goodOf(it); b += badOf(it); } });
    (r.extras || []).forEach(function(x){ g += goodOf(x); b += badOf(x); });
    var stt = r.checked && r.state === 'scan' ? { k: 'ready', t: '목록 완료' } : st;
    return '<div class="rc"><div class="rt"><span class="t">' + hm(r.at) + ' · ' + esc((CFG.vendor && r.vendor) || rmanOf(r) || '-') + ' · ' + kinds + '종 정상 ' + g + (b ? ' · 불량 ' + b : '')
      + '<span class="mono">' + esc(r.rno) + (r.orig && !r.self ? ' → ' + esc(r.orig) : '') + '</span></span><span class="st s-' + stt.k + '">' + stt.t + '</span></div><div class="ra">'
      + (dl ? '<button class="ok" onclick="confirmRec(\'' + r.rno + '\')">확정</button><button onclick="openRec(\'' + r.rno + '\',true)">수정</button>'
            : '<button class="ok" onclick="openRec(\'' + r.rno + '\')">이어서</button>')
      + (locked(r) ? '' : '<button class="del" onclick="delRec(\'' + r.rno + '\')">삭제</button>') + '</div></div>'; }).join('')
    : '<div class="dim" style="padding:20px 0;text-align:center">내 목록이 비었습니다</div>';
}

/* ── 사진 ── */
var UPLOADING = {};
function shrink(file){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var M = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, M / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? res(b) : rej(new Error('사진 변환 실패')); }, 'image/jpeg', 0.8);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('사진을 못 읽었습니다')); };
    img.src = url;
  });
}
function uploadFiles(files){
  var r = RECS[CUR]; if (!r || !files || !files.length) return;
  [].forEach.call(files, function(f){
    var tmp = 'u' + Date.now() + Math.random().toString(36).slice(2, 6); UPLOADING[tmp] = 1; render();
    var path = CFG.path + '/' + gid + '/' + r.rno + '/' + Date.now() + '_' + Math.random().toString(36).slice(2, 6) + '.jpg';
    shrink(f).then(function(b){
      var ref = firebase.storage().ref(path);
      return ref.put(b, { contentType: 'image/jpeg' }).then(function(){ return ref.getDownloadURL(); });
    }).then(function(url){
      return base.child('photos/' + r.rno).push({ path: path, url: url, at: Date.now(), by: byName() });
    }).then(function(){ delete UPLOADING[tmp]; vib(30); render(); }, function(e){ delete UPLOADING[tmp]; render(); toast('사진 올리기 실패: ' + (e.code || e.message)); });
  });
}
$('camIn').addEventListener('change', function(){ uploadFiles(this.files); this.value = ''; });
$('albumIn').addEventListener('change', function(){ uploadFiles(this.files); this.value = ''; });
function delPhoto(k){
  var p = PHOTOS[k]; if (!p || !confirm('이 사진을 지울까요?')) return;
  base.child('photos/' + CUR + '/' + k).remove();
  if (p.path) firebase.storage().ref(p.path).delete().catch(function(){});
}
function viewPhoto(u){ $('viewImg').src = u; $('viewer').style.display = 'flex'; }

/* ── 시작 ── */
/* 신규인원용 링크(?key=열쇠): 구글 로그인 없이 이름 없는 임시 계정으로 접속 → 서버(retKioskJoin)가 열쇠 확인 → 이 반품 데이터만 열림
   작업자 이름은 휴대폰에 한 번 저장해 두고 기록의 「작업자」로 씀 */
var KIOSK = (/[?&]key=([A-Za-z0-9_-]{20,64})/.exec(location.search) || [])[1] || null, WORKER = '';
if (KIOSK){ try { WORKER = localStorage.getItem('retWorker') || ''; } catch(e){} }
function kioskFail(msg){
  $('who').textContent = '신규인원용 링크 · 접속 안 됨';
  KFAIL = true;
  $('foot').innerHTML = '';
  $('page').innerHTML = '<div class="banner red">⛔ ' + esc(msg) + '<small>관리자(PC 반품입고관리)에게 새 링크·QR을 받아 다시 열어 주세요.</small></div>';
}
function askWorker(){
  var n = prompt('작업자 이름을 넣어 주세요 (기록에 남습니다)', WORKER || '');
  if (n === null) return false;
  WORKER = String(n).trim().slice(0, 20);
  try { localStorage.setItem('retWorker', WORKER); } catch(e){}
  return !!WORKER;
}
function startData(){
  base = db.ref('wms_sync/groups/' + gid + '/' + CFG.path);
  if (CFG.vendor) base.child('dict/vendor').on('value', function(s){ VENDORS = s.val() || {}; renderVendorChips(); });
  base.child('recs').orderByChild('at').startAt(Date.now() - 3 * 864e5).on('value', function(s){
    RECS = s.val() || {};
    var a = document.activeElement;
    if (!(a && a.tagName === 'TEXTAREA')) render(); else renderRecent();
  });
  base.child('notes').on('value', function(s){ NOTES = s.val() || {}; if (CUR) render(); });
  db.ref('.info/serverTimeOffset').on('value', function(s){ SKEW = s.val() || 0; });
  base.child('helperBeat').on('value', function(s){ BEAT = s.val(); showPcWarn(); if (CUR && !typing()) render(); });
}
render();
WMSync.init('star_return', { requireAuth: !KIOSK });
if (KIOSK){
  var joined = false;
  firebase.auth().onAuthStateChanged(function(u){
    if (joined) return;
    if (!u){ firebase.auth().signInAnonymously().catch(function(e){ kioskFail(/admin-restricted|operation-not-allowed/.test(e.code || '') ? '로그인 없는 접속이 아직 켜지지 않았습니다 (관리자: Firebase 익명 로그인 사용 설정 필요)' : '접속 실패: ' + (e.code || e.message)); }); return; }
    if (!WORKER && !askWorker()){ kioskFail('작업자 이름이 있어야 시작할 수 있습니다 — 다시 열어 주세요'); return; }
    joined = true;
    firebase.app().functions('asia-northeast3').httpsCallable('retKioskJoin')({ key: KIOSK, name: WORKER }).then(function(res){
      var d = res.data || {};
      if (d.db !== CFG.db){ kioskFail('이 링크는 ' + (d.db === 'cargo' ? '화물' : '스타') + ' 반품용입니다 — 링크 주소를 확인하세요'); return; }
      me = u; gid = d.gid; db = firebase.database();
      var pcA = document.querySelector('.top a[href^="star_return.html"]'); if (pcA) pcA.style.display = 'none';   /* 링크 접속자는 PC 화면 못 씀 */
      $('who').innerHTML = '👤 ' + esc(WORKER) + ' · 신규인원용 링크' + (d.label ? ' 「' + esc(d.label) + '」' : '') + (d.exp ? ' · ~' + hm(d.exp) : '') + ' <a href="#" style="color:var(--muted)" onclick="if(askWorker())location.reload();return false">이름 바꾸기</a>';
      startData();
    }).catch(function(e){ joined = false; kioskFail(String(e.message || e.code || e)); });
  });
} else WMSync.onAuth(function(st){
  if (!st.user){ $('who').textContent = '로그인 필요'; return; }
  if (!st.groupId){ $('who').textContent = '작업 그룹 미등록 — 관리자에게 초대코드를 받으세요'; return; }
  me = st.user; gid = st.groupId; db = firebase.database();
  $('who').textContent = (me.email || '').split('@')[0] + ' · 그룹 ' + gid;
  startData();
});
</script>
