<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 디자인은 급여관리(payroll.html)와 같은 규칙 */
:root{
  --bg:#0b0d12; --s1:#141822; --s2:#1c2331; --s3:#232b3b; --br:#2a3040; --tx:#e6e9f0; --mu:#8b94a8;
  --g:#4ade80; --y:#fbbf24; --b:#60a5fa; --r:#f87171;
  --mo:'Space Mono',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--br);border-radius:7px;padding:.45rem .6rem;max-width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--b)}
textarea{width:100%;min-height:62px;resize:vertical}
a{color:var(--b)}
.hide{display:none!important}
.btn{border-radius:8px;padding:.55rem 1rem;font-weight:700;font-size:13px;background:var(--s3);color:var(--tx);border:1px solid var(--br);white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--mu)}
.btn.pri{background:var(--b);color:#0b0d12;border-color:var(--b)}
.btn.dan{background:transparent;color:var(--r);border-color:var(--r)}
.btn.sm{padding:.3rem .6rem;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.top{position:sticky;top:0;z-index:20;background:rgba(11,13,18,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--br)}
.top-in{max-width:1400px;margin:0 auto;padding:.7rem 1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.brand{font-weight:900;font-size:16px;display:flex;align-items:center;gap:.45rem}
.brand small{font-family:var(--mo);font-size:10px;color:var(--mu);font-weight:400;letter-spacing:.12em}
.top-r{margin-left:auto;display:flex;gap:.5rem;align-items:center;font-size:12px;color:var(--mu)}
.tabs{max-width:1400px;margin:0 auto;padding:0 1rem;display:flex;gap:.2rem;overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--mu);padding:.6rem .9rem;font-size:13.5px;font-weight:700;white-space:nowrap}
.tabs button.on{color:var(--tx);border-bottom-color:var(--b)}
.wrap{max-width:1400px;margin:0 auto;padding:1rem}
body.embed .brand, body.embed .top-r{display:none}
body.embed .top-in{padding:.5rem 1rem 0}
.card{background:var(--s1);border:1px solid var(--br);border-radius:12px;padding:1rem;margin-bottom:.8rem}
.card h2{font-size:13.5px;font-weight:700;margin-bottom:.7rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
.row .sp{flex:1}
label.f{display:block;margin-bottom:.7rem;font-size:12px;color:var(--mu)}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:.25rem;font-size:14px}
.tblwrap{overflow:auto;border:1px solid var(--br);border-radius:10px;background:var(--s1)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th{position:sticky;top:0;text-align:left;font-weight:700;font-size:11.5px;color:var(--mu);background:var(--s2);padding:.45rem .6rem;border-bottom:1px solid var(--br);white-space:nowrap}
td{padding:.45rem .6rem;border-bottom:1px solid var(--br);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;border:1px solid var(--br);color:var(--mu);margin-left:.25rem}
.tag.warn{color:var(--r);border-color:rgba(248,113,113,.4)}
.tag.on{color:var(--g);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.hint{font-size:12px;color:var(--mu);line-height:1.7}
.err{color:var(--r);font-size:13px}
.empty{color:var(--mu);text-align:center;padding:2.5rem 1rem;line-height:1.8}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-bottom:.8rem}
.sum div{background:var(--s1);border:1px solid var(--br);border-radius:12px;padding:.8rem 1rem}
.sum .k{display:block;font-size:11.5px;color:var(--mu)}
.sum .v{display:block;font-family:var(--mo);font-size:18px;font-weight:700;margin-top:.2rem}
.logoThumb{width:56px;height:56px;border:1px solid var(--br);border-radius:8px;object-fit:contain;background:#fff}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--br);border-radius:12px;padding:1.2rem;width:min(420px,calc(100vw - 32px));margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:15px;font-weight:700;margin-bottom:.8rem}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--br);padding:.6rem 1rem;border-radius:9px;font-size:13px;z-index:100;display:none;max-width:90vw}
#toast.bad{border-color:var(--r);color:var(--r)}

  /* 인쇄 안내문 */
  .poster { background:#fbf9f4; color:#1c1b18; border-radius:6px; padding:36px 24px; text-align:center; width:100%; max-width:380px; margin:0 auto; }
  .poster .pl { width:76px; height:76px; margin:0 auto 12px; border-radius:50%; border:1px solid #b89b5e; overflow:hidden; display:flex; align-items:center; justify-content:center; font-family:'Noto Serif KR',serif; font-size:30px; color:#8a6f35; background:#fff; }
  .poster .pl img { width:100%; height:100%; object-fit:contain; }
  .poster .pn { font-family:'Noto Serif KR',serif; font-weight:600; font-size:24px; letter-spacing:.04em; word-break:keep-all; }
  .poster .ps { font-size:13px; color:#6b675d; }
  .poster .pt { font-size:13px; color:#6b675d; margin:4px 0 20px; }
  .poster .pq { width:210px; height:210px; display:block; margin:0 auto; }
  .poster .pa { font-size:16px; font-weight:500; margin-top:20px; }
  .poster ol { list-style:none; font-size:13.5px; line-height:2; color:#55524a; margin-top:10px; }
  #printArea { display:none; }
  @media print {
    @page { size:A4; margin:18mm; }
    html, body { background:#fff; }
    body > *:not(#printArea) { display:none !important; }
    #printArea { display:block; }
    #printArea .poster { max-width:none; background:#fff; padding:30mm 0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #printArea .poster .pl { width:34mm; height:34mm; font-size:56px; }
    #printArea .poster .pn { font-size:38px; }
    #printArea .poster .ps, #printArea .poster .pt { font-size:18px; }
    #printArea .poster .pq { width:95mm; height:95mm; }
    #printArea .poster .pa { font-size:24px; margin-top:12mm; }
    #printArea .poster ol { font-size:20px; margin-top:6mm; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <div class="brand">🕒 QR 출퇴근기록기 <small>QR ATTENDANCE</small></div>
    <span id="coName" style="font-weight:700"></span><select id="companySel" class="hide" onchange="pick(this.value)" aria-label="고객사 선택"></select>
    <div class="top-r"><span id="who"></span><a class="btn sm" href="/index.html">홈</a></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="wrap" id="wrap">
  <div id="noCompany" class="card hide"></div>
  <div id="main" class="hide">
    <section id="tab-records" class="tab"></section>
    <section id="tab-qr" class="tab"></section>
    <section id="tab-workers" class="tab"></section>
    <section id="tab-mail" class="tab"></section>
    <section id="tab-companies" class="tab"></section>
  </div>
</div>
<div id="printArea"></div>
<div id="toast"></div>
<dialog id="dlg"></dialog>
<div id="qrGen" class="hide"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var FIREBASE_CONFIG = {
  apiKey:"AIzaSyAM2t9dvtStrXNam-YAiq19yD8FHwKpPmI",
  authDomain:"makewon.com",
  databaseURL:"https://makechango-wms-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"makechango-wms",
  storageBucket:"makechango-wms.firebasestorage.app",
  messagingSenderId:"333385336098",
  appId:"1:333385336098:web:94f07492421965ab32917b"
};
if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
var db = firebase.database();
var $ = function(id){ return document.getElementById(id); };
var KST = 9 * 3600e3, DAY = 24 * 3600e3;
/* 급여관리 탭 안에서 열렸을 때: 머리글을 줄이고 자동잠금 시간이 늘어나도록 활동을 알린다 */
if (new URLSearchParams(location.search).get('embed')) {
  document.body.classList.add('embed');
  if (window.parent !== window) ['pointerdown','keydown','scroll'].forEach(function(ev){
    window.addEventListener(ev, function(){ window.parent.postMessage('qra-activity', location.origin); }, { passive:true, capture:true });
  });
}
var S = { user:null, isSuper:false, companies:{}, cid:null, tab:'records', logs:[], workers:{}, from:'', to:'', q:'' };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function fn(name, data){ return firebase.app().functions('asia-northeast3').httpsCallable(name)(data).then(function(r){ return r.data; }); }
var toastT;
function toast(text, bad){ var t = $('toast'); t.textContent = text; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(function(){ t.style.display = 'none'; }, 3500); }
function fail(e){ toast((e && e.message) || '처리하지 못했습니다', true); }
function ekey(m){ return String(m || '').trim().toLowerCase().replace(/\./g, ','); }

/* 한국 시간 변환 */
function kstIso(ms){ return new Date(ms + KST).toISOString(); }
function dayStr(ms){ return kstIso(ms).slice(0, 10); }
function hm(ms){ return ms == null ? '' : kstIso(ms).slice(11, 16); }
function dtLocal(ms){ return ms == null ? '' : kstIso(ms).slice(0, 16); }
function parseLocal(v){ return v ? Date.parse(v + ':00+09:00') : null; }
function dayStart(d){ return Date.parse(d + 'T00:00:00+09:00'); }
function monthsBetween(fromMs, toMs){
  var out = [], m = kstIso(fromMs).slice(0, 7), end = kstIso(toMs - 1).slice(0, 7);
  while (m <= end) { out.push(m); var p = m.split('-').map(Number); m = kstIso(Date.UTC(p[0], p[1], 1) - KST).slice(0, 7); }
  return out;
}
function maskPhone(p){ p = String(p || ''); return p.length >= 10 ? p.slice(0, 3) + '-****-' + p.slice(-4) : p; }
function dur(min){ return min == null ? '' : Math.floor(min / 60) + '시간 ' + (min % 60) + '분'; }

/* ── 시작 ── */
firebase.auth().onAuthStateChanged(function(u){
  if (!u) return;   /* 로그인 이동은 wms_access.js 가 처리 */
  if (S.user) return;
  S.user = u;
  $('who').textContent = u.email || '';
  db.ref('superadmins/' + u.uid).get().then(function(s){
    S.isSuper = s.exists();
    return loadCompanies();
  }).catch(function(e){ showNone('권한을 확인하지 못했습니다: ' + (e.code || e.message)); });
});

function showNone(text){
  $('main').classList.add('hide');
  var b = $('noCompany'); b.textContent = text; b.classList.remove('hide');
  var again = document.createElement('button');
  again.type = 'button'; again.className = 'btn'; again.style.cssText = 'display:block;margin-top:.8rem'; again.textContent = '다른 구글 계정으로 로그인';
  again.onclick = function(){
    firebase.auth().signOut().then(function(){ location.replace('/wms_login.html?return=' + encodeURIComponent(location.pathname + location.search)); });
  };
  b.appendChild(again);
}

function loadCompanies(){
  var load = S.isSuper
    ? db.ref('qra/companies').get().then(function(s){ return s.val() || {}; })
    : db.ref('qra/admins/' + ekey(S.user.email)).get().then(function(s){
        var ids = Object.keys(s.val() || {});
        return Promise.all(ids.map(function(id){ return db.ref('qra/companies/' + id).get(); })).then(function(list){
          var o = {}; list.forEach(function(x, i){ if (x.exists()) o[ids[i]] = x.val(); }); return o;
        });
      });
  return load.then(function(cs){
    S.companies = cs;
    var ids = Object.keys(cs).sort(function(a, b){ return String(cs[a].name).localeCompare(String(cs[b].name), 'ko'); });
    var wanted = new URLSearchParams(location.search).get('c');
    if (!S.isSuper && (!ids.length || (wanted && !cs[wanted]))) { showNone('이 고객사의 담당자로 등록된 메일이 아닙니다 (' + (S.user.email || '') + '). 등록된 구글 메일로 로그인해 주세요.'); return; }
    if (wanted && cs[wanted] && !S.cid) S.cid = wanted;
    document.querySelector('.top-r .btn').classList.toggle('hide', !S.isSuper);
    $('noCompany').classList.add('hide'); $('main').classList.remove('hide');
    var sel = $('companySel');
    sel.innerHTML = ids.map(function(id){ return '<option value="' + esc(id) + '">' + esc(cs[id].name) + (cs[id].off ? ' (중지)' : '') + '</option>'; }).join('');
    sel.classList.toggle('hide', ids.length < 2);
    $('coName').textContent = (!S.isSuper && ids.length === 1) ? cs[ids[0]].name : '';
    if (!S.cid || !cs[S.cid]) S.cid = ids[0] || null;
    if (S.cid) sel.value = S.cid;
    if (!S.cid) S.tab = 'companies';
    renderTabs(); openTab(S.tab);
  });
}
function pick(cid){ S.cid = cid; openTab(S.tab); }

var TABS = [['records','기록'],['qr','QR·회사 정보'],['workers','직원'],['mail','자동 메일']];
function renderTabs(){
  var list = S.isSuper ? TABS.concat([['companies','고객사 관리']]) : TABS.slice(0, 1);
  if (!S.cid) list = list.filter(function(t){ return t[0] === 'companies'; });
  $('tabs').innerHTML = list.map(function(t){ return '<button type="button" data-t="' + t[0] + '" onclick="openTab(\'' + t[0] + '\')">' + t[1] + '</button>'; }).join('');
}
function openTab(t){
  S.tab = t;
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-t') === t); });
  document.querySelectorAll('.tab').forEach(function(s){ s.classList.toggle('hide', s.id !== 'tab-' + t); });
  ({ records:tabRecords, qr:tabQr, workers:tabWorkers, mail:tabMail, companies:tabCompanies })[t]();
}

/* ── 기록 ── */
function tabRecords(){
  if (!S.from) { var today = dayStr(Date.now()); S.from = today.slice(0, 8) + '01'; S.to = today; }
  $('tab-records').innerHTML =
    '<div class="row"><input type="date" id="rFrom" value="' + esc(S.from) + '" aria-label="시작일"> ~ <input type="date" id="rTo" value="' + esc(S.to) + '" aria-label="종료일">'
    + '<input id="rQ" placeholder="이름 검색" value="' + esc(S.q) + '" oninput="S.q=this.value;drawLogs()" aria-label="이름 검색">'
    + '<button type="button" class="btn" onclick="loadLogs()">조회</button><span class="sp"></span>'
    + (S.isSuper ? '<button type="button" class="btn" onclick="addLog()">수기 추가</button>' : '') + '<button type="button" class="btn pri" onclick="downloadExcel()">엑셀 다운로드</button></div>'
    + '<div id="rSum" class="sum"></div><div id="rList" class="tblwrap"></div>';
  loadLogs();
}
function rangeMs(){
  S.from = $('rFrom').value; S.to = $('rTo').value;
  if (!S.from || !S.to || S.from > S.to) { toast('기간을 다시 확인해 주세요', true); return null; }
  return { fromMs:dayStart(S.from), toMs:dayStart(S.to) + DAY };
}
function loadLogs(){
  var r = rangeMs(); if (!r) return;
  var cid = S.cid;
  $('rList').innerHTML = '<div class="empty">불러오는 중…</div>';
  Promise.all(monthsBetween(r.fromMs, r.toMs).map(function(m){
    return db.ref('qra/logs/' + cid + '/' + m).get().then(function(s){
      var v = s.val() || {}; return Object.keys(v).map(function(id){ return Object.assign({ id:id, month:m }, v[id]); });
    });
  })).then(function(parts){
    if (cid !== S.cid) return;
    S.logs = [].concat.apply([], parts).filter(function(l){ return l.in >= r.fromMs && l.in < r.toMs; }).sort(function(a, b){ return b.in - a.in; });
    drawLogs();
  }).catch(function(e){ $('rList').innerHTML = '<div class="err">불러오지 못했습니다: ' + esc(e.code || e.message) + '</div>'; });
}
/* 같은 날 한 폰으로 여러 사람이 찍힌 기록 */
function sharedPhones(logs){
  var seen = {}, flagged = {};
  logs.forEach(function(l){
    [l.inDev, l.outDev].forEach(function(d){
      if (!d) return;
      var k = dayStr(l.in) + '|' + d;
      seen[k] = seen[k] || {}; seen[k][l.wid] = 1;
      if (Object.keys(seen[k]).length > 1) flagged[k] = 1;
    });
  });
  return function(l){ return [l.inDev, l.outDev].some(function(d){ return d && flagged[dayStr(l.in) + '|' + d]; }); };
}
function statusOf(l){
  if (l.status === 'open') return Date.now() - l.in >= 18 * 3600e3 ? '<span class="tag warn">퇴근 미기록</span>' : '<span class="tag on">근무 중</span>';
  if (l.status === 'noout') return '<span class="tag warn">퇴근 미기록</span>';
  return '';
}
function drawLogs(){
  if (!$('rList')) return;
  var q = String(S.q || '').replace(/\s/g, '');
  var shared = sharedPhones(S.logs);
  var list = S.logs.filter(function(l){ return !q || String(l.name).indexOf(q) >= 0; });
  var people = {}, total = 0, noout = 0, flags = 0;
  list.forEach(function(l){
    people[l.wid] = 1;
    if (l.out != null) total += Math.round((l.out - l.in) / 60000);
    if (l.status === 'noout') noout++;
    if (shared(l)) flags++;
  });
  var stat = function(k, v){ return '<div><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; };
  $('rSum').innerHTML = stat('기록', list.length + '건') + stat('인원', Object.keys(people).length + '명') + stat('총 근무', dur(total)) + stat('퇴근 미기록', noout + '건')
    + (flags ? stat('한 폰 여러 이름', flags + '건') : '');
  if (!list.length) { $('rList').innerHTML = '<div class="empty">이 기간의 기록이 없습니다.</div>'; return; }
  $('rList').innerHTML = '<table><thead><tr><th>날짜</th><th>이름</th><th>휴대폰</th><th>출근</th><th>퇴근</th><th>근무시간</th><th>상태</th>' + (S.isSuper ? '<th></th>' : '') + '</tr></thead><tbody>'
    + list.map(function(l){
      return '<tr><td>' + dayStr(l.in) + '</td><td>' + esc(l.name) + '</td><td>' + esc(maskPhone(l.phone)) + '</td><td>' + hm(l.in) + '</td><td>' + hm(l.out) + '</td><td>'
        + (l.out != null ? dur(Math.round((l.out - l.in) / 60000)) : '') + '</td><td>' + statusOf(l)
        + (l.manual ? '<span class="tag">수기</span>' : '') + (l.edits ? '<span class="tag">수정됨</span>' : '') + (shared(l) ? '<span class="tag warn">한 폰 여러 이름</span>' : '')
        + '</td>' + (S.isSuper ? '<td><button type="button" class="btn sm" onclick="editLog(\'' + esc(l.id) + '\')">수정</button></td>' : '') + '</tr>';
    }).join('') + '</tbody></table>';
}
function dlg(html){ var d = $('dlg'); d.innerHTML = html; if (!d.open) d.showModal(); return d; }
function closeDlg(){ $('dlg').close(); }
function editLog(id){
  var l = S.logs.filter(function(x){ return x.id === id; })[0]; if (!l) return;
  var hist = Object.values(l.edits || {}).sort(function(a, b){ return b.at - a.at; }).map(function(e){
    return '<div class="hint">' + dayStr(e.at) + ' ' + hm(e.at) + ' ' + esc(e.by) + ': 이전 ' + hm(e.in) + ' ~ ' + hm(e.out) + '</div>';
  }).join('');

}

/* 긴 변 400px, 저장 크기 안에 들 때까지 품질을 낮춘다 */
function shrinkLogo(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(url);
      var r = Math.min(1, 400 / Math.max(img.width, img.height));
      var cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width * r)); cv.height = Math.max(1, Math.round(img.height * r));
      var g = cv.getContext('2d');
      g.drawImage(img, 0, 0, cv.width, cv.height);
      var out = cv.toDataURL('image/png');
      if (out.length < 200000) { res(out); return; }
      g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
      for (var q = 0.85; q > 0.3; q -= 0.15) { out = cv.toDataURL('image/jpeg', q); if (out.length < 200000) { res(out); return; } }
      rej(new Error('로고 파일이 너무 큽니다. 더 작은 이미지를 올려 주세요'));
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('이미지를 읽지 못했습니다')); };
    img.src = url;
  });
}
function uploadLogo(file){ if (!file) return; shrinkLogo(file).then(saveLogo).catch(fail); }

function parseMails(s){
  var valid = [], invalid = [];
  String(s || '').split(/[,;\n]/).map(function(x){ return x.trim(); }).filter(Boolean).forEach(function(x){
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x)) { invalid.push(x); return; }
    if (!valid.some(function(v){ return v.toLowerCase() === x.toLowerCase(); })) valid.push(x);
  });
  return { valid:valid, invalid:invalid };
}

function copyAdminUrl(){
  var u = S.adminPoster.url;
  if (navigator.clipboard) navigator.clipboard.writeText(u).then(function(){ toast('주소를 복사했습니다'); }, function(){ prompt('주소를 복사해 주세요', u); });
  else prompt('주소를 복사해 주세요', u);
}
function companyForm(id){
  var c = id ? S.companies[id] : {};
  dlg('<h2>' + (id ? '고객사 수정' : '고객사 등록') + '</h2>'
    + '<label class="f">회사명<input id="cName" maxlength="40" value="' + esc(c.name) + '"></label>'
    + '<label class="f">담당자 구글 메일 (여러 명은 쉼표로 구분)<textarea id="cMails">' + esc(Object.values(c.adminEmails || {}).join(', ')) + '</textarea></label>'
    + (id ? '<label class="row" style="margin-bottom:0"><input type="checkbox" id="cOff"' + (c.off ? ' checked' : '') + '> 사용 중지 (QR로 기록할 수 없고 메일도 나가지 않습니다)</label>' : '<p class="hint">로고와 현장명은 등록 후 QR·회사 정보 탭에서 넣습니다.</p>')
    + '<div id="cErr" class="err"></div>'
    + '<div class="row" style="margin:14px 0 0"><span class="sp"></span><button type="button" class="btn" onclick="closeDlg()">취소</button><button type="button" class="btn pri" onclick="saveCompany(' + (id ? '\'' + esc(id) + '\'' : '') + ')">저장</button></div>');
}
function randId(len){
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', a = crypto.getRandomValues(new Uint8Array(len)), s = '';
  for (var i = 0; i < len; i++) s += chars[a[i] % chars.length];
  return s;
}
function saveCompany(id){
  var name = $('cName').value.trim();
  var mails = parseMails($('cMails').value);
  if (!name) { $('cErr').textContent = '회사명을 입력해 주세요'; return; }
  if (mails.invalid.length) { $('cErr').textContent = '잘못된 주소: ' + mails.invalid.join(', '); return; }
  var emails = {}; mails.valid.forEach(function(m){ emails[ekey(m)] = m.trim().toLowerCase(); });
  var up = {};
  var cid = id || randId(20);
  if (id) {
    var old = S.companies[id].adminEmails || {};
    Object.keys(old).forEach(function(k){ if (!emails[k]) up['qra/admins/' + k + '/' + cid] = null; });
    up['qra/companies/' + cid + '/name'] = name;
    up['qra/companies/' + cid + '/adminEmails'] = emails;
    up['qra/companies/' + cid + '/off'] = $('cOff').checked ? true : null;
  } else {
    var key = randId(24);
    up['qra/companies/' + cid] = { name:name, qrKey:key, adminEmails:emails, mail:{ freq:'off' }, at:firebase.database.ServerValue.TIMESTAMP, by:S.user.email || '' };
    up['qra/keys/' + key] = cid;
  }
  Object.keys(emails).forEach(function(k){ up['qra/admins/' + k + '/' + cid] = true; });
  db.ref().update(up).then(function(){
    closeDlg(); toast('저장했습니다');
    S.cid = cid;
    if (!id) S.tab = 'qr';
    return loadCompanies();
  }).catch(fail);
}
</script>
