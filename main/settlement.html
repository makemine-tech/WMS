<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>정산관리 — 메이크창고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- 관문: 슈퍼관리자(3) 고정. SDK 를 먼저 실어야 게이트가 로그인 복원을 기다린다 -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="/wms_access.js" data-page="settlement" data-floor="3"></script>
<style>
:root{
  --bg:#0b0d12; --s1:#141822; --s2:#1c2331; --s3:#232b3b; --br:#2a3040; --tx:#e6e9f0; --mu:#8b94a8;
  --g:#4ade80; --y:#fbbf24; --b:#60a5fa; --r:#f87171;
  --mo:'Space Mono',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px}
a{color:var(--b)}
.hide{display:none!important}

/* ── 관문 화면 ── */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{width:100%;max-width:420px;background:var(--s1);border:1px solid var(--br);border-radius:16px;padding:28px 24px;text-align:center}
.gate-ic{font-size:40px;margin-bottom:10px}
.gate-t{font-size:19px;font-weight:900;margin-bottom:6px}
.gate-s{font-size:12.5px;color:var(--mu);line-height:1.75}

/* ── 앱 ── */
.top{position:sticky;top:0;z-index:20;background:rgba(11,13,18,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--br)}
.top-in{max-width:1100px;margin:0 auto;padding:.8rem 1rem;display:flex;align-items:center;gap:.8rem}
.top-t{font-size:17px;font-weight:900}
.top-e{font-family:var(--mo);font-size:11px;color:var(--mu);letter-spacing:.12em}
.top-sp{flex:1}
.top a{font-size:12.5px;color:var(--mu);text-decoration:none;border:1px solid var(--br);border-radius:7px;padding:.35rem .7rem}
.wrap{max-width:1100px;margin:0 auto;padding:1.4rem 1rem 3rem}
.empty{background:var(--s1);border:1px dashed var(--br);border-radius:14px;padding:2.4rem 1.2rem;text-align:center;color:var(--mu);line-height:1.9}
.empty b{color:var(--tx)}
.empty .ic{font-size:38px;margin-bottom:.6rem}
</style>
</head>
<body>

<!-- 권한 확인 전에는 내용을 보이지 않는다 (실제 차단은 wms_access.js) -->
<div id="gate" class="gate">
  <div class="gate-box">
    <div class="gate-ic">🔐</div>
    <div class="gate-t">정산관리</div>
    <div class="gate-s">슈퍼관리자 권한을 확인하는 중…</div>
  </div>
</div>

<div id="app" class="hide">
  <div class="top"><div class="top-in">
    <div>
      <div class="top-t">정산관리 🔒</div>
      <div class="top-e">3PL SETTLEMENT</div>
    </div>
    <div class="top-sp"></div>
    <a href="/index.html">홈으로</a>
  </div></div>

  <div class="wrap">
    <div class="empty">
      <div class="ic">🧾</div>
      <b>업체별 정산 메뉴는 정산을 진행하면서 하나씩 추가됩니다.</b><br>
      업체를 고르면 필요한 파일을 일문일답으로 올리고, 점검한 뒤 거래내역서 엑셀을 받는 방식입니다.
    </div>
  </div>
</div>

<script>
/* wms_access.js 가 슈퍼관리자로 확인해 주면 본문을 연다 */
(function(){
  var t0 = Date.now();
  (function wait(){
    var A = window.WMSAccess;
    if (A && A.ready && A.level >= 3) {
      document.getElementById('gate').classList.add('hide');
      document.getElementById('app').classList.remove('hide');
      return;
    }
    if (Date.now() - t0 < 30000) setTimeout(wait, 150);
  })();
})();
</script>
</body>
</html>
