<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 물류비서</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Do+Hyeon&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0d0f14; --surface:#151820; --surface2:#1b1f29; --border:#2a2f3d; --accent:#4af0a8; --accent2:#f0a84a;
          --text:#e8eaf0; --muted:#8b93a3; --red:#f05050; --yellow:#fbbf24; }
  body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:0 0 4rem; }
  .container { width:calc(100% - 2rem); max-width:1320px; margin:0 auto; padding:1.25rem 0 0; }
  .split { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:.9rem; align-items:start; }
  .office { position:sticky; top:.8rem; }
  .scene { position:relative; line-height:0; border-radius:10px; overflow:hidden; container-type:inline-size; }
  .scene canvas { width:100%; height:auto; display:block; image-rendering:pixelated; }
  .plate { position:absolute; line-height:1.25; background:#2e3138; color:#fff; font:400 clamp(8px,2cqw,14px) 'Do Hyeon','Noto Sans KR',sans-serif; padding:.1em .5em; white-space:nowrap; max-width:46%; overflow:hidden; text-overflow:ellipsis; }
  .plate b { font-weight:400; color:#c8d3d0; margin-left:5px; }
  .plate.alert { background:#b43a28; } .plate.alert b { color:#ffe1da; }
  .plate.work { background:#1f7a55; } .plate.work b { color:#d6efe2; }
  .plate.off { background:#474d5a; }
  .office-note { font-size:.74rem; color:var(--muted); margin-top:.55rem; line-height:1.5; }
  @media (max-width:900px) { .split { grid-template-columns:minmax(0,1fr); } .office { position:static; } }
  .header { display:flex; align-items:center; justify-content:space-between; gap:.75rem; margin-bottom:1rem; }
  h1 { font-size:1.35rem; font-weight:900; }
  h1 span { color:var(--accent); }
  .who { font-size:.74rem; color:var(--muted); text-align:right; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1rem; margin-bottom:.8rem; }
  .card-h { font-size:.88rem; font-weight:800; margin-bottom:.6rem; }
  .row { display:flex; justify-content:space-between; gap:.75rem; padding:.45rem 0; border-top:1px solid var(--border); font-size:.84rem; }
  .row:first-of-type { border-top:0; }
  .row .l { font-weight:700; white-space:nowrap; }
  .row .r { color:var(--muted); text-align:right; word-break:break-word; }
  .notes { border-color:var(--red); }
  .notes .card-h { color:var(--red); }
  .note { font-size:.84rem; padding:.3rem 0; line-height:1.5; }
  .state { font-size:1rem; font-weight:800; }
  .on { color:var(--accent); } .off { color:var(--red); } .warn { color:var(--yellow); }
  #startBtn { position:relative; overflow:hidden; display:block; width:100%; min-height:128px; margin:.8rem 0 .5rem; border-radius:16px; border:2px solid var(--accent);
              background:var(--surface2); color:var(--accent); font:inherit; font-size:1.3rem; font-weight:900; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; }
  #startBtn:disabled { border-color:var(--border); color:var(--muted); cursor:not-allowed; }
  #startBtn .fill { position:absolute; inset:0; width:0; background:rgba(74,240,168,.25); }
  #startBtn.hold .fill { width:100%; transition:width 1s linear; }
  #startBtn .tx { position:relative; }
  .hint { font-size:.78rem; color:var(--muted); text-align:center; min-height:1.2em; line-height:1.5; }
  .range { display:flex; align-items:center; justify-content:center; gap:.4rem; flex-wrap:wrap; margin-top:.6rem; font-size:.8rem; color:var(--muted); }
  .range input { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:.35rem .5rem; font:inherit; color-scheme:dark; }
  .tag { font-size:.68rem; font-weight:700; color:var(--accent2); margin-left:.3rem; }
  .btns { display:flex; gap:.5rem; flex-wrap:wrap; }
  .btn { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:.55rem .85rem; font:inherit; font-size:.8rem; font-weight:700; cursor:pointer; }
  .btn:hover { border-color:var(--muted); }
  #runBar { display:none; background:#10261d; border:1px solid var(--accent); color:var(--accent); border-radius:12px; padding:.8rem 1rem; margin-bottom:.8rem; font-size:.86rem; font-weight:700; line-height:1.6; }
  #runBar.bad { background:#2a1414; border-color:var(--red); color:var(--red); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><span>AI</span> 물류비서</h1>
    <div class="who" id="who">확인 중…</div>
  </div>
  <div id="runBar"></div>
  <div class="split">
  <div class="side">
  <div class="card notes" id="notesCard" style="display:none"><div class="card-h">특이사항</div><div id="notes"></div></div>
  <div class="card">
    <div class="state" id="pcState">상시 컴퓨터 확인 중…</div>
    <button id="startBtn" type="button" disabled><span class="fill"></span><span class="tx">시동</span></button>
    <div class="hint" id="startHint">길게 누르면 곡물도감 주문을 읽어 미리 봅니다. 저장하지 않습니다.</div>
    <label class="range">발주일 시작 <input type="date" id="fromDate"> <span id="toDate"></span></label>
  </div>
  <div class="card" id="previewCard" style="display:none"><div class="card-h">최근 미리 보기 <span class="tag">읽기 전용 · 저장 안 함</span></div><div id="preview"></div></div>
  <div class="card"><div class="card-h">사이트</div><div id="sites"></div></div>
  <div class="card"><div class="card-h">최근 기록</div><div id="jobs"><div class="row"><span class="r">기록 없음</span></div></div></div>
  <div class="card">
    <div class="card-h">상시 컴퓨터</div>
    <div id="pcInfo"></div>
    <div class="btns" style="margin-top:.7rem">
      <button class="btn" type="button" id="pauseBtn">전체 멈춤</button>
      <button class="btn" type="button" id="releaseBtn">실행 PC 해제</button>
    </div>
  </div>
  </div>
  <div class="card office">
    <div class="card-h">메이크창고 사무실</div>
    <div class="scene" id="scene"><canvas id="officeCv" width="720" height="286" role="img" aria-label="비서들이 일하는 건물 단면. 왼쪽 화면과 같은 실제 상태를 그림으로 보여 줍니다"></canvas></div>
    <div class="office-note">왼쪽과 같은 실제 상태입니다. 꺼지면 커튼이 닫히고, 일하면 위쪽 띠가 흐르며, 문제가 있으면 방이 붉어집니다.</div>
  </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="wms_sync.js"></script>
<script src="/wms_access.js" data-page="secretary" data-floor="3"></script>
<script src="p9_fee.js"></script>
<script src="ez_split_calc.js"></script>
<script src="secretary_ez.js"></script>
<script src="secretary_core.js"></script>
<script src="secretary_runner.js"></script>
<script src="secretary_office.js"></script>
<script>
/* ============================================================
   AI 물류비서 (메인 메뉴 이름, 설계서의 전담비서) — 시동 페이지 겸 헤드비서 (2026-11-01)
     secretary.html       폰·PC 어디서나: 시동·멈춤 명령을 보내고 결과를 봄
     secretary.html?run=1 상시 컴퓨터 전용 크롬(확장이 열어 둠): 명령을 받아 실행
   지금 시동 = 연결·로그인 점검 + 곡물도감 미리 보기(읽기 전용). 합포 저장·송장 부여 없음
   데이터: secretary/ runner · sites/{site} · jobs/{jobKey} · control · settings · commands/{id} · notes/{id}
============================================================ */
var C = window.SECRETARY_CORE;
var $ = function(id){ return document.getElementById(id); };
var IS_RUN = new URLSearchParams(location.search).get('run') === '1';
var db = null, root = null, me = null, offset = 0;
var OFFICE = window.SECRETARY_OFFICE.mount($('scene'));
var RUNNER = null, CONTROL = null, JOBS = {}, SITES_V = {}, NOTES = {}, SETTINGS = {}, GID = null;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function now(){ return Date.now() + offset; }
function ago(ts){
  if (!ts) return '기록 없음';
  var m = Math.floor((now() - ts) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  if (m < 1440) return Math.floor(m / 60) + '시간 전';
  return Math.floor(m / 1440) + '일 전';
}
function runningJob(){ return Object.keys(JOBS).map(function(k){ return JOBS[k]; }).find(function(j){ return j && j.state === 'running'; }); }

/* ── 화면 ── */
var SITE_TEXT = { ok: ['🟢', 'on'], login: ['🔑', 'warn'], error: ['🔴', 'off'] };
var JOB_TEXT = { running: '진행 중', done: '완료', stopped: '멈춤', interrupted: '중단' };
function paint(){
  var state = C.runnerState(RUNNER, now());
  var pc = $('pcState');
  pc.textContent = state === 'on' ? '🟢 상시 컴퓨터 켜짐' : (RUNNER ? '🔴 상시 컴퓨터가 꺼져 있습니다' : '🔴 등록된 상시 컴퓨터 없음');
  pc.className = 'state ' + (state === 'on' ? 'on' : 'off');

  var block = C.startBlock({ runner: RUNNER, control: CONTROL, job: runningJob(), now: now() });
  if (!pending) {
    $('startBtn').disabled = !!block;
    $('startHint').textContent = block || '길게 누르면 곡물도감 주문을 읽어 미리 봅니다. 저장하지 않습니다.';
  }
  paintRange();
  paintPreview();
  $('pauseBtn').textContent = CONTROL && CONTROL.pause ? '멈춤 풀기' : '전체 멈춤';

  $('sites').innerHTML = C.SITES.map(function(s){
    var v = SITES_V[s.id];
    var t = v ? SITE_TEXT[v.state] || ['⚪', ''] : ['⚪', ''];
    return '<div class="row"><span class="l">' + t[0] + ' ' + esc(s.name) + '</span><span class="r">' + esc(v ? v.msg + ' · ' + ago(v.checkedAt) : '아직 점검 안 함') + '</span></div>';
  }).join('');

  var keys = Object.keys(JOBS).sort(function(a, b){ return (JOBS[b].at || 0) - (JOBS[a].at || 0); }).slice(0, 10);
  $('jobs').innerHTML = keys.length ? keys.map(function(k){
    var j = JOBS[k];
    return '<div class="row"><span class="l">' + esc(JOB_TEXT[j.state] || j.state) + ' · ' + esc(ago(j.at)) + '</span><span class="r">' + esc(j.notes || (C.RECIPES[j.recipe] || {}).name || '') + '</span></div>';
  }).join('') : '<div class="row"><span class="r">기록 없음</span></div>';

  $('pcInfo').innerHTML = [
    ['마지막 신호', RUNNER ? ago(RUNNER.ts) : '없음'],
    ['확장 프로그램', RUNNER && RUNNER.ext ? RUNNER.ext : '확인 안 됨'],
    ['헤드비서 판', RUNNER && RUNNER.ver ? RUNNER.ver : '확인 안 됨'],
    ['크롬', RUNNER && RUNNER.ua ? RUNNER.ua : '확인 안 됨']
  ].map(function(r){ return '<div class="row"><span class="l">' + esc(r[0]) + '</span><span class="r">' + esc(r[1]) + '</span></div>'; }).join('');

  var notes = [];
  if (CONTROL && CONTROL.pause) notes.push('전체 멈춤 상태입니다. 풀어야 시동을 걸 수 있습니다.');
  C.SITES.forEach(function(s){ var v = SITES_V[s.id]; if (v && v.state !== 'ok') notes.push(s.name + ': ' + v.msg); });
  Object.keys(NOTES).sort().reverse().slice(0, 5).forEach(function(k){
    if (now() - (NOTES[k].at || 0) < 24 * 60 * 60 * 1000) notes.push(NOTES[k].msg + ' (' + ago(NOTES[k].at) + ')');
  });
  $('notesCard').style.display = notes.length ? '' : 'none';
  $('notes').innerHTML = notes.map(function(n){ return '<div class="note">' + esc(n) + '</div>'; }).join('');
  OFFICE.update(C.officeRooms({ runner: RUNNER, control: CONTROL, sites: SITES_V, jobs: JOBS, noteCount: notes.length, now: now() }));
}

/* 발주일 기간: 어느 폰·PC 에서 눌러도 같도록 secretary/settings 에 둠 */
function paintRange(){
  var r = C.dateRange(SETTINGS.ezFrom, now()), el = $('fromDate');
  if (document.activeElement !== el) el.value = r.from;
  el.max = r.to;
  $('toDate').textContent = '~ ' + r.to + ' (오늘)';
}
function paintPreview(){
  var key = Object.keys(JOBS).filter(function(k){ return JOBS[k] && JOBS[k].preview; }).sort(function(a, b){ return (JOBS[b].at || 0) - (JOBS[a].at || 0); })[0];
  $('previewCard').style.display = key ? '' : 'none';
  if (!key) return;
  var j = JOBS[key], p = j.preview, f = p.flags || {};
  var rows = [
    ['기간', (j.from || '') + ' ~ ' + (j.to || '') + ' · ' + ago(j.at)],
    ['주문', p.orders + '건 (' + p.rows + '줄)'],
    ['나눌 묶음', p.splitPacks + '건'],
    ['송장', p.invoices + '장 (단포 ' + p.single + ' · 합포 ' + p.multi + ')']
  ];
  (p.sizes || []).forEach(function(s){ rows.push([s.size + '박스', (s.single + s.multi) + '장 (단포 ' + s.single + ' · 합포 ' + s.multi + ')']); });
  if (f.divided) rows.push(['이미 나뉜 주문', f.divided + '건 (그대로 둠)']);
  if (f.option) rows.push(['옵션 있는 주문', f.option + '건 (그대로 둠)']);
  (p.blockers || []).forEach(function(b){ rows.push(['⚠️ 멈출 이유', b]); });
  (p.newComps || []).forEach(function(c){ rows.push(['처음 보는 구성 ' + c.orders + '건', c.comp]); });
  $('preview').innerHTML = rows.map(function(r){ return '<div class="row"><span class="l">' + esc(r[0]) + '</span><span class="r">' + esc(r[1]) + '</span></div>'; }).join('');
}

/* ── 명령 보내기 ── */
var pending = false;
function send(type){
  var ref = root.child('commands').push(), from = C.dateRange($('fromDate').value, now()).from;
  return root.child('settings/ezFrom').set(from).then(function(){
    return ref.set({ type: type, from: from, by: (me && me.email) || '', at: firebase.database.ServerValue.TIMESTAMP });
  }).then(function(){ return ref; });
}
var COMMAND_TEXT = { taken: '시동 걸림', started: '연결·로그인 점검 중…', reading: '곡물도감 주문 읽는 중… (보통 5초 안팎)', expired: '명령이 만료됐습니다. 다시 시동해 주세요.', interrupted: '헤드비서 탭이 다시 켜져 작업이 중단됐습니다. 다시 시동해 주세요.' };
var COMMAND_GIVE_UP = 16 * 60 * 1000;   /* 명령 만료 10분 + 점검·주문 읽기 최대 약 6분. 이때까지 끝 소식이 없으면 버튼을 풀어 줌 */
function startPressed(){
  pending = true;
  $('startBtn').disabled = true;
  $('startHint').textContent = '시동 거는 중…';
  send('start').then(function(ref){
    var answered = false;
    var timer = setTimeout(function(){
      if (answered) return;
      $('startHint').textContent = '응답 없음. 10분 뒤 만료되며, 나중에 저절로 실행되지 않습니다.';
    }, 60000);
    var giveUp = setTimeout(function(){ finish('결과를 받지 못했습니다. 상시 컴퓨터를 확인하세요.'); }, COMMAND_GIVE_UP);
    var finish = function(text){
      clearTimeout(timer);
      clearTimeout(giveUp);
      ref.off('value', on);
      $('startHint').textContent = text;
      setTimeout(function(){ pending = false; paint(); }, 5000);
    };
    var on = ref.on('value', function(s){
      var c = s.val();
      if (!c || !c.status) return;
      answered = true;
      if (c.status === 'done') return finish('끝났습니다. 아래 미리 보기를 확인하세요.');
      if (c.status === 'refused') return finish('시동 거절: ' + (c.why || ''));
      if (c.status === 'expired' || c.status === 'interrupted') return finish(COMMAND_TEXT[c.status]);
      $('startHint').textContent = COMMAND_TEXT[c.status] || c.status;
    });
  }).catch(function(e){
    pending = false;
    $('startBtn').disabled = false;
    $('startHint').textContent = '보내지 못했습니다: ' + e.message;
  });
}
/* 주머니 속 오작동을 막으려고 1초 길게 눌러야 시동 */
(function(){
  var btn = $('startBtn'), t = null;
  function down(e){
    if (btn.disabled || t) return;
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    btn.classList.add('hold');
    t = setTimeout(function(){ t = null; btn.classList.remove('hold'); startPressed(); }, 1000);
  }
  function up(){ if (t){ clearTimeout(t); t = null; } btn.classList.remove('hold'); }
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('keydown', down);
  ['pointerup', 'pointerleave', 'pointercancel', 'keyup', 'blur'].forEach(function(n){ btn.addEventListener(n, up); });
  btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();
/* 멈춤은 상시 컴퓨터가 꺼져 있어도 걸리도록 직접 쓴다. 헤드비서는 시동 때 이 값을 읽음 */
$('pauseBtn').addEventListener('click', function(){
  root.child('control').set({ pause: !(CONTROL && CONTROL.pause), by: (me && me.email) || '', at: firebase.database.ServerValue.TIMESTAMP })
    .catch(function(e){ $('startHint').textContent = '멈춤을 바꾸지 못했습니다: ' + e.message; });
});
$('releaseBtn').addEventListener('click', function(){
  if (!confirm('실행 PC 등록을 해제할까요?\n다른 컴퓨터로 옮길 때만 해제하세요. 지금 PC 의 헤드비서는 멈추고, 그 뒤 새로 켜지는 헤드비서가 새 실행 PC 가 됩니다.')) return;
  root.child('runner').remove();
});

/* ── 헤드비서 (?run=1) ── */
function runBar(text, bad){ var b = $('runBar'); b.style.display = 'block'; b.className = bad ? 'bad' : ''; b.textContent = text; }
function runnerInfo(){ return { ext: document.documentElement.dataset.mkwExt || '', ver: C.PAGE_VER, ua: 'Chrome ' + ((navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1] || '') }; }
function runnerId(){
  var k = 'mkwSecretaryRunnerId', v = localStorage.getItem(k);
  if (!v) { v = crypto.randomUUID(); localStorage.setItem(k, v); }
  return v;
}

/* 사이트 탭을 열고 도우미(확장이 넣음)의 인사를 기다린 뒤 ping. 이 경로로는 ping·read 만 나간다 */
var HELPER_WAIT = 60000, SEARCH_WAIT = 100000, H = {};
window.addEventListener('message', function(e){
  var m = e.data;
  if (!m || !m.from) return;
  var site = C.SITES.find(function(s){ return s.from === m.from && s.origin.test(e.origin); });
  if (!site) return;
  var h = H[site.id] || (H[site.id] = { pend: {}, seq: 0 });
  if (m.cmd === 'ready') {
    h.win = e.source; h.origin = e.origin;
    if (h.onReady) { h.onReady(); h.onReady = null; }
    /* 로그인 화면 등으로 페이지가 넘어가면 앞 요청이 사라지므로 새 도우미에 다시 보냄 */
    Object.keys(h.pend).forEach(function(id){ h.win.postMessage({ to: site.to, id: Number(id), cmd: h.pend[id].cmd, args: h.pend[id].args }, h.origin); });
    return;
  }
  var p = h.pend[m.id];
  if (!p) return;
  delete h.pend[m.id];
  clearTimeout(p.t);
  if (m.ok) p.ok(m.data); else p.no(new Error(m.err === 'LOGIN' ? '로그인이 필요합니다' : m.err));
});
function ask(site, cmd, args, wait){
  C.assertSafeCmd(cmd);
  var h = H[site.id];
  if (!h || !h.win) return Promise.reject(new Error('도우미가 연결되지 않았습니다'));
  return new Promise(function(ok, no){
    var id = ++h.seq;
    h.pend[id] = { cmd: cmd, args: args || {}, ok: ok, no: no, t: setTimeout(function(){ delete h.pend[id]; no(new Error('도우미 응답 없음')); }, wait || HELPER_WAIT) };
    h.win.postMessage({ to: site.to, id: id, cmd: cmd, args: args || {} }, h.origin);
  });
}
/* 곡물도감 검색 → 기존대로 계산. 피킹이지 박스 기록은 읽기만 함 */
function ezPreview(range){
  var site = C.SITES.find(function(s){ return s.id === 'ezadmin'; });
  return Promise.all([
    window.SECRETARY_EZ.searchSettled(
      function(){ return ask(site, 'search', { supplier: C.RECIPES.ez_daily.supplier, from: range.from, to: range.to }, SEARCH_WAIT); },
      function(){ return ask(site, 'read'); },
      function(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
    ),
    db.ref('wms_sync/groups/' + GID + '/picking_ez/boxes').get().then(function(s){ return s.val() || {}; })
  ]).then(function(r){ return window.SECRETARY_EZ.preview(r[0], r[1], window.EZ_SPLIT, window.P9_FEE); });
}
function openSite(site){
  var h = H[site.id] || (H[site.id] = { pend: {}, seq: 0 });
  h.win = null;
  return new Promise(function(ok, no){
    var t = setTimeout(function(){ h.onReady = null; no(new Error('도우미가 켜지지 않습니다. 확장 프로그램을 확인하세요.')); }, HELPER_WAIT);
    h.onReady = function(){ clearTimeout(t); ok(); };
    if (!window.open(site.url, site.tab)) { clearTimeout(t); h.onReady = null; no(new Error('팝업이 막혔습니다. makewon.com 팝업을 허용하세요.')); }
  }).then(function(){ return pingSite(site, 2); });
}
/* 이지어드민 표(#grid1)는 도우미보다 늦게 생길 수 있어 화면이 안 보이면 5초 뒤 두 번 더 물어봄 */
function pingSite(site, retries){
  return ask(site, 'ping').then(function(r){
    if (site.id !== 'ezadmin' || r.page || !retries) return r;
    return new Promise(function(ok){ setTimeout(ok, 5000); }).then(function(){ return pingSite(site, retries - 1); });
  });
}

function makeStore(){
  return {
    claimRunner: function(id, info){
      return root.child('runner').transaction(function(cur){
        if (cur && cur.id && cur.id !== id) return;
        return Object.assign({}, info, { id: id, ts: now() });
      }).then(function(r){ return r.committed; });
    },
    /* 신호: 등록이 해제됐거나 다른 PC 로 바뀌었으면 다시 차지하지 않음 */
    beatRunner: function(id, info){
      return root.child('runner').transaction(function(cur){
        if (cur === null) return null;   /* 서버 값을 아직 모름. 진짜 비어 있으면 아래에서 거절 */
        if (cur.id !== id) return;
        return Object.assign({}, info, { id: id, ts: now() });
      }).then(function(r){ var v = r.snapshot.val(); return !!r.committed && !!v && v.id === id; });
    },
    getRunner: function(){ return root.child('runner').get().then(function(s){ return s.val(); }); },
    claimCommand: function(id){
      return root.child('commands/' + id + '/status').transaction(function(cur){
        if (cur) return;
        return 'taken';
      }).then(function(r){ return r.committed; });
    },
    setCommand: function(id, p){ return root.child('commands/' + id).update(p); },
    getJobs: function(){ return root.child('jobs').get().then(function(s){ return s.val(); }); },
    setJob: function(k, p){ return root.child('jobs/' + k).update(p); },
    getControl: function(){ return root.child('control').get().then(function(s){ return s.val(); }); },
    setSite: function(id, p){ return root.child('sites/' + id).set(p); }
  };
}

/* 배포해도 이 탭은 옛 코드로 계속 돌기 때문에, 새 판이 올라오면 작업이 없을 때 새로고침 */
function reloadIfNewVersion(){
  fetch('secretary_core.js?cb=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(t){
    var m = t.match(/PAGE_VER = '([^']+)'/);
    if (m && m[1] !== C.PAGE_VER && !runningJob()) location.reload();
  }).catch(function(){});
}

function startRunner(){
  if (!navigator.locks) { runBar('이 브라우저에서는 헤드비서를 실행할 수 없습니다.', true); return; }
  navigator.locks.request('mkw_secretary_runner', { ifAvailable: true }, function(lock){
    if (!lock) { runBar('다른 탭에서 헤드비서가 이미 실행 중입니다. 이 탭은 닫아도 됩니다.', true); return; }
    return new Promise(function(){ runMain(); });   /* 탭이 닫힐 때까지 잠금 유지 */
  });
}
function runMain(){
  var id = runnerId();
  var runner = window.SECRETARY_RUNNER.createRunner({ store: makeStore(), openSite: openSite, ezPreview: ezPreview, now: now, runnerId: id, info: runnerInfo() });
  var stopped = false;
  function refuse(){
    stopped = true;
    runBar('등록된 실행 PC 가 아닙니다. 옮기려면 「실행 PC 해제」를 누른 뒤 이 탭을 새로고침하세요.', true);
  }
  runner.claim().then(function(ok){
    if (!ok) return refuse();
    runBar('헤드비서 실행 중입니다. 이 탭을 닫지 마세요.');
    setInterval(function(){
      if (stopped) return;
      makeStore().beatRunner(id, runnerInfo()).then(function(mine){
        if (!mine) return refuse();
        runBar('헤드비서 실행 중입니다. 이 탭을 닫지 마세요.');
        reloadIfNewVersion();
      }).catch(function(e){ runBar('신호를 보내지 못했습니다: ' + e.message, true); });
    }, 60000);
    root.child('commands').limitToLast(20).on('child_added', function(s){
      var c = s.val();
      if (stopped || !c || c.status) return;
      runner.handleCommand(s.key, c).catch(function(e){ makeStore().setCommand(s.key, { status: 'refused', why: e.message }); });
    });
  }).catch(function(e){ runBar('헤드비서를 시작하지 못했습니다: ' + e.message, true); });
}

/* ── 시작 ── */
WMSync.init('secretary', { requireAuth: true });
var started = false;
WMSync.onAuth(function(st){
  if (!st.user) { $('who').textContent = '로그인 필요'; return; }
  if (started) return;
  started = true;
  me = st.user;
  GID = st.groupId;
  $('who').textContent = (me.email || '').split('@')[0];
  db = firebase.database();
  root = db.ref('secretary');
  db.ref('.info/serverTimeOffset').on('value', function(s){ offset = s.val() || 0; paint(); });
  root.child('runner').on('value', function(s){ RUNNER = s.val(); paint(); });
  root.child('control').on('value', function(s){ CONTROL = s.val(); paint(); });
  root.child('settings').on('value', function(s){ SETTINGS = s.val() || {}; paint(); });
  root.child('sites').on('value', function(s){ SITES_V = s.val() || {}; paint(); });
  root.child('jobs').limitToLast(20).on('value', function(s){ JOBS = s.val() || {}; paint(); });
  root.child('notes').limitToLast(5).on('value', function(s){ NOTES = s.val() || {}; paint(); });
  setInterval(paint, 30000);
  if (IS_RUN) startRunner();
});
</script>
