<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 물류비서</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Do+Hyeon&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0d0f14; --surface:#151820; --surface2:#1b1f29; --border:#2a2f3d; --accent:#4af0a8; --accent2:#f0a84a;
          --text:#e8eaf0; --muted:#8b93a3; --red:#f05050; --yellow:#fbbf24; }
  body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:0 0 4rem; }
  .container { width:calc(100% - 2rem); max-width:1320px; margin:0 auto; padding:1.25rem 0 0; }
  .keys { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:.6rem; margin-top:.7rem; }
  /* 할 일 버튼은 가운데 정렬. 줄이 덜 차도 남은 버튼이 가운데에 옴 (대표님 2026-11-04) */
  #actions { grid-column:1 / -1; display:flex; flex-wrap:wrap; justify-content:center; gap:.6rem; }
  #actions:empty { display:none; }
  .scene { position:relative; line-height:0; border-radius:10px; overflow:hidden; container-type:inline-size; }
  .scene canvas { width:100%; height:auto; display:block; image-rendering:pixelated; }
  .plate { position:absolute; line-height:1.25; background:#2e3138; color:#fff; font:400 clamp(11px,2.7cqw,19px) 'Do Hyeon','Noto Sans KR',sans-serif; padding:.1em .5em; white-space:nowrap; max-width:47%; overflow:hidden; text-overflow:ellipsis; }
  .plate b { font-weight:400; color:#c8d3d0; margin-left:5px; }
  .plate.alert { background:#b43a28; } .plate.alert b { color:#ffe1da; }
  .plate.work { background:#1f7a55; } .plate.work b { color:#d6efe2; }
  .plate.off { background:#474d5a; color:#fff; }
  .header { display:flex; align-items:center; justify-content:space-between; gap:.75rem; margin-bottom:1rem; }
  h1 { font-size:1.35rem; font-weight:900; }
  h1 span { color:var(--accent); }
  .who { font-size:.84rem; color:var(--muted); text-align:right; }
  .hdr-r { display:flex; align-items:center; gap:.6rem; }
  .btn { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:.5rem .85rem; font:inherit; font-size:.95rem; font-weight:700; cursor:pointer; }
  /* 시작 버튼: 대표님이 주신 그림 그대로 (secretary_start.jpg, 2026-11-04). 글자는 그림 안에 있어 화면 읽기용으로만 둠. 좁아도 자르지 않고 그림 전체를 줄여 보여 줌(양옆 캐릭터가 잘리지 않게) */
  #startBtn { position:relative; overflow:hidden; display:block; width:100%; aspect-ratio:2000 / 244; padding:0; margin:0; border-radius:10px; border:0;
              background:#1b2232; color:#fff; font:400 2.4rem 'Do Hyeon','Noto Sans KR',sans-serif; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none;
              box-shadow:inset 0 -6px 0 rgba(0,0,0,.35), 0 0 0 2px #0d0f14, 0 4px 0 #26324a; grid-column:1 / -1; }
  #startBtn img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #startBtn:disabled { cursor:not-allowed; } #startBtn:disabled img { opacity:.45; }
  #startBtn:not(:disabled):hover img { filter:brightness(1.1); }
  #startBtn .fill { position:absolute; inset:0; width:0; background:rgba(74,240,168,.28); z-index:1; }
  #startBtn.hold .fill { width:100%; transition:width 1s linear; }
  #startBtn .tx { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .hint { font-size:.9rem; color:var(--muted); text-align:center; min-height:1.2em; line-height:1.5; }
  #actions .act { display:flex; flex-direction:column; gap:.35rem; align-items:center; justify-content:center; width:100%; min-height:128px; border-radius:16px; border:2px solid var(--red); background:#2a1414; color:#fff; font:inherit; font-size:1.7rem; font-weight:900; cursor:pointer; text-align:center; padding:.5rem; }
  #actions .act { flex:0 1 360px; }
  @media (max-width:640px){ #actions .act { flex-basis:100%; } }
  #actions .act:hover { background:#3a1818; }
  #actions .act small { font:500 .95rem/1.4 'Noto Sans KR',sans-serif; color:#ffc9c9; max-width:34em; }
  .flow-box { margin-top:1.3rem; }
  .flow-t { display:flex; align-items:center; gap:.5rem; font:400 1.5rem 'Do Hyeon','Noto Sans KR',sans-serif; margin-bottom:.6rem; }
  .flow-t svg { width:1.4em; height:1.4em; color:#c9d3e6; }
  /* 단계 머리띠와 칸 카드: 파랑 주문수집, 보라 주문확정, 초록 주문송장업로드 */
  .fgroup { --c:#3d6fa8; --cb:#1d3150; --ch:#2a4d78; }
  .fgroup.g1 { --c:#7a5bb5; --cb:#33284d; --ch:#4c3a73; }
  .fgroup.g2 { --c:#3fa36b; --cb:#1d4532; --ch:#2a6a48; }
  .fgroup-t { display:flex; align-items:center; justify-content:center; gap:.6rem; background:var(--ch); border:3px solid var(--c); border-radius:12px; padding:.45rem .8rem; margin-bottom:.6rem;
              font:400 1.3rem 'Do Hyeon','Noto Sans KR',sans-serif; color:#fff; box-shadow:inset 0 -4px 0 rgba(0,0,0,.25); }
  .fgroup-t svg { width:1.4em; height:1.4em; }
  /* 넓은 화면: 10칸이 한 줄로 폭을 꽉 채움. 3·4·3칸이라 단계 폭도 3:4:3 */
  .flow { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0, 1fr); gap:.5rem 1.4rem; }
  #flowMenso { display:grid; grid-template-columns:3fr 4fr 3fr; gap:.8rem 1.4rem; }
  .fgroup:not(:last-child) .node:last-child::after { content:'→'; position:absolute; right:-1.25rem; top:50%; transform:translateY(-50%); color:#8b93a3; font-size:1.1rem; font-weight:900; }
  @media (max-width:1000px){
    #flowMenso { grid-template-columns:minmax(0, 1fr); }
    .fgroup:not(:last-child) .node:last-child::after { content:none; }
  }
  @media (max-width:520px){
    .flow { gap:.5rem .9rem; }
    .flow.n4 { grid-auto-flow:row; grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .flow.n4 .node:nth-child(2)::after { content:none; }
    .node:not(:last-child)::after { right:-.85rem; }
  }
  .node { word-break:keep-all; }
  .node { --nc:var(--c, #3d6fa8); --nb:var(--cb, #1d3150); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:.25rem; width:100%; min-height:150px;
          border-radius:12px; border:3px solid var(--nc); background:var(--nb); color:#fff; font:400 1.15rem 'Do Hyeon','Noto Sans KR',sans-serif; cursor:pointer; padding:.9rem .4rem .6rem; text-align:center; line-height:1.15;
          box-shadow:inset 0 -5px 0 rgba(0,0,0,.28); }
  .node:hover { filter:brightness(1.12); }
  .node .no { position:absolute; left:-3px; top:-3px; min-width:2rem; padding:.15rem .4rem; border-radius:10px 0 10px 0; background:var(--nc); font:400 1.2rem 'Do Hyeon',sans-serif; line-height:1.2; }
  .node .ic { width:46px; height:46px; color:#fff; margin-top:.2rem; }
  .node .nm { min-height:2.3em; display:flex; align-items:center; }
  .node small { display:inline-block; font:700 .82rem 'Noto Sans KR',sans-serif; background:var(--nc); border-radius:999px; padding:.15rem .9rem; margin-top:auto; }
  .node b { position:absolute; right:-3px; top:-3px; background:#ffd84a; color:#2a1a00; border-radius:0 10px 0 10px; padding:.1rem .45rem; font:400 1rem 'Do Hyeon',sans-serif; }
  .node.todo { --nc:#ff8a4c; --nb:#a8452a; }
  .node.run { --nc:#ffc24a; --nb:#8a5a12; animation:nodeRun 1s ease-in-out infinite alternate; }
  @keyframes nodeRun { to { filter:brightness(1.25); } }
  .node.done .no::after { content:' ✓'; }
  .node.wait { opacity:.88; }
  .node.later { border-style:dashed; opacity:.6; }
  @media (prefers-reduced-motion:reduce){ .node.run { animation:none; } }
  .node:not(:last-child)::after { content:'›'; position:absolute; right:-1.05rem; top:50%; transform:translateY(-50%); color:#8b93a3; font:900 1.6rem sans-serif; }
  .fgroup:not(:last-child) .node:last-child::after { content:'›'; right:-1.05rem; }
  /* 이지어드민: 넓은 카드 두 장 */
  #flowEz { display:grid; grid-template-columns:1fr auto 1fr; align-items:stretch; gap:.8rem; }
  #flowEz .arrow { align-self:center; color:#c9d3e6; font:900 2.4rem sans-serif; }
  .ez { --nc:#56617a; --nb:#2a3242; display:flex; align-items:center; gap:1rem; min-height:110px; padding:.8rem 1.2rem; border-radius:14px; border:3px solid var(--nc); background:var(--nb); color:#fff; cursor:pointer;
        font:400 1.6rem 'Do Hyeon','Noto Sans KR',sans-serif; text-align:left; box-shadow:inset 0 -6px 0 rgba(0,0,0,.28); }
  .ez:hover { filter:brightness(1.12); }
  .ez .big-ic { width:64px; height:64px; flex:none; }
  .ez .num { flex:none; width:2.2rem; height:2.2rem; display:grid; place-items:center; background:#fff; color:#111; border-radius:6px; font:400 1.5rem 'Do Hyeon',sans-serif; }
  .ez .bar { width:3px; align-self:stretch; background:rgba(255,255,255,.35); }
  .ez .txt { display:flex; flex-direction:column; align-items:flex-start; gap:.3rem; flex:1; }
  .ez small { font:700 .85rem 'Noto Sans KR',sans-serif; background:rgba(255,255,255,.22); border-radius:999px; padding:.15rem .9rem; }
  .ez b { font:400 1.1rem 'Do Hyeon',sans-serif; background:#ffd84a; color:#2a1a00; border-radius:6px; padding:.05rem .4rem; }
  .ez.todo { --nc:#ff8a4c; --nb:#a8452a; } .ez.run { --nc:#ffc24a; --nb:#8a5a12; } .ez.done { --nc:#3d6fa8; --nb:#1d3150; } .ez.wait { opacity:.88; }
  @media (max-width:760px){ #flowEz { grid-template-columns:1fr; } #flowEz .arrow { display:none; } .ez { font-size:1.35rem; } }
  /* 흰 화면은 화면 가운데 팝업 (대표님 2026-11-04). 바깥을 누르거나 Esc 로 닫힘 */
  #sheet { position:fixed; inset:0; background:rgba(8,10,16,.6); z-index:50; display:flex; align-items:center; justify-content:center; padding:1rem; color-scheme:light; }
  #sheet[hidden] { display:none; }
  /* 받을 파일은 팝업 맨 위 초록 칸에 크게 (대표님 2026-11-04: 파일 받는 곳이 안 보임) */
  .file-card { border:3px solid #0a7d3e; background:#e9f8ef; border-radius:12px; padding:.9rem 1rem; margin:0 0 1rem; }
  .file-card .ft { font-weight:900; font-size:1.15rem; margin-bottom:.5rem; }
  .file-card .fbtn { display:flex; align-items:center; gap:.8rem; width:100%; text-align:left; background:#0a7d3e; border:0; color:#fff; border-radius:10px; padding:.8rem 1rem; margin:.4rem 0 0; font:inherit; cursor:pointer; box-shadow:inset 0 -4px 0 rgba(0,0,0,.25); }
  .file-card .fbtn:hover { filter:brightness(1.1); } .file-card .fbtn:disabled { opacity:.6; cursor:wait; }
  .file-card .fbtn .fi { font-size:2rem; line-height:1; pointer-events:none; } .file-card .fbtn .fn { display:flex; flex-direction:column; pointer-events:none; }
  .file-card .fbtn b { font-size:1.25rem; } .file-card .fbtn small { font-size:.95rem; opacity:.9; }
  .file-card .fbtn.sub { background:#fff; color:#0a4d28; border:2px solid #0a7d3e; box-shadow:none; }
  .file-card .fmsg { margin-top:.5rem; font-weight:700; }
  .file-card.old { border-color:#b45309; background:#fff7e6; }
  .act-card { border:2px solid #0b57d0; background:#eef4ff; border-radius:12px; padding:.8rem 1rem; margin:0 0 1rem; }
  .act-card .act-what { font-weight:700; margin-bottom:.6rem; } .act-card .wbtn.go { margin:.4rem 0 0; } .act-card .big { margin-top:0; }
  /* 파일 선택은 직접 하는 길이라 설명 칸·결과 아래로 */
  #splitBox { order:2; margin:1rem 0 0; padding-top:1rem; border-top:2px solid #000; }
  #splitBox[hidden] { display:none; }
  #splitBox .memoT { font-weight:900; margin-bottom:.3rem; }
  #splitBox input[type=file] { font:inherit; }
  #splitMsg { margin-top:.4rem; }
  #splitSites { margin:.5rem 0; }
  #splitSites .ss { display:flex; justify-content:space-between; gap:1rem; padding:.2rem 0; border-bottom:1px solid #ddd; }
  #splitSites .ssT { font-weight:900; margin-top:.6rem; }
  #splitBtns[hidden] { display:none; }
  #giftMemoBox { margin:0 0 1rem; }
  #giftMemoBox[hidden] { display:none; }
  #giftMemoBox .memoT { font-weight:900; margin-bottom:.3rem; }
  #giftMemo { width:100%; box-sizing:border-box; font:inherit; padding:.6rem; border:2px solid #000; border-radius:8px; background:#fffdf0; color:#000; resize:vertical; }
  #takeWrap { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px; color:#000; color-scheme:light; }
  #takeWrap[hidden] { display:none; }
  #takeWrap .takeBox { background:#fff; border-radius:14px; padding:1.2rem; width:100%; max-width:440px; font-size:1.05rem; line-height:1.6; }
  #takeWrap h2 { font-size:1.3rem; font-weight:900; margin:0 0 .6rem; }
  #takeWrap .row { display:flex; gap:.6rem; justify-content:flex-end; flex-wrap:wrap; margin-top:1rem; }
  #loginWrap { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px; color:#000; color-scheme:light; }
  #loginWrap[hidden] { display:none; }
  #loginBox { background:#fff; border-radius:14px; padding:1.2rem; width:100%; max-width:420px; }
  #loginBox h2 { font-size:1.3rem; font-weight:900; margin:0 0 .7rem; }
  #loginBox label { display:block; font-size:1rem; font-weight:700; margin:.6rem 0 .2rem; }
  #loginBox input { width:100%; box-sizing:border-box; font-size:1.15rem; padding:.6rem; border:2px solid #000; border-radius:8px; background:#fff; color:#000; }
  #loginMsg { min-height:1.5em; margin:.7rem 0; font-size:1rem; font-weight:700; }
  #loginBox .row { display:flex; gap:.6rem; justify-content:flex-end; }
  /* 일괄합포제외도 이벗 칸과 같은 가운데 팝업 (대표님 2026-11-04). 표가 넓어 더 넓게 */
  #ezFrameWrap { position:fixed; inset:0; z-index:60; background:rgba(8,10,16,.6); display:flex; align-items:center; justify-content:center; padding:1rem; color-scheme:light; }
  #ezFrameWrap[hidden] { display:none; }
  .ez-in { display:flex; flex-direction:column; background:#fff; color:#000; width:min(1180px, 100%); height:88vh; border-radius:16px; box-shadow:0 24px 70px rgba(0,0,0,.4); padding:0 1.2rem 1rem; font-size:18px; line-height:1.45; overflow:hidden; }
  .ez-in > * { flex:none; }
  .ez-in .act-card { margin:0 0 .7rem; padding:.6rem 1rem; }
  #splitBar { margin:0 0 .7rem; }
  @media (max-width:560px) { #ezFrameWrap { padding:.5rem; } .ez-in { height:94vh; padding:0 .6rem .6rem; } .ez-in .act-card { font-size:.9rem; padding:.5rem .7rem; } .ez-in .act-what { margin-bottom:.2rem; } .ez-in .sheet-top h2 { font-size:1.3rem; } }
  /* 막대는 가운데, 글씨는 막대 아래 한 줄 (대표님 2026-11-05) */
  .pbar { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.3rem; font-weight:900; text-align:center; } .pbar[hidden] { display:none; }
  .pbar > span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .pbar canvas { display:block; width:270px; max-width:60vw; height:auto; image-rendering:pixelated; }
  #startBar { margin:.4rem 0 0; } #startBar .pbar-t { color:var(--fg, #fff); }
  #ezFrame { flex:1 1 auto; min-height:0; width:100%; border:1px solid #e3e6ec; border-radius:10px; }
  .sheet-in { display:flex; flex-direction:column; background:#fff; color:#000; width:min(760px, 100%); max-height:88vh; overflow:auto; border-radius:16px; box-shadow:0 24px 70px rgba(0,0,0,.4); padding:0 1.2rem 1.4rem; font-size:18px; line-height:1.45; }
  .sheet-top { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:.8rem; position:sticky; top:0; background:#fff; padding:.8rem 0 .5rem; z-index:1; border-bottom:2px solid #e3e6ec; }
  .sheet-in > * { flex:none; }
  @media (max-width:560px) { #sheet { padding:.5rem; } .sheet-in { max-height:94vh; padding:0 .8rem 1rem; } }
  .sheet-top h2 { font-size:1.6rem; font-weight:900; }
  #jobBar { margin:0 0 1rem; } #jobBar[hidden] { display:none; }
  #jobBar canvas { display:block; width:100%; max-width:540px; height:auto; image-rendering:pixelated; }
  #jobBarText { font-weight:900; margin-top:.2rem; }
  .wbtn { display:inline-block; background:#fff; color:#000; border:2px solid #000; border-radius:8px; padding:.55rem 1rem; font:inherit; font-weight:800; cursor:pointer; text-decoration:none; margin:.2rem .3rem .2rem 0; }
  .wbtn.go { background:#0b57d0; border-color:#0b57d0; color:#fff; font-size:1.3rem; padding:.8rem 1.2rem; }
  .chk { display:flex; gap:.6rem; align-items:baseline; padding:.6rem 0; border-top:2px solid #c9ced6; font-weight:700; }
  .chk .i { flex:none; font-size:1.2em; } .chk.bad { color:#c81e1e; } .chk.ok .i { color:#0a7d3e; }
  .big { font-size:2.2rem; font-weight:900; margin:.3rem 0 .7rem; }
  .sub2 { font-size:1rem; font-weight:400; }
  /* 시동 보여 주기: 실제로 끝난 단계마다 큰 글자가 떠오르며 사라지고, 다 끝나면 담당 비서들이 함께 인사 (대표님 2026-11-04) */
  #cheerWrap { position:fixed; inset:0; pointer-events:none; z-index:80; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3.5rem; background:rgba(8,10,16,0); transition:background .5s; }
  #cheerWrap.on { background:rgba(8,10,16,.55); }
  #floatBox { position:relative; width:100%; height:10rem; }
  .float { position:absolute; left:50%; top:60%; white-space:nowrap; font:400 clamp(1.7rem, 6.5vw, 3.2rem) 'Do Hyeon','Noto Sans KR',sans-serif; color:#fff; opacity:0;
           text-shadow:0 3px 0 #0d0f14, 0 0 22px rgba(0,0,0,.75); animation:floatUp 2.8s ease-out forwards; }
  .float.ok::before { content:'✓ '; color:#4af0a8; } .float.bad { color:#ffb0b0; } .float.bad::before { content:'! '; color:#ff6b6b; } .float.big { color:#ffd84a; font-size:clamp(2rem, 8vw, 3.8rem); }
  @keyframes floatUp { 0% { opacity:0; transform:translate(-50%, 30%) scale(.85); } 14% { opacity:1; transform:translate(-50%, -50%) scale(1); } 68% { opacity:1; transform:translate(-50%, -120%); } 100% { opacity:0; transform:translate(-50%, -190%); } }
  #cheer { position:relative; width:min(600px, 94vw); aspect-ratio:230 / 96; } #cheer[hidden] { display:none; }
  #cheerCv { display:block; width:100%; height:100%; image-rendering:pixelated; }
  .bub { position:absolute; top:22%; background:#fff; color:#111; border:3px solid #0d0f14; border-radius:10px; padding:.15rem .6rem; white-space:nowrap; opacity:0;
         font:400 clamp(.95rem, 3.6vw, 1.35rem) 'Do Hyeon','Noto Sans KR',sans-serif; box-shadow:0 3px 0 #0d0f14; animation:bubPop 4.2s ease-out forwards; }
  .bub.bad { background:#ffe1e1; }
  @keyframes bubPop { 0%, 10% { opacity:0; transform:translate(-50%, -70%) scale(.5); } 20% { opacity:1; transform:translate(-50%, -100%) scale(1.06); } 26% { transform:translate(-50%, -100%) scale(1); } 84% { opacity:1; transform:translate(-50%, -100%); } 100% { opacity:0; transform:translate(-50%, -120%); } }
  @media (prefers-reduced-motion: reduce) { .float, .bub { animation-duration:.01s; animation-delay:0s !important; opacity:1; } }
  #runBar { display:none; background:#10261d; border:1px solid var(--accent); color:var(--accent); border-radius:12px; padding:.8rem 1rem; margin-bottom:.8rem; font-size:.95rem; font-weight:700; line-height:1.6; }
  #runBar.bad { background:#2a1414; border-color:var(--red); color:var(--red); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><span>AI</span> 물류비서</h1>
    <div class="hdr-r"><span class="who" id="who">확인 중…</span><button class="btn" type="button" data-sheet="settings">설정</button></div>

  var v = SITES_V.bizem;
  if (!v) return '<p class="sub2">시작 버튼을 누르면 읽어 옵니다.</p>';
  if (v.state !== 'ok') return chk(false, esc(v.msg || '연결 안 됨'));
  var c = v.counts;
  if (!c) return chk(false, esc(v.msg || '건수를 아직 읽지 못했습니다'));
  return '<div class="big">주문확정 대기 ' + c.unconfirmed + '건 · 운송장인쇄 대기 ' + c.printWait + '건</div><p class="sub2">' + esc(ago(v.countsAt)) + ' 읽음</p>';
}
/* 비젬 주문수집: 칸을 누르면 체크된 쇼핑몰을 읽어 보여 주고, 사람이 버튼을 눌러야 수집과 주문확정(전체)까지 실행함. 다시 시도하지 않음.
   방금 끝낸 뒤에는 수집 버튼을 바로 내지 않아 두 번 누르는 일을 막음 */
var BZ = { state: '' }, BZ_RECENT = 30 * 60 * 1000, BZ_READ_WAIT = 90000, BZ_RUN_WAIT = 20 * 60 * 1000, BZ_OPT = { 10: '주문수집 + 클레임수집', 20: '주문수집', 30: '클레임수집' };
function bizemJobKey(recipe){
  var pre = (recipe || 'bizem_collect') + ':' + C.kstDate(now()) + ':';
  return Object.keys(JOBS).filter(function(x){ return x.indexOf(pre) === 0; }).sort(function(a, b){ return (JOBS[b].at || 0) - (JOBS[a].at || 0); })[0];
}
function bizemJob(recipe){ var k = bizemJobKey(recipe); return k ? JOBS[k] : null; }
function bizemSend(type, extra, wait, done){
  send(type, extra).then(function(ref){
    var t = setTimeout(function(){ ref.off('value', on); done(null); }, wait);
    var on = ref.on('value', function(s){
      var c = s.val();
      if (!c || ['done', 'refused', 'expired', 'interrupted'].indexOf(c.status) < 0) return;
      clearTimeout(t);
      ref.off('value', on);
      done(c);
    });
  }).catch(function(e){ done({ status: 'refused', why: e.message }); });
}
function bizemRecent(j){ return !!j && j.state === 'done' && now() - (j.endedAt || 0) < BZ_RECENT; }
function bizemRead(force){
  var j = bizemJob();
  if (BZ.state === 'reading' || BZ.state === 'sent' || (j && j.state === 'running') || (!force && bizemRecent(j))) return;
  var block = C.startBlock({ runner: RUNNER, control: CONTROL, job: runningJob(), now: now() });
  if (block) { BZ = { state: 'no', why: block }; return; }
  BZ = { state: 'reading' };
  bizemSend('bizem_check', null, BZ_READ_WAIT, function(c){
    BZ = !c ? { state: 'no', why: '상시 컴퓨터가 답하지 않았습니다.' } : c.status === 'done' && c.check ? { state: 'ready', check: c.check } : { state: 'no', why: c.why || '쇼핑몰 목록을 읽지 못했습니다.' };
    paint();
  });
}
function bizemGo(){
  if (BZ.state !== 'ready') return;
  var k = BZ.check;
  bizemRun('bizem_collect', { malls: k.checked, from: k.from, to: k.to, opt: k.opt, confirm: true });
}
function bizemConfirmGo(){
  var c = SITES_V.bizem && SITES_V.bizem.counts;
  if (BZ.state === 'sent' || !c || !c.unconfirmed) return;
  bizemRun('bizem_confirm', { seen: c.unconfirmed });
}
function bizemRun(type, extra){
  BZ = { state: 'sent' };
  paint();
  bizemSend(type, extra, BZ_RUN_WAIT, function(c){
    BZ = !c ? { state: 'no', why: '결과를 받지 못했습니다. 비젬에서 먼저 확인해 주세요.' } : c.status === 'done' ? { state: '' } : { state: 'no', why: c.status === 'expired' ? '요청이 늦게 도착해 수집하지 않았습니다.' : c.why || '수집하지 못했습니다.' };
    paint();
  });
}
function bizemResult(j){
  var r = j.result || {}, c = r.counts, line = c && c.before >= 0 && c.after >= 0 ? ' · 주문확정 대기 ' + c.before + '건 → ' + c.after + '건' : '', cf = r.confirm;
  var html = j.state === 'done' ? (c ? chk(true, '오늘 수집 완료 ' + esc(ago(j.endedAt)) + esc(line)) : '') : (c ? chk(true, '수집 완료' + esc(line)) : '') + chk(false, esc(j.notes || '끝나지 않았습니다. 비젬에서 먼저 확인해 주세요'));
  if (cf) html += chk(!cf.after, '주문확정 ' + cf.orders + '건 처리 · 남은 대기 ' + cf.after + '건 · 운송장인쇄 대기 ' + cf.printWait + '건');
  (r.alerts || []).forEach(function(a){ html += chk(false, esc(a)); });
  return html;
}

/* 파일 내려받기: 이 화면이 1회용 키를 만들어 실행 PC 에 요청 → 실행 PC 가 잠가 secretary/fileres 에 잠깐 올림 → 여기서 풀어 저장하고 지움 */
var BF = { msg: '' }, FILE_WAIT = 60000;
function getFile(kind){
  var key = bizemJobKey('bizem_import');
  if (!key || BF.busy) return;
  BF = { busy: true, msg: '실행 PC 에 파일을 요청하는 중…' };
  paint();
  var keys, req, res, done = false, t;
  function finish(msg){ if (done) return; done = true; clearTimeout(t); if (res) { res.off(); res.remove(); } BF = { msg: msg }; paint(); }
  window.SECRETARY_LOGIN.createKeys().then(function(k){
    keys = k;
    req = root.child('filereq').push();
    res = root.child('fileres/' + req.key);
    t = setTimeout(function(){ req.remove(); finish('실행 PC 가 답하지 않았습니다. 다시 눌러 주세요.'); }, FILE_WAIT);
    res.on('value', function(s){
      var r = s.val();
      if (!r || done) return;
      if (r.why) return finish(r.why);
      window.SECRETARY_LOGIN.openFile(keys.privateKey, r.sealed).then(function(buf){
        var a = document.createElement('a'), url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
        finish('받았습니다: ' + r.name);
      }, function(){ finish('파일을 풀지 못했습니다. 다시 눌러 주세요.'); });
    });
    return req.set({ kind: kind, job: key, jwk: keys.publicJwk, by: (me && me.email) || '', at: firebase.database.ServerValue.TIMESTAMP });
  }).catch(function(e){ finish('요청하지 못했습니다: ' + e.message); });
}

/* 사이트 탭을 열고 도우미(확장이 넣음)의 인사를 기다린 뒤 ping. 이 경로로는 ping·read 만 나간다 */
var HELPER_WAIT = 60000, SEARCH_WAIT = 100000, H = {};
window.addEventListener('message', function(e){
  var m = e.data;
  if (!m || !m.from) return;
  var site = C.SITES.find(function(s){ return s.from === m.from && s.origin.test(e.origin); });
  if (!site) return;
  var h = H[site.id] || (H[site.id] = { pend: {}, seq: 0 });
  if (m.cmd === 'ready') {
    h.win = e.source; h.origin = e.origin;
    if (h.onReady) { h.onReady(); h.onReady = null; }
    /* 로그인 화면 등으로 페이지가 넘어가면 앞 요청이 사라지므로 새 도우미에 다시 보냄. 저장 명령은 두 번 나가면 안 되어 실패로 돌림 */
    Object.keys(h.pend).forEach(function(id){
      if (C.HELPER_WRITE.indexOf(h.pend[id].cmd) >= 0) { var w = h.pend[id]; delete h.pend[id]; clearTimeout(w.t); w.no(new Error('작업 중 이지어드민 화면이 바뀌었습니다')); return; }
      h.win.postMessage({ to: site.to, id: Number(id), cmd: h.pend[id].cmd, args: h.pend[id].args }, h.origin); });
    return;
  }
  var p = h.pend[m.id];
  if (!p) return;
  delete h.pend[m.id];
  clearTimeout(p.t);
  if (m.ok) p.ok(m.data); else p.no(new Error(m.err === 'LOGIN' ? '로그인이 필요합니다' : m.err));
});
function ask(site, cmd, args, wait){
  C.assertSafeCmd(cmd);
  return askAny(site, cmd, args, wait);
}
function askAny(site, cmd, args, wait){
  var h = H[site.id];
  if (!h || !h.win) return Promise.reject(new Error('도우미가 연결되지 않았습니다'));
  return new Promise(function(ok, no){
    var id = ++h.seq;
    h.pend[id] = { cmd: cmd, args: args || {}, ok: ok, no: no, t: setTimeout(function(){ delete h.pend[id]; no(new Error('도우미 응답 없음')); }, wait || HELPER_WAIT) };
    h.win.postMessage({ to: site.to, id: id, cmd: cmd, args: args || {} }, h.origin);
  });
}
/* 이벗 주문서목록 읽기 → 행사표로 사은품 대상 계산. 이벗에 쓰지 않음 */

function makeStore(){
  return {
    claimRunner: function(id, info){
      return root.child('runner').transaction(function(cur){
        if (cur && cur.id && cur.id !== id) return;
        return Object.assign({}, info, { id: id, ts: now() });
      }).then(function(r){ return r.committed; });
    },
    /* 신호: 등록이 해제됐거나 다른 PC 로 바뀌었으면 다시 차지하지 않음 */
    beatRunner: function(id, info){
      return root.child('runner').transaction(function(cur){
        if (cur === null) return null;   /* 서버 값을 아직 모름. 진짜 비어 있으면 아래에서 거절 */
        if (cur.id !== id) return;
        return Object.assign({}, info, { id: id, ts: now() });
      }).then(function(r){ var v = r.snapshot.val(); return !!r.committed && !!v && v.id === id; });
    },
    getRunner: function(){ return root.child('runner').get().then(function(s){ return s.val(); }); },
    /* 시작 버튼으로 이 컴퓨터가 넘겨받음. 앞 헤드비서는 다음 신호 때 자기 차례가 아님을 알고 멈춤 */
    takeRunner: function(id, info){ return root.child('runner').set(Object.assign({}, info, { id: id, ts: now() })); },
    claimCommand: function(id){
      return root.child('commands/' + id + '/status').transaction(function(cur){
        if (cur) return;
        return 'taken';
      }).then(function(r){ return r.committed; });
    },
    setCommand: function(id, p){ return root.child('commands/' + id).update(p); },
    getJobs: function(){ return root.child('jobs').get().then(function(s){ return s.val(); }); },
    setJob: function(k, p){ return root.child('jobs/' + k).update(p); },
    getControl: function(){ return root.child('control').get().then(function(s){ return s.val(); }); },
    setSite: function(id, p){ return root.child('sites/' + id).set(p); },
    setMatch: function(path, p){ return root.child('match/' + path).set(p); },
    setUpload: function(p){ return root.child('bizemUpload/' + p.day).push(p); },
    clearLoginReq: function(id){ return root.child('loginreq/' + id).remove(); },
    setLoginResult: function(id, p){ return root.child('loginres/' + id).set(p); },
    claimCall: function(id){
      return root.child('ezcall/' + id + '/status').transaction(function(cur){
        if (cur) return;
        return 'taken';
      }).then(function(r){ return r.committed; });
    },
    setCall: function(id, p){ return root.child('ezcall/' + id).update(p); }
  };
}

/* 우체국 대신 조회 (functions-settle/epost.js) — 서버→우체국이 막힐 때 secretary/epost/req/{번호} 가 오면 확장으로 읽어 res/{번호} 에 남김 */
var epostSeq = 0;
function extEpost(no){
  return new Promise(function(ok){
    var id = ++epostSeq, timer;
    function on(e){ if (e.source !== window || !e.data || e.data.to !== 'mkwPageEpost' || e.data.id !== id) return; end(e.data.res); }
    function end(r){ clearTimeout(timer); window.removeEventListener('message', on); ok(r); }
    window.addEventListener('message', on);
    timer = setTimeout(function(){ end({ err: '확장 응답 없음' }); }, 15000);
    window.postMessage({ to: 'mkwExtEpost', id: id, no: no }, location.origin);
  });
}
function startEpostRelay(){
  var far = root.child('epost');
  far.child('res').remove();
  far.child('req').on('child_added', function(s){
    var no = s.key, q = s.val();
    s.ref.remove();
    if (!q || now() - q.at > 60000) return;
    extEpost(no).then(function(r){
      far.child('res/' + no).set(Object.assign({}, r, { at: firebase.database.ServerValue.TIMESTAMP }));
      setTimeout(function(){ far.child('res/' + no).remove(); }, 300000);
    });
  });
}

function startRunner(){

  navigator.locks.request('mkw_secretary_runner', { ifAvailable: true }, function(lock){
    if (!lock) { runBar('다른 탭에서 헤드비서가 이미 실행 중입니다. 이 탭은 닫아도 됩니다.', true); return; }

}
var LOGIN_KEY = null;

function runMain(local){
  var id = runnerId();
  var runner = window.SECRETARY_RUNNER.createRunner({ store: makeStore(), openSite: openSite, ezPreview: ezPreview, ezSearch: ezSearch, ezWrite: ezWrite, ezPing: ezPing, mensoPreview: mensoPreview, matchRead: matchRead, matchSearch: matchSearch, relogin: relogin, ebutUpload: ebutUpload, login: loginWith, bizemCounts: function(){ return ask(C.SITES.find(function(s){ return s.id === 'bizem'; }), 'counts', {}, 30000); }, bizemRead: function(cmd){ return ask(C.SITES.find(function(s){ return s.id === 'bizem'; }), cmd, {}, 60000); }, ebutMatchPage: function(){ var s = C.SITES.find(function(x){ return x.id === 'ebut'; }); return openSite(Object.assign({}, s, { url: 'https://ebut3pl.co.kr/jsp/site/site217edit.jsp' })); }, ebutOrderPage: function(){ var s = C.SITES.find(function(x){ return x.id === 'ebut'; }); return openSite(Object.assign({}, s, { url: 'https://ebut3pl.co.kr/jsp/site/site230main.jsp' })); }, ebutRead: function(cmd){ return ask(C.SITES.find(function(s){ return s.id === 'ebut'; }), cmd, {}, 60000); }, ebutGo: function(cmd, args){ if (C.HELPER_WRITE.indexOf(cmd) < 0) return Promise.reject(new Error('허용되지 않은 요청: ' + cmd)); return askAny(C.SITES.find(function(s){ return s.id === 'ebut'; }), cmd, args || {}, 60000); }, bizemFile: bizemFile, bizemGo: function(cmd, args){ if (C.HELPER_WRITE.indexOf(cmd) < 0) return Promise.reject(new Error('허용되지 않은 요청: ' + cmd)); return askAny(C.SITES.find(function(s){ return s.id === 'bizem'; }), cmd, args, 60000); }, unseal: function(sealed){ return window.SECRETARY_LOGIN.unseal(LOGIN_KEY, sealed); }, now: now, runnerId: id, info: runnerInfo() });
  RUNNER_OBJ = runner;
  var stopped = true, started = false, taking = false, RUN_TEXT = local ? '이 컴퓨터에서 진행 중입니다. 이 탭을 닫으면 상시 컴퓨터가 다시 맡습니다.' : '헤드비서 실행 중입니다. 이 탭을 닫지 마세요.';
  function refuse(){
    stopped = true;
    if (local) root.child('runner').onDisconnect().cancel();
    runBar(local ? '다른 컴퓨터가 가져갔거나 연결이 끊겼습니다. 다시 하려면 새로고침 후 시작 버튼을 눌러 주세요.' : '지금 다른 컴퓨터에서 일하는 중입니다. 그 컴퓨터가 끝나면 여기서 다시 맡습니다.', local);
    if (local) LOCAL = false;
  }
  function listen(){
    if (!local) startEpostRelay();
    setInterval(function(){
      if (stopped) return;
      makeStore().beatRunner(id, runnerInfo()).then(function(mine){
        if (!mine) return refuse();
        runBar(RUN_TEXT);
        if (!local) reloadIfNewVersion();
      }).catch(function(e){ runBar('신호를 보내지 못했습니다: ' + e.message, true); });
    }, 60000);
    setInterval(function(){ if (!stopped) runner.printWatch().catch(function(){}); }, 60000);
    if (C.KEEP_ALIVE_ON) setInterval(function(){ if (!stopped) runner.keepAlive().catch(function(){}); }, C.KEEP_ALIVE_MS);
    root.child('loginreq').on('child_added', function(s){ var r = s.val(); if (r && !stopped) runner.handleLogin(s.key, r).catch(function(){}); });
    root.child('filereq').on('child_added', function(s){ if (!stopped) serveFile(s); });
    root.child('ezcall').on('child_added', function(s){
      var c = s.val();
      if (stopped || !c || c.status) return;
      if (now() - (c.at || 0) > C.RELAY_TTL) { s.ref.remove(); return; }   /* 화면이 닫혀 남은 요청 */
      runner.handleCall(s.key, c).catch(function(){});
    });
    root.child('commands').limitToLast(20).on('child_added', function(s){
      var c = s.val();
      if (stopped || !c || c.status) return;
      runner.handleCommand(s.key, c).catch(function(e){ makeStore().setCommand(s.key, { status: 'refused', why: e.message }); });
    });
  }
  function take(){
    if (taking || !stopped) return;
    taking = true;
    return runner.claim().then(function(ok){
      if (!ok) return refuse();
      if (local) root.child('runner').onDisconnect().remove();
      return publishLoginKey().then(function(){
        stopped = false;
        runBar(RUN_TEXT);
        if (!started) { started = true; listen(); }
      });
    }).catch(function(e){ runBar('헤드비서를 시작하지 못했습니다: ' + e.message, true); }).then(function(){ taking = false; });
  }
  take();
  /* 상시 컴퓨터: 다른 컴퓨터가 끝나 실행 PC 가 비면 다시 맡음 */
  if (!local) root.child('runner').on('value', function(s){ if (stopped && s.val() === null) take(); });
}

  root.child('control').on('value', function(s){ CONTROL = s.val(); paint(); });
  root.child('settings').on('value', function(s){ SETTINGS = s.val() || {}; paint(); });
  root.child('campaigns').on('value', function(s){ CAMPAIGNS = s.val() || {}; paint(); });
  root.child('giftMemo').on('value', function(s){ GIFT_MEMO = s.val(); paintGiftMemo(); });
  root.child('sites').on('value', function(s){ SITES_V = s.val() || {}; paint(); });
  /* 작업 기록 키는 '종류:날짜:번호' 라 limitToLast 는 이름 순 끝(menso·match…)만 가져와 비젬 기록이 빠졌음 (2026-11-05). 종류별로 최근 것만 따로 듣고 합침 */
  var JOB_KINDS = ['bizem_collect', 'bizem_import', 'check', 'ebut_collect', 'ez_daily', 'ez_print', 'ez_split', 'match_save', 'menso_read'], JOB_PART = {};
  JOB_KINDS.forEach(function(kind){
    root.child('jobs').orderByKey().startAt(kind + ':').endAt(kind + ':\uf8ff').limitToLast(12).on('value', function(s){
      JOB_PART[kind] = s.val() || {};
      JOBS = Object.assign.apply(null, [{}].concat(JOB_KINDS.map(function(k){ return JOB_PART[k] || {}; })));
      paint();
    });
  });
  root.child('notes').limitToLast(5).on('value', function(s){ NOTES = s.val() || {}; paint(); });
  setInterval(paint, 30000);
  if (IS_RUN) startRunner();
});
</script>
<script src="/mm_copy.js" defer></script>
