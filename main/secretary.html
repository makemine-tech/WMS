<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 물류비서</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Do+Hyeon&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#0d0f14; --surface:#151820; --surface2:#1b1f29; --border:#2a2f3d; --accent:#4af0a8; --accent2:#f0a84a;
          --text:#e8eaf0; --muted:#8b93a3; --red:#f05050; --yellow:#fbbf24; }
  body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:0 0 4rem; }
  .container { width:calc(100% - 2rem); max-width:1320px; margin:0 auto; padding:1.25rem 0 0; }
  .keys { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:.6rem; margin-top:.7rem; }
  #actions { display:contents; }
  .scene { position:relative; line-height:0; border-radius:10px; overflow:hidden; container-type:inline-size; }
  .scene canvas { width:100%; height:auto; display:block; image-rendering:pixelated; }
  .plate { position:absolute; line-height:1.25; background:#2e3138; color:#fff; font:400 clamp(11px,2.7cqw,19px) 'Do Hyeon','Noto Sans KR',sans-serif; padding:.1em .5em; white-space:nowrap; max-width:47%; overflow:hidden; text-overflow:ellipsis; }
  .plate b { font-weight:400; color:#c8d3d0; margin-left:5px; }
  .plate.alert { background:#b43a28; } .plate.alert b { color:#ffe1da; }
  .plate.work { background:#1f7a55; } .plate.work b { color:#d6efe2; }
  .plate.off { background:#474d5a; color:#fff; }
  .header { display:flex; align-items:center; justify-content:space-between; gap:.75rem; margin-bottom:1rem; }
  h1 { font-size:1.35rem; font-weight:900; }
  h1 span { color:var(--accent); }
  .who { font-size:.84rem; color:var(--muted); text-align:right; }
  .hdr-r { display:flex; align-items:center; gap:.6rem; }
  .btn { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:.5rem .85rem; font:inherit; font-size:.95rem; font-weight:700; cursor:pointer; }
  #startBtn { position:relative; overflow:hidden; display:block; width:100%; min-height:128px; margin:0; border-radius:16px; border:2px solid var(--accent);
              background:var(--surface2); color:var(--accent); font:inherit; font-size:2rem; font-weight:900; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; }
  #startBtn:disabled { border-color:var(--border); color:var(--muted); cursor:not-allowed; }
  #startBtn .fill { position:absolute; inset:0; width:0; background:rgba(74,240,168,.25); }
  #startBtn.hold .fill { width:100%; transition:width 1s linear; }
  #startBtn .tx { position:relative; }
  #startBtn .txs { display:block; font-size:.9rem; font-weight:700; margin-top:.3rem; opacity:.85; }
  .hint { font-size:.9rem; color:var(--muted); text-align:center; min-height:1.2em; line-height:1.5; }
  #actions .act { display:flex; align-items:center; justify-content:center; width:100%; min-height:128px; border-radius:16px; border:2px solid var(--red); background:#2a1414; color:#fff; font:inherit; font-size:1.7rem; font-weight:900; cursor:pointer; text-align:center; padding:.5rem; }
  #actions .act:hover { background:#3a1818; }
  .flow-box { margin-top:1rem; }
  .flow-t { font-size:1.1rem; font-weight:900; margin-bottom:.5rem; }
  /* 넓은 화면: 10칸이 한 줄로 폭을 꽉 채움. 3·4·3칸이라 단계 폭도 3:4:3 */
  .flow { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0, 1fr); gap:.5rem 1.4rem; }
  #flowMenso { display:grid; grid-template-columns:3fr 4fr 3fr; gap:.8rem 1.4rem; }
  .fgroup-t { font-size:.92rem; font-weight:700; color:var(--muted); margin-bottom:.3rem; }
  .fgroup:not(:last-child) .node:last-child::after { content:'→'; position:absolute; right:-1.25rem; top:50%; transform:translateY(-50%); color:#8b93a3; font-size:1.1rem; font-weight:900; }
  @media (max-width:1000px){
    #flowMenso { grid-template-columns:minmax(0, 1fr); }
    .fgroup:not(:last-child) .node:last-child::after { content:none; }
  }
  @media (max-width:520px){
    .flow { gap:.5rem .9rem; }
    .flow.n4 { grid-auto-flow:row; grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .flow.n4 .node:nth-child(2)::after { content:none; }
    .node:not(:last-child)::after { right:-.85rem; }
  }
  .node { word-break:keep-all; }
  .node { position:relative; width:100%; min-height:96px; border-radius:12px; border:2px solid transparent; color:#fff; font:inherit; cursor:pointer; padding:.5rem .6rem; text-align:center; font-size:1.1rem; font-weight:900; }
  .node .no { display:block; font-size:1.5rem; font-weight:900; line-height:1.15; }
  .node small { display:block; font-size:.86rem; font-weight:700; opacity:.9; margin-top:.15rem; }
  .node b { display:block; font-size:1.5rem; font-weight:900; line-height:1.2; }
  .node.done { background:#1d6fe8; } .node.todo { background:#d92b2b; } .node.wait { background:#2a2f3d; color:#b8bfcc; } .node.later { background:transparent; border:2px dashed #4a5163; color:#8b93a3; } .node.run { background:#d98a00; }
  .node:not(:last-child)::after { content:'→'; position:absolute; right:-1.25rem; top:50%; transform:translateY(-50%); color:#8b93a3; font-size:1.1rem; font-weight:900; }
  #sheet { position:fixed; inset:0; background:#fff; color:#000; z-index:50; overflow:auto; color-scheme:light; }
  #sheet[hidden] { display:none; }
  #giftMemoBox { margin:0 0 1rem; }
  #giftMemoBox[hidden] { display:none; }
  #giftMemoBox .memoT { font-weight:900; margin-bottom:.3rem; }
  #giftMemo { width:100%; box-sizing:border-box; font:inherit; padding:.6rem; border:2px solid #000; border-radius:8px; background:#fffdf0; color:#000; resize:vertical; }
  #takeWrap { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px; color:#000; color-scheme:light; }
  #takeWrap[hidden] { display:none; }
  #takeWrap .takeBox { background:#fff; border-radius:14px; padding:1.2rem; width:100%; max-width:440px; font-size:1.05rem; line-height:1.6; }
  #takeWrap h2 { font-size:1.3rem; font-weight:900; margin:0 0 .6rem; }
  #takeWrap .row { display:flex; gap:.6rem; justify-content:flex-end; flex-wrap:wrap; margin-top:1rem; }
  #loginWrap { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px; color:#000; color-scheme:light; }
  #loginWrap[hidden] { display:none; }
  #loginBox { background:#fff; border-radius:14px; padding:1.2rem; width:100%; max-width:420px; }
  #loginBox h2 { font-size:1.3rem; font-weight:900; margin:0 0 .7rem; }
  #loginBox label { display:block; font-size:1rem; font-weight:700; margin:.6rem 0 .2rem; }
  #loginBox input { width:100%; box-sizing:border-box; font-size:1.15rem; padding:.6rem; border:2px solid #000; border-radius:8px; background:#fff; color:#000; }
  #loginMsg { min-height:1.5em; margin:.7rem 0; font-size:1rem; font-weight:700; }
  #loginBox .row { display:flex; gap:.6rem; justify-content:flex-end; }
  #ezFrameWrap { position:fixed; inset:0; z-index:60; background:#fff; display:flex; flex-direction:column; }
  #ezFrameWrap[hidden] { display:none; }
  #ezFrameTop { display:flex; justify-content:flex-end; padding:.5rem .8rem; background:#fff; border-bottom:1px solid #cfd3da; }
  #ezFrame { flex:1; width:100%; border:0; }
  .sheet-in { width:calc(100% - 2rem); max-width:900px; margin:0 auto; padding:1rem 0 3rem; font-size:20px; line-height:1.45; }
  .sheet-top { display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1rem; position:sticky; top:0; background:#fff; padding:.4rem 0; }
  .sheet-top h2 { font-size:1.6rem; font-weight:900; }
  .wbtn { display:inline-block; background:#fff; color:#000; border:2px solid #000; border-radius:8px; padding:.55rem 1rem; font:inherit; font-weight:800; cursor:pointer; text-decoration:none; margin:.2rem .3rem .2rem 0; }
  .wbtn.go { background:#0b57d0; border-color:#0b57d0; color:#fff; font-size:1.3rem; padding:.8rem 1.2rem; }
  .chk { display:flex; gap:.6rem; align-items:baseline; padding:.6rem 0; border-top:2px solid #c9ced6; font-weight:700; }
  .chk .i { flex:none; font-size:1.2em; } .chk.bad { color:#c81e1e; } .chk.ok .i { color:#0a7d3e; }
  .big { font-size:2.2rem; font-weight:900; margin:.3rem 0 .7rem; }
  .sub2 { font-size:1rem; font-weight:400; }
  #runBar { display:none; background:#10261d; border:1px solid var(--accent); color:var(--accent); border-radius:12px; padding:.8rem 1rem; margin-bottom:.8rem; font-size:.95rem; font-weight:700; line-height:1.6; }
  #runBar.bad { background:#2a1414; border-color:var(--red); color:var(--red); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><span>AI</span> 물류비서</h1>
    <div class="hdr-r"><span class="who" id="who">확인 중…</span><button class="btn" type="button" data-sheet="settings">설정</button></div>
  </div>
  <div id="runBar"></div>
  <div class="scene" id="scene"><canvas id="officeCv" width="720" height="286" role="img" aria-label="비서들이 일하는 건물 단면, 현재 상태를 보여 줍니다"></canvas></div>
  <div class="keys">
    <button id="startBtn" type="button" disabled><span class="fill"></span><span class="tx">오늘 하루 시작~!<br>화이팅~!<small class="txs">1초 동안 길게 눌러 주세요</small></span></button>
    <div id="actions"></div>
  </div>
  <div class="hint" id="startHint"></div>
  <div class="flow-box"><div class="flow-t">이벗 · 맨소래담</div><div id="flowMenso"></div></div>
  <div class="flow-box"><div class="flow-t">이지어드민 · 곡물도감</div><div class="flow" id="flowEz"></div></div>
</div>
<div id="takeWrap" hidden><div class="takeBox">
  <h2>상시 컴퓨터가 켜져 있습니다</h2>
  <p>어디서 진행할까요? 이 컴퓨터에서 하면 이지어드민과 이벗이 여기서 열립니다. 이 탭을 닫으면 상시 컴퓨터가 다시 맡습니다.</p>
  <div class="row"><button class="wbtn" type="button" id="takeLeave">상시 컴퓨터에 맡기기</button><button class="wbtn go" type="button" id="takeHere">이 컴퓨터에서</button></div>
</div></div>
<div id="loginWrap" hidden><div id="loginBox">
  <h2 id="loginTitle"></h2>
  <div id="loginDomainRow"><label for="loginDomain">도메인</label><input id="loginDomain" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <label for="loginId">아이디</label><input id="loginId" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="loginPw">비밀번호</label><input id="loginPw" type="password" autocomplete="new-password">
  <div id="loginMsg"></div>
  <div class="row"><button class="wbtn" type="button" id="loginClose">닫기</button><button class="wbtn go" type="button" id="loginGo">로그인</button></div>
</div></div>
<div id="ezFrameWrap" hidden><div id="ezFrameTop"><button class="wbtn" type="button" id="ezFrameClose">닫기</button></div><iframe id="ezFrame" title="일괄합포제외"></iframe></div>
<div id="sheet" hidden><div class="sheet-in"><div class="sheet-top"><h2 id="sheetTitle"></h2><button class="wbtn" type="button" id="sheetClose">닫기</button></div><div id="giftMemoBox" hidden><div class="memoT">사은품 메모</div><textarea id="giftMemo" rows="5" placeholder="이번 사은품 내용을 적어 두세요. 수령자 이름, 전화번호는 적지 마세요."></textarea><div class="sub2" id="giftMemoState"></div></div><div id="sheetBody"></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="wms_sync.js"></script>
<script src="/wms_access.js" data-page="secretary" data-floor="3"></script>
<script src="p9_fee.js"></script>
<script src="ez_split_calc.js"></script>
<script src="secretary_ez.js"></script>
<script src="secretary_menso.js"></script>
<script src="secretary_login.js"></script>
<script src="secretary_core.js"></script>
<script src="secretary_runner.js"></script>
<script src="secretary_office.js"></script>
<script>
/* ============================================================
   AI 물류비서 (메인 메뉴 이름, 설계서의 전담비서) — 시동 페이지 겸 헤드비서 (2026-11-01)
     secretary.html       폰·PC 어디서나: 시동·멈춤 명령을 보내고 결과를 봄
     secretary.html?run=1 상시 컴퓨터 전용 크롬(확장이 열어 둠): 명령을 받아 실행
   지금 시동 = 연결·로그인 점검 + 곡물도감 미리 보기(읽기 전용). 합포 저장·송장 부여 없음
   데이터: secretary/ runner · sites/{site} · jobs/{jobKey} · control · settings · commands/{id} · notes/{id}
============================================================ */
var C = window.SECRETARY_CORE;
var $ = function(id){ return document.getElementById(id); };
var IS_RUN = new URLSearchParams(location.search).get('run') === '1', LOCAL = false;
var db = null, root = null, me = null, offset = 0;
var OFFICE = window.SECRETARY_OFFICE.mount($('scene'), new URLSearchParams(location.search).get('run') === '1' ? { fps: 4 } : null);
var RUNNER = null, CONTROL = null, JOBS = {}, SITES_V = {}, NOTES = {}, SETTINGS = {}, GID = null, CAMPAIGNS = {};

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function now(){ return Date.now() + offset; }
function ago(ts){
  if (!ts) return '기록 없음';
  var m = Math.floor((now() - ts) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  if (m < 1440) return Math.floor(m / 60) + '시간 전';
  return Math.floor(m / 1440) + '일 전';
}
function runningJob(){ return Object.keys(JOBS).map(function(k){ return JOBS[k]; }).find(function(j){ return j && j.state === 'running'; }); }

/* ── 화면 ── 키(시동·해야 할 일)와 액정(사무실), 흐름도만. 내용은 눌러서 흰 화면으로 */
var M = window.SECRETARY_MENSO;
var EBUT = { collect: '/jsp/site/site230main.jsp', match: '/jsp/site/site217edit.jsp', confirm: '/jsp/site/site310main.jsp', gift: '/html/site3110main.html', invoice: '/jsp/site/site320main.jsp', ship: '/jsp/site/site410main.jsp', send: '/jsp/site/site420main.jsp' };
function latestKey(recipe){
  return Object.keys(JOBS).filter(function(x){ return JOBS[x] && (JOBS[x].recipe || 'ez_daily') === recipe && JOBS[x].state !== 'running'; }).sort(function(a, b){ return (JOBS[b].at || 0) - (JOBS[a].at || 0); })[0];
}
function latest(recipe){
  var k = latestKey(recipe);
  return k ? JOBS[k] : null;
}
function won(n){ return Number(n || 0).toLocaleString('ko-KR') + '원'; }
function mensoFlow(){ var j = latest('menso_read'), f = (j && j.menso && j.menso.flow) || M.flow({ rows: [] }, []); return { orders: f.orders, waiting: f.waiting, steps: M.bizemSteps(f.steps, SITES_V.bizem) }; }
function ezSplitJob(){
  var k = Object.keys(JOBS).filter(function(x){ return JOBS[x] && JOBS[x].recipe === 'ez_split'; }).sort(function(a, b){ return (JOBS[b].at || 0) - (JOBS[a].at || 0); })[0];
  return k ? JOBS[k] : null;
}
function ezSteps(){ return C.ezFlow(SITES_V.ezadmin, latest('ez_daily'), ezSplitJob()); }
function nodeHtml(s, i){
  return '<button class="node ' + s.state + '" type="button" data-sheet="' + esc(s.id) + '"><span class="no">' + (i + 1) + '</span>' + esc(s.name) + (s.state === 'todo' && s.count ? '<b>' + s.count + '건</b>' : '') + '<small>' + esc(s.who) + '</small></button>';
}
/* 지금 해야 할 일만 시동과 같은 크기의 버튼으로 */
function actions(){
  var out = [], ebut = SITES_V.ebut;
  if (CONTROL && CONTROL.pause) out.push(['settings', '전체 멈춤 중']);
  if (ebut && ebut.state !== 'ok') out.push(['ebut_login', '이벗 로그인 필요']);
  if (SITES_V.ezadmin && SITES_V.ezadmin.state !== 'ok') out.push(['ez_login', '이지어드민 로그인 필요']);
  if (SITES_V.bizem && SITES_V.bizem.state === 'login') out.push(['bizem_login', '비젬 로그인 필요']);
  var draftN = Object.keys(CAMPAIGNS).filter(function(k){ return !CAMPAIGNS[k].confirmed && activeCampaign(CAMPAIGNS[k]); }).length;
  if (draftN) out.push(['gift', '행사표 확인 ' + draftN + '건']);
  mensoFlow().steps.forEach(function(s){ if (s.state === 'todo') out.push([s.id, s.name + (s.count ? ' ' + s.count + '건' : '')]); });
  ezSteps().forEach(function(s){ if (s.state === 'run') out.push([s.id, s.name + ' 진행 중']); if (s.state === 'todo' && s.id !== 'ez_login') out.push([s.id, s.id === 'ez_preview' ? '이지어드민 확인 ' + s.count + '건' : s.name + (s.count ? ' ' + s.count + '건' : '')]); });
  return out;
}
function activeCampaign(c){ var d = C.kstDate(now()); return !c.to || d <= c.to; }
function paint(){
  var block = C.startBlock({ runner: RUNNER, control: CONTROL, job: runningJob(), now: now() });
  if (!pending) { $('startBtn').disabled = !!block; $('startHint').textContent = block || ''; }
  var acts = actions();
  $('actions').innerHTML = acts.map(function(a){ return '<button class="act" type="button" data-sheet="' + esc(a[0]) + '">' + esc(a[1]) + '</button>'; }).join('');
  var mf = mensoFlow().steps, no = 0;
  /* 번호는 그룹을 넘어 1~10 으로 이어짐 */
  $('flowMenso').innerHTML = M.GROUPS.map(function(g){
    var nodes = g.ids.map(function(id){ var s = mf.find(function(x){ return x.id === id; }); return s ? nodeHtml(s, no++) : ''; }).join('');
    return '<div class="fgroup"><div class="fgroup-t">' + esc(g.name) + '</div><div class="flow n' + g.ids.length + '">' + nodes + '</div></div>';
  }).join('');
  $('flowEz').innerHTML = ezSteps().map(nodeHtml).join('');
  OFFICE.update(C.officeRooms({ runner: RUNNER, control: CONTROL, sites: SITES_V, jobs: JOBS, noteCount: acts.length, now: now() }));
  if (SHEET) paintSheet();
}

/* ── 흰 화면: 해당 내용만 체크리스트로 ── */
var SHEET = null;
function chk(ok, text){ return '<div class="chk ' + (ok ? 'ok' : 'bad') + '"><span class="i">' + (ok ? '✓' : '✕') + '</span><span>' + text + '</span></div>'; }
function goLink(href, label){ return '<a class="wbtn go" href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(label) + '</a>'; }
function ebutLink(id, label){ return goLink('https://www.ebut3pl.co.kr' + EBUT[id], label); }
function sheetGift(){
  var html = '', ids = Object.keys(CAMPAIGNS).filter(function(k){ return activeCampaign(CAMPAIGNS[k]); }), m = (latest('menso_read') || {}).menso;
  /* 행사표는 건수 계산 기준. 평소에는 메모를 보고, 확인 전 행사표만 보여 줌 */
  ids.filter(function(id){ return !CAMPAIGNS[id].confirmed; }).forEach(function(id){
    var c = CAMPAIGNS[id];
    html += '<div class="big">' + esc(c.name) + '</div>';
    (c.tiers || []).forEach(function(t){ html += '<div class="chk ok"><span class="i">·</span><span>' + esc(won(t.min)) + ' 이상 → ' + esc(t.label || '') + '</span></div>'; });
    if (c.note) html += chk(false, esc(c.note));
    if (!c.confirmed) html += '<p><button class="wbtn go" type="button" data-camp="' + esc(id) + '">내용 확인 완료</button></p>';
  });
  ((m && m.campaigns) || []).forEach(function(c){
    (c.needList || []).forEach(function(n){ html += chk(false, esc(n.no) + ' · ' + esc(won(n.amt)) + ' · ' + esc(won(n.min)) + ' 구간'); });
    (c.wrong || []).forEach(function(w){ html += chk(false, esc(w.no) + ' · ' + esc(won(w.amt)) + ' · ' + esc(w.why)); });
    if (c.past) html += '<p class="sub2">이미 나간 주문 중 구간과 다른 ' + c.past + '건은 할 일에서 뺐습니다.</p>';
  });

    /* 로그인 화면 등으로 페이지가 넘어가면 앞 요청이 사라지므로 새 도우미에 다시 보냄. 저장 명령은 두 번 나가면 안 되어 실패로 돌림 */
    Object.keys(h.pend).forEach(function(id){
      if (C.HELPER_WRITE.indexOf(h.pend[id].cmd) >= 0) { var w = h.pend[id]; delete h.pend[id]; clearTimeout(w.t); w.no(new Error('작업 중 이지어드민 화면이 바뀌었습니다')); return; }
      h.win.postMessage({ to: site.to, id: Number(id), cmd: h.pend[id].cmd, args: h.pend[id].args }, h.origin); });
    return;
  }
  var p = h.pend[m.id];
  if (!p) return;
  delete h.pend[m.id];
  clearTimeout(p.t);
  if (m.ok) p.ok(m.data); else p.no(new Error(m.err === 'LOGIN' ? '로그인이 필요합니다' : m.err));
});
function ask(site, cmd, args, wait){
  C.assertSafeCmd(cmd);
  return askAny(site, cmd, args, wait);
}
function askAny(site, cmd, args, wait){
  var h = H[site.id];
  if (!h || !h.win) return Promise.reject(new Error('도우미가 연결되지 않았습니다'));
  return new Promise(function(ok, no){
    var id = ++h.seq;
    h.pend[id] = { cmd: cmd, args: args || {}, ok: ok, no: no, t: setTimeout(function(){ delete h.pend[id]; no(new Error('도우미 응답 없음')); }, wait || HELPER_WAIT) };
    h.win.postMessage({ to: site.to, id: id, cmd: cmd, args: args || {} }, h.origin);
  });
}
/* 이벗 주문서목록 읽기 → 행사표로 사은품 대상 계산. 이벗에 쓰지 않음 */
function mensoPreview(range){
  var site = C.SITES.find(function(s){ return s.id === 'ebut'; });
  return Promise.all([
    ask(site, 'orders', { cust: C.MENSO_CUST, from: range.from, to: range.to }, SEARCH_WAIT),
    root.child('campaigns').get().then(function(s){ var v = s.val() || {}; return Object.keys(v).map(function(k){ return v[k]; }); })
  ]).then(function(r){ return window.SECRETARY_MENSO.preview(r[0], r[1]); });
}
/* 매칭 화면 자료 읽기 (secretary_match.html). 이벗에 쓰지 않음 */
function matchRead(range){
  var site = C.SITES.find(function(s){ return s.id === 'ebut'; });
  return ask(site, 'matchRead', { cust: C.MENSO_CUST, from: range.from, to: range.to, terms: C.MATCH_TERMS }, SEARCH_WAIT * 2);
}
function matchSearch(text){
  var site = C.SITES.find(function(s){ return s.id === 'ebut'; });
  return ask(site, 'matchSearch', { cust: C.MENSO_CUST, text: text }, SEARCH_WAIT);
}
/* 곡물도감 검색 → 기존대로 계산. 피킹이지 박스 기록은 읽기만 함 */
function ezPreview(range){
  return ezPlan(range);
}
var EZ_SITE = function(){ return C.SITES.find(function(s){ return s.id === 'ezadmin'; }); };
/* 합포 분할 화면의 요청: 검색은 늦게 뜬 결과까지 기다리고, 저장 명령은 정해진 것만 도우미로 보냄 */
function ezSearch(args){
  var site = EZ_SITE();
  return window.SECRETARY_EZ.searchSettled(
    function(){ return ask(site, 'search', args, SEARCH_WAIT); },
    function(){ return ask(site, 'read'); },
    function(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
  );
}
/* 로그인 화면을 열어 입력값을 한 번 넣음. 저장 명령과 같아서 페이지가 바뀌어도 다시 보내지 않음 */
function loginWith(site, creds){
  if (extTooOld(site)) return Promise.resolve({ tried: false, why: '확장 프로그램을 ' + site.minExt + ' 로 업데이트해 주세요' });
  var h = H[site.id] || (H[site.id] = { pend: {}, seq: 0 });
  h.win = null;
  return new Promise(function(ok, no){
    var t = setTimeout(function(){ h.onReady = null; no(new Error('로그인 화면이 열리지 않음')); }, HELPER_WAIT);
    h.onReady = function(){ clearTimeout(t); ok(); };
    if (!window.open(site.login, site.tab)) { clearTimeout(t); h.onReady = null; no(new Error('팝업이 막힘')); }
  }).then(function(){ return askAny(site, 'login', creds, 15000); }).then(function(r){
    if (!r.tried) return r;
    return new Promise(function(ok){ setTimeout(function(){ ok(r); }, 8000); });
  });
}
function ezWrite(cmd, args){
  if (C.HELPER_WRITE.indexOf(cmd) < 0) return Promise.reject(new Error('허용되지 않은 요청: ' + cmd));
  return askAny(EZ_SITE(), cmd, args, EZ_WAIT[cmd] || 300000);
}
var EZ_WAIT = { commit: 620000, printPrep: 170000, printGo: 60000, printStatus: 15000, printEnd: 15000, printClose: 15000 };
function ezPing(){ return ask(EZ_SITE(), 'ping', {}, 8000).then(function(r){ return r.page === 'DG00'; }, function(){ return false; }); }
function ezPlan(range){
  var site = EZ_SITE();
  return Promise.all([
    window.SECRETARY_EZ.searchSettled(
      function(){ return ask(site, 'search', { supplier: C.RECIPES.ez_daily.supplier, from: range.from, to: range.to }, SEARCH_WAIT); },
      function(){ return ask(site, 'read'); },
      function(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
    ),
    db.ref('wms_sync/groups/' + GID + '/picking_ez/boxes').get().then(function(s){ return s.val() || {}; })
  ]).then(function(r){ return window.SECRETARY_EZ.preview(r[0], r[1], window.EZ_SPLIT, window.P9_FEE); });
}
/* 확장이 옛 판이면 도우미가 안 켜져 1분을 기다리게 되므로 바로 알림 */
function extTooOld(site){ var v = document.documentElement.dataset.mkwExt || ''; return !!site.minExt && (!v || v < site.minExt); }
function openSite(site){
  if (extTooOld(site)) return Promise.reject(new Error('확장 프로그램을 ' + site.minExt + ' 로 업데이트해 주세요'));
  var h = H[site.id] || (H[site.id] = { pend: {}, seq: 0 });
  h.win = null;
  return new Promise(function(ok, no){
    var t = setTimeout(function(){ h.onReady = null; no(new Error('도우미가 켜지지 않습니다. 확장 프로그램을 확인하세요.')); }, HELPER_WAIT);
    h.onReady = function(){ clearTimeout(t); ok(); };
    if (!window.open(site.url, site.tab)) { clearTimeout(t); h.onReady = null; no(new Error('팝업이 막혔습니다. makewon.com 팝업을 허용하세요.')); }
  }).then(function(){ return pingSite(site, 2); });
}
/* 이지어드민 표(#grid1)는 도우미보다 늦게 생길 수 있어 화면이 안 보이면 5초 뒤 두 번 더 물어봄 */
function pingSite(site, retries){
  return ask(site, 'ping').then(function(r){
    if (site.id !== 'ezadmin' || r.page || !retries) return r;
    return new Promise(function(ok){ setTimeout(ok, 5000); }).then(function(){ return pingSite(site, retries - 1); });
  });
}

/* 로그인 화면을 열어 도우미에게 한 번 시도시킴. 비밀번호는 크롬이 채운 값만 쓰고 이쪽으로 오지 않음 */
function relogin(site){
  var h = H[site.id] || (H[site.id] = { pend: {}, seq: 0 });
  h.win = null;
  return new Promise(function(ok, no){
    var t = setTimeout(function(){ h.onReady = null; no(new Error('로그인 화면이 열리지 않음')); }, HELPER_WAIT);
    h.onReady = function(){ clearTimeout(t); ok(); };
    if (!window.open(site.login, site.tab)) { clearTimeout(t); h.onReady = null; no(new Error('팝업이 막힘')); }
  }).then(function(){
    /* 크롬이 칸을 채울 시간 */
    return new Promise(function(ok){ setTimeout(ok, 3000); });
  }).then(function(){ return ask(site, 'relogin'); }).then(function(r){
    if (!r.tried) return r;
    return new Promise(function(ok){ setTimeout(function(){ ok(r); }, 8000); });
  });
}

function makeStore(){
  return {
    claimRunner: function(id, info){
      return root.child('runner').transaction(function(cur){
        if (cur && cur.id && cur.id !== id) return;
        return Object.assign({}, info, { id: id, ts: now() });
      }).then(function(r){ return r.committed; });
    },
    /* 신호: 등록이 해제됐거나 다른 PC 로 바뀌었으면 다시 차지하지 않음 */
    beatRunner: function(id, info){
      return root.child('runner').transaction(function(cur){
        if (cur === null) return null;   /* 서버 값을 아직 모름. 진짜 비어 있으면 아래에서 거절 */
        if (cur.id !== id) return;
        return Object.assign({}, info, { id: id, ts: now() });
      }).then(function(r){ var v = r.snapshot.val(); return !!r.committed && !!v && v.id === id; });
    },
    getRunner: function(){ return root.child('runner').get().then(function(s){ return s.val(); }); },
    /* 시작 버튼으로 이 컴퓨터가 넘겨받음. 앞 헤드비서는 다음 신호 때 자기 차례가 아님을 알고 멈춤 */
    takeRunner: function(id, info){ return root.child('runner').set(Object.assign({}, info, { id: id, ts: now() })); },
    claimCommand: function(id){
      return root.child('commands/' + id + '/status').transaction(function(cur){
        if (cur) return;
        return 'taken';
      }).then(function(r){ return r.committed; });
    },
    setCommand: function(id, p){ return root.child('commands/' + id).update(p); },
    getJobs: function(){ return root.child('jobs').get().then(function(s){ return s.val(); }); },
    setJob: function(k, p){ return root.child('jobs/' + k).update(p); },
    getControl: function(){ return root.child('control').get().then(function(s){ return s.val(); }); },
    setSite: function(id, p){ return root.child('sites/' + id).set(p); },
    setMatch: function(path, p){ return root.child('match/' + path).set(p); },
    clearLoginReq: function(id){ return root.child('loginreq/' + id).remove(); },
    setLoginResult: function(id, p){ return root.child('loginres/' + id).set(p); },
    claimCall: function(id){
      return root.child('ezcall/' + id + '/status').transaction(function(cur){
        if (cur) return;
        return 'taken';
      }).then(function(r){ return r.committed; });
    },
    setCall: function(id, p){ return root.child('ezcall/' + id).update(p); }
  };
}

/* 배포해도 이 탭은 옛 코드로 계속 돌기 때문에, 새 판이 올라오면 작업이 없을 때 새로고침 */
var RUNNER_OBJ = null;
function reloadIfNewVersion(){
  fetch('secretary_core.js?cb=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(t){
    var m = t.match(/PAGE_VER = '([^']+)'/);
    if (m && m[1] !== C.PAGE_VER && !runningJob() && !(RUNNER_OBJ && RUNNER_OBJ.mustStay())) location.reload();
  }).catch(function(){});
}

/* 우체국 대신 조회 (functions-settle/epost.js) — 서버→우체국이 막힐 때 secretary/epost/req/{번호} 가 오면 확장으로 읽어 res/{번호} 에 남김 */
var epostSeq = 0;
function extEpost(no){
  return new Promise(function(ok){
    var id = ++epostSeq, timer;
    function on(e){ if (e.source !== window || !e.data || e.data.to !== 'mkwPageEpost' || e.data.id !== id) return; end(e.data.res); }
    function end(r){ clearTimeout(timer); window.removeEventListener('message', on); ok(r); }
    window.addEventListener('message', on);
    timer = setTimeout(function(){ end({ err: '확장 응답 없음' }); }, 15000);
    window.postMessage({ to: 'mkwExtEpost', id: id, no: no }, location.origin);
  });
}
function startEpostRelay(){
  var far = root.child('epost');
  far.child('res').remove();
  far.child('req').on('child_added', function(s){
    var no = s.key, q = s.val();
    s.ref.remove();
    if (!q || now() - q.at > 60000) return;
    extEpost(no).then(function(r){
      far.child('res/' + no).set(Object.assign({}, r, { at: firebase.database.ServerValue.TIMESTAMP }));
      setTimeout(function(){ far.child('res/' + no).remove(); }, 300000);
    });
  });
}

function startRunner(){
  if (!navigator.locks) { runBar('이 브라우저에서는 헤드비서를 실행할 수 없습니다.', true); return; }
  navigator.locks.request('mkw_secretary_runner', { ifAvailable: true }, function(lock){
    if (!lock) { runBar('다른 탭에서 헤드비서가 이미 실행 중입니다. 이 탭은 닫아도 됩니다.', true); return; }
    return new Promise(function(){ runMain(); });   /* 탭이 닫힐 때까지 잠금 유지 */
  });
}
var LOGIN_KEY = null;
/* 맡을 때마다 새 키. 개인키는 메모리에만, 공개키만 올림 */
function publishLoginKey(){
  return window.SECRETARY_LOGIN.createKeys().then(function(k){
    LOGIN_KEY = k.privateKey;
    return root.child('loginKey').set({ jwk: k.publicJwk, at: firebase.database.ServerValue.TIMESTAMP });
  }).catch(function(e){ runBar('로그인 입력을 준비하지 못했습니다: ' + e.message, true); });
}
function runMain(local){
  var id = runnerId();
  var runner = window.SECRETARY_RUNNER.createRunner({ store: makeStore(), openSite: openSite, ezPreview: ezPreview, ezSearch: ezSearch, ezWrite: ezWrite, ezPing: ezPing, mensoPreview: mensoPreview, matchRead: matchRead, matchSearch: matchSearch, relogin: relogin, login: loginWith, bizemCounts: function(){ return ask(C.SITES.find(function(s){ return s.id === 'bizem'; }), 'counts', {}, 30000); }, unseal: function(sealed){ return window.SECRETARY_LOGIN.unseal(LOGIN_KEY, sealed); }, now: now, runnerId: id, info: runnerInfo() });
  RUNNER_OBJ = runner;
  var stopped = true, started = false, taking = false, RUN_TEXT = local ? '이 컴퓨터에서 진행 중입니다. 이 탭을 닫으면 상시 컴퓨터가 다시 맡습니다.' : '헤드비서 실행 중입니다. 이 탭을 닫지 마세요.';
  function refuse(){
    stopped = true;
    if (local) root.child('runner').onDisconnect().cancel();
    runBar(local ? '다른 컴퓨터가 가져갔거나 연결이 끊겼습니다. 다시 하려면 새로고침 후 시작 버튼을 눌러 주세요.' : '지금 다른 컴퓨터에서 일하는 중입니다. 그 컴퓨터가 끝나면 여기서 다시 맡습니다.', local);
    if (local) LOCAL = false;
  }
  function listen(){
    if (!local) startEpostRelay();
    setInterval(function(){
      if (stopped) return;
      makeStore().beatRunner(id, runnerInfo()).then(function(mine){
        if (!mine) return refuse();
        runBar(RUN_TEXT);
        if (!local) reloadIfNewVersion();
      }).catch(function(e){ runBar('신호를 보내지 못했습니다: ' + e.message, true); });
    }, 60000);
    setInterval(function(){ if (!stopped) runner.printWatch().catch(function(){}); }, 60000);
    if (C.KEEP_ALIVE_ON) setInterval(function(){ if (!stopped) runner.keepAlive().catch(function(){}); }, C.KEEP_ALIVE_MS);
    root.child('loginreq').on('child_added', function(s){ var r = s.val(); if (r && !stopped) runner.handleLogin(s.key, r).catch(function(){}); });
    root.child('ezcall').on('child_added', function(s){
      var c = s.val();
      if (stopped || !c || c.status) return;
      if (now() - (c.at || 0) > C.RELAY_TTL) { s.ref.remove(); return; }   /* 화면이 닫혀 남은 요청 */
      runner.handleCall(s.key, c).catch(function(){});
    });
    root.child('commands').limitToLast(20).on('child_added', function(s){
      var c = s.val();
      if (stopped || !c || c.status) return;
      runner.handleCommand(s.key, c).catch(function(e){ makeStore().setCommand(s.key, { status: 'refused', why: e.message }); });
    });
  }
  function take(){
    if (taking || !stopped) return;
    taking = true;
    return runner.claim().then(function(ok){
      if (!ok) return refuse();
      if (local) root.child('runner').onDisconnect().remove();
      return publishLoginKey().then(function(){
        stopped = false;
        runBar(RUN_TEXT);
        if (!started) { started = true; listen(); }
      });
    }).catch(function(e){ runBar('헤드비서를 시작하지 못했습니다: ' + e.message, true); }).then(function(){ taking = false; });
  }
  take();
  /* 상시 컴퓨터: 다른 컴퓨터가 끝나 실행 PC 가 비면 다시 맡음 */
  if (!local) root.child('runner').on('value', function(s){ if (stopped && s.val() === null) take(); });
}

/* ── 시작 ── */
WMSync.init('secretary', { requireAuth: true });
var started = false;
WMSync.onAuth(function(st){
  if (!st.user) { $('who').textContent = '로그인 필요'; return; }
  if (started) return;
  started = true;
  me = st.user;
  GID = st.groupId;
  $('who').textContent = (me.email || '').split('@')[0];
  db = firebase.database();
  root = db.ref('secretary');
  db.ref('.info/serverTimeOffset').on('value', function(s){ offset = s.val() || 0; paint(); });
  root.child('runner').on('value', function(s){ RUNNER = s.val(); paint(); });
  root.child('control').on('value', function(s){ CONTROL = s.val(); paint(); });
  root.child('settings').on('value', function(s){ SETTINGS = s.val() || {}; paint(); });
  root.child('campaigns').on('value', function(s){ CAMPAIGNS = s.val() || {}; paint(); });
  root.child('giftMemo').on('value', function(s){ GIFT_MEMO = s.val(); paintGiftMemo(); });
  root.child('sites').on('value', function(s){ SITES_V = s.val() || {}; paint(); });
  root.child('jobs').limitToLast(60).on('value', function(s){ JOBS = s.val() || {}; paint(); });
  root.child('notes').limitToLast(5).on('value', function(s){ NOTES = s.val() || {}; paint(); });
  setInterval(paint, 30000);
  if (IS_RUN) startRunner();
});
</script>
