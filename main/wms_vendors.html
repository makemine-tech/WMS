<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>메이크창고 WMS — 업체등록 · 상품연결</title>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="/wms_access.js" data-page="wms_vendors" data-floor="2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0F172A;font-family:system-ui,sans-serif;color:#E2E8F0;min-height:100vh;padding:24px 16px 90px;}
.wrap{max-width:760px;margin:0 auto;}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #334155;}
.badge-admin{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;color:#F87171;white-space:nowrap;}
.btn-back{background:rgba(255,255,255,.06);color:#94A3B8;border:1px solid #334155;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;}
.btn-back:hover{background:rgba(255,255,255,.1);}
h1{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px;}
.sub{font-size:12px;color:#64748B;margin-bottom:22px;line-height:1.6;}
.section{margin-bottom:26px;}
.section-h{font-size:13px;font-weight:800;color:#94A3B8;letter-spacing:.03em;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.count-chip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:rgba(255,255,255,.06);color:#94A3B8;}
.inp{background:#0F172A;border:1px solid #334155;border-radius:8px;padding:9px 11px;color:#E2E8F0;font-size:13px;outline:none;font-family:inherit;}
.inp:focus{border-color:#3B82F6;}
.btn{border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-primary{background:#2563EB;color:#fff;}
.vrow{display:flex;align-items:center;gap:10px;padding:11px 13px;background:rgba(255,255,255,.03);border:1px solid #334155;border-radius:10px;margin-bottom:8px;}
.vrow .vmeta{flex:1;min-width:0;}
.vrow .vname{font-weight:700;font-size:14px;}
.vrow .vmail{font-size:11px;color:#64748B;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vrow .vcount{font-size:11px;color:#A78BFA;font-weight:700;flex-shrink:0;}
.btn-del{background:rgba(239,68,68,.15);color:#F87171;border:1px solid rgba(239,68,68,.3);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;}
.btn-prev{background:rgba(124,58,237,.15);color:#A78BFA;border:1px solid rgba(124,58,237,.3);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;}
.btn-prev:hover{background:rgba(124,58,237,.28);}
.add-form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.add-form .inp{flex:1;min-width:120px;}
.add-hint{font-size:11px;color:#64748B;margin-top:7px;line-height:1.5;}
.vcard{background:rgba(255,255,255,.03);border:1px solid #334155;border-radius:10px;padding:11px 13px;margin-bottom:8px;}
.vcard-top{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.vcard-top .vname{flex:1;font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vmails{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;}
.email-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.3);color:#93C5FD;border-radius:20px;padding:3px 5px 3px 11px;font-size:11px;font-weight:600;}
.email-chip a{color:#60A5FA;cursor:pointer;font-weight:800;text-decoration:none;padding:0 5px;border-radius:50%;line-height:1.4;}
.email-chip a:hover{background:rgba(239,68,68,.25);color:#F87171;}
.muted-sm{font-size:11px;color:#475569;}
.vmail-add{display:flex;gap:6px;}
.vmail-add .inp{flex:1;padding:7px 10px;font-size:12px;min-width:0;}
.vmail-add button{background:rgba(96,165,250,.15);color:#93C5FD;border:1px solid rgba(96,165,250,.3);border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.prow{display:flex;align-items:center;gap:10px;padding:9px 13px;background:rgba(255,255,255,.03);border:1px solid #334155;border-radius:9px;margin-bottom:6px;}
.prow.unlinked{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.06);}
.prow .pname{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border-radius:6px;padding:2px 6px;margin:-2px -6px;transition:background .12s;}
.prow .pname:hover{background:rgba(96,165,250,.14);}
.rename-hint{font-size:11px;color:#60A5FA;opacity:.55;margin-left:5px;}
.prow .pname:hover .rename-hint{opacity:1;}
.prow .pstale{font-size:10px;color:#64748B;font-weight:500;margin-left:6px;}
.pmain{flex:1;min-width:0;}
.pmain .pname{display:block;}
.ploc{font-size:11.5px;color:#CBD5E1;margin-top:4px;line-height:1.55;white-space:normal;}
.ploc .lw{color:#94A3B8;font-weight:700;margin-right:4px;}
.ploc .lc{display:inline-block;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);color:#FDE68A;border-radius:6px;padding:0 6px;margin:1px 3px 1px 0;font-weight:700;}
.ploc .lc small{color:#CBD5E1;font-weight:600;margin-left:3px;}
.ploc .ltot{color:#FBBF24;font-weight:800;margin-left:4px;}
.pzero{display:inline-block;font-size:10px;font-weight:700;color:#FCA5A5;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.35);border-radius:10px;padding:1px 7px;margin-left:8px;vertical-align:middle;}
.sel{background:#0F172A;border:1px solid #334155;border-radius:7px;padding:7px 9px;color:#E2E8F0;font-size:12px;outline:none;font-family:inherit;flex-shrink:0;max-width:170px;}
.sel.none{color:#FBBF24;border-color:rgba(251,191,36,.4);}
.unlinked-banner{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:10px;padding:12px 14px;font-size:12px;color:#FCD34D;line-height:1.6;margin-bottom:12px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1E293B;border:1px solid #334155;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;}
.toast.show{opacity:1;}
/* 유닛 컬러 칸 — 실선=그룹 통일 색, 점선=아직 통일 전(창고 색), ≠=창고마다 다름 */
.swatch{width:30px;height:30px;flex-shrink:0;border-radius:7px;border:2px dashed #475569;background:transparent;cursor:pointer;position:relative;padding:0;align-self:center;}
.swatch.set{border:2px solid #E2E8F0;}
.swatch:hover{transform:scale(1.08);}
.sw-diff{position:absolute;right:-7px;top:-8px;background:#F59E0B;color:#0F172A;font-size:11px;font-weight:900;border-radius:9px;padding:0 4px;line-height:15px;}
.btn-unify{margin-left:auto;background:rgba(245,158,11,.15);color:#FBBF24;border:1px solid rgba(245,158,11,.4);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer;}
.clr-pop{position:absolute;z-index:1000;background:#1E293B;border:1px solid #475569;border-radius:10px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.clr-pop .cp-h{font-size:12px;font-weight:800;margin-bottom:6px;max-width:220px;}
.clr-pop .cp-h span{display:block;font-size:10.5px;color:#94A3B8;font-weight:600;margin-top:2px;}
.clr-pop .cp-now{font-size:10.5px;color:#94A3B8;margin-bottom:7px;display:flex;align-items:center;gap:3px;}
.clr-pop .cp-now i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #64748B;}
.clr-pop .cp-now b{color:#FBBF24;margin-left:4px;}
.clr-pop .cp-row{display:flex;gap:4px;margin-bottom:4px;}
.clr-pop .cp-chip{width:24px;height:24px;border-radius:5px;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0;}
.clr-pop .cp-chip:hover{transform:scale(1.15);}
.clr-pop .cp-chip.on{outline:2px solid #fff;outline-offset:1px;}
.center{text-align:center;padding:60px 20px;color:#64748B;font-size:14px;}
.spinner{width:24px;height:24px;border:2px solid #334155;border-top-color:#3B82F6;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:#64748B;padding:18px;font-size:12px;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="center"><div class="spinner"></div>인증 확인 중...</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* wms_access.js 가 먼저 초기화했을 수 있다 */
if(!firebase.apps.length) firebase.initializeApp({
  apiKey:"AIzaSyAM2t9dvtStrXNam-YAiq19yD8FHwKpPmI",
  authDomain:"makewon.com",
  databaseURL:"https://makechango-wms-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"makechango-wms",
  storageBucket:"makechango-wms.firebasestorage.app",
  messagingSenderId:"333385336098",
  appId:"1:333385336098:web:94f07492421965ab32917b"
});
var auth=firebase.auth(), db=firebase.database();
var app=document.getElementById('app'), toastEl=document.getElementById('toast');

var GID = (new URLSearchParams(location.search).get('gid')) || localStorage.getItem('wms_adminGroupId') || '';

var _products=[];   /* 현재 재고 상품명 (창고 slots 합집합 — 상품별재고와 동일) */
var _vendors={};    /* vendorId -> {name,email,createdAt} */
var _map={};        /* productKey -> {name, vendorId} */
var _locs={};       /* 상품명 -> [{wid, whName, ck, qty, exp}] — 미연결 상품 위치·수량 표시용 */
var _wids=[];       /* 그룹 창고 id 목록 — 색을 모든 창고에 같이 쓴다 */
var _grpClr={};     /* 상품명 -> 그룹 통일 색 (vendorConfig/{gid}/colors) */
var _whClr={};      /* 상품명 -> {색: 그 색을 쓰는 창고 수} — 창고마다 색이 다른지 보기용 */

/* 유닛 컬러 — 창고관리(wms.html)와 같은 팔레트 */
var PAL_ROWS=[['#B22222','#FF0000','#FF6666','#FFCCCC'],['#CC7A00','#FFA500','#FFC04D','#FFE5B3'],['#B3B300','#FFFF00','#FFFF66','#FFFFCC'],['#006400','#008000','#4CAF50','#C8E6C9'],['#00008B','#0000FF','#6666FF','#CCCCFF'],['#000033','#000080','#333399','#9999CC'],['#004D40','#008080','#4DB6AC','#B2DFDB'],['#4B0082','#800080','#B366B3','#E6CCE6'],['#000000','#333333','#666666','#999999','#CCCCCC','#FFFFFF']];
/* 창고 pColors 와 같은 키 인코딩 — Firebase 키에 못 쓰는 . # $ / [ ] (와 %) 만 %XX 로 */
function clrEnc(k){return String(k).replace(/[%.#$\/\[\]]/g,function(c){return '%'+c.charCodeAt(0).toString(16).toUpperCase();});}
function clrDec(k){return String(k).replace(/%(25|2E|23|24|2F|5B|5D)/g,function(m,h){return String.fromCharCode(parseInt(h,16));});}
function decMap(o){var n={};Object.keys(o||{}).forEach(function(k){n[clrDec(k)]=o[k];});return n;}
/* 창고 색 중 가장 많이 쓰는 색 */
function topWhClr(nm){var m=_whClr[nm]||{},best='',bn=0;Object.keys(m).forEach(function(c){if(m[c]>bn){bn=m[c];best=c;}});return best;}

function colAlpha(c){ var s=String.fromCharCode(65+(c%26)); if(c>=26) s=String.fromCharCode(65+Math.floor(c/26)-1)+s; return s; }
/* 칸 키 "r-c"(0부터) → 배치도 좌표 "B-3" (창고관리 칸 표기와 동일) */
function cellLabel(ck){ var p=String(ck).split('-'), r=+p[0], c=+p[1]; return (isNaN(r)||isNaN(c))?String(ck):colAlpha(c)+'-'+(r+1); }
function nf(n){ return (+n||0).toLocaleString('ko-KR'); }
/* 위치·수량 한 줄: 창고별로 "B-3 120 · C-5×2 240 — 총 3팔 360개" */
function locHtml(nm){
  var arr=_locs[nm]; if(!arr||!arr.length) return '';
  var byWh={}, order=[];
  arr.forEach(function(l){ if(!byWh[l.wid]){ byWh[l.wid]={name:l.whName, cells:{}, cOrder:[]}; order.push(l.wid); }
    var w=byWh[l.wid], lb=cellLabel(l.ck);
    if(!w.cells[lb]){ w.cells[lb]={n:0, qty:0, ck:l.ck}; w.cOrder.push(lb); }
    w.cells[lb].n++; w.cells[lb].qty+=(+l.qty||0); });
  var totP=0, totQ=0;
  var lines=order.map(function(wid){
    var w=byWh[wid];
    w.cOrder.sort(function(a,b){ var pa=w.cells[a].ck.split('-'), pb=w.cells[b].ck.split('-'); return (+pa[1]-+pb[1])||(+pa[0]-+pb[0]); });
    var chips=w.cOrder.map(function(lb){ var c=w.cells[lb]; totP+=c.n; totQ+=c.qty;
      return '<span class="lc">'+esc(lb)+(c.n>1?'×'+c.n:'')+'<small>'+nf(c.qty)+'개</small></span>'; }).join('');
    return '<div><span class="lw">📍 '+esc(w.name)+'</span>'+chips+'</div>';
  });
  return '<div class="ploc">'+lines.join('')+'<span class="ltot">총 '+totP+'팔 · '+nf(totQ)+'개</span></div>';
}

function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(function(){toastEl.classList.remove('show');},1600);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function keyOf(name){return String(name).replace(/[.#$/\[\]]/g,'_');}
function genId(){return 'v'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function emailKey(em){return String(em||'').trim().toLowerCase().replace(/[.#$/\[\]]/g,'_');}
/* vendorByEmail 인덱스 키 — DB 규칙(auth.token.email.toLowerCase().replace('.',',')) 과 반드시 동일 */
function emIdxKey(em){return String(em||'').trim().toLowerCase().replace(/\./g,',');}
function validEmail(em){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em);}
/* 레거시 단일 email 필드 + 신규 emails 맵을 하나로 합쳐 {emailKey: email} 반환 */
function currentEmailsMap(v){var m={}; if(v&&v.email){m[emailKey(v.email)]=v.email;} if(v&&v.emails){Object.keys(v.emails).forEach(function(k){m[k]=v.emails[k]||k;});} return m;}
function findVendorByName(name){var lc=String(name||'').trim().toLowerCase(),f=null;Object.keys(_vendors).forEach(function(vid){if((_vendors[vid].name||'').trim().toLowerCase()===lc)f=vid;});return f;}

function renderDenied(msg){
  app.innerHTML='<div class="center" style="color:#F87171;">'
   +'<div style="font-size:40px;margin-bottom:10px;">🚫</div>'
   +(msg||'접근 권한이 없습니다.')+'<br><br>'
   +'<a href="/wms.html" class="btn-back">창고관리로 돌아가기</a></div>';
}

/* ── 데이터 로드 ── */
function loadAll(){
  return db.ref('groups/'+GID).get().then(function(gs){
    var wids = gs.exists() ? Object.keys(gs.val()).filter(function(k){return k!=='_init';}) : [];
    _locs={}; _wids=wids; _whClr={};
    var jobs = wids.map(function(wid){
      /* 상품별재고(getPG)와 동일하게 현재 슬롯에 실제로 놓인 상품명만 수집.
         pColors(등록 이력 누적)는 오타·출고완료분이 남으므로 상품 목록엔 쓰지 않음 — 색 비교에만 씀. */
      return Promise.all([
        db.ref('warehouses/'+wid+'/cells').get(),
        db.ref('warehouses/'+wid+'/name').get().catch(function(){return null;}),
        db.ref('warehouses/'+wid+'/pColors').get().catch(function(){return null;})
      ]).then(function(res){
        var cells=res[0].val()||{}, names=[];
        var whName=(res[1]&&res[1].val())||wid;
        var pc=decMap((res[2]&&res[2].val())||{});
        Object.keys(pc).forEach(function(nm){ var m=_whClr[nm]||(_whClr[nm]={}); m[pc[nm]]=(m[pc[nm]]||0)+1; });
        Object.keys(cells).forEach(function(ck){
          var c=cells[ck]; if(!c||!c.slots) return;
          Object.keys(c.slots).forEach(function(sk){
            var slot=c.slots[sk]; if(!(slot && slot.name)) return;
            names.push(slot.name);
            (_locs[slot.name]=_locs[slot.name]||[]).push({wid:wid, whName:whName, ck:ck, qty:+slot.qty||0, exp:slot.exp||''});
          });
        });
        return names;
      }).catch(function(){return [];});
    });
    return Promise.all(jobs);
  }).then(function(lists){
    var set={};
    lists.forEach(function(arr){arr.forEach(function(n){if(n)set[n]=true;});});
    _products = Object.keys(set).sort(function(a,b){return a.localeCompare(b,'ko');});
    return Promise.all([
      db.ref('vendorConfig/'+GID+'/vendors').get(),
      db.ref('vendorConfig/'+GID+'/map').get(),
      db.ref('vendorConfig/'+GID+'/colors').get().catch(function(){return null;})
    ]);
  }).then(function(res){
    _vendors = (res[0] && res[0].val()) || {};
    _map = (res[1] && res[1].val()) || {};
    _grpClr = decMap((res[2] && res[2].val()) || {});
  });
}

/* ── 렌더 ── */
function vendorOptions(selected){
  var opts='<option value="">— 미연결 —</option>';
  Object.keys(_vendors).forEach(function(vid){
    opts+='<option value="'+vid+'"'+(vid===selected?' selected':'')+'>'+esc(_vendors[vid].name)+'</option>';
  });
  return opts;
}
function vendorProductCount(vid){
  var n=0; Object.keys(_map).forEach(function(k){if(_map[k]&&_map[k].vendorId===vid)n++;}); return n;
}

function render(user){
  /* 현재 재고 상품 + 업체에 이미 연결된 상품(재고 0이어도 유지). pColors 누적분은 제외. */
  var liveSet={}; _products.forEach(function(n){liveSet[n]=1;});
  var mapOnly=[];
  Object.keys(_map).forEach(function(k){
    var nm=_map[k]&&_map[k].name;
    if(nm && !liveSet[nm]) mapOnly.push(nm);
  });
  var allNames=_products.concat(mapOnly.sort(function(a,b){return a.localeCompare(b,'ko');}));

  var linked=[], unlinked=[];
  allNames.forEach(function(nm){
    var e=_map[keyOf(nm)];
    if(e && e.vendorId && _vendors[e.vendorId]) linked.push(nm); else unlinked.push(nm);
  });

  /* 업체 목록 */
  var vids=Object.keys(_vendors);
  var vendorHtml = vids.length===0
    ? '<div class="empty">아직 등록된 업체가 없습니다. 아래에서 추가하세요.</div>'
    : vids.map(function(vid){
        var v=_vendors[vid];
        var ems=currentEmailsMap(v);
        var chips=Object.keys(ems).map(function(ek){
          return '<span class="email-chip">✉ '+esc(ems[ek])
            +'<a title="담당자 제거" onclick="removeEmail(\''+vid+'\',\''+encodeURIComponent(ek)+'\')">✕</a></span>';
        }).join('');
        if(!chips) chips='<span class="muted-sm">담당자 이메일 없음 — 아래에서 추가</span>';
        return '<div class="vcard">'
          +'<div class="vcard-top"><div class="vname">'+esc(v.name)+'</div>'
          +'<div class="vcount">'+vendorProductCount(vid)+'개 상품</div>'
          +'<button class="btn-prev" onclick="previewVendor(\''+vid+'\')">👁 현황</button>'
          +'<button class="btn-del" onclick="delVendor(\''+vid+'\')">업체삭제</button></div>'
          +'<div class="vmails">'+chips+'</div>'
          +'<div class="vmail-add"><input id="em-'+vid+'" class="inp" type="email" placeholder="담당자 이메일 추가" '
          +'onkeydown="if(event.key===\'Enter\')addEmailFromRow(\''+vid+'\')"/>'
          +'<button onclick="addEmailFromRow(\''+vid+'\')">+ 담당자</button></div>'
          +'</div>';
      }).join('');

  /* 상품 연결 행 */
  function prow(nm, isUnlinked){
    var k=keyOf(nm);
    var sel=(_map[k]&&_map[k].vendorId)||'';
    var zero=(_products.indexOf(nm)<0) ? '<span class="pzero">재고 0</span>' : '';
    /* 유닛 컬러 — 그룹 통일 색이 있으면 그 색(실선), 없으면 창고에서 쓰는 색(점선), 창고마다 다르면 ≠ 표시 */
    var gc=_grpClr[nm], wc=topWhClr(nm), nDiff=Object.keys(_whClr[nm]||{}).length;
    var shown=gc||wc;
    var swTitle=gc ? '그룹 통일 색 '+gc+' — 모든 창고에 같은 색 (클릭해서 바꾸기)'
      : (nDiff>1 ? '창고마다 색이 다릅니다 ('+Object.keys(_whClr[nm]).join(', ')+') — 클릭해서 하나로 통일'
        : (wc ? '창고 색 '+wc+' (아직 그룹 통일 전) — 클릭해서 모든 창고에 통일' : '색 없음 — 클릭해서 지정'));
    var sw='<button class="swatch'+(gc?' set':'')+'" style="'+(shown?'background:'+shown+';':'')+'" title="'+esc(swTitle)+'" onclick="openClr(event,\''+encodeURIComponent(nm)+'\')">'
      +(!gc&&nDiff>1?'<span class="sw-diff">≠</span>':'')+'</button>';
    return '<div class="prow'+(isUnlinked?' unlinked':'')+'">'
      +sw
      +'<div class="pmain"><div class="pname" title="클릭 → 상품명 일괄 변경/통합" onclick="renameProduct(\''+encodeURIComponent(nm)+'\')">'+esc(nm)+'<span class="rename-hint">✎ 이름수정</span>'+zero+'</div>'
      +(isUnlinked?locHtml(nm):'')+'</div>'
      +'<select class="sel'+(sel?'':' none')+'" onchange="linkProduct(\''+encodeURIComponent(nm)+'\',this.value)">'
      +vendorOptions(sel)+'</select></div>';
  }

  var unlinkedHtml = unlinked.length===0
    ? '<div class="empty" style="color:#34D399;">✅ 모든 상품이 업체에 연결되었습니다</div>'
    : '<div class="unlinked-banner">⚠️ 아래 '+unlinked.length+'개 상품이 아직 업체에 연결되지 않았습니다. 누락 없이 연결해 주세요.</div>'
      + unlinked.map(function(nm){return prow(nm,true);}).join('');

  var diffCnt = allNames.filter(function(nm){ return !_grpClr[nm] && Object.keys(_whClr[nm]||{}).length>1; }).length;

  var linkedHtml = linked.length===0
    ? '<div class="empty">연결된 상품이 없습니다</div>'
    : linked.map(function(nm){return prow(nm,false);}).join('');

  app.innerHTML=
    '<div class="topbar">'
    +'<a href="/wms.html" class="btn-back">‹ 창고관리</a>'
    +'<div class="badge-admin">🛡️ 슈퍼관리자</div>'
    +'<div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">그룹 · '+esc(GID)+'</div>'
    +'<div style="font-size:11px;color:#64748B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(user.email)+'</div></div>'
    +'</div>'
    +'<h1>🏷️ 업체등록 · 상품연결</h1>'
    +'<div class="sub">창고가 여러 개여도 그룹 단위로 통합 관리됩니다. <b style="color:#94A3B8;">현재 재고 상품 + 연결된 상품</b>이 표시됩니다(연결된 상품은 재고 0이어도 유지). 상품명마다 거래 업체를 지정하면, 해당 업체 담당자가 자기 상품 현황을 볼 수 있습니다.</div>'

    +'<div class="section">'
    +'<div class="section-h">📇 업체 목록 <span class="count-chip">'+vids.length+'</span></div>'
    +vendorHtml
    +'<div class="add-form">'
    +'<input id="nvName" class="inp" placeholder="업체명 (예: 가나푸드)" style="flex:2;"/>'
    +'<input id="nvEmail" class="inp" type="email" placeholder="담당자 이메일 (선택)" style="flex:3;"/>'
    +'<button class="btn btn-primary" onclick="addVendor()">+ 추가</button>'
    +'</div>'
    +'<div class="add-hint">💡 한 업체에 담당자 여러 명을 둘 수 있습니다. 이미 등록된 <b>업체명을 그대로</b> 입력하고 이메일을 넣으면 그 업체에 담당자가 추가됩니다.</div>'
    +'</div>'

    +'<div class="section">'
    +'<div class="section-h">⚠️ 업체 미연결 <span class="count-chip" style="background:rgba(251,191,36,.15);color:#FBBF24;">'+unlinked.length+'</span></div>'
    +unlinkedHtml+'</div>'

    +'<div class="section">'
    +'<div class="section-h">🔗 연결된 상품 <span class="count-chip" style="background:rgba(124,58,237,.15);color:#A78BFA;">'+linked.length+'</span>'
    +(diffCnt ? '<button class="btn-unify" onclick="unifyAllColors()" title="그룹 통일 색이 없는 상품 중 창고마다 색이 다른 것을, 창고에서 가장 많이 쓰는 색으로 모든 창고에 맞춥니다">🎨 창고마다 다른 색 '+diffCnt+'개 통일</button>' : '')
    +'</div>'
    +'<div class="add-hint" style="margin-top:0;margin-bottom:10px;">🎨 왼쪽 색 칸을 눌러 <b>유닛 컬러</b>를 정하면 그룹의 <b>모든 창고</b>에 같은 색으로 적용됩니다. (점선 = 아직 통일 전 · ≠ = 창고마다 색이 다름)</div>'
    +linkedHtml+'</div>'

    +'<div class="section">'
    +'<div class="section-h">➕ 재고 없는 상품 추가 <span class="muted-sm" style="font-weight:600;">현황에 0팔 0개로 표시</span></div>'
    +'<div class="add-hint" style="margin-top:0;margin-bottom:10px;">창고에 아직 재고가 없는 상품을 미리 업체에 연결해 두면 현황 보고서에 <b>0팔 0개(재고보충요망)</b>로 표시됩니다. 재고가 들어오면 자동으로 실수량으로 바뀝니다. <b style="color:#FBBF24;">상품명은 창고에서 쓰는 이름과 정확히 동일</b>해야 합니다.</div>'
    +'<div class="add-form">'
    +'<input id="mpName" class="inp" placeholder="상품명 (예: 21곡45)" style="flex:2;"/>'
    +'<select id="mpVendor" class="inp" style="flex:2;">'+vendorOptions('')+'</select>'
    +'<button class="btn btn-primary" onclick="addManualProduct()">+ 추가</button>'
    +'</div></div>';
}

/* ── 액션 ── */
function addVendor(){
  var nameEl=document.getElementById('nvName'), emailEl=document.getElementById('nvEmail');
  var name=(nameEl.value||'').trim();
  var email=(emailEl.value||'').trim();
  if(!name){toast('업체명을 입력하세요');return;}
  if(email && !validEmail(email)){toast('이메일 형식을 확인하세요');return;}
  var existing=findVendorByName(name);
  if(existing){
    if(!email){toast('이미 등록된 업체입니다. 담당자 이메일을 입력하면 추가됩니다.');return;}
    nameEl.value=''; emailEl.value='';
    addEmailTo(existing, email, '기존 업체 "'+name+'"에 담당자 추가');
    return;
  }
  var vid=genId();
  var emails={}; if(email) emails[emailKey(email)]=email;
  var rec={name:name, emails:emails, createdAt:Date.now()};
  var updates={};
  updates['vendorConfig/'+GID+'/vendors/'+vid]=rec;
  if(email) updates['vendorByEmail/'+emIdxKey(email)]={gid:GID, vendorId:vid, vendorName:name};
  db.ref().update(updates).then(function(){
    _vendors[vid]=rec; nameEl.value=''; emailEl.value=''; renderReload(); toast('업체 추가됨 · '+name);
  }).catch(function(e){toast('추가 실패: '+e.message);});
}
window.addVendor=addVendor;

/* 업체에 담당자 이메일 추가 (여러 명 가능). 레거시 단일 email 필드는 emails 맵으로 정리. */
function addEmailTo(vid, email, okMsg){
  var v=_vendors[vid]; if(!v) return;
  email=String(email||'').trim();
  if(!validEmail(email)){toast('이메일 형식을 확인하세요');return;}
  var ek=emailKey(email);
  var cur=currentEmailsMap(v);
  if(cur[ek]){toast('이미 등록된 담당자입니다');return;}
  cur[ek]=email;
  var updates={};
  updates['vendorConfig/'+GID+'/vendors/'+vid+'/emails']=cur;
  updates['vendorConfig/'+GID+'/vendors/'+vid+'/email']=null;
  updates['vendorByEmail/'+emIdxKey(email)]={gid:GID, vendorId:vid, vendorName:v.name};
  db.ref().update(updates).then(function(){
    v.emails=cur; delete v.email; renderReload(); toast(okMsg||('담당자 추가 · '+email));
  }).catch(function(e){toast('추가 실패: '+e.message);});
}
window.addEmailTo=addEmailTo;

function addEmailFromRow(vid){
  var el=document.getElementById('em-'+vid); if(!el) return;
  var email=(el.value||'').trim();
  if(!email){toast('이메일을 입력하세요');return;}
  el.value='';
  addEmailTo(vid, email);
}
window.addEmailFromRow=addEmailFromRow;

function removeEmail(vid, encEk){
  var v=_vendors[vid]; if(!v) return;
  var ek=decodeURIComponent(encEk);
  var cur=currentEmailsMap(v);
  if(!cur[ek]) return;
  var removedEmail=cur[ek];
  if(!confirm('담당자 "'+removedEmail+'" 를 제거할까요?')) return;
  delete cur[ek];
  var hasAny=Object.keys(cur).length>0;
  var updates={};
  updates['vendorConfig/'+GID+'/vendors/'+vid+'/emails']=hasAny?cur:null;
  updates['vendorConfig/'+GID+'/vendors/'+vid+'/email']=null;
  updates['vendorByEmail/'+emIdxKey(removedEmail)]=null;
  db.ref().update(updates).then(function(){
    v.emails=cur; delete v.email; renderReload(); toast('담당자 제거됨');
  }).catch(function(e){toast('제거 실패: '+e.message);});
}
window.removeEmail=removeEmail;

function delVendor(vid){
  var v=_vendors[vid]; if(!v) return;
  var cnt=vendorProductCount(vid);
  if(!confirm('업체 "'+v.name+'" 을(를) 삭제할까요?'+(cnt?('\n\n연결된 '+cnt+'개 상품은 미연결 상태가 됩니다.'):''))) return;
  /* 연결된 상품 링크 해제 + 담당자 인덱스/현황 요약본 정리 */
  var updates={};
  Object.keys(_map).forEach(function(k){ if(_map[k]&&_map[k].vendorId===vid) updates['vendorConfig/'+GID+'/map/'+k]=null; });
  var ems=currentEmailsMap(v);
  Object.keys(ems).forEach(function(ek){ updates['vendorByEmail/'+emIdxKey(ems[ek])]=null; });
  updates['vendorStatus/'+GID+'/'+vid]=null;
  updates['vendorConfig/'+GID+'/vendors/'+vid]=null;
  db.ref().update(updates).then(function(){
    Object.keys(_map).forEach(function(k){ if(_map[k]&&_map[k].vendorId===vid) delete _map[k]; });
    delete _vendors[vid]; renderReload(); toast('삭제됨');
  }).catch(function(e){toast('삭제 실패: '+e.message);});
}
window.delVendor=delVendor;

function previewVendor(vid){
  window.open('/vendor_status.html?gid='+encodeURIComponent(GID)+'&vid='+encodeURIComponent(vid),'_blank');
}
window.previewVendor=previewVendor;

/* 재고 없는 상품을 업체에 직접 연결 — 현황에 0팔 0개로 표시됨 */
function addManualProduct(){
  var nameEl=document.getElementById('mpName'), vidEl=document.getElementById('mpVendor');
  var name=(nameEl.value||'').trim();
  var vid=vidEl.value;
  if(!name){toast('상품명을 입력하세요');return;}
  if(!vid){toast('연결할 업체를 선택하세요');return;}
  var k=keyOf(name);
  if(_map[k] && _map[k].vendorId){ toast('이미 연결된 상품입니다'); return; }
  var rec={name:name, vendorId:vid};
  db.ref('vendorConfig/'+GID+'/map/'+k).set(rec).then(function(){
    _map[k]=rec; nameEl.value=''; renderReload();
    toast(name+' → '+(_vendors[vid]?_vendors[vid].name:'업체')+' (재고 0)');
  }).catch(function(e){toast('추가 실패: '+e.message);});
}
window.addManualProduct=addManualProduct;

function linkProduct(encName, vendorId){
  var nm=decodeURIComponent(encName);
  var k=keyOf(nm);
  if(!vendorId){
    db.ref('vendorConfig/'+GID+'/map/'+k).remove().then(function(){
      delete _map[k]; renderReload(); toast('미연결로 변경 · '+nm);
    }).catch(function(e){toast('실패: '+e.message);});
  }else{
    var rec={name:nm, vendorId:vendorId};
    db.ref('vendorConfig/'+GID+'/map/'+k).set(rec).then(function(){
      _map[k]=rec; renderReload(); toast(nm+' → '+(_vendors[vendorId]?_vendors[vendorId].name:'업체'));
    }).catch(function(e){toast('실패: '+e.message);});
  }
}
window.linkProduct=linkProduct;

/* ── 상품명 일괄 변경/통합 — 그룹 내 모든 창고의 재고·입고대기·색상·업체연결을 함께 변경 ── */
function renameProduct(encName){
  var oldName=decodeURIComponent(encName);
  var input=prompt('상품명 일괄 변경\n\n"'+oldName+'"\n→ 새 상품명을 입력하세요.\n\n· 그룹 내 모든 창고의 재고·입고대기·업체연결이 함께 변경됩니다.\n· 같은 이름이 이미 있으면 하나로 통합됩니다.', oldName);
  if(input==null)return;
  var newName=input.trim();
  if(!newName){toast('상품명을 입력하세요');return;}
  if(newName===oldName)return;
  var merge=(_products.indexOf(newName)>=0)||Object.keys(_map).some(function(k){return _map[k]&&_map[k].name===newName;});
  var msg='"'+oldName+'"  →  "'+newName+'"\n\n그룹 내 모든 창고에서 변경합니다.';
  if(merge)msg+='\n\n⚠️ 기존 "'+newName+'" 와(과) 하나로 통합됩니다.';
  msg+='\n\n계속할까요?';
  if(!confirm(msg))return;
  doRename(oldName,newName);
}
window.renameProduct=renameProduct;

function doRename(oldName,newName){
  toast('일괄 변경 중...');
  db.ref('groups/'+GID).get().then(function(gs){
    var wids=gs.exists()?Object.keys(gs.val()).filter(function(k){return k!=='_init';}):[];
    return Promise.all(wids.map(function(wid){
      return db.ref('warehouses/'+wid).get().then(function(s){return {wid:wid,wh:s.val()};});
    }));
  }).then(function(list){
    var updates={};
    list.forEach(function(item){
      var wid=item.wid, wh=item.wh; if(!wh)return;
      var cells=wh.cells||{};
      Object.keys(cells).forEach(function(ck){
        var c=cells[ck]; if(!c||!c.slots)return;
        Object.keys(c.slots).forEach(function(sk){
          var slot=c.slots[sk];
          if(slot&&slot.name===oldName) updates['warehouses/'+wid+'/cells/'+ck+'/slots/'+sk+'/name']=newName;
        });
      });
      if(Array.isArray(wh.inQ)){
        var changed=false;
        var nq=wh.inQ.map(function(it){if(it&&it.name===oldName){changed=true;return Object.assign({},it,{name:newName});}return it;});
        if(changed)updates['warehouses/'+wid+'/inQ']=nq;
      }
      if(wh.pColors&&wh.pColors[oldName]!==undefined){
        var npc=Object.assign({},wh.pColors);
        var clr=npc[oldName]; delete npc[oldName];
        if(npc[newName]===undefined)npc[newName]=clr;
        updates['warehouses/'+wid+'/pColors']=npc;
      }
    });
    /* 그룹 통일 색도 새 이름으로 옮김 (새 이름에 이미 색이 있으면 그 색 유지) */
    if(_grpClr[oldName]){
      updates['vendorConfig/'+GID+'/colors/'+clrEnc(oldName)]=null;
      if(!_grpClr[newName]) updates['vendorConfig/'+GID+'/colors/'+clrEnc(newName)]=_grpClr[oldName];
    }
    var oldK=keyOf(oldName), newK=keyOf(newName);
    if(_map[oldK]){
      var vId=_map[oldK].vendorId;
      updates['vendorConfig/'+GID+'/map/'+oldK]=null;
      if(!(_map[newK]&&_map[newK].vendorId)) updates['vendorConfig/'+GID+'/map/'+newK]={name:newName, vendorId:vId};
    }
    if(Object.keys(updates).length===0){toast('변경할 재고/연결이 없습니다');return;}
    return db.ref().update(updates).then(function(){
      return loadAll().then(function(){ renderReload(); toast('일괄 변경 완료 · '+newName); });
    });
  }).catch(function(e){toast('변경 실패: '+e.message);});
}
window.doRename=doRename;

/* ── 유닛 컬러 — 그룹 통일 색 지정 → 그룹 모든 창고 pColors 에 같은 색 ── */
var _clrPop=null;
function closeClr(){ if(_clrPop){ _clrPop.remove(); _clrPop=null; } }
function openClr(ev, encName){
  ev.stopPropagation();
  closeClr();
  var nm=decodeURIComponent(encName);
  var cur=_grpClr[nm]||'';
  var whs=Object.keys(_whClr[nm]||{});
  var pop=document.createElement('div');
  pop.className='clr-pop';
  pop.innerHTML='<div class="cp-h">🎨 '+esc(nm)+'<span>모든 창고에 같은 색</span></div>'
    +(whs.length ? '<div class="cp-now">지금 창고 색: '+whs.map(function(c){return '<i style="background:'+c+'" title="'+c+'"></i>';}).join('')+(whs.length>1?' <b>창고마다 다름</b>':'')+'</div>' : '')
    +PAL_ROWS.map(function(row){
      return '<div class="cp-row">'+row.map(function(c){
        return '<button class="cp-chip'+(c===cur?' on':'')+'" style="background:'+c+'" title="'+c+'" onclick="setGroupColor(\''+encodeURIComponent(nm)+'\',\''+c+'\')"></button>';
      }).join('')+'</div>';
    }).join('');
  document.body.appendChild(pop);
  var r=ev.currentTarget.getBoundingClientRect();
  var top=r.bottom+window.scrollY+6, left=r.left+window.scrollX;
  var pw=pop.offsetWidth, ph=pop.offsetHeight;
  if(left+pw>window.scrollX+document.documentElement.clientWidth-8) left=window.scrollX+document.documentElement.clientWidth-pw-8;
  if(r.bottom+ph+6>window.innerHeight) top=r.top+window.scrollY-ph-6;
  pop.style.left=Math.max(8,left)+'px'; pop.style.top=Math.max(8,top)+'px';
  _clrPop=pop;
}
window.openClr=openClr;
document.addEventListener('click',function(e){ if(_clrPop && !_clrPop.contains(e.target)) closeClr(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeClr(); });

/* 한 번의 저장으로 — 그룹 색 + 그룹 안 모든 창고의 pColors 를 같은 색으로 */
function colorUpdates(list){   /* list: [[상품명, 색], ...] */
  var u={};
  list.forEach(function(p){
    var ek=clrEnc(p[0]);
    u['vendorConfig/'+GID+'/colors/'+ek]=p[1];
    _wids.forEach(function(wid){ u['warehouses/'+wid+'/pColors/'+ek]=p[1]; });
  });
  return u;
}
function applyColorsLocal(list){
  list.forEach(function(p){ _grpClr[p[0]]=p[1]; var m={}; m[p[1]]=_wids.length||1; _whClr[p[0]]=m; });
}
function setGroupColor(encName, clr){
  var nm=decodeURIComponent(encName);
  closeClr();
  db.ref().update(colorUpdates([[nm,clr]])).then(function(){
    applyColorsLocal([[nm,clr]]); renderReload();
    toast('🎨 '+nm+' — 창고 '+_wids.length+'곳 모두 같은 색');
  }).catch(function(e){toast('색 저장 실패: '+e.message);});
}
window.setGroupColor=setGroupColor;

/* 그룹 통일 색이 없는데 창고마다 색이 다른 상품 → 창고에서 가장 많이 쓰는 색으로 일괄 통일 */
function unifyAllColors(){
  var list=[], shownSet={};
  /* 화면에 나오는 상품(현재 재고 + 업체 연결)만 — 창고 pColors 에 남은 옛 이름·오타는 건드리지 않음 */
  _products.forEach(function(n){ shownSet[n]=1; });
  Object.keys(_map).forEach(function(k){ if(_map[k]&&_map[k].name) shownSet[_map[k].name]=1; });
  Object.keys(_whClr).forEach(function(nm){
    if(!shownSet[nm] || _grpClr[nm]) return;
    if(Object.keys(_whClr[nm]).length<2) return;
    list.push([nm, topWhClr(nm)]);
  });
  if(!list.length){ toast('통일할 상품이 없습니다'); return; }
  if(!confirm('창고마다 색이 다른 상품 '+list.length+'개를\n창고에서 가장 많이 쓰는 색으로 모든 창고('+_wids.length+'곳)에 통일할까요?\n\n(통일한 뒤에도 색 칸을 눌러 언제든 바꿀 수 있습니다)')) return;
  db.ref().update(colorUpdates(list)).then(function(){
    applyColorsLocal(list); renderReload();
    toast('🎨 '+list.length+'개 상품 색 통일 완료');
  }).catch(function(e){toast('통일 실패: '+e.message);});
}
window.unifyAllColors=unifyAllColors;

var _user=null;
function renderReload(){ if(_user) render(_user); }

/* ── 부팅 ── */
auth.onAuthStateChanged(function(user){
  if(!user){ location.replace('/wms_login.html?return='+encodeURIComponent('/wms_vendors.html'+location.search)); return; }
  if(!GID){ renderDenied('그룹이 지정되지 않았습니다. 창고관리 메인에서 그룹을 선택한 뒤 다시 들어오세요.'); return; }
  db.ref('superadmins/'+user.uid).get().then(function(snap){
    if(!snap.exists()){ renderDenied('슈퍼관리자만 이용할 수 있습니다.'); return; }
    _user=user;
    loadAll().then(function(){ render(user); }).catch(function(e){
      app.innerHTML='<div class="center" style="color:#F87171;">데이터 로드 실패: '+esc(e.message)+'</div>';
    });
  }).catch(function(e){
    app.innerHTML='<div class="center" style="color:#F87171;">권한 확인 실패: '+esc(e.message)+'</div>';
  });
});
</script>
