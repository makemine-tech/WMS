<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문 매칭 · AI 물류비서</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { --bg:#0d0f14; --surface:#151820; --surface2:#1b1f29; --border:#2a2f3d; --accent:#4af0a8; --accent2:#f0a84a; --text:#e8eaf0; --muted:#8b93a3; --red:#f05050; }
  body { font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:15px; }
  .wrap { width:calc(100% - 2rem); max-width:1600px; margin:0 auto; padding:1rem 0 3rem; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:.8rem; flex-wrap:wrap; margin-bottom:.7rem; }
  h1 { font-size:1.35rem; font-weight:900; } h1 span { color:var(--accent); }
  .notice { background:#2a2110; border:1px solid var(--accent2); color:#f7d9a8; border-radius:10px; padding:.55rem .85rem; margin-bottom:.8rem; font-size:.92rem; }
  .btn { background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:.5rem .8rem; font:inherit; font-size:.9rem; font-weight:700; cursor:pointer; }
  .btn:hover { border-color:var(--muted); } .btn:disabled { opacity:.45; cursor:not-allowed; }
  .grid { display:grid; grid-template-columns:minmax(260px,1fr) minmax(340px,1.25fr) minmax(320px,1.25fr); gap:.8rem; align-items:start; }
  .pane { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:.8rem; min-width:0; }
  .pane h2 { font-size:1rem; font-weight:800; margin-bottom:.6rem; }
  .item { display:block; width:100%; text-align:left; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:.55rem .65rem; margin-bottom:.4rem; font:inherit; cursor:pointer; }
  .item.on { border-color:var(--accent); } .item .sub { display:block; color:var(--muted); font-size:.84rem; margin-top:.15rem; }
  .ok { color:var(--accent); font-weight:700; } .warn { color:var(--accent2); font-weight:700; }
  .box { background:var(--surface2); border-radius:8px; padding:.6rem .7rem; margin-bottom:.6rem; line-height:1.55; }
  .caution { background:#2a1414; border:1px solid var(--red); border-radius:8px; padding:.55rem .7rem; margin-bottom:.6rem; line-height:1.55; }
  .caution label { display:flex; gap:.4rem; align-items:center; margin-top:.4rem; font-weight:700; cursor:pointer; }
  .pick { display:grid; grid-template-columns:minmax(0,1fr) 72px auto; gap:.4rem; align-items:center; padding:.4rem 0; border-top:1px solid var(--border); }
  input[type=search], input[type=number] { background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:.45rem .55rem; font:inherit; width:100%; }
  .row-s { display:flex; gap:.4rem; margin-bottom:.6rem; }
  .cand { display:flex; justify-content:space-between; gap:.5rem; align-items:center; padding:.45rem 0; border-top:1px solid var(--border); }
  .dim { color:var(--muted); font-size:.86rem; } .hist { font-size:.88rem; padding:.3rem 0; border-top:1px solid var(--border); }
  .empty { color:var(--muted); padding:1rem .2rem; line-height:1.6; }
  @media (max-width:1000px) { .grid { grid-template-columns:minmax(0,1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span>AI</span> 물류비서 · 주문 매칭</h1>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap">
      <button class="btn" type="button" id="readBtn">이벗에서 새로 읽기</button>
      <button class="btn" type="button" id="demoBtn">예시로 보기</button>
    </div>
  </div>
  <div class="notice">지금은 <b>입력을 임시 저장만</b> 합니다. 이벗 매칭에는 아직 반영되지 않습니다. 상품과 수량은 작업자가 정합니다.</div>
  <div class="dim" id="status" style="margin-bottom:.7rem">확인 중…</div>
  <div class="grid">
    <div class="pane"><h2>매칭할 주문 상품 <span class="dim" id="progress"></span></h2><div id="items"></div></div>
    <div class="pane"><h2>선택한 상품</h2><div id="detail"><div class="empty">왼쪽에서 상품을 고르세요.</div></div></div>
    <div class="pane"><h2>이벗 상품</h2>
      <div class="row-s"><input type="search" id="q" placeholder="상품명으로 찾기"><button class="btn" type="button" id="moreBtn" title="목록에 없으면 이벗에서 직접 찾습니다">이벗에서 찾기</button></div>
      <div id="cands"><div class="empty">상품을 고르면 비슷한 상품을 먼저 보여 줍니다.</div></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="wms_sync.js"></script>
<script src="/wms_access.js" data-page="secretary_match" data-floor="3"></script>
<script src="secretary_core.js"></script>
<script src="secretary_match.js"></script>
<script>
/* ============================================================
   주문 매칭 화면 (대표님 2026-11-01) — 왼쪽 미매칭 상품, 가운데 주의·입력, 오른쪽 이벗 상품
   자료 읽기는 상시 컴퓨터 헤드비서가 함. 이 페이지는 이벗에 직접 닿지 않음. 입력은 secretary/match/drafts 임시 저장
============================================================ */
var C = window.SECRETARY_CORE, M = window.SECRETARY_MATCH;
var $ = function(id){ return document.getElementById(id); };
var root = null, me = null, DATA = null, DRAFTS = {}, SEL = null, DEMO = false, EXTRA = [];
var DEMO_DATA = { readAt: 0, masters: [
    { code: 'd1', name: '[A45아크네스]아크네스 데일리 딥 클렌저 120g' }, { code: 'd2', name: '[A03아크네스] 데일리 딥 클렌저 100g' },
    { code: 'd3', name: '[M01멘소래담] 마사지 롤온 로션 50ml' }, { code: 'd4', name: '[M02멘소래담] 쿨 롤온 로션 50ml' }, { code: 'd5', name: '[A14아크네스] 퍼펙트 솔루션 바디워시 500ml' }, { code: 'd6', name: '호박 샤워볼(증정용)' } ],
  items: [
    { name: '[추가10%적립] 아크네스 데일리 딥 클렌저 120g, 2개', opt: '수량: 3개', qty: 1, site: '맨소레담공식스마트스토어', orders: 4 },
    { name: '멘소래담 마사지 롤온 로션 50ml + 쿨 롤온 로션 50ml', opt: '선택: 핫 롤온 로션 2개', qty: 1, site: '맨소레담공식스마트스토어', orders: 2 },
    { name: '아크네스 퍼펙트 솔루션 바디워시 500ml 약산성 등드름 케어', opt: '선택: 퍼펙트 솔루션 바디워시 500ml / 증정: 호박 샤워볼', qty: 1, site: '맨소레담공식스마트스토어', orders: 1 } ],
  history: { '[추가10%적립] 아크네스 데일리 딥 클렌저 120g, 2개': [{ name: '[추가10%적립] 아크네스 데일리 딥 클렌저 120g, 2개', opt: '수량: 3개', qty: 3, master: '[A45아크네스]아크네스 데일리 딥 클렌저 120g - 9' }] } };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function src(){ return DEMO ? DEMO_DATA : DATA; }
function items(){ var d = src(); return (d && d.items) || []; }
function keyOf(it){ return M.itemKey(it.name, it.opt, it.qty); }
function draft(k){ return DRAFTS[k] || { picks: [], checked: false }; }
function saveDraft(k, d){
  d.by = (me && me.email) || ''; d.at = Date.now();
  DRAFTS[k] = d;
  if (!DEMO && root) root.child('match/drafts/' + k).set(d).catch(function(e){ $('status').textContent = '임시 저장 실패: ' + e.message; });
  paint();
}
function paintItems(){
  var list = items(), done = 0;
  $('items').innerHTML = list.length ? list.map(function(it){
    var k = keyOf(it), ready = M.draftReady(it, draft(k)), w = M.warnings(it.name, it.opt).length;
    if (ready) done++;
    return '<button class="item' + (SEL === k ? ' on' : '') + '" type="button" data-k="' + k + '">' + (ready ? '<span class="ok">✓ </span>' : w ? '<span class="warn">주의 ' + w + ' </span>' : '') + esc(it.name) +
      '<span class="sub">' + esc(it.opt || '옵션 없음') + ' · 주문수량 ' + it.qty + ' · ' + it.orders + '건</span></button>';
  }).join('') : '<div class="empty">매칭할 상품이 없습니다.<br>수집 후 「이벗에서 새로 읽기」를 누르거나, 「예시로 보기」로 화면을 확인할 수 있습니다.</div>';
  $('progress').textContent = list.length ? '(' + done + ' / ' + list.length + ')' : '';
}
function current(){ return items().find(function(it){ return keyOf(it) === SEL; }); }
function paintDetail(){
  var it = current();
  if (!it) { $('detail').innerHTML = '<div class="empty">왼쪽에서 상품을 고르세요.</div>'; return; }
  var k = SEL, d = draft(k), w = M.warnings(it.name, it.opt), hist = (src().history || {})[it.name] || [];
  var html = '<div class="box"><b>' + esc(it.name) + '</b><br><span class="dim">옵션</span> ' + esc(it.opt || '없음') + '<br><span class="dim">주문수량</span> ' + it.qty + ' · <span class="dim">판매처</span> ' + esc(it.site || '') + ' · ' + it.orders + '건</div>';
  if (w.length) html += '<div class="caution">' + w.map(function(x){ return '⚠️ ' + esc(x.text); }).join('<br>') + '<label><input type="checkbox" id="checked"' + (d.checked ? ' checked' : '') + '> 위 내용을 확인했습니다</label></div>';
  html += '<h2 style="margin-top:.2rem">넣을 상품과 총 수량</h2>';
  html += (d.picks || []).length ? d.picks.map(function(p, i){ return '<div class="pick"><span>' + esc(p.name) + '</span><input type="number" min="1" step="1" data-q="' + i + '" value="' + esc(p.qty || '') + '" aria-label="수량"><button class="btn" type="button" data-del="' + i + '">빼기</button></div>'; }).join('') : '<div class="dim" style="padding:.3rem 0 .6rem">오른쪽에서 상품을 추가하세요. 수량은 직접 넣어 주세요.</div>';
  html += '<h2 style="margin-top:.8rem">같은 상품명의 과거 매칭 (참고)</h2>';
  html += hist.length ? hist.map(function(h){ return '<div class="hist">' + esc(h.opt || '옵션 없음') + ' · 주문수량 ' + h.qty + '<br><span class="dim">' + esc(h.master) + '</span></div>'; }).join('') : '<div class="dim">과거 매칭이 없습니다.</div>';
  $('detail').innerHTML = html;
}
function masters(){ var d = src(); return ((d && d.masters) || []).concat(EXTRA); }
function paintCands(){
  var it = current(), q = $('q').value.trim();
  if (!it && !q) { $('cands').innerHTML = '<div class="empty">상품을 고르면 비슷한 상품을 먼저 보여 줍니다.</div>'; return; }
  var list = q ? M.candidates('', '', masters(), q) : M.candidates(it.name, it.opt, masters());
  $('cands').innerHTML = (q ? '' : '<div class="dim" style="margin-bottom:.3rem">상품명 기준 예상 상품입니다. 정답이 아니니 직접 확인하세요.</div>') +
    (list.length ? list.map(function(m){ return '<div class="cand"><span>' + esc(m.name) + (m.opt && m.opt !== '-' ? ' <span class="dim">' + esc(m.opt) + '</span>' : '') + '</span><button class="btn" type="button" data-add="' + esc(m.code) + '"' + (it ? '' : ' disabled') + '>추가</button></div>'; }).join('') : '<div class="empty">찾은 상품이 없습니다. 「이벗에서 찾기」를 눌러 보세요.</div>');
}
function paint(){ paintItems(); paintDetail(); paintCands(); }

$('items').addEventListener('click', function(e){ var b = e.target.closest('[data-k]'); if (!b) return; SEL = b.getAttribute('data-k'); $('q').value = ''; paint(); });
$('cands').addEventListener('click', function(e){
  var code = e.target.getAttribute && e.target.getAttribute('data-add'); if (!code || !SEL) return;
  var m = masters().find(function(x){ return String(x.code) === code; }), d = draft(SEL);
  d.picks = (d.picks || []).filter(function(p){ return p.code !== code; }).concat([{ code: code, name: m.name, qty: '' }]);
  saveDraft(SEL, d);
});
$('detail').addEventListener('click', function(e){
  var i = e.target.getAttribute && e.target.getAttribute('data-del'); if (i == null) return;
  var d = draft(SEL); d.picks.splice(Number(i), 1); saveDraft(SEL, d);
});
$('detail').addEventListener('change', function(e){
  var d = draft(SEL);
  if (e.target.id === 'checked') { d.checked = e.target.checked; saveDraft(SEL, d); return; }
  var i = e.target.getAttribute('data-q');
  if (i != null) { d.picks[Number(i)].qty = Number(e.target.value) || ''; saveDraft(SEL, d); }
});
$('q').addEventListener('input', paintCands);
$('demoBtn').addEventListener('click', function(){
  DEMO = !DEMO; SEL = null; EXTRA = [];
  if (DEMO) DRAFTS = {};
  $('demoBtn').textContent = DEMO ? '실제 자료로 돌아가기' : '예시로 보기';
  $('readBtn').disabled = DEMO; $('moreBtn').disabled = DEMO;
  showStatus();
  if (DEMO) paint(); else if (root) root.child('match/drafts').get().then(function(s){ DRAFTS = s.val() || {}; paint(); });
});

function showStatus(){
  if (DEMO) { $('status').textContent = '예시 화면입니다. 실제 주문이 아니며 입력은 저장되지 않습니다.'; return; }
  $('status').textContent = DATA && DATA.readAt ? '마지막으로 읽은 시각: ' + new Date(DATA.readAt).toLocaleString('ko-KR') + ' · 매칭할 상품 ' + (DATA.items || []).length + '종 · 이벗 상품 ' + (DATA.masters || []).length + '개' : '아직 읽은 자료가 없습니다. 「이벗에서 새로 읽기」를 눌러 주세요.';
}
/* 명령을 보내고 헤드비서의 끝 소식을 기다림 */
function command(p, label){
  var ref = root.child('commands').push();
  $('status').textContent = label + ' 중…';
  $('readBtn').disabled = true; $('moreBtn').disabled = true;
  return ref.set(Object.assign({ by: (me && me.email) || '', at: firebase.database.ServerValue.TIMESTAMP }, p)).then(function(){
    return new Promise(function(ok, no){
      var t = setTimeout(function(){ ref.off('value', on); no(new Error('응답 없음. 상시 컴퓨터를 확인해 주세요.')); }, 180000);
      var on = ref.on('value', function(s){
        var c = s.val() || {};
        if (c.status === 'done') { clearTimeout(t); ref.off('value', on); ok(ref.key); }
        if (c.status === 'refused' || c.status === 'expired' || c.status === 'interrupted') { clearTimeout(t); ref.off('value', on); no(new Error(c.why || '처리되지 않았습니다')); }
      });
    });
  }).then(function(key){ $('readBtn').disabled = false; $('moreBtn').disabled = false; return key; }, function(e){ $('readBtn').disabled = false; $('moreBtn').disabled = false; $('status').textContent = label + ' 실패: ' + e.message; throw e; });
}
$('readBtn').addEventListener('click', function(){ command({ type: 'match_read' }, '이벗 자료 읽기').catch(function(){}); });
$('moreBtn').addEventListener('click', function(){
  var text = $('q').value.trim(); if (!text) { $('q').focus(); return; }
  command({ type: 'match_search', text: text }, '이벗 상품 찾기').then(function(key){
    return root.child('match/search/' + key).get().then(function(s){
      var v = s.val() || {}, have = {}; masters().forEach(function(m){ have[m.code] = 1; });
      (v.rows || []).forEach(function(m){ if (!have[m.code]) EXTRA.push(m); });
      showStatus(); paintCands();
      root.child('match/search/' + key).remove();
    });
  }).catch(function(){});
});

WMSync.init('secretary_match', { requireAuth: true });
var started = false;
WMSync.onAuth(function(st){
  if (!st.user || started) return;
  started = true; me = st.user;
  root = firebase.database().ref('secretary');
  root.child('match/data').on('value', function(s){ DATA = s.val(); if (!DEMO) { showStatus(); paint(); } });
  root.child('match/drafts').on('value', function(s){ if (!DEMO) { DRAFTS = s.val() || {}; paint(); } });
});
</script>
<script src="/mm_copy.js" defer></script>
</body>
</html>
