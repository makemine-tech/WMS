<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문 매칭 · AI 물류비서</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root { color-scheme:light; --line:#c9ced6; --soft:#f2f4f7; --red:#c81e1e; --blue:#0b57d0; --green:#0a7d3e; --mark:#ffe14d; }
  html, body { background:#fff; color:#000; }
  body { font-family:'Noto Sans KR',sans-serif; font-size:18px; line-height:1.4; min-height:100vh; }
  .wrap { width:calc(100% - 2rem); max-width:1720px; margin:0 auto; padding:.9rem 0 3rem; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:.8rem; flex-wrap:wrap; margin-bottom:.8rem; }
  h1 { font-size:1.6rem; font-weight:900; }
  .tag { color:var(--red); font-weight:900; margin-left:.6rem; font-size:1rem; white-space:nowrap; }
  .btn { background:#fff; border:2px solid #000; color:#000; border-radius:8px; padding:.5rem .9rem; font:inherit; font-weight:800; cursor:pointer; white-space:nowrap; }
  .btn:hover { background:var(--soft); } .btn:disabled { opacity:.35; cursor:not-allowed; }
  .btn.add { background:var(--blue); border-color:var(--blue); color:#fff; flex:none; }
  .btn.add:hover { background:#0842a0; }
  .addbox { display:flex; flex-direction:column; align-items:center; gap:.15rem; flex:none; }
  .stock { font-size:1.05rem; font-weight:900; white-space:nowrap; } .stock.none { color:var(--red); }
  .btn.confirm { display:block; width:100%; background:var(--green); border-color:var(--green); color:#fff; font-size:1.4rem; font-weight:900; padding:.75rem; margin-top:.9rem; }
  .btn.confirm:hover:not(:disabled) { background:#075f2f; }
  .btn.confirm:disabled { background:#fff; color:#000; border-color:var(--line); opacity:.6; }
  .done { margin-top:.8rem; border-top:2px solid var(--line); padding-top:.6rem; }
  .done-row { display:flex; justify-content:space-between; gap:.5rem; align-items:center; padding:.35rem 0; font-size:1rem; font-weight:700; }
  .grid { display:grid; grid-template-columns:minmax(260px,.7fr) minmax(480px,1.7fr) minmax(340px,1fr); gap:1rem; align-items:start; }
  .pane { border:2px solid #000; border-radius:12px; padding:.9rem; min-width:0; }
  .pane > h2 { font-size:1.25rem; font-weight:900; margin-bottom:.7rem; }
  .step { display:inline-block; min-width:1.6em; text-align:center; background:#000; color:#fff; border-radius:6px; margin-right:.4rem; }
  .item { display:block; width:100%; text-align:left; background:#fff; border:2px solid var(--line); color:#000; border-radius:8px; padding:.6rem .7rem; margin-bottom:.5rem; font:inherit; font-weight:700; cursor:pointer; }
  .item:hover { border-color:#000; } .item.on { border-color:var(--blue); background:#eaf1ff; outline:2px solid var(--blue); }
  .item .sub { display:block; font-weight:400; margin-top:.15rem; font-size:1rem; }
  .ok { color:var(--green); font-weight:900; }
  mark { background:var(--mark); color:#000; font-weight:900; padding:0 .12em; border-radius:3px; }
  .bigname { font-size:30px; font-weight:900; line-height:1.25; white-space:nowrap; overflow:hidden; margin-bottom:.8rem; }
  .bigname.wrapit { white-space:normal; }
  .facts { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.9rem; margin-bottom:.8rem; }
  .fact { border:2px solid var(--line); border-radius:10px; padding:.55rem .8rem; min-width:0; }
  .fact small { display:block; font-size:1rem; font-weight:700; }
  .fact b { display:block; font-size:28px; font-weight:900; line-height:1.3; word-break:keep-all; }
  .fact.qty { text-align:center; min-width:130px; } .fact.qty b { font-size:44px; line-height:1.1; }
  .caution { color:var(--red); font-size:1.3rem; font-weight:900; margin-bottom:.8rem; }
  .sec { font-size:1.15rem; font-weight:900; margin:.2rem 0 .3rem; }
  .pick { display:grid; grid-template-columns:minmax(0,1fr) 96px auto; gap:.5rem; align-items:center; padding:.5rem 0; border-top:2px solid var(--line); font-weight:700; font-size:1.1rem; }
  input[type=search], input[type=number] { background:#fff; border:2px solid #000; color:#000; border-radius:8px; padding:.5rem .6rem; font:inherit; font-weight:700; width:100%; }
  input[type=number] { font-size:1.5rem; font-weight:900; text-align:center; padding:.3rem; }
  .row-s { display:flex; gap:.5rem; margin-bottom:.7rem; }
  .cand { display:flex; justify-content:space-between; gap:.6rem; align-items:center; padding:.6rem 0; border-top:2px solid var(--line); font-weight:700; }
  .empty { padding:.8rem .1rem; }
  details { margin-top:.9rem; border-top:2px solid var(--line); padding-top:.5rem; }
  summary { cursor:pointer; font-weight:800; }
  .hist { padding:.35rem 0; border-top:1px solid var(--line); font-size:1rem; }
  .pbar { display:flex; align-items:center; gap:.7rem; font-weight:900; margin:0 0 .8rem; } .pbar[hidden] { display:none; }
  .pbar canvas { display:block; width:360px; max-width:70vw; height:auto; image-rendering:pixelated; }
  .btn.save { background:var(--red); border-color:var(--red); color:#fff; }
  .ask { border:2px solid var(--red); border-radius:10px; padding:.7rem .9rem; margin:0 0 .8rem; font-weight:800; } .ask[hidden] { display:none; }
  .ask .btns { display:flex; gap:.5rem; margin-top:.5rem; }
  .bad { color:var(--red); font-weight:900; }
  @media (max-width:1100px) { .grid { grid-template-columns:minmax(0,1fr); } .bigname { white-space:normal; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>주문 매칭<span class="tag" id="waitTag"></span></h1>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
      <span id="status"></span>
      <button class="btn" type="button" id="readBtn">불러오기</button>
      <button class="btn save" type="button" id="saveBtn" hidden></button>
      <button class="btn" type="button" id="demoBtn">예시</button>
    </div>
  </div>
  <div class="pbar" id="bar" hidden><canvas id="barCv" width="360" height="64"></canvas><span id="barText"></span></div>
  <div class="ask" id="ask" hidden><div id="askText"></div><div class="btns"><button class="btn save" type="button" id="askYes">이벗에 저장</button><button class="btn" type="button" id="askNo">취소</button></div></div>
  <div class="grid">
    <div class="pane"><h2><span class="step">1</span>주문 상품 <span id="progress"></span></h2><div id="items"></div><div id="doneList"></div></div>
    <div class="pane"><h2><span class="step">2</span>확인</h2><div id="detail"><div class="empty">1번에서 상품을 고르세요.</div></div></div>
    <div class="pane"><h2><span class="step">3</span>이벗 상품</h2>
      <div class="row-s"><input type="search" id="q" placeholder="상품명 검색"><button class="btn" type="button" id="moreBtn">이벗 검색</button></div>
      <div id="cands"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="wms_sync.js"></script>
<script src="/wms_access.js" data-page="secretary_match" data-floor="2"></script>
<script src="secretary_core.js"></script>
<script src="secretary_match.js"></script>
<script src="secretary_office.js"></script>
<script>
/* ============================================================
   주문 매칭 화면 (대표님 2026-11-01) — 흰 바탕·검정 큰 글씨, 설명 최소
     1 주문 상품 → 2 상품명·옵션·주문수량 크게, 2Pack·용량·개수 강조 → 3 이벗 상품(유추 먼저, 없으면 검색)
   자료 읽기와 이벗 저장은 상시 컴퓨터 헤드비서가 함. 이 페이지는 이벗에 직접 닿지 않음. 입력은 secretary/match/drafts 임시 저장
   「매칭 확정」한 상품만 「이벗에 저장」으로 보냄 (match_save). 진행은 이벗 비서 진행 막대로 보여 줌
============================================================ */
var C = window.SECRETARY_CORE, M = window.SECRETARY_MATCH;
var $ = function(id){ return document.getElementById(id); };
var root = null, me = null, DATA = null, DRAFTS = {}, SEL = null, DEMO = false, EXTRA = [];
var DEMO_DATA = { readAt: 0, masters: [
    { code: 'd1', name: '[A45아크네스]아크네스 데일리 딥 클렌저 120g', stock: 128 }, { code: 'd2', name: '[A03아크네스] 데일리 딥 클렌저 100g', stock: 0 },
    { code: 'd3', name: '[M01멘소래담] 마사지 롤온 로션 50ml', stock: 42 }, { code: 'd4', name: '[M02멘소래담] 쿨 롤온 로션 50ml', stock: 7 }, { code: 'd5', name: '[A14아크네스] 퍼펙트 솔루션 바디워시 500ml', stock: 1350 }, { code: 'd6', name: '호박 샤워볼(증정용)', stock: 15 } ],
  items: [
    { name: '[추가10%적립] 아크네스 데일리 딥 클렌저 120g, 2개', opt: '수량: 3개', qty: 1, site: '맨소레담공식스마트스토어', orders: 4 },
    { name: '멘소래담 마사지 롤온 로션 50ml + 쿨 롤온 로션 50ml', opt: '선택: 핫 롤온 로션 2개', qty: 1, site: '맨소레담공식스마트스토어', orders: 2 },
    { name: '아크네스 퍼펙트 솔루션 바디워시 500ml 약산성 등드름 케어', opt: '선택: 퍼펙트 솔루션 바디워시 500ml / 증정: 호박 샤워볼', qty: 1, site: '맨소레담공식스마트스토어', orders: 1 } ],
  history: { '[추가10%적립] 아크네스 데일리 딥 클렌저 120g, 2개': [{ name: '[추가10%적립] 아크네스 데일리 딥 클렌저 120g, 2개', opt: '수량: 3개', qty: 3, master: '[A45아크네스]아크네스 데일리 딥 클렌저 120g - 9' }] } };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
/* 옵션 앞의 「선택:」「수량:」 은 그대로 둠 — 이벗 값과 대조할 수 있게 글자를 바꾸지 않음 */
function marked(s){ return M.marks(s).map(function(p){ return p.hit ? '<mark>' + esc(p.t) + '</mark>' : esc(p.t); }).join(''); }
function src(){ return DEMO ? DEMO_DATA : DATA; }
/* 지난 매칭: 예전 자료는 상품명 이름표, 새 자료는 목록 */
function histFor(name){
  var h = (src() && src().history) || [];
  if (Array.isArray(h)) { var f = h.find(function(x){ return x.name === name; }); return (f && f.rows) || []; }
  return h[name] || [];
}
function unsaved(){ return M.splitItems(items(), DRAFTS).confirmed.filter(function(it){ var s = draft(keyOf(it)).saved; return !(s && s.ok); }); }
function items(){ var d = src(); return (d && d.items) || []; }
function keyOf(it){ return M.itemKey(it.name, it.opt, it.qty); }
function draft(k){ return DRAFTS[k] || { picks: [] }; }
function saveDraft(k, d){
  d.by = (me && me.email) || ''; d.at = Date.now();
  DRAFTS[k] = d;
  if (!DEMO && root) root.child('match/drafts/' + k).set(d).catch(function(e){ $('status').textContent = '저장 실패: ' + e.message; });
  paint();
}
function paintItems(){
  var parts = M.splitItems(items(), DRAFTS), list = parts.open;
  $('items').innerHTML = list.length ? list.map(function(it){
    var k = keyOf(it), ready = M.draftReady(it, draft(k));
    return '<button class="item' + (SEL === k ? ' on' : '') + '" type="button" data-k="' + k + '">' + (ready ? '<span class="ok">✓ </span>' : '') + marked(it.name) +
      '<span class="sub">' + (it.opt ? marked(it.opt) + ' · ' : '') + '주문 ' + it.qty + '개 · ' + it.orders + '건</span></button>';
  }).join('') : '<div class="empty" style="font-size:1.3rem;font-weight:900">매칭할 상품이 없습니다.</div>';
  $('progress').textContent = list.length ? list.length + '건 남음' : '';
  /* 확정만 하고 이벗에 저장 안 한 것은 끝난 것처럼 보이지 않게 대기 수를 표시 */
  var wait = unsaved();
  $('waitTag').textContent = wait.length ? '이벗 저장 전 ' + wait.length + '건' : '';
  $('saveBtn').hidden = DEMO || !wait.length || SAVING;
  $('saveBtn').textContent = '이벗에 저장 ' + wait.length + '건';
  $('doneList').innerHTML = parts.confirmed.length ? '<div class="done"><b>확정 ' + parts.confirmed.length + '건</b>' + parts.confirmed.map(function(it){
    var s = draft(keyOf(it)).saved, state = s && s.ok ? '<span class="ok">이벗 저장됨</span>' : (s ? '<span class="bad">' + esc(s.msg || '저장 실패') + '</span> ' : '') + '<button class="btn" type="button" data-undo="' + keyOf(it) + '">되돌리기</button>';
    return '<div class="done-row"><span>' + esc(it.name) + '</span><span>' + state + '</span></div>';
  }).join('') + '</div>' : '';
}
function current(){ return M.splitItems(items(), DRAFTS).open.find(function(it){ return keyOf(it) === SEL; }); }
/* 상품명은 한 줄로: 넘치면 글자를 줄이고, 그래도 안 되면 줄바꿈 (잘라서 숨기지 않음) */
function fitName(){
  var el = document.querySelector('.bigname'); if (!el) return;
  el.classList.remove('wrapit');
  for (var s = 30; s >= 20; s--) { el.style.fontSize = s + 'px'; if (el.scrollWidth <= el.clientWidth) return; }
  el.classList.add('wrapit');
}
function paintDetail(){
  var it = current();
  if (!it) { $('detail').innerHTML = '<div class="empty">1번에서 상품을 고르세요.</div>'; return; }
  var d = draft(SEL), w = M.warnings(it.name, it.opt), hist = histFor(it.name);
  var html = '<div class="bigname">' + marked(it.name) + '</div>' +
    '<div class="facts"><div class="fact"><small>옵션</small><b>' + (it.opt ? marked(it.opt) : '없음') + '</b></div><div class="fact qty"><small>주문수량</small><b>' + it.qty + '</b></div></div>';
  if (w.length) html += '<div class="caution">' + w.map(function(x){ return esc(x.text); }).join(' · ') + '</div>';
  html += '<div class="sec">넣을 상품 · 총 수량</div>';
  html += (d.picks || []).map(function(p, i){ return '<div class="pick"><span>' + esc(p.name) + '</span><input type="number" min="1" step="1" data-q="' + i + '" value="' + esc(p.qty || '') + '" aria-label="총 수량"><button class="btn" type="button" data-del="' + i + '">빼기</button></div>'; }).join('');
  if (!(d.picks || []).length) html += '<div class="empty">3번에서 상품을 추가하세요.</div>';
  html += '<button class="btn confirm" type="button" id="confirmBtn"' + (M.draftReady(it, d) ? '' : ' disabled') + '>매칭 확정</button>';
  if (hist.length) html += '<details><summary>지난 매칭 ' + hist.length + '건</summary>' + hist.map(function(h){ return '<div class="hist">' + esc(h.opt || '옵션 없음') + ' · 주문 ' + h.qty + '개 → ' + esc(h.master) + '</div>'; }).join('') + '</details>';
  $('detail').innerHTML = html;
  fitName();
}
function masters(){ var d = src(); return ((d && d.masters) || []).concat(EXTRA); }
function paintCands(){
  var it = current(), q = $('q').value.trim();
  if (!it && !q) { $('cands').innerHTML = ''; return; }
  var list = q ? M.candidates('', '', masters(), q) : M.candidates(it.name, it.opt, masters());
  $('cands').innerHTML = list.length ? list.map(function(m){ return '<div class="cand"><span>' + marked(m.name) + (m.opt && m.opt !== '-' ? ' · ' + esc(m.opt) : '') + '</span><span class="addbox">' + (m.stock != null ? '<span class="stock' + (m.stock <= 0 ? ' none' : '') + '" title="이벗 가용재고 (불러온 때 기준)">' + Number(m.stock).toLocaleString('ko-KR') + '개</span>' : '') + '<button class="btn add" type="button" data-add="' + esc(m.code) + '"' + (it ? '' : ' disabled') + '>추가</button></span></div>'; }).join('') : '<div class="empty">없습니다. 상품명을 넣고 「이벗 검색」을 누르세요.</div>';
}
function paint(){ paintItems(); paintDetail(); paintCands(); }

$('items').addEventListener('click', function(e){ var b = e.target.closest('[data-k]'); if (!b) return; SEL = b.getAttribute('data-k'); $('q').value = ''; paint(); });
$('cands').addEventListener('click', function(e){
  var code = e.target.getAttribute && e.target.getAttribute('data-add'); if (!code || !SEL) return;
  /* 총 수량은 주문수량을 그대로 넣어 둠 (대표님 2026-11-03). 다르면 사람이 고침 */
  var m = masters().find(function(x){ return String(x.code) === code; }), d = draft(SEL), it = current();
  d.picks = (d.picks || []).filter(function(p){ return p.code !== code; }).concat([{ code: code, seq: m.seq || '', name: m.name, qty: (it && Number(it.qty)) || 1 }]);
  saveDraft(SEL, d);
  var input = document.querySelector('[data-q="' + (d.picks.length - 1) + '"]'); if (input) { input.focus(); input.select(); }
});
$('detail').addEventListener('click', function(e){
  if (e.target.id === 'confirmBtn') {
    var it = current(), cd = draft(SEL);
    if (!it || !M.draftReady(it, cd)) return;
    cd.status = 'confirmed'; cd.confirmedAt = Date.now();
    var key = SEL;
    SEL = null;
    saveDraft(key, cd);
    /* 다음 상품으로 바로 이동 */
    var next = M.splitItems(items(), DRAFTS).open[0];
    if (next) { SEL = keyOf(next); $('q').value = ''; paint(); }
    return;
  }
  var i = e.target.getAttribute && e.target.getAttribute('data-del'); if (i == null) return;
  var d = draft(SEL); d.picks.splice(Number(i), 1); saveDraft(SEL, d);
});
$('doneList').addEventListener('click', function(e){
  var k = e.target.getAttribute && e.target.getAttribute('data-undo'); if (!k) return;
  var d = draft(k); delete d.status; delete d.confirmedAt; saveDraft(k, d);
});
$('detail').addEventListener('change', function(e){
  var d = draft(SEL), i = e.target.getAttribute('data-q');
  if (i != null) { d.picks[Number(i)].qty = Number(e.target.value) || ''; saveDraft(SEL, d); }
});
$('q').addEventListener('input', paintCands);
window.addEventListener('resize', fitName);
$('demoBtn').addEventListener('click', function(){
  DEMO = !DEMO; SEL = null; EXTRA = [];
  if (DEMO) DRAFTS = {};
  $('demoBtn').textContent = DEMO ? '실제 자료' : '예시';
  $('readBtn').disabled = DEMO; $('moreBtn').disabled = DEMO; $('ask').hidden = true;
  showStatus();
  if (DEMO) paint(); else if (root) root.child('match/drafts').get().then(function(s){ DRAFTS = s.val() || {}; paint(); });
});

function showStatus(){
  if (DEMO) { $('status').textContent = '예시 화면'; return; }
  $('status').textContent = DATA && DATA.readAt ? new Date(DATA.readAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' 읽음' : '아직 안 읽음';
}
/* 명령을 보내고 헤드비서의 끝 소식을 기다림 */
function command(p, label, wait, onStatus){
  var ref = root.child('commands').push();
  $('status').textContent = label + ' 중…';
  $('readBtn').disabled = true; $('moreBtn').disabled = true;
  return ref.set(Object.assign({ by: (me && me.email) || '', at: firebase.database.ServerValue.TIMESTAMP }, p)).then(function(){
    return new Promise(function(ok, no){
      var t = setTimeout(function(){ ref.off('value', on); no(new Error('응답 없음')); }, wait || 180000);
      var on = ref.on('value', function(s){
        var c = s.val() || {};
        if (onStatus) onStatus(c);
        if (c.status === 'done') { clearTimeout(t); ref.off('value', on); ok(ref.key); }
        if (c.status === 'refused' || c.status === 'expired' || c.status === 'interrupted') { clearTimeout(t); ref.off('value', on); no(new Error(c.why || '처리 안 됨')); }
      });
    });
  }).then(function(key){ $('readBtn').disabled = false; $('moreBtn').disabled = false; return key; }, function(e){ $('readBtn').disabled = false; $('moreBtn').disabled = false; $('status').textContent = label + ' 실패: ' + e.message; throw e; });
}
/* 진행 막대: 헤드비서에 보낸 요청과 저장 작업 기록(jobs/match_save)으로만 움직임 */
var BAR = null, SAVING = false, SAVE_JOB = null, BAR_STATE = null;
function setBar(b){
  BAR_STATE = b;
  if (!BAR) BAR = window.SECRETARY_OFFICE.progress($('barCv'));
  $('bar').hidden = !b;
  BAR.set(b ? { who: 'ebut', state: b.state, pct: b.pct } : { state: 'off' });
  $('barText').textContent = b ? b.text : '';
}
$('readBtn').addEventListener('click', function(){
  setBar({ state: 'run', pct: null, text: '이벗에서 불러오는 중' });
  command({ type: 'match_read' }, '불러오기').then(function(){ setBar({ state: 'done', pct: 1, text: '불러왔습니다' }); }, function(e){ setBar({ state: 'stop', pct: 1, text: '불러오지 못했습니다: ' + e.message }); });
});
$('saveBtn').addEventListener('click', function(){
  var list = unsaved();
  if (!list.length) return;
  $('askText').textContent = '확정한 ' + list.length + '건을 이벗 주문 매칭에 저장합니다. 이벗 매칭 정보로 남아 다음 주문부터 자동 매칭되고, 되돌리려면 이벗에서 지워야 합니다.';
  $('ask').hidden = false;
});
$('askNo').addEventListener('click', function(){ $('ask').hidden = true; });
$('askYes').addEventListener('click', function(){
  $('ask').hidden = true;
  var list = unsaved().map(function(it){ var d = draft(keyOf(it)); return { key: keyOf(it), name: it.name, opt: it.opt || '', qty: it.qty, picks: (d.picks || []).map(function(p){ return { code: p.code, qty: Number(p.qty), name: p.name }; }) }; });
  if (!list.length) return;
  SAVING = true; paint();
  setBar({ state: 'run', pct: null, text: '이벗 매칭 창 여는 중' });
  watchSave(command({ type: 'match_save', items: list }, '저장', 20 * 60 * 1000, function(c){ if (c.jobKey && !SAVE_JOB) followJob(c.jobKey); }));
});
function followJob(key){
  SAVE_JOB = root.child('jobs/' + key);
  SAVE_JOB.on('value', function(s){
    var j = s.val();
    if (!j) return;
    if (j.state === 'running') setBar({ state: 'run', pct: j.total ? ((Number(j.done) || 0) + .5) / (j.total + 1) : null, text: j.step || '저장 중' });
    else setBar(j.state === 'done' ? { state: 'done', pct: 1, text: '이벗 저장 완료 ' + ((j.result && j.result.saved) || 0) + '건' } : { state: 'stop', pct: 1, text: j.notes || '확인 필요' });
  });
}
function watchSave(p){
  p.then(function(){}, function(e){ if (!SAVE_JOB) setBar({ state: 'stop', pct: 1, text: '저장하지 못했습니다: ' + e.message }); }).then(function(){
    SAVING = false;
    if (SAVE_JOB) { var ref = SAVE_JOB; setTimeout(function(){ ref.off(); }, 60000); SAVE_JOB = null; }
    paint();
  });
}
$('moreBtn').addEventListener('click', function(){
  var text = $('q').value.trim(); if (!text) { $('q').focus(); return; }
  command({ type: 'match_search', text: text }, '검색').then(function(key){
    return root.child('match/search/' + key).get().then(function(s){
      var v = s.val() || {}, have = {}; masters().forEach(function(m){ have[m.code] = 1; });
      (v.rows || []).forEach(function(m){ if (!have[m.code]) EXTRA.push(m); });
      showStatus(); paintCands();
      root.child('match/search/' + key).remove();
    });
  }).catch(function(){});
});

WMSync.init('secretary_match', { requireAuth: true });
var started = false;
WMSync.onAuth(function(st){
  if (!st.user || started) return;
  started = true; me = st.user;
  root = firebase.database().ref('secretary');
  root.child('match/data').on('value', function(s){ DATA = s.val(); if (!DEMO) { showStatus(); paint(); } });
  root.child('match/drafts').on('value', function(s){ if (!DEMO) { DRAFTS = s.val() || {}; paint(); } });
});
</script>
