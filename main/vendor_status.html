<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>재고 현황 — 메이크창고</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="/wms_vendor_projection.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0B1220;--card:#141E33;--bd:#26344F;--tx:#E8EEF7;--sub:#8597B0;--accent:#3B82F6;--green:#34D399;--amber:#FBBF24;}
body{background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--tx);min-height:100vh;padding:0 0 40px;}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px;}
.center{text-align:center;padding:70px 20px;color:var(--sub);font-size:14px;}
.spinner{width:26px;height:26px;border:2px solid var(--bd);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* 헤더 */
.rpt-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--bd);padding-bottom:16px;margin-bottom:20px;}
.rpt-title{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:.18em;margin-bottom:5px;}
.rpt-vendor{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.1;}
.rpt-meta{text-align:right;font-size:11px;color:var(--sub);line-height:1.7;flex-shrink:0;}
.rpt-meta b{color:var(--tx);font-weight:700;}
.tools{display:flex;gap:8px;margin-top:8px;justify-content:flex-end;flex-wrap:wrap;}
.tbtn{background:rgba(255,255,255,.06);color:var(--sub);border:1px solid var(--bd);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.tbtn:hover{background:rgba(255,255,255,.1);color:var(--tx);}

/* 참고용 안내 배너 */
.notice-banner{display:flex;gap:11px;align-items:flex-start;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);border-left:4px solid var(--amber);border-radius:10px;padding:13px 15px;margin-bottom:18px;}
.notice-banner .ni{font-size:19px;line-height:1.35;flex-shrink:0;}
.notice-banner .nt{font-size:12.5px;color:#FDE68A;line-height:1.7;}
.notice-banner .nt b{color:#FCD34D;font-weight:800;}

/* 요약 카드 */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;}
.scard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 14px;text-align:center;}
.scard .v{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1;}
.scard .l{font-size:11px;color:var(--sub);margin-top:7px;font-weight:600;letter-spacing:.03em;}
.scard.a .v{color:#60A5FA;} .scard.b .v{color:var(--green);} .scard.c .v{color:var(--amber);}

/* 테이블 */
.tbl-wrap{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow-x:auto;overflow-y:hidden;}
table{width:100%;border-collapse:collapse;}
thead th{background:rgba(255,255,255,.04);font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.05em;text-align:right;padding:12px 16px;border-bottom:1px solid var(--bd);}
thead th.l{text-align:left;}
tbody td{padding:13px 16px;font-size:14px;text-align:right;border-bottom:1px solid rgba(255,255,255,.05);}
tbody td.l{text-align:left;font-weight:600;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:nth-child(even){background:rgba(255,255,255,.015);}
.num{font-variant-numeric:tabular-nums;font-weight:700;}
.num .u{font-size:11px;color:var(--sub);font-weight:600;margin-left:2px;}
tfoot td{padding:14px 16px;font-size:14px;font-weight:800;text-align:right;border-top:2px solid var(--bd);background:rgba(59,130,246,.07);}
tfoot td.l{text-align:left;letter-spacing:.04em;}
.empty{text-align:center;color:var(--sub);padding:44px 20px;font-size:14px;}

/* 정렬 바 */
.sortbar{display:flex;align-items:center;gap:6px;margin-bottom:11px;flex-wrap:wrap;}
.sortlabel{font-size:11px;color:var(--sub);font-weight:700;margin-right:2px;}
.sortbtn{background:rgba(255,255,255,.05);color:var(--sub);border:1px solid var(--bd);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;}
.sortbtn.active{background:rgba(59,130,246,.18);color:#93C5FD;border-color:rgba(59,130,246,.5);}

/* 총수량 펼침 버튼 */
.qcell{cursor:pointer;}
.pn{font-weight:600;}
.qty-toggle{background:none;border:none;color:var(--tx);font-size:14px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px;padding:2px 0;}
.qty-toggle .u{font-size:11px;color:var(--sub);font-weight:600;margin-left:1px;}
.qty-toggle .caret{font-size:10px;color:#60A5FA;}
.qty-toggle:hover{color:#93C5FD;}

/* 세부 적재구성 */
.detail-row td{padding:0 16px 12px!important;background:rgba(255,255,255,.015);text-align:left;}
.bd-box{background:rgba(0,0,0,.22);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;}
.bd-line{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-variant-numeric:tabular-nums;}
.bd-line:last-of-type{border-bottom:none;}
.bd-l{color:var(--tx);font-weight:600;}
.bd-r{color:#93C5FD;font-weight:700;}
.bd-total{text-align:right;font-size:13px;font-weight:800;color:var(--green);margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);}
.bd-empty{font-size:12px;color:var(--sub);padding:8px 2px;}

/* 재고 부족 */
.num.low{color:#F87171;}
.lowrow td{background:rgba(239,68,68,.05);}
.restock{display:inline-flex;align-items:center;gap:4px;background:rgba(239,68,68,.16);color:#FCA5A5;border:1px solid rgba(239,68,68,.45);border-radius:20px;padding:3px 9px 3px 7px;font-size:10.5px;font-weight:800;cursor:pointer;margin-left:8px;vertical-align:middle;letter-spacing:.02em;white-space:nowrap;}
.restock:hover{background:rgba(239,68,68,.28);color:#fff;}
.restock svg{flex-shrink:0;}

/* 낱개수량 입력 */
.loose-hint{background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.3);border-radius:9px;padding:8px 12px;font-size:12px;color:#C4B5FD;line-height:1.55;margin-bottom:11px;}
.loosehead{color:#C4B5FD!important;}
.loosecell{background:rgba(124,58,237,.05);}
.loose-inp{width:74px;background:#0B1220;border:1px solid #3B2E66;border-radius:7px;padding:7px 8px;color:#fff;font-size:14px;font-weight:700;text-align:right;outline:none;font-variant-numeric:tabular-nums;font-family:inherit;-moz-appearance:textfield;}
.loose-inp:focus{border-color:#7C3AED;background:#15102b;}
.loose-inp::-webkit-outer-spin-button,.loose-inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.loose-inp::placeholder{color:#4B5563;font-weight:600;}
.loosero{color:var(--sub);}
.sumv{color:var(--green);font-weight:800;}
.sumcell{background:rgba(52,211,153,.05);}

/* 창고별 낱개수량 입력(관리자) */
.loose-toggle .caret{color:#C4B5FD;}
.lw-box{background:rgba(124,58,237,.06);border:1px solid rgba(124,58,237,.3);border-radius:10px;padding:10px 12px;}
.lw-title{font-size:11.5px;color:#C4B5FD;font-weight:800;letter-spacing:.03em;margin-bottom:9px;}
.lw-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.08);}
.lw-line:last-of-type{border-bottom:none;}
.lw-name{font-size:13px;color:var(--tx);font-weight:600;}
.lw-legacy .lw-name{color:var(--amber);}
.lw-inp{width:88px;}
.lw-total{text-align:right;font-size:13px;font-weight:800;color:var(--green);margin-top:9px;padding-top:9px;border-top:1px solid rgba(124,58,237,.3);}
.lw-total b{color:var(--green);}
@media(max-width:640px){ .lw-inp{width:64px;} .lw-name{font-size:12px;} }

/* 검색바 */
.searchbar{display:flex;align-items:center;gap:9px;margin-bottom:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;}
.searchbar .sicon{font-size:14px;opacity:.7;flex-shrink:0;}
.search-inp{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--tx);font-size:14px;font-family:inherit;}
.search-inp::placeholder{color:var(--sub);}
.sclear{background:rgba(255,255,255,.08);border:1px solid var(--bd);color:var(--sub);border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:12px;line-height:1;flex-shrink:0;}
.sclear:hover{color:var(--tx);background:rgba(255,255,255,.14);}
.sresult{font-size:11px;color:var(--sub);font-weight:700;white-space:nowrap;flex-shrink:0;}
/* 범례 */
.legend{font-size:11.5px;color:var(--sub);line-height:1.5;margin-bottom:11px;padding:0 2px;}
.legend b{color:var(--tx);font-weight:700;}
/* 갱신 신선도 */
.reltime{color:var(--sub);}
.stale-badge{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:800;color:#FCD34D;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);border-radius:6px;padding:2px 7px;letter-spacing:0;}
/* 재고 없음 배지 */
.outbadge{display:inline-flex;align-items:center;gap:4px;background:rgba(148,163,184,.14);color:#CBD5E1;border:1px solid rgba(148,163,184,.4);border-radius:20px;padding:3px 9px;font-size:10.5px;font-weight:800;margin-left:8px;vertical-align:middle;white-space:nowrap;}

/* 재고조사 마감 버튼 강조 */
.tbtn.hl{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.5);color:#6EE7B7;}
.tbtn.hl:hover{background:rgba(52,211,153,.26);color:#A7F3D0;}
/* 재고조사 이력 오버레이 */
.hist-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.62);display:none;align-items:flex-start;justify-content:center;padding:32px 14px;overflow-y:auto;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
.hist-card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.hist-card.wide{max-width:820px;}
.hist-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--bd);font-size:15px;font-weight:800;background:rgba(255,255,255,.03);}
.hist-hd-btns{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.hist-x{background:rgba(255,255,255,.08);border:1px solid var(--bd);color:var(--sub);border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:14px;flex-shrink:0;}
.hist-x:hover{color:var(--tx);background:rgba(255,255,255,.15);}
.hist-body{padding:16px 18px;max-height:calc(100vh - 160px);overflow-y:auto;}
.hist-empty{text-align:center;color:var(--sub);padding:34px 10px;font-size:14px;line-height:1.7;}
.hist-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:11px;padding:12px 14px;margin-bottom:10px;}
.hist-item-main{flex:1;cursor:pointer;min-width:0;}
.hist-when{font-size:14px;font-weight:800;color:var(--tx);}
.hist-memo{font-size:12.5px;color:#93C5FD;margin-top:3px;word-break:break-all;}
.hist-meta{font-size:12px;color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums;}
.hist-acts{display:flex;gap:6px;flex-shrink:0;}
.hbtn{background:rgba(255,255,255,.06);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.hbtn:hover{background:rgba(255,255,255,.12);}
.hbtn.del{color:#FCA5A5;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1);}
.hbtn.del:hover{background:rgba(239,68,68,.2);color:#fff;}
.hist-note{margin-top:14px;font-size:11.5px;color:var(--sub);line-height:1.8;border-top:1px solid var(--bd);padding-top:12px;}
.hist-note b{color:var(--tx);}
@media(max-width:640px){ .hist-body{padding:12px;} .hist-item{flex-direction:column;align-items:stretch;} .hist-acts{justify-content:flex-end;} }

/* ── 세부내역(관리자 전용): 상품 × 유통기한 × 보관장소 ── */
.tbtn.dt{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.55);color:#93C5FD;}
.tbtn.dt:hover{background:rgba(59,130,246,.3);color:#DBEAFE;}
.dt-hint{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.3);border-radius:9px;padding:8px 12px;font-size:12px;color:#93C5FD;line-height:1.55;margin-bottom:11px;}
.dt-hint b{color:#BFDBFE;}
.dtbl thead th{word-break:keep-all;}
.dtbl tbody tr{background:none!important;}
.dtbl tbody td{border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;}
.dtbl tbody.pgrp+tbody.pgrp{border-top:1px solid var(--bd);}
.dtbl td.pnc{vertical-align:top;}
.drow{cursor:pointer;}
.drow:hover td.dc{background:rgba(59,130,246,.12);}
.dtbl td.dc.l{font-weight:600;}
.exp{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;}
.exp.none{color:var(--sub);font-weight:600;}
.expb{display:inline-block;font-size:10px;font-weight:800;border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:middle;}
.expb.expired{background:rgba(239,68,68,.18);color:#FCA5A5;border:1px solid rgba(239,68,68,.45);}
.expb.imminent{background:rgba(245,158,11,.16);color:#FCD34D;border:1px solid rgba(245,158,11,.45);}
.plc{font-weight:700;white-space:nowrap;}
.plc .pin{margin-right:3px;}
.locs{font-size:11px;color:var(--sub);margin-top:3px;font-weight:600;line-height:1.4;}
.psub{font-size:11px;color:var(--sub);font-weight:600;margin-top:4px;}
.lwsub{font-size:10.5px;color:var(--sub);font-weight:600;margin-top:3px;line-height:1.5;white-space:nowrap;}

/* ── 위치도 팝업 (창고 배치도 + 적색 네모) ── */
.loc-overlay{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.88);display:none;flex-direction:column;}
.loc-hd{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.loc-ttl{flex:1;min-width:0;}
.loc-ttl .t1{font-size:15px;font-weight:800;}
.loc-ttl .t2{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.55;}
.loc-ttl .t2 b{color:#FCA5A5;}
.zbtn{background:rgba(255,255,255,.08);border:1px solid var(--bd);color:var(--tx);border-radius:7px;min-width:34px;height:32px;cursor:pointer;font-size:15px;font-weight:800;flex-shrink:0;font-family:inherit;}
.zbtn:hover{background:rgba(255,255,255,.16);}
.loc-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:7px 14px;font-size:11.5px;color:var(--sub);background:#0F172A;border-bottom:1px solid var(--bd);flex-shrink:0;}
.lg-hit{display:inline-block;width:14px;height:14px;border:3px solid #EF4444;border-radius:3px;vertical-align:-3px;margin-right:5px;box-shadow:0 0 6px rgba(239,68,68,.7);}
.loc-body{flex:1;overflow:auto;padding:10px;background:#0F172A;}
.lm-wrap{display:inline-flex;flex-direction:column;gap:2px;padding:8px;user-select:none;-webkit-user-select:none;}
.lm-line{display:flex;gap:2px;align-items:flex-start;}
.lm-axis{display:grid;gap:2px;flex-shrink:0;}
.lm-lbl{display:flex;align-items:center;justify-content:center;font-weight:700;color:rgba(255,255,255,.7);line-height:1;font-variant-numeric:tabular-nums;}
.lm-lbl.on{color:#F87171;}
.lm-grid{display:inline-grid;gap:2px;flex-shrink:0;}
.lm-cell{border-radius:4px;overflow:hidden;box-sizing:border-box;display:grid;gap:2px;padding:2px;position:relative;}
.lm-cell.dim{opacity:.5;}
.lm-cell.hit{z-index:2;box-shadow:0 0 0 3px #EF4444,0 0 14px 2px rgba(239,68,68,.75);animation:hitpulse 1.4s ease-in-out infinite;}
@keyframes hitpulse{50%{box-shadow:0 0 0 3px #EF4444,0 0 3px 0 rgba(239,68,68,.3);}}
.lm-slot{border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:1px;min-width:0;min-height:0;box-sizing:border-box;}
.lm-slot.hs{background:rgba(239,68,68,.45)!important;border:2px solid #F87171!important;}
.lm-dot{border-radius:50%;flex-shrink:0;}
.lm-nm{color:#E2E8F0;text-align:center;line-height:1.1;overflow:hidden;width:100%;white-space:nowrap;margin-top:1px;}
.lm-ex{text-align:center;line-height:1;white-space:nowrap;}
@media(max-width:640px){
  .loc-hd{padding:8px 10px;gap:6px;} .loc-ttl .t1{font-size:14px;} .loc-ttl .t2{font-size:11px;}
  .zbtn{min-width:30px;height:30px;font-size:14px;}
  .locs{font-size:10px;} .expb{display:block;width:fit-content;margin:2px 0 0;}
}

.foot-note{font-size:11px;color:var(--sub);margin-top:16px;line-height:1.7;text-align:center;}
.notreg{max-width:440px;margin:40px auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:32px 26px;text-align:center;}

@media print{
  body{background:#fff;color:#000;}
  .tools,.tbtn,.searchbar,.hist-overlay,.loc-overlay,.dt-hint{display:none!important;}
  .scard,.tbl-wrap,.rpt-head{border-color:#bbb;}
  .scard{background:#f4f6fa;} thead th{background:#eef1f6;color:#333;}
  .rpt-vendor,.scard .v,.num{color:#000!important;}
}
@media(max-width:640px){
  .wrap{padding:14px 10px;}
  .rpt-vendor{font-size:22px;} .cards{gap:7px;} .scard{padding:14px 8px;} .scard .v{font-size:22px;} .scard .l{font-size:10px;}
  thead th,tbody td,tfoot td{padding:8px 5px;font-size:11.5px;}
  thead th{letter-spacing:0;}
  .num .u,.qty-toggle .u{display:none;}   /* 단위 숨겨 폭 절약 — 헤더로 구분 */
  .loose-inp{width:46px;padding:6px 4px;font-size:12px;}
  .qty-toggle{font-size:12px;gap:2px;}
  .pn{font-size:12px;}
  .detail-row td{padding:0 10px 10px!important;}
  .restock{font-size:9px;padding:2px 6px 2px 5px;margin-left:0;margin-top:4px;}
}
</style>
</head>

<script>

var auth=firebase.auth(), db=firebase.database();

function emKey(em){ return String(em||'').trim().toLowerCase().replace(/\./g,','); }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nf(n){return (n==null?0:n).toLocaleString('ko-KR');}
/* 낱개수량 노드 → 합계. 구형(숫자) / 신형(창고별 맵) 모두 지원 */
function looseSum(v){
  if(v==null) return 0;
  if(typeof v==='number') return v>0?v:0;
  if(typeof v==='object'){ var t=0; for(var k in v){ var n=+v[k]; if(n>0) t+=n; } return t; }
  var n=+v; return (isNaN(n)||n<0)?0:n;
}
function fmtTime(ts){
  if(!ts) return '—';
  try{ var d=new Date(ts);
    var p=function(x){return (x<10?'0':'')+x;};
    return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }catch(e){return '—';}
}
/* 갱신 경과시간(상대표시) */
function relTime(ts){
  if(!ts) return '';
  var diff=Date.now()-ts; if(diff<0) diff=0;
  var m=Math.floor(diff/60000);
  if(m<1) return '방금 전';
  if(m<60) return m+'분 전';
  var h=Math.floor(m/60);
  if(h<24) return h+'시간 전';
  var d=Math.floor(h/24);
  return d+'일 전';
}

function sortRows(rows){
  var r=rows.slice();
  if(_sortMode==='name') r.sort(function(a,b){return String(a.name).localeCompare(String(b.name),'ko');});
  else if(_sortMode==='pallet') r.sort(function(a,b){return (b.pallets||0)-(a.pallets||0);});
  else r.sort(function(a,b){return (b.totalQty||0)-(a.totalQty||0);});
  return r;
}

/* ===================================================================

   행 클릭 → 해당 창고 배치도 팝업에 상품 위치를 적색 네모로 표시.
   (wms.html 배치도와 동일한 격자: rows×cols 칸, 칸마다 divR×divC 슬롯, 슬롯=1파렛트)
=================================================================== */
var _view=/^#detail/.test(location.hash)?'detail':'summary';

var _detail=[];          /* [{p, groups:[{exp,wid,whName,pallets,qty,locs:[{ck,sk}]}]}] */
var _loc=null;           /* 위치도 팝업 상태 {i,j,zoom} */

/* wms.html 과 동일한 표시 규칙 */
var MCT={rack:{bg:'rgba(59,130,246,.20)',bdr:'#3B82F6'},shelf:{bg:'rgba(245,158,11,.16)',bdr:'#F59E0B'},empty:{bg:'rgba(148,163,184,.13)',bdr:'#64748B'},unused:{bg:'rgba(51,65,85,.18)',bdr:'#334155'}};
var MEM={expired:{clr:'#F87171',bg:'rgba(239,68,68,.22)',bdr:'#EF4444'},imminent:{clr:'#FBBF24',bg:'rgba(245,158,11,.18)',bdr:'#F59E0B'}};
var MBDR='#334155';
function fmtExp(s){ s=String(s||''); return s.length===6?'20'+s.slice(0,2)+'.'+s.slice(2,4)+'.'+s.slice(4,6):s; }
function fmtShort(s){ s=String(s||''); return s.length===6?s.slice(2,4)+'/'+s.slice(4,6):''; }
function getExpSt(exp){ exp=String(exp||''); if(exp.length!==6) return 'ok';
  var d=new Date('20'+exp.slice(0,2)+'-'+exp.slice(2,4)+'-'+exp.slice(4,6)); var now=new Date(); now.setHours(0,0,0,0);
  if(isNaN(d)) return 'ok'; if(d<now) return 'expired'; if((d-now)/86400000<=90) return 'imminent'; return 'ok'; }
function colAlpha(c){ var s=String.fromCharCode(65+(c%26)); if(c>=26) s=String.fromCharCode(65+Math.floor(c/26)-1)+s; return s; }
/* 칸 키 "r-c"(0부터) → 배치도 좌표 "B3" (가로 A,B,C… / 세로 1,2,3…) */
function cellLabel(ck){ var p=String(ck).split('-'), r=+p[0], c=+p[1]; return (isNaN(r)||isNaN(c))?String(ck):colAlpha(c)+(r+1); }
function locText(locs){
  var cnt={}, order=[];
  locs.forEach(function(l){ var lb=cellLabel(l.ck); if(!cnt[lb]){ cnt[lb]=0; order.push(lb); } cnt[lb]++; });
  var parts=order.map(function(lb){ return lb+(cnt[lb]>1?'×'+cnt[lb]:''); });
  return parts.length>8 ? parts.slice(0,8).join(' · ')+' 외 '+(parts.length-8)+'곳' : parts.join(' · ');
}

/* 상품 행(요약과 같은 정렬) → 유통기한·창고별 묶음. 집계 기준은 projection aggregate 와 동일(모든 슬롯) */
function buildDetail(rows){
  var byName={};
  rows.forEach(function(p){ byName[p.name]={p:p, g:{}}; });
  _whList.forEach(function(w){
    var cells=(w.wh&&w.wh.cells)||{};
    Object.keys(cells).forEach(function(ck){
      var c=cells[ck]; if(!c||!c.slots) return;
      Object.keys(c.slots).forEach(function(sk){
        var s=c.slots[sk]; if(!s||!s.name) return;
        var e=byName[s.name]; if(!e) return;
        var exp=String(s.exp||''), gk=exp+'||'+w.id;
        var g=e.g[gk]||(e.g[gk]={exp:exp, wid:w.id, whName:(w.wh&&w.wh.name)||w.id, pallets:0, qty:0, locs:[]});
        g.pallets++; g.qty+=(+s.qty||0); g.locs.push({ck:ck, sk:sk});
      });
    });
  });
  return rows.map(function(p){
    var e=byName[p.name];
    var gs=Object.keys(e.g).map(function(k){ return e.g[k]; });
    gs.sort(function(a,b){
      if(a.exp!==b.exp){ if(!a.exp) return 1; if(!b.exp) return -1; return a.exp<b.exp?-1:1; }   /* 유통기한 빠른순, 미기재 맨 뒤 */
      return String(a.whName).localeCompare(String(b.whName),'ko');
    });
    gs.forEach(function(g){ g.locs.sort(function(a,b){ var pa=a.ck.split('-'), pb=b.ck.split('-'); return (+pa[1]-+pb[1])||(+pa[0]-+pb[0]); }); });
    return {p:p, groups:gs};
  });
}

/* 낱개수량 창고별 내역 (상품 단위) */
function looseWhLines(p){
  var node=_loose[p._k];
  if(!node || typeof node!=='object') return '';
  var names={}; ((_lastInfo&&_lastInfo.warehouses)||[]).forEach(function(w){ names[w.id]=w.name||w.id; });
  var parts=Object.keys(node).filter(function(w){ return (+node[w])>0; })
    .map(function(w){ return esc(w==='__misc'?'미분류':(names[w]||w))+' '+nf(+node[w]); });
  return parts.length ? '<div class="lwsub">'+parts.join('<br>')+'</div>' : '';
}

function ensureLocOverlay(){

function hideLoc(){
  var o=document.getElementById('locOverlay'); if(o){ o.style.display='none'; o.innerHTML=''; }

}

}
window.closeLoc=closeLoc;
function zoomLoc(dz){ if(!_loc) return; _loc.zoom=Math.max(.3, Math.min(3, Math.round((_loc.zoom+dz)*10)/10)); renderLoc(); }
window.zoomLoc=zoomLoc;
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && _loc) closeLoc(); });

function renderLoc(){
  var o=document.getElementById('locOverlay'); if(!o||!_loc) return;
  var d=_detail[_loc.i], g=d&&d.groups[_loc.j]; if(!g){ closeLoc(); return; }
  var w=null; for(var x=0;x<_whList.length;x++){ if(_whList[x].id===g.wid){ w=_whList[x]; break; } }
  var head='<div class="loc-hd"><div class="loc-ttl"><div class="t1">📍 '+esc(g.whName)+' 위치도</div>'
    +'<div class="t2"><b>'+esc(d.p.name)+'</b> · 유통기한 '+esc(g.exp?fmtExp(g.exp):'미기재')+' · '+nf(g.pallets)+'팔 · '+nf(g.qty)+'개'
    +'<br>위치 '+esc(locText(g.locs))+'</div></div>'
    +'<button class="zbtn" onclick="zoomLoc(.2)" title="확대">＋</button><button class="zbtn" onclick="zoomLoc(-.2)" title="축소">－</button>'
    +'<button class="zbtn" onclick="closeLoc()" title="닫기">✕</button></div>';
  if(!w||!w.wh){ o.innerHTML=head+'<div class="loc-body"><div class="hist-empty">창고 배치도 정보를 찾을 수 없습니다.</div></div>'; return; }
  var wh=w.wh, cells=wh.cells||{}, pc=wh.pColors||{};
  var rows=+wh.rows||0, cols=+wh.cols||0;
  if(!rows||!cols){ Object.keys(cells).forEach(function(k){ var p=k.split('-'); rows=Math.max(rows,(+p[0]||0)+1); cols=Math.max(cols,(+p[1]||0)+1); }); }
  if(_loc.zoom==null){   /* 처음엔 화면 폭에 맞춤 */
    var need=cols*58+2*47+36;
    _loc.zoom=Math.max(.35, Math.min(1.2, Math.floor((Math.max(280,window.innerWidth-24)/need)*10)/10));
  }
  var CS=Math.round(56*_loc.zoom), LS=Math.round(CS*.8), LFS=Math.max(9,Math.round(CS*.42));
  var hitR={}, hitC={}, hitN=0;
  var grid='';
  for(var r=0;r<rows;r++){ for(var c=0;c<cols;c++){
    var key=r+'-'+c, cell=cells[key]||{}, ct=MCT[cell.type];
    var dR=cell.divR||1, dC=cell.divC||1, slots=cell.slots||{}, hit=false, subs='';
    for(var sr=0;sr<dR;sr++){ for(var sc=0;sc<dC;sc++){
      var sk=sr+'-'+sc, slot=slots[sk]||null;
      var isH=!!(slot && slot.name===d.p.name && String(slot.exp||'')===g.exp);
      if(isH){ hit=true; hitN++; }
      var subH=CS/dR, subW=CS/dC;
      var pClr=slot?(pc[slot.name]||'#94A3B8'):null;
      var em=slot?MEM[getExpSt(slot.exp)]:null;
      var bg=slot?(em?em.bg:(pClr+'3a')):(ct?ct.bg:'rgba(255,255,255,.04)');
      var bd=(slot&&em)?em.bdr:(ct?(ct.bdr+'55'):MBDR);
      var inner='';
      if(slot){
        var ds=Math.max(2,Math.min(5,subW*.28,subH*.28));
        inner='<div class="lm-dot" style="width:'+ds+'px;height:'+ds+'px;background:'+pClr+'"></div>';
        if(subH>=28 && subW>=20){
          inner+='<div class="lm-nm" style="font-size:'+Math.max(6,Math.min(9,subH*.15))+'px">'+esc(String(slot.name).slice(0,Math.max(2,Math.floor(subW/8))))+'</div>';
          var es=fmtShort(slot.exp);
          if(es) inner+='<div class="lm-ex" style="font-size:'+Math.max(5,Math.min(8,subH*.13))+'px;color:'+(em?em.clr:'#64748B')+'">'+es+'</div>';
        }
      }
      var tip=cellLabel(key)+(slot?' · '+slot.name+(slot.exp?' · '+fmtExp(slot.exp):'')+' · '+nf(+slot.qty||0)+'개':'');
      subs+='<div class="lm-slot'+(isH?' hs':'')+'" title="'+esc(tip)+'" style="background:'+bg+';border:1px solid '+bd+'">'+inner+'</div>';
    } }
    if(hit){ hitR[r]=1; hitC[c]=1; }
    grid+='<div class="lm-cell '+(hit?'hit':'dim')+'" style="width:'+CS+'px;height:'+CS+'px;background:'+(ct?ct.bdr+'22':'rgba(255,255,255,.03)')
      +';border:1.5px solid '+(ct?ct.bdr:MBDR)+';grid-template-columns:repeat('+dC+',minmax(0,1fr));grid-template-rows:repeat('+dR+',minmax(0,1fr))">'+subs+'</div>';
  } }
  function lbl(txt,wd,ht,on){ return '<div class="lm-lbl'+(on?' on':'')+'" style="width:'+wd+'px;height:'+ht+'px;font-size:'+LFS+'px">'+txt+'</div>'; }
  var colStrip='', rowStrip='';
  for(var c2=0;c2<cols;c2++) colStrip+=lbl(colAlpha(c2),CS,LS,hitC[c2]);
  for(var r2=0;r2<rows;r2++) rowStrip+=lbl(String(r2+1),LS,CS,hitR[r2]);
  colStrip='<div class="lm-axis" style="grid-template-columns:repeat('+cols+','+CS+'px)">'+colStrip+'</div>';
  rowStrip='<div class="lm-axis" style="grid-template-rows:repeat('+rows+','+CS+'px)">'+rowStrip+'</div>';
  var corner='<div style="width:'+LS+'px;height:'+LS+'px;flex-shrink:0"></div>';
  var map='<div class="lm-wrap">'
    +'<div class="lm-line">'+corner+colStrip+corner+'</div>'
    +'<div class="lm-line">'+rowStrip+'<div class="lm-grid" style="grid-template-columns:repeat('+cols+','+CS+'px)">'+grid+'</div>'+rowStrip+'</div>'
    +'<div class="lm-line">'+corner+colStrip+corner+'</div></div>';
  var legend='<div class="loc-legend"><span><i class="lg-hit"></i>해당 상품 위치 <b style="color:#FCA5A5">'+hitN+'팔</b></span>'
    +'<span>흐린 칸 = 다른 상품·빈 칸</span><span>좌표: 가로 A·B·C… / 세로 1·2·3…</span><span>배율 '+Math.round(_loc.zoom*100)+'%</span></div>';
  var bodyEl=o.querySelector('.loc-body'), keep=bodyEl?{l:bodyEl.scrollLeft,t:bodyEl.scrollTop}:null;
  o.innerHTML=head+legend+'<div class="loc-body">'+map+'</div>';
  var nb=o.querySelector('.loc-body'), first=o.querySelector('.lm-cell.hit');
  if(first && nb){   /* 첫 위치를 화면 가운데로 */
    var br=nb.getBoundingClientRect(), fr=first.getBoundingClientRect();
    nb.scrollLeft+= (fr.left+fr.width/2)-(br.left+br.width/2);
    nb.scrollTop += (fr.top+fr.height/2)-(br.top+br.height/2);
  } else if(keep && nb){ nb.scrollLeft=keep.l; nb.scrollTop=keep.t; }
}

function applySearchDom(){
  var q=(_search||'').trim().toLowerCase();

/* 창고별 낱개수량 입력(관리자 전용) — 입력 즉시 합계/총합계/총재고 갱신, blur 시 저장.
   메모리 모델(_loose[k])은 창고별 맵으로 정규화하며, 구형(숫자)은 '미분류(__misc)'로 보존 */
function onLooseWhInput(el, i, encKey, encWid, totalQty){
  var k=decodeURIComponent(encKey), wid=decodeURIComponent(encWid);
  var node=_loose[k];
  if(node==null || typeof node!=='object'){
    var lg=(typeof node==='number' && node>0)?node:0;
    node={}; if(lg>0) node.__misc=lg;
    _loose[k]=node;
  }
  var v=parseInt(el.value,10); if(isNaN(v)||v<0) v=0;
  if(v>0) node[wid]=v; else delete node[wid];
  var ls=looseSum(node);
  var sc=document.getElementById('sum-'+i); if(sc) sc.innerHTML=nf((+totalQty||0)+ls)+'<span class="u">개</span>';
  var lb=document.getElementById('loosebtn-'+i); if(lb) lb.innerHTML=nf(ls)+'<span class="u">개</span><span class="caret">▴</span>';
  var lt=document.getElementById('lwtot-'+i); if(lt) lt.textContent=nf(ls);
  recalcFooter();
}
window.onLooseWhInput=onLooseWhInput;

/* 전 품목 낱개합계를 모델 기준으로 재계산해 합계행/요약카드 갱신 (닫힌 행 포함) */

  var totLoose=0;
  (_rows||[]).forEach(function(r){ totLoose+=looseSum(_loose[r._k]); });
  var g=document.getElementById('grandTotal'); if(g) g.innerHTML=nf(_baseTotalQty+totLoose);
  var fl=document.getElementById('footLoose'); if(fl) fl.innerHTML=nf(totLoose)+'<span class="u">개</span>';
  var fs=document.getElementById('footSum'); if(fs) fs.innerHTML=nf(_baseTotalQty+totLoose)+'<span class="u">개</span>';
}

/* 저장: 정규화된 창고별 맵 전체를 기록(부분쓰기로 인한 숫자→맵 유실 방지). 0/빈값은 제거 */
function saveLooseWh(encKey){
  if(!_lastInfo || !_lastInfo.gid || !_lastInfo.vendorId) return;
  var k=decodeURIComponent(encKey);
  var node=_loose[k];
  var ref=db.ref('vendorLoose/'+_lastInfo.gid+'/'+_lastInfo.vendorId+'/'+k);
  if(node && typeof node==='object'){
    var clean={}, any=false;
    for(var w in node){ var n=+node[w]; if(n>0){ clean[w]=n; any=true; } }
    (any ? ref.set(clean) : ref.remove()).catch(function(e){ console.warn('낱개 저장 실패', e); });
  } else {
    var v=(+node||0);
    (v>0 ? ref.set(v) : ref.remove()).catch(function(e){ console.warn('낱개 저장 실패', e); });
  }
}

function dateStamp(){ var d=new Date(); var p=function(x){return (x<10?'0':'')+x;}; return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate()); }
function exportExcel(){
  if(typeof XLSX==='undefined'){ alert('엑셀 모듈을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'); return; }
  if(_canEdit && _view==='detail'){ exportDetailExcel(); return; }
  var info=_lastInfo||{}, data=_lastData||{};
  var vendorName=info.vendorName||'업체';
  var totPal=0, totQty=0, totLoose=0;
  var aoa=[];
  aoa.push(['재고 현황 보고서']);
  aoa.push(['업체', vendorName]);
  aoa.push(['기준시각', fmtTime(data.updatedAt)]);
  aoa.push([]);
  aoa.push(['상품명','파렛트(팔)','파렛트내 수량(개)','파렛트외 낱개수량(개)','총 재고(개)']);
  (_rows||[]).forEach(function(p){
    var loose=looseSum(_loose[p._k]);
    var pal=(+p.pallets||0), qty=(+p.totalQty||0), sum=qty+loose;
    totPal+=pal; totQty+=qty; totLoose+=loose;
    aoa.push([p.name, pal, qty, loose, sum]);
  });
  aoa.push(['합계', totPal, totQty, totLoose, totQty+totLoose]);
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:24},{wch:10},{wch:15},{wch:19},{wch:13}];
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '재고현황');
  var fname=String(vendorName).replace(/[\\\/:*?"<>|]/g,'_')+'_재고현황_'+dateStamp()+'.xlsx';
  XLSX.writeFile(wb, fname);
}
window.exportExcel=exportExcel;

/* 세부내역 엑셀 — 상품·유통기한·보관장소·위치 행 단위 (낱개/총재고는 상품 첫 행에만) */
function exportDetailExcel(){
  var info=_lastInfo||{}, data=_lastData||{};
  var vendorName=info.vendorName||'업체';
  var aoa=[['재고 세부내역'],['업체',vendorName],['기준시각',fmtTime(data.updatedAt)],[],
    ['상품명','유통기한','보관장소','위치','파렛트(팔)','파렛트내 수량(개)','파렛트외 낱개수량(개)','총 재고(개)']];
  var tP=0,tQ=0,tL=0;
  (_detail||[]).forEach(function(d){
    var p=d.p, loose=looseSum(_loose[p._k]), stock=(+p.totalQty||0)+loose;
    tP+=(+p.pallets||0); tQ+=(+p.totalQty||0); tL+=loose;
    if(!d.groups.length){ aoa.push([p.name,'','','',0,0,loose,stock]); return; }
    d.groups.forEach(function(g,j){
      aoa.push([p.name, g.exp?fmtExp(g.exp):'미기재', g.whName, locText(g.locs), g.pallets, g.qty, j===0?loose:null, j===0?stock:null]);
    });
  });
  aoa.push(['합계','','','',tP,tQ,tL,tQ+tL]);
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:24},{wch:12},{wch:14},{wch:26},{wch:10},{wch:15},{wch:19},{wch:13}];
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '세부내역');
  XLSX.writeFile(wb, String(vendorName).replace(/[\\\/:*?"<>|]/g,'_')+'_재고세부내역_'+dateStamp()+'.xlsx');
}

/* ===================================================================
   재고조사 마감(스냅샷) & 이력
   저장 경로: vendorStatus/{gid}/{vid}/snapshots/{id}
   → 기존 vendorStatus 규칙 재사용: 쓰기(마감·삭제)=관리자, 읽기(조회)=관리자+담당자
=================================================================== */
var _histList=[];

function snapPath(){ var i=_lastInfo||{}; if(!i.gid||!i.vendorId) return null; return 'vendorStatus/'+i.gid+'/'+i.vendorId+'/snapshots'; }

/* 관리자: 현재 현황을 이력으로 마감·저장 */
function closeInventory(){
  if(!_canEdit) return;
  var products=(_lastData&&_lastData.products)||{};
  var keys=Object.keys(products).filter(function(k){ return products[k]&&products[k].name; });
  if(!keys.length){ alert('저장할 현황이 없습니다.'); return; }
  var memo=prompt('재고조사 마감 메모 (선택) — 예: 8월 정기 재고조사\n\n[확인]을 누르면 현재 현황이 이력으로 저장됩니다.','');
  if(memo===null) return;   /* 취소 */
  var loose={}, sumPal=0, sumQty=0, sumLoose=0, items=0;
  keys.forEach(function(k){
    var p=products[k]; var ls=looseSum(_loose[k]);
    if(ls>0) loose[k]=ls;
    sumPal+=(+p.pallets||0); sumQty+=(+p.totalQty||0); sumLoose+=ls; items++;
  });
  var path=snapPath(); if(!path) return;
  var snap={
    closedAt:Date.now(),
    closedByEmail:(auth.currentUser&&auth.currentUser.email)||'',
    updatedAt:(_lastData&&_lastData.updatedAt)||Date.now(),
    memo:String(memo||'').slice(0,120),
    items:items, sumPal:sumPal, sumQty:sumQty, sumLoose:sumLoose,
    products:products, loose:loose
  };
  db.ref(path).push().set(snap)
    .then(function(){ alert('✅ 재고조사가 마감·저장되었습니다.'); openHistory(); })
    .catch(function(e){ alert('저장 실패: '+e.message); });
}
window.closeInventory=closeInventory;

function ensureHistOverlay(){
  var o=document.getElementById('histOverlay');
  if(!o){ o=document.createElement('div'); o.id='histOverlay'; o.className='hist-overlay';
    o.onclick=function(e){ if(e.target===o) closeHist(); }; document.body.appendChild(o); }
  o.style.display='flex';
  return o;
}
function closeHist(){ var o=document.getElementById('histOverlay'); if(o) o.style.display='none'; }
window.closeHist=closeHist;

/* 이력 목록 열기 (관리자·담당자 공통) */
function openHistory(){
  var path=snapPath(); if(!path) return;
  var o=ensureHistOverlay();
  o.innerHTML='<div class="hist-card"><div class="hist-hd"><span>📜 재고조사 이력</span><button class="hist-x" onclick="closeHist()">✕</button></div><div class="hist-body"><div class="hist-empty">불러오는 중…</div></div></div>';
  db.ref(path).get().then(function(s){
    var val=s.val()||{};
    _histList=Object.keys(val).map(function(id){ return Object.assign({_id:id}, val[id]); })
      .sort(function(a,b){ return (b.closedAt||0)-(a.closedAt||0); });
    renderHistList();
  }).catch(function(e){
    var o2=ensureHistOverlay();
    o2.innerHTML='<div class="hist-card"><div class="hist-hd"><span>📜 재고조사 이력</span><button class="hist-x" onclick="closeHist()">✕</button></div><div class="hist-body"><div class="hist-empty" style="color:#F87171;">불러오기 실패: '+esc(e.message)+'</div></div></div>';
  });
}
window.openHistory=openHistory;

function renderHistList(){
  var o=ensureHistOverlay();
  var admin=_canEdit;
  var items=_histList.length ? _histList.map(function(s){
    var meta='품목 '+nf(s.items||0)+' · 총 재고 '+nf((s.sumQty||0)+(s.sumLoose||0))+'개 · 파렛트 '+nf(s.sumPal||0)+'팔';
    return '<div class="hist-item">'
      +'<div class="hist-item-main" onclick="viewSnapshot(\''+s._id+'\')">'
        +'<div class="hist-when">📅 '+fmtTime(s.closedAt)+'</div>'
        +(s.memo?'<div class="hist-memo">'+esc(s.memo)+'</div>':'')
        +'<div class="hist-meta">'+meta+'</div>'
      +'</div>'
      +'<div class="hist-acts">'
        +'<button class="hbtn" onclick="viewSnapshot(\''+s._id+'\')">보기</button>'
        +(admin?'<button class="hbtn del" onclick="deleteSnapshot(\''+s._id+'\')">삭제</button>':'')
      +'</div></div>';
  }).join('') : '<div class="hist-empty">저장된 재고조사 내역이 없습니다.'+(admin?'<br><span style="font-size:12px;">현황이 완료되면 상단 <b>✅ 재고조사 마감</b> 버튼으로 저장하세요.</span>':'')+'</div>';
  o.innerHTML='<div class="hist-card"><div class="hist-hd"><span>📜 재고조사 이력</span><button class="hist-x" onclick="closeHist()">✕</button></div>'
    +'<div class="hist-body">'+items+'</div></div>';
}
window.renderHistList=renderHistList;

function viewSnapshot(id){
  var s=null; for(var i=0;i<_histList.length;i++){ if(_histList[i]._id===id){ s=_histList[i]; break; } }
  if(!s) return;
  var o=ensureHistOverlay();
  o.innerHTML='<div class="hist-card wide">'
    +'<div class="hist-hd"><span>📅 '+fmtTime(s.closedAt)+' · 재고조사 내역</span>'
    +'<span class="hist-hd-btns"><button class="hbtn" onclick="renderHistList()">‹ 목록</button><button class="hist-x" onclick="closeHist()">✕</button></span></div>'
    +'<div class="hist-body">'+snapshotReportHtml(s)+'</div></div>';
}
window.viewSnapshot=viewSnapshot;

function deleteSnapshot(id){
  if(!_canEdit) return;   /* 관리자만 (규칙에서도 강제) */
  var path=snapPath(); if(!path) return;
  if(!confirm('이 재고조사 내역을 삭제할까요?\n삭제하면 되돌릴 수 없습니다.')) return;
  db.ref(path+'/'+id).remove().then(function(){
    _histList=_histList.filter(function(x){ return x._id!==id; });
    renderHistList();
  }).catch(function(e){ alert('삭제 실패: '+e.message); });
}
window.deleteSnapshot=deleteSnapshot;

/* 저장 당시 내역을 읽기전용 표로 렌더 */
function snapshotReportHtml(s){
  var products=s.products||{}, loose=s.loose||{};
  var rows=Object.keys(products).map(function(k){ return Object.assign({_k:k}, products[k]); }).filter(function(p){ return p&&p.name; });
  rows.sort(function(a,b){ return (b.totalQty||0)-(a.totalQty||0); });
  var tPal=0,tQty=0,tLoose=0;
  var body=rows.map(function(p){
    var ls=looseSum(loose[p._k]); var stock=(+p.totalQty||0)+ls; var out=stock<=0;
    tPal+=(+p.pallets||0); tQty+=(+p.totalQty||0); tLoose+=ls;
    return '<tr'+(out?' class="lowrow"':'')+'><td class="l"><span class="pn">'+esc(p.name)+'</span>'+(out?' <span class="outbadge">재고없음</span>':'')+'</td>'
      +'<td class="num">'+nf(p.pallets)+'<span class="u">팔</span></td>'
      +'<td class="num">'+nf(p.totalQty)+'<span class="u">개</span></td>'
      +'<td class="num loosecell">'+(ls?nf(ls):'—')+(ls?'<span class="u">개</span>':'')+'</td>'
      +'<td class="num sumcell"><span class="sumv">'+nf(stock)+'<span class="u">개</span></span></td></tr>';
  }).join('');
  var grand=tQty+tLoose;
  var cards='<div class="cards">'
    +'<div class="scard a"><div class="v">'+nf(rows.length)+'</div><div class="l">상품 품목</div></div>'
    +'<div class="scard b"><div class="v">'+nf(grand)+'</div><div class="l">총 재고 (낱개포함·개)</div></div>'
    +'<div class="scard c"><div class="v">'+nf(tPal)+'</div><div class="l">총 파렛트 (팔)</div></div>'
    +'</div>';
  var table=rows.length
    ? '<div class="tbl-wrap"><table>'
      +'<thead><tr><th class="l">상품명</th><th>파렛트</th><th>파렛트내 수량</th><th class="loosehead">파렛트외 낱개수량</th><th>총 재고</th></tr></thead>'
      +'<tbody>'+body+'</tbody>'
      +'<tfoot><tr><td class="l">합계 · '+rows.length+'개 품목</td>'
        +'<td class="num">'+nf(tPal)+'<span class="u">팔</span></td>'
        +'<td class="num">'+nf(tQty)+'<span class="u">개</span></td>'
        +'<td class="num">'+nf(tLoose)+'<span class="u">개</span></td>'
        +'<td class="num sumv">'+nf(grand)+'<span class="u">개</span></td></tr></tfoot>'
      +'</table></div>'
    : '<div class="empty">저장 당시 등록된 상품이 없습니다.</div>';
  var note='<div class="hist-note">🔒 읽기 전용 · 마감시각 <b>'+fmtTime(s.closedAt)+'</b>'
    +(s.closedByEmail?' · 마감자 '+esc(s.closedByEmail):'')
    +' · 현황 기준시각 '+fmtTime(s.updatedAt)
    +(s.memo?'<br>메모: '+esc(s.memo):'')+'</div>';
  return cards+table+note;
}
window.snapshotReportHtml=snapshotReportHtml;

/* 업체 담당자 본인 — 이메일로 자기 업체 현황 (vendorStatus 요약본 실시간) */
function loadOwnByEmail(user){
  var ek=emKey(user.email);
  db.ref('vendorByEmail/'+ek).get().then(function(snap){
    if(!snap.exists()){ renderNotRegistered(user.email); return; }
    var info=snap.val();
    var st={products:null, updatedAt:null};
    function rerender(){ if(st.products!==null) renderReport(info, st); }
    /* 낱개수량 먼저 구독(읽기전용) */
    db.ref('vendorLoose/'+info.gid+'/'+info.vendorId).on('value', function(s){ _loose=s.val()||{}; rerender(); }, function(){ /* 낱개 읽기 실패 무시 */ });
    /* 요약본을 products·updatedAt 하위경로로만 구독 → 이력(snapshots)은 실시간 피드에서 제외(용량 절약) */
    db.ref('vendorStatus/'+info.gid+'/'+info.vendorId+'/products').on('value', function(s){ st.products=s.val()||{}; rerender(); }, function(err){
      app.innerHTML='<div class="center" style="color:#F87171;">현황을 불러오지 못했습니다: '+esc(err.message)+'</div>';
    });
    db.ref('vendorStatus/'+info.gid+'/'+info.vendorId+'/updatedAt').on('value', function(s){ st.updatedAt=s.val()||null; rerender(); }, function(){ /* 무시 */ });
  }).catch(function(e){
    app.innerHTML='<div class="center" style="color:#F87171;">확인 실패: '+esc(e.message)+'</div>';
  });
}

/* 관리자·멤버 미리보기 — 창고 원본으로 즉시 계산해 담당자와 동일 화면 표시(+요약본 갱신) */
function loadAdminPreview(user, gid, vid){
  if(!window.WMSVendorProjection){ app.innerHTML='<div class="center" style="color:#F87171;">집계 모듈 로드 실패</div>'; return; }
  Promise.all([
    db.ref('vendorConfig/'+gid+'/vendors/'+vid).get(),
    db.ref('vendorConfig/'+gid+'/map').get(),
    db.ref('groups/'+gid).get(),
    db.ref('vendorLoose/'+gid+'/'+vid).get()
  ]).then(function(r){
    if(!r[0].exists()){ app.innerHTML='<div class="center" style="color:#F87171;">업체를 찾을 수 없습니다.</div>'; return; }
    var vendorName=(r[0].val()||{}).name||'업체';
    var map=r[1].val()||{};
    _loose=r[3].val()||{};
    var wids=r[2].exists()?Object.keys(r[2].val()).filter(function(k){return k!=='_init';}):[];
    Promise.all(wids.map(function(wid){ return db.ref('warehouses/'+wid).get().then(function(s){return {id:wid, wh:s.val()};}).catch(function(){return {id:wid, wh:null};}); }))
    .then(function(list){
      var whs=list.map(function(x){return x.wh;}).filter(Boolean);
      _whList=list.filter(function(x){return x.wh;});   /* 세부내역·위치도용 창고 원본 */
      var warehouses=list.filter(function(x){return x.wh;}).map(function(x){return {id:x.id, name:(x.wh&&x.wh.name)||x.id};});
      var agg=window.WMSVendorProjection.aggregate(whs), kf=window.WMSVendorProjection.keyOf;
      var products={};
      Object.keys(map).forEach(function(k){
        var e=map[k];
        if(!e || e.vendorId!==vid || !e.name) return;
        var a=agg[e.name];
        products[k]= a
          ? {name:e.name, totalQty:a.totalQty, pallets:a.pallets, breakdown:a.breakdown}
          : {name:e.name, totalQty:0, pallets:0, breakdown:[]};
      });
      renderReport({vendorName:vendorName, _admin:true, gid:gid, vendorId:vid, warehouses:warehouses}, {products:products, updatedAt:Date.now()});
      /* 저장된 요약본도 최신으로 갱신(담당자 화면도 같이 최신화) */
      if(window.WMSVendorProjection.sync) window.WMSVendorProjection.sync(gid, whs, db);
    });
  }).catch(function(e){
    app.innerHTML='<div class="center" style="color:#F87171;">미리보기 권한이 없거나 로드 실패: '+esc(e.message)+'</div>';
  });
}

auth.onAuthStateChanged(function(user){
  if(!user){ location.replace('/wms_login.html?return='+encodeURIComponent('/vendor_status.html'+location.search)); return; }
  var qs=new URLSearchParams(location.search), gid=qs.get('gid'), vid=qs.get('vid');
  if(gid && vid){
    /* 슈퍼관리자 또는 해당 그룹 멤버만 미리보기 — 아니면 일반 담당자 경로로 */
    db.ref('superadmins/'+user.uid).get().then(function(a){
      if(a.exists()){ loadAdminPreview(user, gid, vid); return; }
      db.ref('userGroup/'+user.uid).get().then(function(g){
        if(g.exists() && g.val()===gid){ loadAdminPreview(user, gid, vid); }
        else { loadOwnByEmail(user); }
      }).catch(function(){ loadOwnByEmail(user); });
    }).catch(function(){ loadOwnByEmail(user); });
  } else {
    loadOwnByEmail(user);
  }
});
</script>
