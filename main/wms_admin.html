<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0F172A;font-family:system-ui,sans-serif;color:#E2E8F0;min-height:100vh;padding:24px 16px 80px;}
.wrap{max-width:900px;margin:0 auto;}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid #334155;}
.badge-admin{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;color:#F87171;white-space:nowrap;}
.btn-back{background:rgba(255,255,255,.06);color:#94A3B8;border:1px solid #334155;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;}

h1{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px;}
.sub{font-size:12px;color:#64748B;margin-bottom:20px;line-height:1.6;}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}

.group-title .cnt{font-size:10px;color:#475569;font-weight:700;}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;background:rgba(255,255,255,.03);border:1px solid #334155;border-radius:10px;margin-bottom:8px;}
.row .meta{flex:1;min-width:180px;}
.row .nm{font-weight:700;font-size:14px;}
.row .fk{font-size:11px;color:#64748B;margin-top:2px;font-family:ui-monospace,monospace;word-break:break-all;}
.row .floor-note{font-size:10px;color:#A78BFA;margin-top:3px;}
.row .gate-ok{font-size:10px;color:#34D399;margin-top:3px;}
.row .gate-warn{font-size:10px;color:#FBBF24;margin-top:3px;cursor:pointer;text-decoration:underline dotted;}
.row .gate-self{font-size:10px;color:#60A5FA;margin-top:3px;}
.seg{display:flex;gap:0;border:1px solid #334155;border-radius:8px;overflow:hidden;flex-shrink:0;}
.seg button{background:transparent;color:#94A3B8;border:none;border-left:1px solid #334155;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.seg button:first-child{border-left:none;}
.seg button:disabled{opacity:.25;cursor:not-allowed;}
.seg button.active{color:#fff;}
.seg button.lv0.active{background:#475569;}
.seg button.lv1.active{background:#2563EB;}
.seg button.lv2.active{background:#7C3AED;}
.seg button.lv3.active{background:#DC2626;}
.locked-chip{font-size:11px;font-weight:700;padding:6px 12px;border-radius:8px;border:1px dashed #475569;color:#94A3B8;white-space:nowrap;flex-shrink:0;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1E293B;border:1px solid #334155;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
.center{text-align:center;padding:60px 20px;color:#64748B;font-size:14px;}
.spinner{width:24px;height:24px;border:2px solid #334155;border-top-color:#3B82F6;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
.note-box{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);border-radius:10px;padding:13px 15px;font-size:12px;color:#93C5FD;line-height:1.7;margin-bottom:18px;}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:20px;}
.link-btn{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.04);border:1px solid #334155;border-radius:10px;padding:12px 13px;font-size:13px;font-weight:700;color:#E2E8F0;cursor:pointer;text-align:left;text-decoration:none;}
.link-btn:hover{background:rgba(59,130,246,.1);border-color:#3B82F6;}
.link-btn .ico{font-size:17px;flex-shrink:0;}
.link-btn .d{display:block;font-size:10px;color:#64748B;font-weight:600;margin-top:3px;line-height:1.4;}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.stat{flex:1;min-width:110px;background:rgba(255,255,255,.03);border:1px solid #334155;border-radius:10px;padding:10px 12px;}
.stat .v{font-size:19px;font-weight:800;}
.stat .k{font-size:10px;color:#64748B;font-weight:700;margin-top:2px;}
.search{width:100%;background:rgba(255,255,255,.04);border:1px solid #334155;border-radius:10px;padding:11px 13px;font-size:13px;color:#E2E8F0;font-family:inherit;margin-bottom:6px;}

.mini{font-size:11px;color:#64748B;line-height:1.7;}
.orow{display:flex;align-items:center;gap:10px;padding:10px 13px;background:rgba(255,255,255,.03);border:1px solid #334155;border-radius:10px;margin-bottom:7px;font-size:12px;flex-wrap:wrap;}
.orow .k{font-family:ui-monospace,monospace;font-weight:700;flex:1;min-width:120px;word-break:break-all;}
.btn-sm{background:rgba(239,68,68,.14);color:#F87171;border:1px solid rgba(239,68,68,.3);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;}
.btn-sm.ghost{background:rgba(255,255,255,.05);color:#94A3B8;border-color:#334155;}
/* ── 보기 전환 탭 ── */
.vtabs{display:flex;gap:6px;margin-bottom:16px;}
.vtab{flex:1;background:rgba(255,255,255,.04);color:#94A3B8;border:1px solid #334155;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}
.vtab.on{background:rgba(59,130,246,.16);border-color:#3B82F6;color:#E2E8F0;}
/* ── 메뉴 모양 보기 ── */
.msec{margin-bottom:18px;}
.msec-h{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:800;letter-spacing:.14em;color:#64748B;margin-bottom:8px;font-family:ui-monospace,monospace;}
.msec-h::before,.msec-h::after{content:'';flex:1;height:1px;background:#334155;}
.mgrid{display:grid;gap:6px;}
.mgrid.c1{grid-template-columns:1fr;}
.mgrid.c2{grid-template-columns:repeat(2,1fr);}
.mgrid.c3{grid-template-columns:repeat(3,1fr);}

@media(max-width:400px){ .mgrid.c4{grid-template-columns:repeat(2,1fr);} }
.mt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#000;border:1px solid #334155;border-top:3px solid #475569;border-radius:8px;padding:12px 8px 10px;text-align:center;min-width:0;}
.mt.tile{min-height:150px;}
.mt.tile .mseg{flex-wrap:wrap;justify-content:center;}
.mt.tile .mseg button{flex:1 1 auto;}
.mt.big{flex-direction:row;justify-content:space-between;text-align:left;padding:16px 14px;flex-wrap:wrap;}
.mt.big .mt-txt{flex:1;min-width:140px;}
.mt.card{justify-content:flex-start;align-items:stretch;text-align:left;padding:14px 12px;}
.mt.hiddenTile{border-style:dashed;}
.mt.lv0{border-top-color:#64748B;} .mt.lv1{border-top-color:#2563EB;} .mt.lv2{border-top-color:#7C3AED;} .mt.lv3{border-top-color:#DC2626;}
.mt.open{box-shadow:0 0 0 2px #3B82F6;}
.mt-name{font-size:13px;font-weight:800;line-height:1.25;word-break:keep-all;}
.mt.big .mt-name{font-size:16px;}
.mt-eng{font-size:8px;letter-spacing:.12em;color:#475569;font-family:ui-monospace,monospace;}
.mt-note{font-size:10px;color:#64748B;}
.mt-flag{position:absolute;top:5px;right:6px;font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;}
.mt-flag.hid{background:rgba(148,163,184,.12);color:#94A3B8;border:1px solid #475569;}
.ctl{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;}
.mt.big .ctl,.mt.card .ctl{align-items:flex-start;width:auto;}
.lvb{font-size:10px;font-weight:800;padding:2px 9px;border-radius:20px;color:#fff;white-space:nowrap;}
.lvb.lv0{background:#475569;} .lvb.lv1{background:#2563EB;} .lvb.lv2{background:#7C3AED;} .lvb.lv3{background:#DC2626;}
.mseg{display:flex;border:1px solid #334155;border-radius:6px;overflow:hidden;max-width:100%;}
.mseg button{background:transparent;color:#94A3B8;border:none;border-left:1px solid #334155;padding:4px 6px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;}
.mseg button:first-child{border-left:none;}
.mseg button:disabled{opacity:.22;cursor:not-allowed;}
.mseg button.lv0.active{background:#475569;color:#fff;} .mseg button.lv1.active{background:#2563EB;color:#fff;}
.mseg button.lv2.active{background:#7C3AED;color:#fff;} .mseg button.lv3.active{background:#DC2626;color:#fff;}
.mlock{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;border:1px dashed #475569;color:#94A3B8;white-space:nowrap;}
.mwarn{font-size:9px;color:#FBBF24;}
.mfloor{font-size:9px;color:#A78BFA;}
.subbtn{background:rgba(59,130,246,.12);color:#93C5FD;border:1px solid rgba(59,130,246,.35);border-radius:6px;padding:4px 9px;font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;}
.subbtn:hover{background:rgba(59,130,246,.22);}
.card-also{border-top:1px dashed #334155;margin-top:4px;padding-top:8px;}
.card-also .an{font-size:11px;font-weight:700;color:#CBD5E1;margin-bottom:4px;}
.subpanel{grid-column:1/-1;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.35);border-radius:8px;padding:10px 12px;}
.subpanel .sp-h{font-size:11px;font-weight:800;color:#93C5FD;margin-bottom:8px;}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:rgba(0,0,0,.35);border:1px solid #334155;border-left:3px solid #475569;border-radius:7px;margin-bottom:6px;}
.srow.lv0{border-left-color:#64748B;} .srow.lv1{border-left-color:#2563EB;} .srow.lv2{border-left-color:#7C3AED;} .srow.lv3{border-left-color:#DC2626;}
.srow .sm{flex:1;min-width:150px;}
.srow .sn{font-size:12px;font-weight:700;}
.srow .sf{font-size:10px;color:#64748B;font-family:ui-monospace,monospace;word-break:break-all;}
.srow .ctl{flex-direction:row;flex-wrap:wrap;width:auto;align-items:center;}
.mlegend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
code.snip{display:block;background:#0B1220;border:1px solid #334155;border-radius:8px;padding:9px 11px;font-size:11px;color:#7DD3FC;margin-top:8px;word-break:break-all;font-family:ui-monospace,monospace;}
</style>

<body>
<div class="wrap" id="app">
  <div class="center"><div class="spinner"></div>인증 확인 중...</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ── Firebase ── */
firebase.initializeApp({
  apiKey:"AIzaSyAM2t9dvtStrXNam-YAiq19yD8FHwKpPmI",
  authDomain:"makewon.com",
  databaseURL:"https://makechango-wms-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"makechango-wms",
  storageBucket:"makechango-wms.firebasestorage.app",
  messagingSenderId:"333385336098",
  appId:"1:333385336098:web:94f07492421965ab32917b"
});
var auth=firebase.auth(), db=firebase.database();
var app=document.getElementById('app'), toastEl=document.getElementById('toast');

/* ── 등급 정의 ── */
var LEVELS=[
  {v:0,label:'비회원 공개',short:'비회원',cls:'lv0',color:'#94A3B8',bd:'#475569'},
  {v:1,label:'일반회원이상',short:'일반',cls:'lv1',color:'#60A5FA',bd:'#2563EB'},
  {v:2,label:'초대회원이상',short:'초대',cls:'lv2',color:'#A78BFA',bd:'#7C3AED'},
  {v:3,label:'슈퍼관리자만',short:'관리자',cls:'lv3',color:'#F87171',bd:'#DC2626'}
];

var REGISTRY=WMS_PAGES;   /* 목록은 /wms_pages.js */

var _access={};      /* pageAccess 설정값 캐시 */
var _user=null;

function allItems(){
  var out=[];
  REGISTRY.forEach(function(g){ g.items.forEach(function(it){ out.push(it); }); });
  return out;
}
function findItem(key){
  var hit=null;
  allItems().forEach(function(it){ if(it.key===key) hit=it; });
  return hit;
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(function(){toastEl.classList.remove('show');},2200);
}

function effective(item){
  var configured=_access[item.key];
  configured=(configured===undefined||configured===null)?0:(+configured);
  if(isNaN(configured)||configured<0||configured>3) configured=0;
  return Math.max(configured, item.floor||0);
}

function renderDenied(){
  app.innerHTML='<div class="center" style="color:#F87171;">'
   +'<div style="font-size:40px;margin-bottom:10px;">🚫</div>'
   +'접근 권한이 없습니다.<br><span style="font-size:12px;color:#64748B;">슈퍼관리자만 이용할 수 있습니다.</span><br><br>'
   +'<a href="/wms_login.html" class="btn-back">로그인 화면으로</a></div>';
}

/* ── 관리 바로가기 ── */
function currentGid(){
  try{ return localStorage.getItem('wms_adminGroupId')||''; }catch(e){ return ''; }
}
function goGroupScoped(path){
  var g=currentGid();
  if(!g){ toast('그룹이 선택돼 있지 않습니다 — 그룹 관리로 이동합니다'); setTimeout(function(){ location.href='/wms_login.html'; },1100); return; }
  location.href=path+'?gid='+encodeURIComponent(g);
}
window.goGroupScoped=goGroupScoped;

function quickLinks(){
  var g=currentGid();
  var gLabel=g?('현재 그룹 · '+esc(g)):'그룹 미선택';
  return '<div class="links">'
   +'<a class="link-btn" href="/wms_login.html"><span class="ico">🏢</span><span>그룹 · 초대코드 관리<span class="d">그룹 생성/삭제 · 진입</span></span></a>'
   +'<a class="link-btn" href="/wms.html"><span class="ico">🏭</span><span>WMS 메인 콘솔<span class="d">창고 · 재고 관리</span></span></a>'
   +'<button class="link-btn" onclick="goGroupScoped(\'/wms_vendors.html\')"><span class="ico">🏷️</span><span>업체등록 · 상품연결<span class="d">'+gLabel+'</span></span></button>'
   +'<button class="link-btn" onclick="goGroupScoped(\'/vendor_list.html\')"><span class="ico">📋</span><span>업체 현황 · 낱개입력<span class="d">'+gLabel+'</span></span></button>'
   +'<a class="link-btn" href="/index.html"><span class="ico">🏠</span><span>홈 / 랜딩<span class="d">전체 앱 목록</span></span></a>'
   +'<a class="link-btn" href="/wms-tutorial.html" target="_blank" rel="noopener"><span class="ico">📖</span><span>WMS 튜토리얼<span class="d">새 탭으로 열기</span></span></a>'
   +'</div>';
}

/* ── 게이트 스니펫 ── */
function snippetFor(key, level){
  return '<script src="/wms_access.js" data-page="'+key+'" data-floor="'+level+'"><\/script>';
}
function showSnippet(key){
  var item=findItem(key); if(!item) return;
  var snip=snippetFor(key, effective(item));
  var box=document.getElementById('snip-'+key);
  if(box){ box.remove(); return; }
  var row=document.getElementById('row-'+key); if(!row) return;
  var el=document.createElement('div');
  el.id='snip-'+key;
  el.style.cssText='flex-basis:100%;';
  el.innerHTML='<div class="mini">아래 한 줄을 <b>'+esc(item.file)+'</b> 의 &lt;/body&gt; 직전에 넣으면 이 설정이 실제로 적용됩니다.</div>'
    +'<code class="snip">'+esc(snip)+'</code>'
    +'<button class="btn-sm ghost" style="margin-top:6px;" onclick="copyText(\''+key+'\')">스니펫 복사</button>';
  row.appendChild(el);
}
function copyText(key){
  var item=findItem(key); if(!item) return;
  var text=snippetFor(key, effective(item));
  var done=function(){ toast('복사됨 — '+item.file+' 에 붙여넣으세요'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(function(){ legacyCopy(text, done); });
  }else{ legacyCopy(text, done); }
}
function legacyCopy(text, done){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.cssText='position:fixed;opacity:0;';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('복사 실패 — 직접 선택해 주세요'); }
  document.body.removeChild(ta);
}
window.showSnippet=showSnippet;
window.copyText=copyText;

/* ── 행 렌더 ── */
function rowHtml(item){
  var cur=effective(item);
  var right;
  if(item.locked){
    right='<div class="locked-chip">🔒 '+esc(item.locked)+'</div>';
  }else{
    right='<div class="seg">'+LEVELS.map(function(L){
      var disabled=(L.v < (item.floor||0));
      return '<button class="'+L.cls+(L.v===cur?' active':'')+'"'
        +(disabled?' disabled':'')
        +' onclick="setLevel(\''+item.key+'\','+L.v+','+(item.floor||0)+')">'+L.short+'</button>';
    }).join('')+'</div>';
  }

  var notes='';
  if(item.floor>0) notes+='<div class="floor-note">⚙ 정상 동작 최소 등급 — '+LEVELS[item.floor].label+'</div>';
  if(item.gate){
    notes+='<div class="gate-ok">✅ 접근 게이트 적용 중 — 변경 즉시 반영</div>';
  }else if(!item.locked){
    notes+='<div class="gate-warn" onclick="showSnippet(\''+item.key+'\')">⚠️ wms_access.js 미설치 — 설정해도 적용되지 않음 (설치 방법 보기)</div>';
  }
  if(item.self) notes+='<div class="gate-self">🔐 '+esc(item.self)+'</div>';

  var hay=(item.label+' '+item.file+' '+item.key).toLowerCase();
  return '<div class="row" id="row-'+item.key+'" data-hay="'+esc(hay)+'">'
    +'<div class="meta"><div class="nm">'+esc(item.label)+'</div>'
    +'<div class="fk">'+esc(item.file)+'  ·  key: '+esc(item.key)+'</div>'+notes+'</div>'
    +right+'</div>';
}

function renderAdmin(user){
  _user=user;
  var items=allItems();
  var gated=items.filter(function(i){return i.gate;}).length;
  var ungated=items.filter(function(i){return !i.gate && !i.locked;}).length;
  var restricted=items.filter(function(i){return effective(i)>0;}).length;

  var legend=LEVELS.map(function(L){
    return '<span class="chip" style="color:'+L.color+';border-color:'+L.bd+';">'+L.label+'</span>';
  }).join('');

  var groupsHtml=REGISTRY.map(function(g){
    return '<div class="group-title" data-group="1">'+esc(g.group)+'<span class="cnt">'+g.items.length+'개</span></div>'
      +g.items.map(rowHtml).join('');
  }).join('');

  app.innerHTML=
    '<div class="topbar">'
    +'<a href="/wms_login.html" class="btn-back">‹ 그룹 관리</a>'
    +'<div class="badge-admin">🛡️ 슈퍼관리자</div>'
    +'<div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(user.displayName||'')+'</div>'
    +'<div style="font-size:11px;color:#64748B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(user.email)+'</div></div>'
    +'<button class="btn-back" onclick="doLogout()">로그아웃</button>'
    +'</div>'
    +'<h1>🛠️ 관리도구</h1>'
    +'<div class="sub">페이지 접근 권한을 지정하고, 그룹 · 업체 관리 화면으로 바로 이동합니다.</div>'
    +'<div class="group-title" style="margin-top:0;">관리 바로가기</div>'
    +quickLinks()
    +'<div class="group-title">페이지 접근 권한</div>'
    +'<div class="vtabs">'
    +'<button class="vtab on" id="vt-menu" onclick="showView(\'menu\')">🧭 메뉴 모양으로 보기</button>'
    +'<button class="vtab" id="vt-list" onclick="showView(\'list\')">📋 목록으로 보기</button>'
    +'</div>'
    +'<div id="viewMenu">'+menuViewHtml()+'</div>'
    +'<div id="viewList" class="hidden">'
    +'<div class="stats">'
    +'<div class="stat"><div class="v">'+items.length+'</div><div class="k">등록 페이지</div></div>'
    +'<div class="stat"><div class="v" style="color:#34D399;">'+gated+'</div><div class="k">게이트 적용 중</div></div>'
    +'<div class="stat"><div class="v" style="color:'+(ungated?'#FBBF24':'#34D399')+';">'+ungated+'</div><div class="k">게이트 미설치</div></div>'
    +'<div class="stat"><div class="v" style="color:#A78BFA;">'+restricted+'</div><div class="k">로그인 필요</div></div>'
    +'</div>'
    +'<div class="note-box">📌 <b>등급 안내</b><br>'
    +'· <b>비회원 공개</b> — 로그인 없이 누구나<br>'
    +'· <b>일반회원이상</b> — 구글 로그인만 하면 (그룹 미가입자 포함)<br>'
    +'· <b>초대회원이상</b> — 초대코드로 그룹에 가입한 작업자부터<br>'
    +'· <b>슈퍼관리자만</b> — 대표 본인만<br>'
    +'설정이 없는 페이지의 기본값은 <b>비회원 공개</b>입니다.</div>'
    +(ungated?'<div class="warn-box">⚠️ <b>게이트 미설치 페이지가 '+ungated+'개 있습니다.</b><br>'
      +'해당 페이지에는 <code style="color:#7DD3FC;">wms_access.js</code> 가 아직 삽입되지 않아 여기서 등급을 올려도 실제로 막히지 않습니다. '
      +'각 행의 노란 문구를 눌러 삽입할 스니펫을 확인하세요.</div>':'')
    +'<div class="legend">'+legend+'</div>'
    +'<input class="search" id="q" type="search" placeholder="🔍 페이지 검색 (이름 · 파일명 · 키)" oninput="applyFilter()"/>'
    +'<div id="pages">'+groupsHtml+'</div>'
    +'</div>'
    +'<div class="group-title">미등록 설정 키 (고아 데이터)</div>'
    +'<div id="orphans"><div class="mini">확인 중...</div></div>'
    +'<div class="group-title">슈퍼관리자 계정</div>'
    +'<div id="supers"><div class="mini">불러오는 중...</div></div>';

  renderOrphans();
  loadSupers();
}

/* ── 메뉴 모양 보기 (WMS_MENU = index.html 배치) ── */
var MENU=(typeof WMS_MENU!=='undefined')?WMS_MENU:[];
var LV_NAME=['비회원','로그인 회원','작업 그룹원','슈퍼관리자'];
var _open={};   /* 하부 펼친 타일 */

function cleanLabel(s){ return String(s||'').replace(/^[\s└]+/,''); }
function subCount(subs){
  var n=0; (subs||[]).forEach(function(s){ n+=1+subCount(s.subs); }); return n;
}
function menuKeys(){
  var seen={};
  function walk(list){ (list||[]).forEach(function(n){ seen[n.key]=1; walk(n.also); walk(n.subs); }); }
  MENU.forEach(function(sec){ walk(sec.tiles); });
  return seen;
}
function findMenuNode(key){
  var hit=null;
  function walk(list){ (list||[]).forEach(function(n){ if(n.key===key) hit=n; walk(n.also); walk(n.subs); }); }
  MENU.forEach(function(sec){ walk(sec.tiles); });
  return hit;
}

/* 등급 배지 + 4단 버튼 (data-ctl 로 찾아 다시 그린다) */
function ctlInner(key){
  var item=findItem(key);
  if(!item) return '<span class="mwarn">⚠ wms_pages.js 에 없는 키: '+esc(key)+'</span>';
  var cur=effective(item), h='<span class="lvb lv'+cur+'">'+LV_NAME[cur]+'</span>';
  if(item.locked){
    h+='<span class="mlock">🔒 '+esc(item.locked)+'</span>';
  }else{
    h+='<div class="mseg">'+LEVELS.map(function(L){
      return '<button class="'+L.cls+(L.v===cur?' active':'')+'"'+(L.v<(item.floor||0)?' disabled':'')
        +' title="'+LV_NAME[L.v]+'" onclick="event.stopPropagation();setLevel(\''+item.key+'\','+L.v+','+(item.floor||0)+')">'+L.short+'</button>';
    }).join('')+'</div>';
    if(item.floor>0) h+='<span class="mfloor">최소 '+LV_NAME[item.floor]+'</span>';
  }
  if(!item.gate && !item.locked) h+='<span class="mwarn">⚠ 게이트 미설치</span>';
  return h;
}
function ctlHtml(key){ return '<div class="ctl" data-ctl="'+esc(key)+'">'+ctlInner(key)+'</div>'; }
function lvOf(key){ var it=findItem(key); return it?effective(it):0; }

function subRowsHtml(subs, depth){
  return (subs||[]).map(function(s){
    var it=findItem(s.key)||{label:s.key,file:'?'};
    return '<div class="srow lv'+lvOf(s.key)+'" data-lvkey="'+esc(s.key)+'" style="margin-left:'+(depth*18)+'px;">'
      +'<div class="sm"><div class="sn">'+(depth?'└ ':'')+esc(s.name||cleanLabel(it.label))+'</div>'
      +'<div class="sf">'+esc(it.file)+'</div></div>'+ctlHtml(s.key)+'</div>'
      +subRowsHtml(s.subs, depth+1);
  }).join('');
}

function tileHtml(t, kind){
  var it=findItem(t.key)||{label:t.key};
  var n=subCount(t.subs);
  var flag=t.hidden?'<span class="mt-flag hid">숨김 타일</span>':'';
  var subBtn=n?'<button class="subbtn" onclick="toggleSubs(\''+t.key+'\')">'+(_open[t.key]?'▴ 하부 접기':'▾ 하부 '+n+'개')+'</button>':'';
  var cls='mt '+kind+' lv'+lvOf(t.key)+(t.hidden?' hiddenTile':'')+(_open[t.key]?' open':'');
  var name='<div class="mt-name">'+esc(t.name||cleanLabel(it.label))+'</div><div class="mt-eng">'+esc(t.eng||'')+'</div>'
    +(t.note?'<div class="mt-note">'+esc(t.note)+'</div>':'');
  var body;
  if(kind==='big'){
    body='<div class="mt-txt">'+name+'</div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">'+ctlHtml(t.key)+subBtn+'</div>';
  }else if(kind==='card'){
    body='<div class="mt-eng">'+esc(t.eng||'')+'</div><div class="mt-name">'+esc(t.name||cleanLabel(it.label))+'</div>'
      +ctlHtml(t.key)
      +(t.also||[]).map(function(a){
        var ai=findItem(a.key)||{label:a.key};
        return '<div class="card-also"><div class="an">'+esc(a.name||cleanLabel(ai.label))+'</div>'+ctlHtml(a.key)+'</div>';
      }).join('')
      +(subBtn?'<div style="margin-top:4px;">'+subBtn+'</div>':'');
  }else{
    body=name+ctlHtml(t.key)+subBtn;
  }
  return '<div class="'+cls+'" id="mt-'+esc(t.key)+'" data-lvkey="'+esc(t.key)+'">'+flag+body+'</div>';
}

function menuViewHtml(){
  var placed=menuKeys();
  var rest=allItems().filter(function(it){ return !placed[it.key]; });
  var legend=LEVELS.map(function(L){ return '<span class="lvb lv'+L.v+'">'+LV_NAME[L.v]+'</span>'; }).join('');
  return '<div class="mini" style="margin-bottom:8px;">사이트 메인 메뉴와 같은 배치입니다. 버튼마다 지금 요구 등급이 색으로 보이고, 아래 네 칸으로 바로 바꿉니다. <b>▾ 하부</b> 를 누르면 그 메뉴 안의 페이지가 펼쳐집니다.</div>'
    +'<div class="mlegend">'+legend+'</div>'
    +MENU.map(function(sec, si){
      return '<div class="msec"><div class="msec-h">'+esc(sec.section)+'</div>'
        +'<div class="mgrid c'+(sec.cols||4)+'" id="mg-'+si+'">'+sec.tiles.map(function(t){ return tileHtml(t, sec.kind||'tile'); }).join('')+'</div></div>';
    }).join('')
    +(rest.length?'<div class="msec"><div class="msec-h">메뉴에 없는 페이지 · 직접 주소 · 숨김</div>'
      +'<div class="mgrid c4">'+rest.map(function(it){ return tileHtml({key:it.key}, 'tile'); }).join('')+'</div></div>':'');
}

/* 펼친 하부 칸은 그 타일이 있는 줄의 맨 끝 다음에 넣어 버튼 위치가 안 바뀌게 */
function placePanels(){
  document.querySelectorAll('#viewMenu .subpanel').forEach(function(p){ p.remove(); });
  Object.keys(_open).forEach(function(key){
    var tile=document.getElementById('mt-'+key), node=findMenuNode(key);
    if(!tile || !node) return;
    var grid=tile.parentNode, last=tile, sib=tile.nextElementSibling;
    while(sib && !sib.classList.contains('subpanel') && sib.offsetTop===tile.offsetTop){ last=sib; sib=sib.nextElementSibling; }
    while(last.nextElementSibling && last.nextElementSibling.classList.contains('subpanel')) last=last.nextElementSibling;
    var p=document.createElement('div');
    p.className='subpanel'; p.id='sp-'+key;
    p.innerHTML='<div class="sp-h">▾ '+esc(node.name||cleanLabel((findItem(key)||{}).label))+' 의 하부 페이지</div>'+subRowsHtml(node.subs, 0);
    grid.insertBefore(p, last.nextSibling);
  });
}
function toggleSubs(key){
  if(_open[key]) delete _open[key]; else _open[key]=1;
  var tile=document.getElementById('mt-'+key), node=findMenuNode(key);
  if(tile && node){
    var kind=tile.classList.contains('big')?'big':tile.classList.contains('card')?'card':'tile';
    var tmp=document.createElement('div'); tmp.innerHTML=tileHtml(node, kind);
    tile.parentNode.replaceChild(tmp.firstChild, tile);
  }
  placePanels();
}
window.toggleSubs=toggleSubs;
window.addEventListener('resize', function(){ clearTimeout(placePanels._t); placePanels._t=setTimeout(placePanels,150); });

function refreshMenu(key){
  var lv=lvOf(key);
  document.querySelectorAll('[data-ctl="'+key+'"]').forEach(function(el){ el.innerHTML=ctlInner(key); });
  document.querySelectorAll('[data-lvkey="'+key+'"]').forEach(function(el){
    el.classList.remove('lv0','lv1','lv2','lv3'); el.classList.add('lv'+lv);
  });
}

function showView(v){
  document.getElementById('viewMenu').classList.toggle('hidden', v!=='menu');
  document.getElementById('viewList').classList.toggle('hidden', v!=='list');
  document.getElementById('vt-menu').classList.toggle('on', v==='menu');
  document.getElementById('vt-list').classList.toggle('on', v==='list');
  if(v==='menu') placePanels();
}
window.showView=showView;

/* ── 검색 필터 ── */
function applyFilter(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var pages=document.getElementById('pages');
  var nodes=pages.children, lastTitle=null, shown=0;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(n.getAttribute('data-group')){
      if(lastTitle) lastTitle.classList.toggle('hidden', shown===0);
      lastTitle=n; shown=0; n.classList.remove('hidden');
      continue;
    }
    var hit=!q || (n.getAttribute('data-hay')||'').indexOf(q)>=0;
    n.classList.toggle('hidden', !hit);
    if(hit) shown++;
  }
  if(lastTitle) lastTitle.classList.toggle('hidden', shown===0);
}
window.applyFilter=applyFilter;

/* ── 등급 저장 ── */
function setLevel(key, level, floor){
  if(level < floor){ toast('이 페이지는 최소 '+LEVELS[floor].label+' 필요'); return; }
  var prev=_access[key];
  _access[key]=level;
  /* 낙관적 UI */
  refreshRow(key);
  db.ref('pageAccess/'+key).set(level).then(function(){
    var item=findItem(key);
    toast('저장됨 · '+LEVELS[level].label+((item&&!item.gate)?' (게이트 미설치 — 아직 적용 안 됨)':''));
    renderOrphans();
  }).catch(function(e){
    if(prev===undefined) delete _access[key]; else _access[key]=prev;
    refreshRow(key);
    toast('저장 실패: '+e.message);
  });
}
window.setLevel=setLevel;

function refreshRow(key){
  var item=findItem(key);
  if(!item) return;
  refreshMenu(key);
  var row=document.getElementById('row-'+key);
  if(!row) return;
  var cur=effective(item);
  var btns=row.querySelectorAll('.seg button');
  btns.forEach(function(b,i){ b.classList.toggle('active', i===cur); });
  var snip=document.getElementById('snip-'+key);
  if(snip){ snip.remove(); showSnippet(key); }
}

/* ── 고아 설정 키: REGISTRY 에 없는 pageAccess 항목 ── */
function renderOrphans(){
  var box=document.getElementById('orphans');
  if(!box) return;
  var known={};
  allItems().forEach(function(it){ known[it.key]=1; });
  var keys=Object.keys(_access).filter(function(k){ return !known[k]; });
  if(!keys.length){
    box.innerHTML='<div class="mini">없음 — 저장된 설정이 모두 위 목록과 연결돼 있습니다.</div>';
    return;
  }
  box.innerHTML='<div class="mini" style="margin-bottom:8px;">아래 키는 저장돼 있지만 관리 목록에 없는 페이지입니다. 페이지를 지웠거나 키 이름이 바뀐 경우이니 정리하세요.</div>'
   +keys.map(function(k){
      var lv=+_access[k]; var L=LEVELS[(isNaN(lv)||lv<0||lv>3)?0:lv];
      return '<div class="orow" id="orow-'+esc(k)+'"><span class="k">'+esc(k)+'</span>'
        +'<span class="chip" style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid '+L.bd+';color:'+L.color+';">'+L.label+'</span>'
        +'<button class="btn-sm" onclick="removeOrphan(\''+esc(k).replace(/'/g,"\\'")+'\')">설정 삭제</button></div>';
   }).join('');
}
function removeOrphan(key){
  if(!confirm('설정 키 "'+key+'" 를 삭제할까요?\n\n해당 페이지는 기본값(비회원 공개)으로 돌아갑니다.')) return;
  db.ref('pageAccess/'+key).remove().then(function(){
    delete _access[key]; renderOrphans(); toast('삭제됨 · '+key);
  }).catch(function(e){ toast('삭제 실패: '+e.message); });
}
window.removeOrphan=removeOrphan;

/* ── 슈퍼관리자 목록 (읽기 전용 — 보안규칙상 쓰기 불가) ── */
function loadSupers(){
  var box=document.getElementById('supers');
  if(!box) return;
  db.ref('superadmins').get().then(function(snap){
    var val=snap.val()||{};
    var uids=Object.keys(val);
    if(!uids.length){ box.innerHTML='<div class="mini">등록된 슈퍼관리자가 없습니다.</div>'; return; }
    box.innerHTML=uids.map(function(uid){
      var v=val[uid];
      var extra=(v && typeof v==='object') ? (v.email||v.name||'') : '';
      var me=(_user && _user.uid===uid);
      return '<div class="orow"><span class="k">'+esc(uid)+(extra?' <span style="color:#64748B;font-weight:600;">· '+esc(extra)+'</span>':'')+'</span>'
        +(me?'<span class="badge-admin">나</span>':'')+'</div>';
    }).join('')
    +'<div class="mini" style="margin-top:8px;">🔒 보안 규칙상 <code style="color:#7DD3FC;">superadmins</code> 는 읽기 전용입니다. '
    +'추가·삭제는 Firebase 콘솔 → Realtime Database 에서 <code style="color:#7DD3FC;">superadmins/{uid}: true</code> 로 직접 편집하세요.</div>';
  }).catch(function(e){
    box.innerHTML='<div class="mini" style="color:#F87171;">목록 조회 실패: '+esc(e.message)+'</div>';
  });
}

function doLogout(){
  if(!confirm('로그아웃 하시겠습니까?')) return;
  auth.signOut().then(function(){ location.replace('/wms_login.html'); });
}
window.doLogout=doLogout;

/* ── 부팅: 슈퍼관리자 확인 → pageAccess 로드 ── */
auth.onAuthStateChanged(function(user){
  if(!user){ location.replace('/wms_login.html?return='+encodeURIComponent('/wms_admin.html')); return; }
  db.ref('superadmins/'+user.uid).get().then(function(snap){
    if(!snap.exists()){ renderDenied(); return; }
    db.ref('pageAccess').get().then(function(aSnap){
      _access=aSnap.val()||{};
      renderAdmin(user);
    }).catch(function(e){
      _access={}; renderAdmin(user); toast('설정 로드 경고: '+e.message);
    });
  }).catch(function(e){
    app.innerHTML='<div class="center" style="color:#F87171;">권한 확인 실패: '+esc(e.message)+'</div>';
  });
});
</script>
