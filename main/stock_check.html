<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>재고조사풀 — 메이크창고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- 로그인 게이트(wms_access.js)가 쓰는 SDK — 미리 싣지 않으면 로그인 확인 전에 튕긴다 -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<style>
  :root{ --bg:#0b0d12; --surface:#141822; --surface2:#1c2331; --border:#2a3040;
         --text:#e6e9f0; --muted:#8b94a8; --accent:#4ade80; --accent2:#fbbf24; --blue:#3b82f6; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:1.2rem .9rem 3rem; }
  .wrap{ width:100%; max-width:1000px; margin:0 auto; }

  .top{ display:flex; align-items:center; justify-content:space-between; gap:.8rem; flex-wrap:wrap; margin-bottom:.5rem; }
  .ttl{ font-size:1.35rem; font-weight:900; letter-spacing:-.4px; }
  .ttl small{ display:block; font-family:'Space Mono',monospace; font-size:.62rem; color:var(--muted); font-weight:400; letter-spacing:.12em; margin-top:.2rem; }
  .home{ background:var(--surface2); border:1px solid var(--border); color:var(--muted); border-radius:8px;
         padding:.45rem .8rem; font-size:.78rem; font-weight:700; text-decoration:none; }
  .home:hover{ color:var(--text); }
  .lead{ font-size:.82rem; color:var(--muted); line-height:1.7; margin-bottom:1.1rem; }

  .sec{ font-size:.72rem; font-weight:800; color:var(--muted); letter-spacing:.1em; margin:1.2rem 0 .5rem; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:.8rem; }
  .item{ display:block; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1rem;
         text-decoration:none; color:var(--text); position:relative; }
  .item:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .item .ico{ font-size:1.5rem; margin-bottom:.45rem; }
  .item .nm{ font-size:1rem; font-weight:800; }
  .item .ds{ font-size:.75rem; color:var(--muted); line-height:1.6; margin-top:.3rem; }
  .item .tag{ position:absolute; top:.7rem; right:.8rem; font-size:.6rem; font-weight:800; letter-spacing:.06em;
              background:rgba(74,222,128,.15); color:var(--accent); border:1px solid rgba(74,222,128,.4);
              border-radius:20px; padding:.15rem .5rem; }
  .item.soon{ opacity:.45; pointer-events:none; }
  .item.soon .tag{ background:rgba(255,255,255,.06); color:var(--muted); border-color:var(--border); }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="ttl">📦 재고조사풀<small>STOCK CHECK POOL</small></div>
    <a class="home" href="/index.html">‹ 홈으로</a>
  </div>
  <div class="lead">업체·브랜드마다 재고조사 방식이 달라서, 각 조사 도구를 하나씩 따로 둡니다. 쓰실 도구를 골라 들어가세요.</div>

  <div class="sec">테일즈</div>
  <div class="grid">
    <a class="item" href="/stock_tales_minus.html">
      <span class="tag">사용 가능</span>
      <div class="ico">🧮</div>
      <div class="nm">테일즈 마이너스재고 조정</div>
      <div class="ds">재고조사 엑셀을 올리면 마이너스 재고를 그 다음 유통기한 수량에서 빼서 0으로 맞추고, 업로드용 엑셀을 만들어 줍니다.</div>
    </a>
  </div>

  <div class="sec">곡물도감</div>
  <div class="grid">
    <div class="item soon">
      <span class="tag">준비 중</span>
      <div class="ico">🌾</div>
      <div class="nm">곡물도감 재고조사</div>
      <div class="ds">양식이 정해지면 이어서 만듭니다.</div>
    </div>
  </div>

  <div class="sec">그 밖의 업체</div>
  <div class="grid">
    <div class="item soon">
      <span class="tag">준비 중</span>
      <div class="ico">➕</div>
      <div class="nm">업체별 재고조사</div>
      <div class="ds">업체가 늘어나는 대로 이 자리에 하나씩 추가됩니다.</div>
    </div>
  </div>

</div>
<script src="/wms_access.js" data-page="stock_check" data-floor="2"></script>
</body>
</html>
